<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentforce Sales 問題集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: single centered study column; header with exam countdown, domain meters, then the quiz card */
:root {
  --bg: #f6f7f9; --surface: #ffffff; --fg: #1b2330; --muted: #5d6878; --line: #dde2ea;
  --accent: #0b5cad; --accent-weak: #e6f0fb;
  --ok: #1f7a4d; --ok-weak: #e3f4ea; --ng: #b3261e; --ng-weak: #fbe9e7; --warn: #9a6400;
  --sans: "IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12161d; --surface: #1a2029; --fg: #e5e9f0; --muted: #98a3b3; --line: #2c3441;
  --accent: #6aa8ec; --accent-weak: #1b2b40;
  --ok: #5cc48d; --ok-weak: #15301f; --ng: #f08a80; --ng-weak: #3a1b19; --warn: #e3b25a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12161d; --surface: #1a2029; --fg: #e5e9f0; --muted: #98a3b3; --line: #2c3441;
  --accent: #6aa8ec; --accent-weak: #1b2b40;
  --ok: #5cc48d; --ok-weak: #15301f; --ng: #f08a80; --ng-weak: #3a1b19; --warn: #e3b25a; color-scheme: dark }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.7 var(--sans); }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 20px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }
h1 { font-size: 20px; margin: 0; text-wrap: balance; }
h2 { font-size: 15px; margin: 0; color: var(--muted); font-weight: 500; letter-spacing: .04em; }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.count { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.count b { color: var(--accent); font-size: 18px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.domains { display: grid; gap: 10px; }
.drow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; }
.drow .name { font-size: 14px; }
.drow .num { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.bar { grid-column: 1 / -1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .c { background: var(--ok) } .bar .w { background: var(--ng); opacity: .75 }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
button { font: inherit; color: inherit; cursor: pointer; }
.mode { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.mode:hover { border-color: var(--accent); }
.mode strong { font-size: 15px; }
.mode span { font-size: 12px; color: var(--muted); }
.mode.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.mode.primary span { color: var(--surface); opacity: .85 }
.mode:disabled { opacity: .45; cursor: default; }
select { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; max-width: 100%; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 8px 14px; }
.btn.go { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 500; }
.btn:disabled { opacity: .4; cursor: default; }
.btn:focus-visible, .mode:focus-visible, .choice:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; }
.chip.multi { border-color: var(--warn); color: var(--warn); }
.q { font-size: 16px; white-space: pre-wrap; }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 10px; align-items: start; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; }
.choice input { margin-top: 5px; }
.choice.sel { border-color: var(--accent); background: var(--accent-weak); }
.choice.right { border-color: var(--ok); background: var(--ok-weak); }
.choice.wrong { border-color: var(--ng); background: var(--ng-weak); }
.note { grid-column: 2; font-size: 13px; color: var(--muted); }
.verdict { font-weight: 700; font-size: 16px; }
.verdict.ok { color: var(--ok) } .verdict.ng { color: var(--ng) }
.expl { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.ref { font-size: 12px; color: var(--muted); }
.progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); }
.timer { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.timer.low { color: var(--ng); }
.result-big { font-size: 40px; font-weight: 700; font-family: var(--mono); }
.list { display: flex; flex-direction: column; gap: 6px; }
.li { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 10px; font-size: 13px; padding: 8px 0; border-bottom: 1px solid var(--line); cursor: pointer; text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; }
.mark { font-family: var(--mono); font-weight: 700; }
.mark.ok { color: var(--ok) } .mark.ng { color: var(--ng) }
.star { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 2px 10px; font-size: 13px; }
.star.on { color: var(--warn); border-color: var(--warn); }
.small { font-size: 12px; color: var(--muted); }
.danger { color: var(--ng); background: none; border: 0; padding: 0; font-size: 12px; text-decoration: underline; }
@media (prefers-reduced-motion: no-preference) { .choice, .mode { transition: border-color .12s, background .12s; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const QUESTIONS = [{"id": "CI-001", "domain": "コンサルティングおよび実装戦略", "topic": "ディスカバリーの進め方", "q": "ある製造業の企業では、営業部門がスプレッドシートとメールで商談を管理しており、Sales Cloud の導入を決定した。キックオフ直後、営業本部長は「すぐに画面を作り始めてほしい」と要望している。コンサルタントは最初に何を行うべきか？", "choices": ["標準の商談ページレイアウトを先に構築し、営業担当者に触ってもらいながら要件を集める", "主要な部門の担当者へのインタビューやワークショップを通じて現状の営業プロセスと課題を把握する", "AppExchange で評価の高い営業管理アプリをインストールして要件の代わりとする", "既存のスプレッドシートの列をそのままカスタム項目として作成する"], "answer": [1], "explanation": "実装の最初の段階はディスカバリーであり、現状の業務プロセス・課題・目標を把握することが設計の前提となる。現状を理解せずに構築を始めると、手戻りや定着しないシステムにつながる。ステークホルダーの期待に応えつつも、短期間のディスカバリーを先行させるべきである。", "choiceNotes": ["要件を把握する前に構築を始めると、プロセスに合わない設計や手戻りを招く。", "現状プロセスと課題の把握はディスカバリーの中核であり、最初に行うべき活動である。", "要件を定義せずにアプリを導入しても、ビジネス課題を解決できる保証はない。", "既存のスプレッドシートを複製するだけでは、非効率なプロセスをそのまま移植してしまう。"], "ref": "Trailhead: Salesforce ビジネスアナリストのディスカバリー / 要件の引き出し"}, {"id": "CI-002", "domain": "コンサルティングおよび実装戦略", "topic": "ユーザーストーリーと受け入れ基準", "q": "ある企業では、要件定義の段階で「営業マネージャーとして、部下の停滞している商談を把握したい」という要望が挙がった。開発チームとテストチームが同じ理解で作業できるようにするため、コンサルタントはこの要件をどのように文書化すべきか？", "choices": ["システムの技術仕様書として項目のAPI参照名のみを記載する", "要望をそのまま議事録に残し、構築者の解釈に任せる", "「停滞」の定義（例: 30日間フェーズ変更なし）を含む受け入れ基準を持つユーザーストーリーとして記述する", "ダッシュボードのスクリーンショットを先に作成し、要件の代わりとする"], "answer": [2], "explanation": "ユーザーストーリーは「誰が・何を・なぜ」を表現し、受け入れ基準によって完了条件を検証可能にする。「停滞」のような曖昧な語を具体的な条件に落とし込むことで、構築とテストの解釈のずれを防げる。", "choiceNotes": ["項目名だけではビジネス上の目的や完了条件が伝わらない。", "解釈を構築者に委ねると、期待とのずれが発生しやすい。", "測定可能な受け入れ基準付きのユーザーストーリーにより、構築とテストが同じ基準で判断できる。", "画面イメージは補助にはなるが、完了条件を定義する要件の代わりにはならない。"], "ref": "Trailhead: ユーザーストーリーの作成 / 受け入れ基準"}, {"id": "CI-003", "domain": "コンサルティングおよび実装戦略", "topic": "ステークホルダー管理", "q": "ある企業の Sales Cloud 導入プロジェクトでは、営業部門とマーケティング部門がリードの受け渡し基準で対立し、要件が確定しない状態が続いている。両部門とも自部門の基準を譲らない。コンサルタントは何を推奨すべきか？", "choices": ["プロジェクトのエグゼクティブスポンサーを交えて、ビジネス目標に基づき意思決定を行う場を設ける", "両部門の基準をそれぞれ別のリードレコードタイプとして実装し、対立を回避する", "コンサルタントが技術的に実装しやすい方の基準を採用する", "要件が確定するまでリード管理の範囲をプロジェクトから外し、議論を無期限に保留する"], "answer": [0], "explanation": "部門間で利害が対立する場合、組織全体の目標に照らして判断できる権限を持つエグゼクティブスポンサーの関与が有効である。意思決定の仕組み（ガバナンス）を通じて合意を形成することで、プロジェクトの停滞を防げる。", "choiceNotes": ["権限を持つスポンサーによる意思決定は、部門間の対立解消に適したガバナンス手段である。", "対立を技術で回避すると、一貫性のないプロセスとデータが生まれる。", "実装の容易さはビジネス上の判断基準として適切ではない。", "無期限の保留はスケジュールとスコープに悪影響を与え、問題を解決しない。"], "ref": "Trailhead: ステークホルダーの特定と管理 / プロジェクトガバナンス"}, {"id": "CI-004", "domain": "コンサルティングおよび実装戦略", "topic": "現状とあるべき姿（ギャップ分析）", "q": "ある企業では、見積承認に平均5日かかっており、営業担当者が承認状況を電話で確認している。経営層は承認リードタイムを1日以内にしたいと考えている。コンサルタントが設計に入る前に実施すべき分析として最も適切なものはどれか？", "choices": ["競合他社が使用している承認ツールの一覧を作成する", "全営業担当者に Salesforce のモバイルアプリをインストールさせる", "承認プロセスを削除し、すべての見積を自動承認にする", "現状（As-Is）の承認フローを可視化し、あるべき姿（To-Be）との差分と遅延の原因を特定する"], "answer": [3], "explanation": "ギャップ分析では、現状のプロセスを可視化して課題の根本原因を特定し、目標とするあるべき姿との差分を明らかにする。これにより、どの機能や業務変更で目標を達成するかを根拠を持って設計できる。", "choiceNotes": ["他社のツール調査は自社の遅延原因の特定にはつながらない。", "モバイルアプリの導入は手段の一つにすぎず、原因分析の前に決めるべきではない。", "統制上必要な承認を一律に廃止するのは、ビジネスリスクを無視した極端な対応である。", "As-Is と To-Be の比較と原因の特定は、設計の前に行うべき基本的な分析である。"], "ref": "Trailhead: ビジネスプロセスマッピング / As-Is と To-Be の分析"}, {"id": "CI-005", "domain": "コンサルティングおよび実装戦略", "topic": "ユーザー受け入れテスト（UAT）", "q": "ある企業では、Sales Cloud の構築とシステムテストが完了し、本番リリースまで3週間となった。プロジェクトマネージャーは、業務部門がシステムを承認したことを確認する手順を求めている。コンサルタントは何を推奨すべきか？", "choices": ["開発者が作成した単体テストのカバー率を報告して承認とする", "実際の業務シナリオに基づくテストケースを用いて、業務部門の代表ユーザーが Sandbox でユーザー受け入れテストを実施する", "本番環境に直接リリースし、問題があればユーザーからの問い合わせで対応する", "コンサルタントが全テストケースを代行して実行し、結果を業務部門に共有する"], "answer": [1], "explanation": "ユーザー受け入れテスト（UAT）は、実際の業務を担うユーザーが業務シナリオに沿ってシステムを検証し、要件を満たしていることを確認する工程である。本番相当のデータを持つ Sandbox で実施することで、リリース前に業務上の問題を発見できる。", "choiceNotes": ["単体テストのカバー率は技術的な品質指標であり、業務部門の受け入れを示すものではない。", "業務ユーザーが実際のシナリオで検証することがUATの目的である。", "受け入れを確認せずに本番リリースすると、業務停止などのリスクが高い。", "コンサルタントによる代行では業務部門自身の受け入れ確認にならない。"], "ref": "Salesforce ヘルプ: アプリケーションライフサイクル管理 / Trailhead: テスト戦略"}, {"id": "CI-006", "domain": "コンサルティングおよび実装戦略", "topic": "パイロット展開", "q": "ある企業では、全国12支店・800名の営業担当者に Sales Cloud を展開する予定である。新しい商談管理プロセスが現場で機能するか不安があり、全社展開前にリスクを抑えたいと考えている。コンサルタントは何を推奨すべきか？", "choices": ["全支店に同日一斉展開し、問題を一度にすべて洗い出す", "展開を延期し、要件定義をもう一度最初からやり直す", "1〜2支店でパイロット展開を行い、フィードバックを収集して改善した後に段階的に展開する", "展開前に全機能を Sandbox で凍結し、本番では変更を一切受け付けない"], "answer": [2], "explanation": "パイロット展開は、限られたユーザーで実運用を行い、プロセスやトレーニングの課題を早期に発見する手法である。得られたフィードバックを反映してから段階的に展開することで、全社展開時のリスクと混乱を低減できる。", "choiceNotes": ["一斉展開では問題発生時の影響範囲が全社に及び、リスクが最も高い。", "懸念があるからといって要件定義をやり直す根拠はなく、スケジュールを大きく損なう。", "パイロットで検証し改善してから段階展開するのは、リスク低減の標準的な手法である。", "変更を一切受け付けないと、現場からのフィードバックを反映できない。"], "ref": "Trailhead: ユーザー導入戦略 / 展開計画"}, {"id": "CI-007", "domain": "コンサルティングおよび実装戦略", "topic": "トレーニング計画", "q": "ある企業では、Sales Cloud の稼働後に営業担当者の利用率が低いことが懸念されている。過去のシステム導入では、全員に同じ2時間の集合研修を実施しただけで定着しなかった。今回のトレーニング計画としてコンサルタントが推奨すべきことはどれか？（2つ選択してください）", "choices": ["営業担当者、マネージャー、オペレーション担当など役割ごとに内容を分けたトレーニングを実施する", "システム管理者向けの設定マニュアルを全営業担当者に配布する", "アプリ内ガイダンスやヘルプテキストを活用し、業務の流れの中で操作を支援する", "トレーニングは稼働の3か月前に一度だけ実施する", "トレーニングを省略し、ユーザーが自分で操作を覚えるのを待つ"], "answer": [0, 2], "explanation": "効果的なトレーニングは役割ごとの業務に即した内容であることが重要で、各ユーザーが自分の業務で何をすべきかを理解できる。また、アプリ内ガイダンスやヘルプテキストにより、作業中に必要な情報を提供することで定着を促進できる。", "choiceNotes": ["役割別のトレーニングは各ユーザーの業務に直結し、理解と定着を高める。", "管理者向けの設定情報は営業担当者の業務には不要で、混乱を招く。", "アプリ内ガイダンスは業務中の継続的な支援となり、定着に効果的である。", "稼働から離れすぎた一度きりの研修は記憶に残りにくい。", "トレーニングの省略は利用率低下の典型的な原因である。"], "ref": "Salesforce ヘルプ: アプリ内ガイダンス / Trailhead: ユーザートレーニング"}, {"id": "CI-008", "domain": "コンサルティングおよび実装戦略", "topic": "変更管理と定着の測定", "q": "ある企業では Sales Cloud 稼働から2か月が経過した。経営層は「現場が本当に使っているのか」を把握し、定着が遅れている部門に対策を打ちたいと考えている。コンサルタントは何を推奨すべきか？", "choices": ["ログイン状況やレコードの作成・更新状況を部門別に可視化する導入状況のレポートとダッシュボードを作成する", "全ユーザーのパスワードを毎週リセットしてログインを促す", "利用率の低い部門のユーザーライセンスを即時に削除する", "システムの利用状況は測定せず、四半期末の売上だけで評価する"], "answer": [0], "explanation": "変更管理では、定着状況を測定可能な形で把握し、課題のある部門に追加のトレーニングやサポートを行うことが重要である。ログイン履歴やレコードの作成・更新状況をレポートとダッシュボードで可視化することで、データに基づく対策が可能になる。", "choiceNotes": ["定着状況を測定・可視化することで、対策が必要な部門を特定できる。", "パスワードのリセットは利用促進にならず、ユーザーの不満を招く。", "ライセンス削除は原因分析や支援をせず、利用をさらに阻害する。", "売上だけでは利用状況や定着の課題を把握できない。"], "ref": "Trailhead: ユーザー導入の測定 / Salesforce ヘルプ: ログイン履歴"}, {"id": "CI-009", "domain": "コンサルティングおよび実装戦略", "topic": "Sandbox の種類（Full）", "q": "ある企業では、本番稼働前に本番と同等のデータ量を使ってパフォーマンステストと最終的なユーザー受け入れテストを行いたい。テストには本番のすべてのレコードと添付ファイルが必要である。コンサルタントはどの種類の Sandbox を推奨すべきか？", "choices": ["Developer Sandbox", "Developer Pro Sandbox", "Partial Copy Sandbox", "Full Sandbox"], "answer": [3], "explanation": "Full Sandbox は本番組織のメタデータとすべてのデータ（レコードや添付ファイルを含む）をコピーでき、パフォーマンステスト、負荷テスト、ステージングに適している。一方で更新間隔は29日と長い。", "choiceNotes": ["Developer Sandbox はメタデータのみをコピーし、本番データは含まれない。", "Developer Pro Sandbox もメタデータのみで、ストレージ容量が大きいだけである。", "Partial Copy Sandbox は Sandbox テンプレートで選択したデータのサンプルのみをコピーする。", "Full Sandbox は本番のすべてのデータをコピーでき、本番相当のテストに適している。"], "ref": "Salesforce ヘルプ: Sandbox の種類とテンプレート"}, {"id": "CI-010", "domain": "コンサルティングおよび実装戦略", "topic": "Sandbox の種類（Partial Copy）", "q": "ある企業では、トレーニング環境として本番の一部の取引先・商談データを含む Sandbox が必要である。トレーニングは毎週実施され、数日ごとに環境をリフレッシュしたい。Full Sandbox は契約に含まれていない。コンサルタントは何を推奨すべきか？", "choices": ["Developer Sandbox を作成し、毎回すべてのデータを手作業で入力する", "Sandbox テンプレートで対象オブジェクトを指定した Partial Copy Sandbox を使用する", "本番組織でトレーニング用のレコードを作成し、終了後に削除する", "Developer Pro Sandbox を作成し、本番データを自動でコピーするよう設定する"], "answer": [1], "explanation": "Partial Copy Sandbox は Sandbox テンプレートで選択したオブジェクトのデータのサンプルとメタデータをコピーでき、更新間隔は5日である。本番データの一部を使ったトレーニングやテストに適している。", "choiceNotes": ["Developer Sandbox にはデータがコピーされず、毎回の手入力は非効率である。", "Partial Copy Sandbox はテンプレートで選んだデータのサンプルを含み、5日ごとに更新できる。", "本番でのトレーニングは実データを汚染し、レポートや自動化に影響するリスクがある。", "Developer Pro Sandbox はメタデータのみをコピーし、本番データはコピーされない。"], "ref": "Salesforce ヘルプ: Sandbox の種類とテンプレート / Sandbox テンプレートの作成"}, {"id": "CI-011", "domain": "コンサルティングおよび実装戦略", "topic": "変更セットによる展開", "q": "ある企業では、Sandbox で構築した商談の入力規則とページレイアウトを、変更セットを使って本番組織へリリースしたい。管理者は変更セットを初めて使用する。コンサルタントが説明すべき内容はどれか？（2つ選択してください）", "choices": ["変更セットを使用するには、送信元と送信先の組織間でリリース接続を設定し、受信側で受信変更セットを許可する必要がある", "変更セットは本番組織のレコードデータも一緒に移行できる", "変更セットは同じ本番組織に関連付けられた組織間（本番とその Sandbox など）でのみ使用できる", "変更セットは任意の他社の Salesforce 組織へも送信できる", "変更セットを使用すると、本番で削除したコンポーネントが Sandbox からも自動的に削除される"], "answer": [0, 2], "explanation": "変更セットは、本番組織とその Sandbox など、関連する組織間でメタデータをリリースするための仕組みである。利用にはリリース接続が必要で、受信側の組織で送信元からの受信変更セットを許可する設定を行う。データは移行対象に含まれない。", "choiceNotes": ["リリース接続の設定と受信側での許可は変更セット利用の前提条件である。", "変更セットはメタデータ（設定）を移行するもので、レコードデータは含まれない。", "変更セットは同じ本番組織に関連付けられた組織間でのみ利用できる。", "無関係な他社の組織へは変更セットを送信できない。", "変更セットはコンポーネントの削除を伝播しない。"], "ref": "Salesforce ヘルプ: 変更セット / リリース接続"}, {"id": "CI-012", "domain": "コンサルティングおよび実装戦略", "topic": "KPI定義と成功指標", "q": "ある企業の経営層は Sales Cloud 導入の目的として「営業生産性の向上」を掲げている。プロジェクトの成功を判断するため、コンサルタントはどのような成功指標を定義すべきか？（2つ選択してください）", "choices": ["導入前の値をベースラインとして測定した、商談の平均成約期間（日数）", "Salesforce に作成されたカスタム項目の総数", "導入前後で比較できる、営業担当者1人あたりの商談成約率", "プロジェクトで作成した設計書のページ数", "Sandbox の作成数"], "answer": [0, 2], "explanation": "成功指標はビジネス目標と結び付き、測定可能で、導入前のベースラインと比較できるものであるべきである。成約期間や成約率は営業生産性を直接反映する指標であり、導入効果の評価に適している。", "choiceNotes": ["ベースラインと比較できる成約期間は、生産性向上を測る測定可能な指標である。", "項目数はシステムの構成量であり、ビジネス成果を示さない。", "成約率は営業生産性に直結し、導入前後で比較できる成果指標である。", "設計書の量はプロジェクトの成果物の量であり、ビジネス価値を示さない。", "Sandbox の数は技術的な環境の数であり、成功指標にならない。"], "ref": "Trailhead: ビジネス価値の測定 / KPIの定義"}, {"id": "CI-013", "domain": "コンサルティングおよび実装戦略", "topic": "データ移行の順序", "q": "ある企業では、旧CRMから取引先、取引先責任者、商談、商談商品のデータを Salesforce に移行する計画を立てている。参照関係を正しく保持したまま移行するため、コンサルタントが推奨すべきロード順序はどれか？", "choices": ["商談商品 → 商談 → 取引先責任者 → 取引先", "商談 → 取引先 → 商談商品 → 取引先責任者", "取引先 → 取引先責任者 → 商談 → 商談商品", "取引先責任者 → 商談商品 → 取引先 → 商談"], "answer": [2], "explanation": "データ移行では、参照される側（親）のレコードを先にロードし、子レコードがその親を参照できるようにする必要がある。取引先を最初に、次にそれを参照する取引先責任者と商談、最後に商談を参照する商談商品をロードする。", "choiceNotes": ["子から先にロードすると、参照先の親レコードが存在せず関連付けできない。", "商談は取引先を参照するため、取引先より先にロードするのは不適切である。", "親から子の順でロードすることで参照関係を正しく設定できる。", "商談商品は商談を親とするため、商談より先にはロードできない。"], "ref": "Trailhead: データ移行計画 / Salesforce ヘルプ: データローダ"}, {"id": "CI-014", "domain": "コンサルティングおよび実装戦略", "topic": "データ移行ツールの選択", "q": "ある企業では、旧システムから約30万件の商談レコードを Salesforce に移行する必要がある。移行は事前にテストしたうえで、同じ手順を本番でも再実行したい。コンサルタントはどのツールを推奨すべきか？", "choices": ["データローダ", "データインポートウィザード", "レコードを1件ずつ手作業で入力する", "変更セット"], "answer": [0], "explanation": "データローダは大量のレコード（数百万件規模）のインポートに対応し、商談を含む標準・カスタムオブジェクトを扱える。設定を保存して繰り返し実行したり、コマンドラインで自動化したりできるため、テストと本番で同じ手順を再現しやすい。", "choiceNotes": ["データローダは大量データと商談オブジェクトに対応し、繰り返し実行にも適している。", "データインポートウィザードは一度に50,000件までで、商談のインポートには対応していない。", "30万件を手入力するのは非現実的で、誤りも発生しやすい。", "変更セットはメタデータを移行するもので、レコードデータは移行できない。"], "ref": "Salesforce ヘルプ: データのインポート方法の選択 / データローダ"}, {"id": "CI-015", "domain": "コンサルティングおよび実装戦略", "topic": "データ移行の設計", "q": "ある企業では、旧システムの取引先データを Salesforce に移行する。移行後も旧システムの顧客コードで再ロードや照合ができること、および旧システムでの作成日を Salesforce の作成日として保持することが求められている。コンサルタントは何を推奨すべきか？（2つ選択してください）", "choices": ["旧システムの顧客コードを格納する項目を外部IDとして定義し、upsert で移行する", "移行後に旧システムの顧客コードは削除し、Salesforce ID のみで管理する", "「レコード作成時に監査項目を設定」機能を有効化し、移行ユーザーに必要な権限を付与して作成日をロードする", "作成日は入力規則で旧システムの日付に自動変換する", "すべての取引先を一度削除し、毎回新規作成で再ロードする"], "answer": [0, 2], "explanation": "外部ID項目を使うと、旧システムのキーでレコードを特定して upsert でき、重複を防ぎつつ再ロードや照合が可能になる。作成日などの監査項目は通常は書き込めないが、「レコード作成時に監査項目を設定」を有効化し、権限を持つユーザーであれば作成時に値を設定できる。", "choiceNotes": ["外部IDと upsert により、旧システムのキーで照合・再ロードが可能になる。", "旧システムのキーを削除すると、移行後の照合やトレーサビリティが失われる。", "監査項目の設定機能と権限により、作成時に旧システムの作成日を保持できる。", "入力規則はデータの検証を行う機能であり、値を変換・設定することはできない。", "毎回削除して再作成するとIDが変わり、関連レコードや履歴が失われる。"], "ref": "Salesforce ヘルプ: 外部ID項目 / レコード作成時に監査項目を設定"}, {"id": "CI-016", "domain": "コンサルティングおよび実装戦略", "topic": "送信メッセージ", "q": "ある企業では、商談が「成立」になったときに、商談の情報を社内の受注管理システムへ自動送信したい。受注管理システムは SOAP の受信エンドポイントを提供している。開発コストを最小限に抑えたい一方で、送信に失敗した場合は自動的に再試行してほしい。コンサルタントは何を推奨すべきか？", "choices": ["受注管理システムから5分おきに Salesforce へ全商談をポーリングさせる", "営業担当者に商談の CSV を毎日エクスポートしてもらい、手動で取り込む", "Salesforce Connect で受注管理システムのデータを外部オブジェクトとして参照する", "レコードの変更をきっかけに送信メッセージを使って受注管理システムのエンドポイントへ通知する"], "answer": [3], "explanation": "送信メッセージは、レコードの変更を契機に指定した項目の値を SOAP メッセージとして外部エンドポイントへ送信する宣言的な機能である。コードを書かずに設定でき、受信側から確認応答が返らない場合は一定期間自動的に再送が行われる。", "choiceNotes": ["ポーリングは即時性に欠け、API呼び出しも無駄に消費する。", "手動のエクスポートは自動化の要件を満たさず、ミスも発生しやすい。", "Salesforce Connect は外部データを Salesforce から参照する仕組みで、Salesforce から外部へ送信する用途ではない。", "送信メッセージは宣言的に設定でき、SOAP送信と自動再試行の要件を満たす。"], "ref": "Salesforce ヘルプ: 送信メッセージ"}, {"id": "CI-017", "domain": "コンサルティングおよび実装戦略", "topic": "Salesforce Connect と外部オブジェクト", "q": "ある企業では、営業担当者が取引先ページで基幹システムにある請求履歴を確認したいと考えている。請求データは数千万件あり、常に基幹システムが正となるため、Salesforce にはコピーを保存したくない。基幹システムは OData のエンドポイントを公開している。コンサルタントは何を推奨すべきか？", "choices": ["毎晩、請求データ全件をカスタムオブジェクトへバッチで取り込む", "Salesforce Connect を使い、請求データを外部オブジェクトとして参照し取引先に関連付ける", "請求データを取引先のメモ項目に手作業で転記する", "Platform Event で請求データを Salesforce に保存する"], "answer": [1], "explanation": "Salesforce Connect は外部システムのデータをコピーせずに外部オブジェクトとしてリアルタイムに参照できる。OData などのアダプタに対応しており、大量データを Salesforce のストレージに保存せず、常に最新の外部データを表示できる。", "choiceNotes": ["全件コピーはストレージを消費し、データが最新でなくなる時間差も生じる。", "外部オブジェクトは外部データをコピーせずに参照でき、要件に合致する。", "手作業の転記は大量データでは非現実的で、正確性も保てない。", "Platform Event はイベント通知の仕組みであり、大量の参照データを表示する用途には適さない。"], "ref": "Salesforce ヘルプ: Salesforce Connect / 外部オブジェクト"}, {"id": "CI-018", "domain": "コンサルティングおよび実装戦略", "topic": "Platform Event", "q": "ある企業では、商談のフェーズが変わったときに、在庫システム・請求システム・データ分析基盤の3つの外部システムがそれぞれその変化をほぼリアルタイムに受け取る必要がある。今後、受け取るシステムが増える可能性もある。コンサルタントは何を推奨すべきか？", "choices": ["Platform Event を発行し、各システムがイベントを購読するパブリッシュ/サブスクライブ型の連携にする", "各外部システムがそれぞれ1時間ごとに商談を全件取得する", "Salesforce Connect で3つのシステムのデータを外部オブジェクトとして参照する", "商談のフェーズ変更時に、営業担当者が各システムの担当者へメールで連絡する"], "answer": [0], "explanation": "Platform Event はイベント駆動型のパブリッシュ/サブスクライブモデルを提供し、1つのイベントを複数の購読者がほぼリアルタイムに受け取れる。送信側と受信側が疎結合となるため、購読するシステムが増えても送信側の変更を最小限に抑えられる。", "choiceNotes": ["Platform Event は複数の購読者への疎結合なリアルタイム通知に適している。", "定期的な全件取得はリアルタイム性に欠け、API呼び出しの負荷も大きい。", "外部オブジェクトは外部データを参照する仕組みで、Salesforce の変更を外部へ通知するものではない。", "手動のメール連絡は自動化・リアルタイム性の要件を満たさない。"], "ref": "Salesforce ヘルプ: Platform Event / Trailhead: Platform Event の基本"}, {"id": "CI-019", "domain": "コンサルティングおよび実装戦略", "topic": "API の選択", "q": "ある企業では、毎晩、データウェアハウスから数百万件の取引先スコアを Salesforce に一括更新する連携を構築する。処理はリアルタイムである必要はないが、APIの呼び出し回数を抑えて効率的に処理したい。コンサルタントはどの方式を推奨すべきか？", "choices": ["REST API で1件ずつ更新する", "送信メッセージで取引先を1件ずつ更新する", "Bulk API を使用して非同期にまとめて処理する", "Streaming API を使用して更新を受信する"], "answer": [2], "explanation": "Bulk API は大量のレコードを非同期でまとめて処理するために設計されており、数十万件以上のデータロードに適している。レコードを一括で送信できるため、1件ずつ処理する場合に比べてAPI呼び出し回数を大幅に削減できる。", "choiceNotes": ["REST API で1件ずつ更新すると呼び出し回数が膨大になり、制限に達するおそれがある。", "送信メッセージは Salesforce から外部へ送信する機能であり、外部からの更新には使えない。", "Bulk API は大量データの非同期処理に最適化されている。", "Streaming API は Salesforce の変更を通知として受信する仕組みであり、データの一括更新には使えない。"], "ref": "Salesforce ヘルプ: 使用する API の選択 / Bulk API 2.0"}, {"id": "CI-020", "domain": "コンサルティングおよび実装戦略", "topic": "組織の共有設定（OWD）", "q": "ある企業では、営業担当者は自分の商談のみ参照でき、他の担当者の商談は参照できないようにしたい。ただし、営業マネージャーは部下の商談を参照・編集できる必要がある。コンサルタントは何を推奨すべきか？", "choices": ["商談の組織の共有設定を「公開/参照・更新可能」にし、ページレイアウトで項目を非表示にする", "商談の組織の共有設定を「公開/参照のみ」にし、プロファイルで編集権限を外す", "すべての営業担当者に「すべてのデータの参照」権限を付与する", "商談の組織の共有設定を「非公開」にし、ロール階層でマネージャーに部下のレコードへのアクセスを付与する"], "answer": [3], "explanation": "組織の共有設定はレコードアクセスの最も制限的なベースラインを定める。商談を「非公開」にすると所有者のみがアクセスでき、ロール階層によって上位ロールのユーザーは下位ロールのユーザーが所有するレコードに自動的にアクセスできる。", "choiceNotes": ["公開/参照・更新可能では全員がすべての商談にアクセスでき、要件に反する。", "公開/参照のみでは他の担当者の商談を参照できてしまう。", "「すべてのデータの参照」は全レコードの参照を許可し、要件に反する。", "非公開をベースラインとし、ロール階層で上位者にアクセスを付与するのが適切である。"], "ref": "Salesforce ヘルプ: 組織の共有設定 / ロール階層"}, {"id": "CI-021", "domain": "コンサルティングおよび実装戦略", "topic": "共有ルール", "q": "ある企業では、商談の組織の共有設定が「非公開」である。金額が1億円以上の商談については、所有者やロールに関係なく、全社の「戦略案件チーム」ロールのメンバーが参照できるようにしたい。コンサルタントは何を推奨すべきか？", "choices": ["金額が1億円以上という条件で、「戦略案件チーム」ロールに参照のみのアクセスを付与する条件ベースの共有ルールを作成する", "商談の組織の共有設定を「公開/参照のみ」に変更する", "戦略案件チームのメンバーをすべての営業担当者の上位ロールに配置する", "該当する商談ごとに、所有者が手動で共有する運用にする"], "answer": [0], "explanation": "条件ベースの共有ルールは、レコードの項目値に基づいて特定のグループやロールにアクセスを付与できる。組織の共有設定を非公開に保ったまま、条件に合致するレコードだけを対象者に共有できるため、要件に最も適している。", "choiceNotes": ["条件ベースの共有ルールにより、金額条件を満たす商談のみを自動的に共有できる。", "組織の共有設定を緩めると、全員がすべての商談を参照できてしまう。", "ロール階層を変更すると、条件に関係なくすべての部下の商談にアクセスでき、組織構造も歪む。", "手動共有は漏れが発生しやすく、条件に基づく自動共有の要件を満たさない。"], "ref": "Salesforce ヘルプ: 共有ルール / 条件ベースの共有ルール"}, {"id": "CI-022", "domain": "コンサルティングおよび実装戦略", "topic": "共有ルールの制約", "q": "ある企業では、取引先の組織の共有設定が「公開/参照・更新可能」になっている。セキュリティ監査の結果、特定の業種の取引先については、営業部の一部のユーザーから参照できないように制限したいという要望が出た。コンサルタントはこの要望についてどのように説明すべきか？", "choices": ["共有ルールで対象ユーザーのアクセスを「アクセス権なし」に制限できる", "共有ルールは組織の共有設定より制限を厳しくすることはできないため、組織の共有設定をより制限的に見直し、必要なアクセスを共有ルールで開放する設計が必要である", "ロール階層でユーザーを下位に配置すれば参照を禁止できる", "手動共有を削除すれば対象ユーザーから参照できなくなる"], "answer": [1], "explanation": "共有ルールや手動共有、ロール階層は組織の共有設定で定めたベースラインよりも広いアクセスを付与するための仕組みであり、アクセスを制限することはできない。アクセスを制限したい場合は、組織の共有設定を制限的にし、必要なユーザーに共有ルールなどで開放する。", "choiceNotes": ["共有ルールはアクセスを拡大する仕組みであり、制限には使えない。", "ベースラインを制限的にし、共有ルールで開放するのが正しい設計である。", "ロール階層は上位者にアクセスを付与するもので、ベースラインのアクセスを奪うことはできない。", "公開/参照・更新可能では手動共有がなくても全員がアクセスできるため、制限にならない。"], "ref": "Salesforce ヘルプ: 共有設定の概要 / レコードアクセスの制御"}, {"id": "CI-023", "domain": "コンサルティングおよび実装戦略", "topic": "取引先階層とアクセス", "q": "ある企業では、取引先の組織の共有設定が「非公開」である。グローバル企業の本社取引先とその子会社取引先を取引先階層（親取引先）で関連付けた。本社取引先の所有者は「子会社取引先もすべて参照できるようになる」と期待している。コンサルタントはどのように説明すべきか？", "choices": ["親取引先を設定すると、親取引先の所有者は子取引先を自動的に参照・編集できる", "親取引先を設定すると、親取引先の所有者は子取引先を自動的に参照のみできる", "取引先階層は取引先の関係を表示するためのもので、レコードへのアクセス権は付与されない。必要に応じて共有ルールや取引先チームを検討する", "取引先階層を設定すると、子取引先の所有者が親取引先の所有者に自動的に変更される"], "answer": [2], "explanation": "取引先階層は親取引先項目によって企業間の関係を表示・把握するための機能であり、それ自体がレコードの共有を行うことはない。親取引先の所有者に子取引先へのアクセスが必要な場合は、共有ルールや取引先チームなどの共有の仕組みを別途設計する必要がある。", "choiceNotes": ["取引先階層は参照・編集のアクセス権を付与しない。", "取引先階層は参照のみのアクセス権も付与しない。", "取引先階層は関係の表示用であり、アクセスには共有の仕組みが別途必要である。", "親取引先を設定しても子取引先の所有者は変わらない。"], "ref": "Salesforce ヘルプ: 取引先階層 / 共有設定の概要"}, {"id": "CI-024", "domain": "コンサルティングおよび実装戦略", "topic": "商談チームと取引先チーム", "q": "ある企業では、商談の組織の共有設定が「非公開」である。大型商談ごとに、営業担当者・プリセールス・営業事務が協力して対応しており、メンバーは商談ごとに異なる。また、主要顧客ごとに担当する営業・サポートのメンバーが決まっており、その顧客の取引先レコードへのアクセスが必要である。コンサルタントが推奨すべきことはどれか？（2つ選択してください）", "choices": ["商談チームを有効化し、商談ごとにメンバーと役割、アクセス権を設定する", "すべての関係者を全営業担当者の上位ロールに配置する", "取引先チームを有効化し、主要顧客ごとに担当メンバーと役割を設定する", "商談の組織の共有設定を「公開/参照・更新可能」に変更する", "関係者全員に「すべてのデータの編集」権限を付与する"], "answer": [0, 2], "explanation": "商談チームは商談単位で共同作業するメンバーと役割を定義し、レコードへのアクセスを付与できる。取引先チームは取引先単位で担当メンバーを定義し、取引先レコードなどへのアクセスを付与できる。いずれもベースラインを非公開に保ったまま、必要なメンバーだけに共有できる。", "choiceNotes": ["商談チームは商談ごとに異なるメンバーへのアクセス付与に適している。", "ロールを上位に置くと不要な商談まで参照でき、組織構造も歪む。", "取引先チームは顧客ごとの担当メンバーへのアクセス付与に適している。", "組織の共有設定を緩めると、全員がすべての商談にアクセスできてしまう。", "「すべてのデータの編集」は過剰な権限であり、最小権限の原則に反する。"], "ref": "Salesforce ヘルプ: 商談チーム / 取引先チーム"}, {"id": "CI-025", "domain": "コンサルティングおよび実装戦略", "topic": "手動共有", "q": "ある企業では、商談の組織の共有設定が「非公開」である。ある営業担当者が、特定の1件の商談について一時的に別部門の同僚に参照してもらい、助言を受けたいと考えている。このような例外的な共有はまれにしか発生しない。コンサルタントは何を推奨すべきか？", "choices": ["該当商談の所有者が、その同僚に対して手動共有で参照アクセスを付与する", "同僚を対象とした所有者ベースの共有ルールを作成する", "同僚のロールを営業担当者の上位に変更する", "商談の組織の共有設定を「公開/参照のみ」に変更する"], "answer": [0], "explanation": "手動共有は、レコードの所有者などが個々のレコードを特定のユーザーやグループと共有する仕組みであり、まれに発生する例外的な共有に適している。組織全体の共有設定や構造を変えずに、必要最小限のアクセスを付与できる。", "choiceNotes": ["手動共有は個別レコードの一時的・例外的な共有に適している。", "所有者ベースの共有ルールでは、その担当者が所有するすべての商談が共有されてしまう。", "ロール変更は組織構造に影響し、他の商談へのアクセスも付与してしまう。", "組織の共有設定を緩めると、全員がすべての商談を参照できてしまう。"], "ref": "Salesforce ヘルプ: 手動共有 / レコードの共有"}, {"id": "CI-026", "domain": "コンサルティングおよび実装戦略", "topic": "ユーザーライセンスの選択", "q": "ある企業では、営業担当者に加えて、製造部門の200名が Salesforce を利用する予定である。製造部門のユーザーは、カスタムオブジェクトの品質管理アプリと取引先・取引先責任者の参照のみを使用し、リードや商談にはアクセスしない。コストを抑えたい。コンサルタントは何を推奨すべきか？", "choices": ["製造部門にも Sales Cloud ライセンスを付与する", "製造部門は Salesforce を利用せず、スプレッドシートで管理する", "製造部門に Salesforce Platform ライセンスを付与する", "製造部門のユーザーは営業担当者のアカウントを共有して使用する"], "answer": [2], "explanation": "Salesforce Platform ライセンスは、カスタムアプリと取引先・取引先責任者などの一部の標準オブジェクトを利用するユーザー向けのライセンスで、リードや商談などの CRM 機能は含まれない。要件がカスタムアプリ中心であれば、Sales Cloud ライセンスよりコストを抑えられる。", "choiceNotes": ["使用しない営業機能を含むライセンスを付与すると、コストが過剰になる。", "Salesforce を利用しないと、品質管理アプリと顧客情報の連携という目的を達成できない。", "Platform ライセンスはカスタムアプリと取引先・取引先責任者の利用に適しており、コスト効率が良い。", "アカウントの共有はライセンス規約とセキュリティの両面で不適切である。"], "ref": "Salesforce ヘルプ: ユーザーライセンス / Salesforce Platform ライセンス"}, {"id": "CI-027", "domain": "コンサルティングおよび実装戦略", "topic": "エディションと Sandbox", "q": "ある企業は Enterprise Edition の Sales Cloud を契約している。プロジェクト計画では、本番の全データを使ったステージング環境が必要とされている。コンサルタントがプロジェクト計画の段階で確認すべきことはどれか？", "choices": ["Enterprise Edition ではいかなる Sandbox も作成できないため、エディションをアップグレードする必要がある", "Enterprise Edition には Full Sandbox が標準では含まれていないため、追加購入するか、Partial Copy Sandbox で代替できるかを検討する", "Developer Sandbox で本番の全データをコピーできるため、追加の検討は不要である", "Full Sandbox は無制限に作成でき、更新も毎日可能である"], "answer": [1], "explanation": "エディションによって付属する Sandbox の種類と数は異なり、Enterprise Edition には Full Sandbox が標準では含まれていない。本番の全データを使う環境が必要な場合は、追加購入の要否や Partial Copy Sandbox での代替可否を計画段階で確認する必要がある。", "choiceNotes": ["Enterprise Edition でも Developer Sandbox や Partial Copy Sandbox を利用できる。", "Full Sandbox が標準で含まれないことを踏まえ、購入または代替を検討するのが適切である。", "Developer Sandbox はメタデータのみをコピーし、本番データは含まれない。", "Full Sandbox の数は契約に依存し、更新間隔は29日である。"], "ref": "Salesforce ヘルプ: エディションごとの Sandbox ライセンス / Sandbox の種類"}, {"id": "CI-028", "domain": "コンサルティングおよび実装戦略", "topic": "AppExchange 活用判断", "q": "ある企業では、見積書のPDF生成と電子署名の機能が必要になった。社内開発チームは独自開発を提案しているが、AppExchange にも該当する機能を持つアプリが複数ある。コンサルタントが AppExchange アプリを評価する際に確認すべき点はどれか？（2つ選択してください）", "choices": ["アプリの開発元の本社所在地が自社と同じ都道府県であるか", "アプリのユーザーレビュー・評価や導入実績、Salesforce のセキュリティレビューを通過していることを確認する", "アプリのアイコンのデザインが自社のブランドに合っているか", "アプリが要件をどの程度満たすか、および独自開発と比較したライセンス費用・保守負担などの総コストを評価する", "アプリが無料であれば要件を確認せずに導入する"], "answer": [1, 3], "explanation": "AppExchange アプリを採用するかどうかは、要件の適合度、導入実績やレビュー、セキュリティレビューの通過状況、そして独自開発と比較した総所有コストを踏まえて判断する。既製のアプリは開発・保守の負担を軽減できるが、要件とのギャップやライセンス費用も考慮する必要がある。", "choiceNotes": ["開発元の所在地は機能や品質の評価基準として本質的ではない。", "レビュー、導入実績、セキュリティレビューは品質と信頼性の重要な判断材料である。", "アイコンのデザインは機能や価値と無関係である。", "要件の適合度と総コストの比較は、構築か購入かの判断の中核である。", "無料でも要件に合わなければ価値がなく、保守やセキュリティのリスクもある。"], "ref": "Trailhead: AppExchange の基本 / AppExchange のセキュリティレビュー"}, {"id": "CI2-001", "domain": "コンサルティングおよび実装戦略", "topic": "共有のトラブルシュート", "q": "商談の組織の共有設定（OWD）は「非公開」。営業部長から「自分の部下ではない別部署の担当者が、ある大型商談を参照できている理由を知りたい」と依頼された。コンサルタントがまず使うべき機能はどれか。", "choices": ["商談レコードの［共有階層］ボタンで、アクセスできるユーザーとその理由を確認する", "項目履歴管理を有効にして、所有者の変更履歴を追う", "設定変更履歴を確認して、最近変更された共有ルールを探す", "ログイン履歴を確認して、その担当者のアクセス日時を調べる"], "answer": [0], "explanation": "レコードの［共有階層］（Sharing Hierarchy）では、そのレコードにアクセスできるユーザーと、ロール階層・共有ルール・チームなどアクセス元の理由を確認できます。誰が見られるかを調べるときは、まずこの機能を使います。ほかの履歴機能は補助にはなりますが、アクセスの理由そのものは示しません。", "choiceNotes": ["正解。アクセスできるユーザーとその理由をレコード単位で確認できる。", "項目履歴は値の変更を記録するだけで、アクセス元はわからない。", "設定変更履歴からは変更の有無しかわからず、そのレコードへのアクセス理由は特定できない。", "ログイン履歴はログインの記録で、レコードを参照できる理由とは関係がない。"], "ref": "レコードにアクセスできるユーザーの確認（共有階層）"}, {"id": "CI2-002", "domain": "コンサルティングおよび実装戦略", "topic": "暗黙の共有", "q": "取引先と商談のOWDはどちらも「非公開」。インサイドセールス担当のAさんは、他の営業が所有する取引先に紐づく商談の所有者になった。取引先の共有ルールはない。Aさんはその取引先に対してどのアクセス権を持つか。", "choices": ["アクセスできない", "参照・編集の両方ができる", "暗黙の共有により参照のみできる", "取引先の所有者が手動共有した場合に限り参照できる"], "answer": [2], "explanation": "子レコード（商談・ケース・取引先責任者）にアクセスできるユーザーには、親の取引先への参照のみのアクセス権が暗黙の共有で付与されます。これは親の暗黙の共有と呼ばれ、管理者が無効にすることはできません。編集権限までは付与されません。", "choiceNotes": ["子の商談にアクセスできるため、取引先にもアクセスできる。", "暗黙の共有で付与されるのは参照のみで、編集はできない。", "正解。親の暗黙の共有で参照のみのアクセス権が付与される。", "手動共有がなくても暗黙の共有で参照できる。"], "ref": "暗黙の共有（Implicit Sharing）"}, {"id": "CI2-003", "domain": "コンサルティングおよび実装戦略", "topic": "ロール階層を経由しないアクセス", "q": "人事評価のメモを入れるカスタムオブジェクト「面談記録」がある。OWDは「非公開」。要件は「作成した本人と人事部だけが参照でき、本人の上司（ロール階層の上位者）には見せない」。最も適切な設定はどれか。", "choices": ["ロール階層から上司のロールを外す", "「階層を使用したアクセス許可」をオフにし、人事部向けに共有ルールを作成する", "ページレイアウトから関連リストを外し、上司が開けないようにする", "上司のプロファイルからこのオブジェクトの参照権限を外し、人事部にだけ付与する"], "answer": [1], "explanation": "カスタムオブジェクトでは、OWDの「階層を使用したアクセス許可」をオフにすると、ロール階層の上位者に自動でアクセス権が付与されなくなります。人事部には共有ルールで別途アクセスを与えます。この設定をオフにできるのはカスタムオブジェクトだけです。", "choiceNotes": ["ロール構成を崩すとほかのオブジェクトの共有や予測にも影響し、不適切。", "正解。カスタムオブジェクトなら階層によるアクセスを止め、必要な相手にだけ共有できる。", "レイアウトでは非表示にするだけで、検索やレポートからアクセスできてしまう。", "上司の役職にある人全員が自分の面談記録も作れなくなり、要件に合わない。"], "ref": "組織の共有設定：階層を使用したアクセス許可"}, {"id": "CI2-004", "domain": "コンサルティングおよび実装戦略", "topic": "共有のトラブルシュート", "q": "商談のOWDは「非公開」で、共有ルールもチームも使っていない。ところが、ある営業事務ユーザーが全社の商談を編集できている。原因として考えられるものはどれか。2つ選択してください。", "choices": ["プロファイルか権限セットで、商談の「すべて変更」が付与されている", "「すべてのデータの編集」システム権限が付与されている", "商談のページレイアウトで全項目が編集可能になっている", "商談の項目レベルセキュリティで全項目が「参照のみ」になっていない", "そのユーザーのロールがロール階層の最下位にある"], "answer": [0, 1], "explanation": "オブジェクト権限の「すべて変更」や、システム権限の「すべてのデータの編集」は共有設定より優先されます。これらがあると、OWDに関係なく全レコードを編集できます。トラブルシュートでは、プロファイルと割り当て済みの権限セットの両方を確認します。", "choiceNotes": ["正解。「すべて変更」はそのオブジェクトの共有設定を無視して全レコードを編集できる。", "正解。「すべてのデータの編集」は全オブジェクトの共有を無視する。", "レイアウトは項目の表示方法を決めるだけで、レコードへのアクセス権は与えない。", "項目レベルセキュリティはレコードへのアクセス範囲を広げない。", "ロールが最下位なら階層によるアクセスは減るため、原因にならない。"], "ref": "オブジェクト権限：すべて参照とすべて変更"}, {"id": "CI2-005", "domain": "コンサルティングおよび実装戦略", "topic": "項目が見えないときの切り分け", "q": "営業担当は商談レコードを開けるが、新しく作ったカスタム項目「値引率」が画面に表示されないと報告があった。レコード自体へのアクセスに問題はない。確認すべき項目はどれか。2つ選択してください。", "choices": ["営業担当のプロファイルか権限セットで、その項目の項目レベルセキュリティが参照可能になっているか", "営業担当のレコードタイプとプロファイルに割り当てられたページレイアウトに、その項目が配置されているか", "商談のOWDが「公開/参照・更新可能」になっているか", "営業担当のロールが、商談所有者のロールより上位にあるか", "項目履歴管理がその項目で有効になっているか"], "answer": [0, 1], "explanation": "レコードにはアクセスできるのに項目だけ見えないときは、項目レベルセキュリティとページレイアウト（Dynamic Formsを使っている場合はLightningページの項目配置）を確認します。共有設定やロールはレコード単位のアクセスを決めるもので、項目の表示には関係しません。", "choiceNotes": ["正解。項目レベルセキュリティで参照不可なら、どの画面にも表示されない。", "正解。参照権限があっても、レイアウトに配置されていなければ画面に出ない。", "OWDはレコード単位のアクセスを決めるもので、項目の表示には関係しない。", "ロールはレコードへのアクセスに関わるだけで、項目の表示には影響しない。", "項目履歴管理は変更の記録で、表示されるかどうかとは関係しない。"], "ref": "項目レベルセキュリティとページレイアウト"}, {"id": "CI2-006", "domain": "コンサルティングおよび実装戦略", "topic": "ロール階層を経由しないアクセス", "q": "大阪支店の大型商談に、東京本社の製品スペシャリスト（ロール階層上は別の系統）が参加することになった。この商談にだけ参照・編集のアクセス権を与え、商談画面でメンバーと役割も記録したい。最も適切な方法はどれか。", "choices": ["スペシャリストのロールを大阪支店長の配下に移す", "チームセリングを有効にし、商談チームにスペシャリストを読み取り/書き込み権限で追加する", "商談のOWDを「公開/参照・更新可能」に変更する", "スペシャリストのプロファイルに商談の「すべて変更」を付与する"], "answer": [1], "explanation": "商談チームを使うと、特定の商談にだけ、役割（チームロール）とアクセスレベルを指定してメンバーを追加できます。ロール階層を変えなくても、必要なレコードだけに個別にアクセス権を与えられます。ほかの選択肢はアクセス範囲が広すぎるか、組織の構造を崩します。", "choiceNotes": ["ロールを移すと、ほかの東京本社の業務や共有に影響する。", "正解。特定の商談にだけ、役割付きでアクセス権を与えられる。", "全社の商談が公開になり、要件より広すぎる。", "全社の商談を編集できるようになり、最小権限の原則に反する。"], "ref": "商談チーム（チームセリング）"}, {"id": "CI2-007", "domain": "コンサルティングおよび実装戦略", "topic": "ロール階層を経由しないアクセス", "q": "製造業A社では、ロール階層は人事上の組織（部・課）どおりに作られている。一方で営業活動は「地域×業種」の担当区分で行われ、1つの取引先を複数の区分の担当者が見る必要がある。担当区分は取引先の住所や業種から自動で決めたい。最も適切な機能はどれか。", "choices": ["ロール階層を地域×業種の組み合わせで作り直す", "取引先チームを全取引先に手動で設定する", "エンタープライズテリトリー管理で担当区分を定義し、割り当てルールで取引先を自動割り当てする", "取引先のレコードタイプを地域ごとに作る"], "answer": [2], "explanation": "エンタープライズテリトリー管理では、ロール階層とは別にテリトリー階層を作れます。取引先の項目に基づく割り当てルールで取引先を自動割り当てでき、1つの取引先を複数のテリトリーに割り当てることもできます。テリトリーのユーザーには、取引先と関連する商談などへのアクセス権が付与されます。", "choiceNotes": ["人事組織とは別の軸でロール階層を作り直すと、管理が複雑になり報告系統とも合わなくなる。", "手動設定では件数が多いと維持できず、自動割り当てにならない。", "正解。ロール階層とは別のテリトリー階層を作り、ルールで自動割り当てできる。", "レコードタイプはレイアウトや選択リストを切り替えるもので、アクセス権を与えない。"], "ref": "エンタープライズテリトリー管理"}, {"id": "CI2-008", "domain": "コンサルティングおよび実装戦略", "topic": "権限セットグループ", "q": "「営業基本」権限セットグループを営業全員に割り当てている。グループに含まれる権限セットのうち1つに「レポートのエクスポート」があるが、派遣社員の営業にだけはこの権限を与えたくない。既存の権限セットはほかの部門でも使っている。最も保守しやすい方法はどれか。", "choices": ["派遣社員用に、「営業基本」をコピーした別の権限セットグループを作り、そのグループにミュート権限セットを追加して「レポートのエクスポート」をミュートする", "既存の権限セットから「レポートのエクスポート」を外す", "派遣社員用に新しいプロファイルを作り、プロファイルで「レポートのエクスポート」をオフにする", "派遣社員にだけ権限セットを個別に割り当て、グループは使わない"], "answer": [0], "explanation": "権限セットグループにはミュート権限セットを1つ追加でき、グループ内の特定の権限だけを無効にできます。元の権限セットは変更しないため、ほかの部門への影響がありません。ミュートの効果はそのグループの中だけに及びます。", "choiceNotes": ["正解。元の権限セットを変えずに、派遣社員用のグループでだけ権限を外せる。", "ほかの部門で使っている権限セットを変えると影響が広がる。", "グループ側で付与されている権限は、プロファイルでオフにしても打ち消せない。", "個別に割り当てると管理対象が増え、グループを使うメリットがなくなる。"], "ref": "権限セットグループとミュート権限セット"}, {"id": "CI2-009", "domain": "コンサルティングおよび実装戦略", "topic": "プロファイル最小化", "q": "既存組織にはプロファイルが60個あり、部署が変わるたびに新しいプロファイルが作られて保守できなくなっている。Salesforceが推奨するユーザーアクセス管理への移行方針として最も適切なものはどれか。", "choices": ["部署ごとのプロファイルをそのまま残し、項目追加時の作業を自動化する", "全ユーザーにシステム管理者プロファイルを割り当て、共有ルールで制御する", "プロファイルはライセンスごとにまとめ、権限セットに入れた権限をまとめてユーザーに付与する", "プロファイルを1つにまとめ、すべての権限をそのプロファイルに入れる"], "answer": [2], "explanation": "Salesforceは、プロファイルにはログイン時間・IP制限・デフォルト設定など最小限のものだけを残し、権限は権限セットと権限セットグループで付与する方式を推奨しています。最小アクセス権のプロファイル（Minimum Access - Salesforce）を基本にすると、役割の組み合わせを柔軟に表現できます。", "choiceNotes": ["根本原因であるプロファイルの増殖が解決しない。", "過剰な権限を与えることになり、セキュリティ上問題外。", "正解。プロファイルは最小限にし、権限は権限セットで足していく。", "1つのプロファイルに権限を集めると、全員が過剰な権限を持つことになる。"], "ref": "ユーザーアクセス管理のベストプラクティス（最小アクセス権のプロファイル）"}, {"id": "CI2-010", "domain": "コンサルティングおよび実装戦略", "topic": "組織の拡張（複数事業部）", "q": "法人向け事業部が使っている組織に、個人向け事業部を追加する。個人向けは商談のフェーズが少なく、必要な項目も違う。1つの組織の中で両事業部を運用するための設計として適切なものはどれか。2つ選択してください。", "choices": ["個人向けのフェーズだけを含む商談の営業プロセスを作り、個人向けの商談レコードタイプに関連付ける", "個人向けのレコードタイプに専用のページレイアウトを作り、プロファイルとレコードタイプの組み合わせごとに割り当てる", "個人向け用に「商談2」というカスタムオブジェクトを新しく作る", "フェーズの選択リストに個人向けの値を追加し、入力規則で事業部ごとに選べる値を制限する", "個人向け事業部のために別の本番組織を契約する"], "answer": [0, 1], "explanation": "商談のフェーズの選択肢は営業プロセスで管理し、営業プロセスは商談レコードタイプに関連付けます。項目の違いは、レコードタイプとプロファイルごとのページレイアウト割り当てで表現します。標準オブジェクトを使い続けることで、レポートや予測もそのまま活用できます。", "choiceNotes": ["正解。事業部ごとにフェーズを分けるには、営業プロセスとレコードタイプを使う。", "正解。レコードタイプ別のレイアウトで、事業部ごとに必要な項目を出し分けられる。", "商談の標準機能（予測・パイプラインレポートなど）を使えなくなる。", "入力規則でも制限はできるが、選択肢自体は全員に見え、使い勝手と保守性が悪い。", "要件はレコードタイプで満たせるため、組織を分けるのは過剰でデータも分断される。"], "ref": "営業プロセスとレコードタイプ"}, {"id": "CI2-011", "domain": "コンサルティングおよび実装戦略", "topic": "Sandbox戦略", "q": "本番には約800万件の商談がある。リリース前の最終段階で、本番と同じデータ量を使って業務部門のユーザー受け入れテストと、夜間バッチの性能確認を行いたい。使うべきSandboxはどれか。", "choices": ["Developer Sandbox", "Developer Pro Sandbox", "Partial Copy Sandbox", "Full Sandbox"], "answer": [3], "explanation": "Full Sandboxは本番のメタデータとすべてのデータをコピーするため、本番と同じデータ量での受け入れテストや性能テストに向いています。更新間隔は29日です。ほかのSandboxはデータを含まないか、一部のデータしかコピーしません。", "choiceNotes": ["データはコピーされず、容量も小さいため、データ量を伴うテストには使えない。", "Developerより容量は大きいが、本番データはコピーされない。", "テンプレートで選んだデータの一部（最大5GB）しかコピーされない。", "正解。本番の全データを含むので、本番と同じ条件で検証できる。"], "ref": "Sandboxの種類とライセンス"}, {"id": "CI2-012", "domain": "コンサルティングおよび実装戦略", "topic": "Sandbox戦略", "q": "新人営業の研修を毎週行う。研修環境には本番の一部の取引先と商談を入れておきたく、研修のたびに（週1回程度）環境を初期状態に戻したい。コストも考慮すると、最も適切なSandboxはどれか。", "choices": ["Partial Copy Sandbox（Sandboxテンプレートで対象オブジェクトを選んでコピー）", "Full Sandbox", "Developer Sandbox（研修前に毎回手作業でデータを入れる）", "本番組織に研修用のレコードタイプを作る"], "answer": [0], "explanation": "Partial Copy Sandboxは、Sandboxテンプレートで選んだオブジェクトの本番データの一部をコピーでき、更新間隔は5日なので週1回の更新に対応できます。Full Sandboxは更新間隔が29日で、毎週は戻せません。", "choiceNotes": ["正解。本番データの一部を含み、5日ごとに更新できるので毎週の研修に使える。", "更新間隔が29日なので毎週は初期化できず、コストも高い。", "データがコピーされないため、毎回手作業でデータを入れる負担が大きい。", "本番で研修すると本番データやレポートを汚してしまう。"], "ref": "Sandboxの種類とライセンス（更新間隔）"}, {"id": "CI2-013", "domain": "コンサルティングおよび実装戦略", "topic": "段階的リリース", "q": "全国12支店、営業600名にSalesforceを新しく導入する。現場の抵抗が強いことが予想され、業務を止めずに定着させたい。展開計画として適切なものはどれか。2つ選択してください。", "choices": ["まず1〜2支店でパイロット運用し、フィードバックを反映してから他支店に順次展開する", "各支店から現場のキーユーザー（チャンピオン）を選び、研修と問い合わせの一次窓口を担ってもらう", "混乱を避けるため、全支店で同じ日に一斉に切り替え、旧システムはその日に停止する", "研修は導入後3か月たって利用が定着してから行う", "展開中は要望を一切受け付けず、すべて次年度に回す"], "answer": [0, 1], "explanation": "段階的な展開では、パイロットで課題を早めに見つけて直し、成功事例を作ってから横展開することでリスクを抑えられます。現場のチャンピオンは、利用定着とフィードバック収集に効果があります。研修は導入前後に行い、要望は優先順位をつけて計画的に取り込みます。", "choiceNotes": ["正解。パイロットで課題を見つけて直してから展開するとリスクが小さい。", "正解。現場のチャンピオンが定着を促し、フィードバックの窓口になる。", "抵抗が強い状況での一斉切り替えは、問題が全社に波及するリスクが高い。", "研修が遅いと定着が進まず、誤った使い方が広がる。", "要望を一切受け付けないと現場の不満が高まり、定着を妨げる。"], "ref": "Trailhead：ユーザー導入と変更管理"}, {"id": "CI2-014", "domain": "コンサルティングおよび実装戦略", "topic": "ユーザー受け入れテスト", "q": "商談管理の改修についてユーザー受け入れテスト（UAT）を計画している。UATの進め方として最も適切なものはどれか。", "choices": ["開発者が単体テストと同じ手順で実施し、結果を業務部門に報告する", "業務部門の実ユーザーが、ユーザーストーリーと受け入れ基準をもとにしたテストシナリオを、本番に近いデータのSandboxで実施する", "本番リリース後に、ユーザーの問い合わせをUATの代わりとして扱う", "システム管理者プロファイルでログインし、全機能が動くことを確認する"], "answer": [1], "explanation": "UATは、業務要件を満たしているかを実際の利用者が確かめる工程です。受け入れ基準に基づいたシナリオを、実際の権限で、本番に近いデータを使って実施することで、権限や業務フローの問題も見つかります。", "choiceNotes": ["開発者のテストでは業務の観点が欠け、UATの目的を果たせない。", "正解。実ユーザーが受け入れ基準に沿って、本番に近い環境で検証する。", "リリース後に見つかると、修正のコストと業務への影響が大きい。", "管理者権限では、現場ユーザーの権限で起きる問題を見逃す。"], "ref": "Trailhead：アプリケーションライフサイクル管理（テスト）"}, {"id": "CI2-015", "domain": "コンサルティングおよび実装戦略", "topic": "ガバナンス・CoE", "q": "導入から3年たち、各部門が個別に管理者を置いて設定を変えた結果、似た項目や自動化が重複している。Center of Excellence（CoE）を立ち上げる際に、CoEが担う役割として適切なものはどれか。2つ選択してください。", "choices": ["命名規則・設計標準・リリース手順を定め、全部門の変更が従うようにする", "部門から上がる要望を集約し、ビジネス価値に基づいて優先順位を決める", "すべての設定変更を本番組織で直接行い、スピードを優先する", "各部門の管理者権限を残し、変更内容は年1回の棚卸しでまとめて確認する", "カスタム開発を全面的に禁止し、標準機能だけを使う"], "answer": [0, 1], "explanation": "CoEは標準やベストプラクティスを定め、要望の受付・優先順位付けとリリース管理を一元化して、組織の健全性を保ちます。経営層の関与のもとで意思決定の仕組みを作ることが重要です。", "choiceNotes": ["正解。共通の標準とリリース手順で、重複や品質のばらつきを防ぐ。", "正解。要望を一元管理し、価値に基づいて優先順位を決める。", "本番で直接変更すると、テストされない変更が入るリスクがある。", "年1回の確認では重複の発生を防げない。", "全面禁止は極端で、要件によってはカスタム開発が適切な場合もある。"], "ref": "Trailhead：Salesforceのガバナンス（Center of Excellence）"}, {"id": "CI2-016", "domain": "コンサルティングおよび実装戦略", "topic": "要件の優先順位付け", "q": "初回リリースの期限が決まっているのに、ワークショップで集まった要件が80件あり、全部は入らない。ステークホルダーと合意しながら範囲を決める手法として最も適切なものはどれか。", "choices": ["要望を出した人の役職が高い順に実装する", "実装しやすいものから順に、入るだけ入れる", "MoSCoW法でMust/Should/Could/Won't（今回は対象外）に分け、Mustを初回リリースの範囲にする", "すべての要件を初回に入れられるよう、リリース日を未定にする"], "answer": [2], "explanation": "MoSCoW法は、要件をビジネスへの影響に基づいて分類し、期限内に必ず必要なものを明確にする手法です。Won'tとしたものも記録して、次のリリースの候補として管理します。ステークホルダーと合意した基準で範囲を決めることが重要です。", "choiceNotes": ["役職ではなくビジネス価値で判断すべき。", "実装しやすさだけで選ぶと、重要な要件が漏れる恐れがある。", "正解。ビジネス上の必要度で分類し、合意のうえで範囲を決める。", "期限を守らないと価値の提供が遅れ、プロジェクトのリスクが増える。"], "ref": "Trailhead：ビジネス要件の優先順位付け"}, {"id": "CI2-017", "domain": "コンサルティングおよび実装戦略", "topic": "宣言的ツールとカスタム開発", "q": "要件は「商談のフェーズを『受注』にするとき、『契約開始日』が空なら保存させず、エラーメッセージを項目の横に出す」。開発チームはApexトリガーを提案している。コンサルタントとして推奨するものはどれか。", "choices": ["Apexトリガーで addError を使う", "入力規則を作り、エラーメッセージの表示位置を『契約開始日』に設定する", "レコードトリガーフローで、保存後に契約開始日を今日の日付で埋める", "ページレイアウトで契約開始日を必須項目にする"], "answer": [1], "explanation": "保存時に条件をチェックしてエラーにする要件は、入力規則で宣言的に実現でき、エラーの表示位置も指定できます。コードを使わないので保守が容易で、テストクラスも不要です。ページレイアウトで必須にすると、フェーズに関係なく常に必須になってしまいます。", "choiceNotes": ["実現はできるが、宣言的に実現できる要件にコードを使うのは保守コストが高い。", "正解。条件付きの必須チェックは入力規則で実現できる。", "値を自動で埋めると、誤った日付が登録される。要件はエラーにすること。", "レイアウトでの必須は常に必須になり、APIやインポートには効かない。"], "ref": "入力規則"}, {"id": "CI2-018", "domain": "コンサルティングおよび実装戦略", "topic": "フローの使い分け", "q": "商談が作成・更新されたら、同じ商談の『確度区分』項目を金額とフェーズから計算して設定したい。ほかのレコードは更新しない。性能を最も重視する場合、適切な実装はどれか。", "choices": ["レコードトリガーフローを『レコード更新時の高速項目更新』（保存前）で作る", "レコードトリガーフローを『アクションと関連レコード』（保存後）で作り、同じレコードを更新する", "スケジュールトリガーフローで1時間ごとに全商談を再計算する", "画面フローを作り、営業担当に毎回実行してもらう"], "answer": [0], "explanation": "同じレコードの項目だけを更新する場合は、保存前に実行される高速項目更新のフローを使います。保存前の処理なので、追加のDML処理が発生せず、保存後フローよりかなり高速です。保存後フローで同じレコードを更新すると、余分な保存処理が発生します。", "choiceNotes": ["正解。保存前フローなら追加の保存処理なしで同じレコードを更新できる。", "保存後に同じレコードを更新すると余分なDMLが発生し、性能が落ちる。", "リアルタイムに反映されず、大量の不要な処理が発生する。", "手作業に頼ると漏れが出て、自動化の要件を満たさない。"], "ref": "レコードトリガーフロー（保存前の高速項目更新）"}, {"id": "CI2-019", "domain": "コンサルティングおよび実装戦略", "topic": "フローの使い分け", "q": "「商談の完了予定日の7日前になっても、フェーズが『交渉』より前なら、所有者にタスクを作成する」という要件がある。商談ごとの完了予定日を基準にしたい。最も適切な実装はどれか。", "choices": ["画面フローで営業担当が毎朝手動実行する", "商談のレコードトリガーフローに、完了予定日の7日前に実行するスケジュール済みパスを追加し、実行時にもフェーズを確認する", "Apexトリガーで、商談保存時にすぐタスクを作成する", "完了予定日の項目に入力規則を追加する"], "answer": [1], "explanation": "レコードトリガーフローのスケジュール済みパスは、レコードの日付項目を基準にした相対時間で処理を実行できます。実行時点でのフェーズを判定できるよう、パス内で条件を再確認する設計にします。", "choiceNotes": ["手動実行では漏れが出て、日付基準の自動化にならない。", "正解。レコードの日付項目を基準に、指定したタイミングで処理を実行できる。", "保存時にすぐ作成すると、7日前というタイミング要件を満たさない。", "入力規則は保存時のチェックで、指定日にタスクを作ることはできない。"], "ref": "レコードトリガーフローのスケジュール済みパス"}, {"id": "CI2-020", "domain": "コンサルティングおよび実装戦略", "topic": "フローの使い分け", "q": "毎週月曜の朝6時に、『最終活動日』が60日以上前の未完了商談をすべて抽出し、『要フォロー』チェックボックスをオンにしたい。レコードの作成や更新とは関係なく、決まった時刻に一括で処理する。適切なフローはどれか。", "choices": ["レコードトリガーフロー（保存前）", "画面フロー", "スケジュールトリガーフロー（毎週実行、対象を商談に設定し条件で絞り込む）", "プラットフォームイベントトリガーフロー"], "answer": [2], "explanation": "スケジュールトリガーフローは、指定した日時と頻度で起動し、条件に合うレコードの一括処理に使います。レコードの変更をきっかけにしない定期処理に向いています。", "choiceNotes": ["レコードが保存されたときにしか動かず、更新されない商談は対象にならない。", "画面フローはユーザーの操作で起動するもので、定期実行には使わない。", "正解。決まった時刻に、条件に合うレコードをまとめて処理できる。", "プラットフォームイベントの受信で起動するもので、定期実行の要件には合わない。"], "ref": "スケジュールトリガーフロー"}, {"id": "CI2-021", "domain": "コンサルティングおよび実装戦略", "topic": "フローの使い分け", "q": "営業担当が値引き申請を行う際、条件によって入力項目が変わり、途中で上限値のチェック結果を見せながら、最後に承認申請まで行わせたい。商談画面のボタンから起動したい。最も適切な方法はどれか。", "choices": ["画面フローを作り、商談のクイックアクションまたはLightningページに配置する", "レコードトリガーフロー（保存後）で処理する", "入力規則で上限値をチェックする", "スケジュールトリガーフローで夜間にまとめて承認申請する"], "answer": [0], "explanation": "画面フローはユーザーとの対話を伴うガイド付き入力に使い、条件分岐で画面を切り替えたり、承認申請などのアクションを実行したりできます。クイックアクションやLightningページから起動できます。", "choiceNotes": ["正解。ユーザーとの対話と条件分岐が必要な処理には画面フローを使う。", "レコードトリガーフローは画面を表示できない。", "入力規則ではチェックしかできず、段階的な入力や申請はできない。", "夜間処理ではユーザーとの対話もリアルタイムの申請もできない。"], "ref": "画面フロー"}, {"id": "CI2-022", "domain": "コンサルティングおよび実装戦略", "topic": "外部連携（ERP）設計", "q": "営業担当は取引先画面で、ERPにある受注・出荷状況をリアルタイムに見たい。データ量は数千万件で、Salesforceのストレージにはコピーしたくない。ERPはOData 4.0のエンドポイントを公開している。最も適切な方法はどれか。", "choices": ["Data Loaderで毎晩ERPから全件インポートする", "Salesforce Connectで外部オブジェクトを定義し、取引先との関連を設定する", "ERPのデータを毎時CSV出力し、Salesforceのファイルとして添付する", "営業担当にERPのアカウントを発行し、別画面で確認してもらう"], "answer": [1], "explanation": "Salesforce Connectは外部データをSalesforceにコピーせず、外部オブジェクトとして参照時にリアルタイムで取得します。OData 2.0/4.0に対応しており、外部参照関係などで取引先の関連リストにも表示できます。大容量のデータをストレージを消費せずに扱えます。", "choiceNotes": ["データをコピーするのでストレージを消費し、リアルタイム性もない。", "正解。データをコピーせずに、リアルタイムで参照できる。", "ファイルでは検索や関連付けがしにくく、リアルタイムでもない。", "別画面での確認はユーザー体験が悪く、ライセンスコストもかかる。"], "ref": "Salesforce Connect（外部オブジェクト）"}, {"id": "CI2-023", "domain": "コンサルティングおよび実装戦略", "topic": "外部連携（ERP）設計", "q": "ERPの商品マスタと価格表（約200万件）を、毎晩ミドルウェア経由でSalesforceに同期する。処理時間とAPI呼び出し数を抑えたい。ミドルウェアが使うべきAPIはどれか。", "choices": ["REST API で1件ずつ作成・更新する", "Bulk API 2.0 で非同期の一括処理を行う", "Streaming API で変更を購読する", "Metadata API でデータを配置する"], "answer": [1], "explanation": "Bulk API 2.0は大量レコードの非同期処理に最適化されており、数十万件以上の読み込みに向いています。少ない呼び出し回数で大量のデータを処理できるため、API制限の消費も抑えられます。", "choiceNotes": ["1件ずつでは呼び出し回数が膨大になり、時間もAPI制限も足りない。", "正解。大量データの夜間一括同期に適している。", "Streaming APIはSalesforce側の変更を通知するもので、データ取り込みには使わない。", "Metadata APIは設定（メタデータ）を扱うもので、レコードのデータは扱わない。"], "ref": "Bulk API 2.0"}, {"id": "CI2-024", "domain": "コンサルティングおよび実装戦略", "topic": "外部連携（ERP）設計", "q": "商談が『受注』になったら、受注情報をERPに連携して受注伝票を作りたい。ERPの停止中もSalesforceの保存処理を止めたくないので、疎結合なイベント駆動にしたい。適切な方法はどれか。2つ選択してください。", "choices": ["レコードトリガーフローでプラットフォームイベントを発行し、ミドルウェアがそれを購読してERPに登録する", "商談の変更データキャプチャ（CDC）を有効にし、ミドルウェアが変更イベントを購読してERPに登録する", "営業事務が毎日レポートをエクスポートし、ERPに手入力する", "Apexトリガーから同期でERPのAPIを呼び出し、失敗したら商談の保存をエラーにする", "ERPのユーザーがSalesforceにログインし、受注商談を目視で確認する"], "answer": [0, 1], "explanation": "プラットフォームイベントやCDCを使うと、Salesforceはイベントを発行するだけで、購読側が非同期に処理します。ERPの停止中もSalesforceの保存処理には影響しない疎結合な連携になり、購読側は保持期間内であれば再取得できます。", "choiceNotes": ["正解。フローから発行するイベントを外部の購読者が非同期に処理する。", "正解。レコードの変更を自動でイベントとして配信でき、疎結合に連携できる。", "手作業は遅く、転記ミスも起きる。", "同期呼び出しはERPに依存した密結合になり、トリガー内での同期コールアウトもできない。", "目視確認は自動連携にならず、漏れが出る。"], "ref": "プラットフォームイベントと変更データキャプチャ"}, {"id": "CI2-025", "domain": "コンサルティングおよび実装戦略", "topic": "外部連携（ERP）設計", "q": "ERPの取引先コードをもとに、Salesforceの取引先を毎日新規作成・更新している。ERP側で再送が起きると取引先が重複してしまう。最も適切な対策はどれか。", "choices": ["取引先に『ERP取引先コード』項目を外部IDかつ一意として作り、その項目をキーにupsertで連携する", "取引先名が同じレコードを毎週手作業でマージする", "重複ルールを無効にして連携エラーを減らす", "連携のたびに全取引先を削除してから作り直す"], "answer": [0], "explanation": "外部ID（一意）項目をキーにupsertすると、既存レコードがあれば更新、なければ作成となり、再送されても重複しません。Salesforce IDを外部システムに持たせる必要もありません。", "choiceNotes": ["正解。外部IDをキーにしたupsertで、再送しても冪等な連携になる。", "事後のマージは手間がかかり、重複の発生自体は防げない。", "重複ルールを無効にすると重複を防げなくなる。", "削除して作り直すと、関連する商談や活動の参照が切れてしまう。"], "ref": "外部ID項目とupsert"}, {"id": "DA-001", "domain": "データ管理", "topic": "インポートツールの選択（件数）", "q": "ある製造業の企業では、旧CRMから約12万件の取引先責任者を Salesforce へ移行する予定である。管理者はコードを書かずに作業したいと考えている。コンサルタントは何を推奨すべきか？", "choices": ["データインポートウィザードを使用して、一度にすべての取引先責任者をインポートする", "データローダを使用して取引先責任者をインポートする", "取引先責任者を手動で入力するよう営業担当者に依頼する", "レポートのインポート機能を使用して取引先責任者を作成する"], "answer": [1], "explanation": "データインポートウィザードが一度に処理できるのは最大5万件である。それを超える件数を扱う場合は、クライアントアプリケーションであるデータローダが適している。データローダはGUIで操作でき、コードを書く必要はない。", "choiceNotes": ["誤り。12万件はインポートウィザードの上限（5万件）を超える。", "正しい。データローダは大量レコードをGUIで処理でき、コードは不要。", "誤り。件数が多く非効率で、入力ミスも起きやすい。", "誤り。レポートにはレコードを作成するインポート機能はない。"], "ref": "データのインポート方法の選択（データインポートウィザードとデータローダ）"}, {"id": "DA-002", "domain": "データ管理", "topic": "インポートウィザードの適用場面", "q": "ある不動産会社では、展示会で集めた約800件のリードを営業企画担当者が毎月自分で登録している。担当者はIT部門に頼らず、ブラウザだけで作業し、取込み時に重複も避けたいと考えている。コンサルタントは何を推奨すべきか？", "choices": ["Bulk API を使用するカスタム連携を開発する", "データローダをコマンドラインで実行するようにスケジュールする", "データインポートウィザードを使用し、メールアドレスなどで既存リードと照合する", "Apex トリガでリードを一括作成する"], "answer": [2], "explanation": "データインポートウィザードはブラウザから使えるため、件数が少なく現場担当者が自分で取り込むケースに向いている。リードや取引先責任者は、名前やメールアドレスで既存レコードと照合して重複を避けられる。", "choiceNotes": ["誤り。800件程度の取込みに開発は過剰。", "誤り。コマンドライン実行には設定の知識が必要で、担当者だけでは運用できない。", "正しい。ブラウザで完結し、照合条件で重複も防げる。", "誤り。開発が必要で、要件に合わない。"], "ref": "データインポートウィザード、データのインポートに関するよくある質問"}, {"id": "DA-003", "domain": "データ管理", "topic": "エクスポートと一括削除", "q": "ある企業では、テスト用に作った古い商談データを定期的にCSVでバックアップしてから一括削除したいと考えている。対象は約3万件である。コンサルタントは何を推奨すべきか？", "choices": ["データローダでエクスポートを実行し、その後IDを指定して削除を実行する", "データインポートウィザードでエクスポートと削除を行う", "商談リストビューで全件を選択し、手動で削除する", "商談の入力規則でレコードを無効化する"], "answer": [0], "explanation": "データローダは、挿入・更新・アップサートに加え、エクスポートと削除にも対応している。データインポートウィザードはインポート専用で、エクスポートや削除はできない。", "choiceNotes": ["正しい。データローダならエクスポートと削除の両方ができる。", "誤り。インポートウィザードはエクスポートや削除に対応していない。", "誤り。3万件を手作業で消すのは現実的でなく、バックアップも取れない。", "誤り。入力規則は保存時のチェックで、削除やバックアップには使えない。"], "ref": "データローダ（エクスポートと削除操作）"}, {"id": "DA-004", "domain": "データ管理", "topic": "一致ルールと重複ルール", "q": "ある保険代理店では、営業担当者が同じ取引先責任者を何度も作成してしまう。保存時に重複の可能性を警告しつつ、作成は許可し、発生した重複を後でレポートで確認したい。コンサルタントが推奨すべき設定はどれか？（2つ選択してください）", "choices": ["取引先責任者の一致ルールを有効化する", "取引先責任者の重複ルールを作成し、作成時のアクションを「許可」として警告とレポートを有効にする", "取引先責任者の Email 項目を外部IDとして設定する", "取引先責任者のページレイアウトで Email 項目を必須にする", "取引先責任者の項目履歴管理を有効化する"], "answer": [0, 1], "explanation": "重複管理では、一致ルールで何を重複とみなすかを定義し、重複ルールで保存時のアクション（許可または禁止）、警告、レポートを指定する。重複ルールが参照する一致ルールは有効化しておく必要がある。レポートを有効にすると重複レコードセットが作成され、後から確認できる。", "choiceNotes": ["正しい。重複ルールが参照する一致ルールは有効化しておく必要がある。", "正しい。「許可」と警告で作成を止めずに知らせ、レポートで重複レコードセットを残せる。", "誤り。外部IDはアップサートなどの照合用で、ユーザーへの重複警告は出さない。", "誤り。必須にしても重複は検知できない。", "誤り。項目の変更を記録するだけで、重複は検知しない。"], "ref": "重複管理（一致ルール、重複ルール、重複レコードセット）"}, {"id": "DA-005", "domain": "データ管理", "topic": "重複ルールのブロック", "q": "ある金融機関では、コンプライアンス上、同じ法人番号を持つ取引先を作成できないようにしたい。ユーザーが重複する取引先を保存しようとしたら、確実に保存を止めたい。コンサルタントは何を推奨すべきか？", "choices": ["法人番号を比較する一致ルールを使い、重複ルールの作成アクションを「許可」にして警告を表示する", "取引先の割り当てルールを設定する", "法人番号の項目を項目履歴管理の対象にする", "法人番号を比較する一致ルールを使い、重複ルールの作成アクションを「ブロック」にする"], "answer": [3], "explanation": "重複ルールのアクションを「ブロック」にすると、一致ルールに該当するレコードは保存できなくなる。「許可」では警告が出るだけで、保存はできてしまう。", "choiceNotes": ["誤り。「許可」は警告を出すだけで、保存は止められない。", "誤り。割り当てルールは所有者を決める機能で、重複は防げない。", "誤り。履歴は変更を記録するだけで、作成は止めない。", "正しい。「ブロック」なら重複レコードの保存を止められる。"], "ref": "重複ルールのアクション（許可／ブロック）"}, {"id": "DA-006", "domain": "データ管理", "topic": "入力規則", "q": "ある企業の営業部長は、商談を「Closed Lost」にするときは必ず「失注理由」を入力してほしいと考えている。他のフェーズでは失注理由は不要である。コンサルタントは何を推奨すべきか？", "choices": ["失注理由の項目をページレイアウトで必須にする", "フェーズが「Closed Lost」で失注理由が空白のときにエラーを表示する入力規則を作成する", "失注理由の項目を項目レベルセキュリティで参照のみにする", "失注理由を数式項目に変更する"], "answer": [1], "explanation": "条件によって入力を必須にしたい場合は入力規則を使う。ページレイアウトの必須設定は常に適用されるため、フェーズに関係なく入力を求めてしまう。", "choiceNotes": ["誤り。常に必須になり、他のフェーズでも入力が必要になる。", "正しい。条件付きの必須チェックは入力規則で実現できる。", "誤り。参照のみにすると入力そのものができなくなる。", "誤り。数式項目はユーザーが入力できない。"], "ref": "入力規則、入力規則の例"}, {"id": "DA-007", "domain": "データ管理", "topic": "選択リストの標準化", "q": "ある企業では、取引先、リード、カスタムオブジェクト「案件」の3つに「地域」という選択リストがある。値がオブジェクトごとに少しずつ違い、レポートで集計しにくい。今後は値を一か所で管理し、ユーザーが一覧にない値を入れられないようにしたい。コンサルタントは何を推奨すべきか？", "choices": ["グローバル選択リスト値セットを作成し、各オブジェクトの「地域」項目がそれを使うようにする", "「地域」をテキスト項目に変え、入力規則で文字数を制限する", "各オブジェクトの選択リストに「その他」を追加する", "地域ごとにレコードタイプを作成する"], "answer": [0], "explanation": "グローバル選択リスト値セットを使うと、複数の選択リスト項目で同じ値を共有し、一か所で管理できる。グローバル値セットを使う選択リストは制限付きなので、定義されていない値は保存できない。", "choiceNotes": ["正しい。値を一元管理でき、一覧にない値も入らない。", "誤り。テキスト項目では値がばらつき、問題がかえって悪化する。", "誤り。値のばらつきは解消しない。", "誤り。レコードタイプはプロセスやレイアウトを分ける機能で、値を統一する機能ではない。"], "ref": "グローバル選択リスト値セット、制限付き選択リスト"}, {"id": "DA-008", "domain": "データ管理", "topic": "API経由でも有効な必須化", "q": "ある企業では、取引先を画面から作成するだけでなく、基幹システムからの API 連携でも作成している。連携で作られた取引先に「顧客区分」が入っていないことがある。どの経路で作成しても顧客区分が必ず入るようにするには、どの方法が有効か？（2つ選択してください）", "choices": ["ページレイアウトで顧客区分を必須にする", "顧客区分の項目定義で「常に値を必須にする」を有効にする", "顧客区分が空白のときにエラーを返す入力規則を作成する", "Lightning レコードページで顧客区分の項目を目立つ位置に置く", "顧客区分の既定値をユーザーごとに設定する"], "answer": [1, 2], "explanation": "ページレイアウトの必須設定は画面での入力にしか効かず、API での作成には適用されない。項目定義で常に必須にする設定や入力規則は、API を含むすべての保存処理に適用される。", "choiceNotes": ["誤り。画面での入力にしか効かず、API 連携には適用されない。", "正しい。項目定義での必須はすべての作成経路に適用される。", "正しい。入力規則は API による保存でも評価される。", "誤り。表示位置を変えても入力は強制されない。", "誤り。ユーザーごとの既定値という標準機能はなく、入力も保証されない。"], "ref": "項目の必須化（ユニバーサル必須項目）、入力規則"}, {"id": "DA-009", "domain": "データ管理", "topic": "外部IDとアップサート", "q": "ある卸売業者では、毎晩ERPから取引先データを Salesforce に連携している。ERPには Salesforce のレコードIDがなく、ERP独自の顧客コードで管理している。新しい顧客は作成し、既存の顧客は更新したい。コンサルタントは何を推奨すべきか？", "choices": ["毎晩すべての取引先を削除してから再度インポートする", "顧客コードを取引先名の末尾に連結し、名前で照合する", "取引先に顧客コードの項目を作り外部IDとして設定し、それをキーにアップサートする", "新しい顧客と既存の顧客を手作業で分けて、それぞれ挿入と更新を行う"], "answer": [2], "explanation": "外部IDに設定した項目をキーにアップサートすると、一致するレコードがあれば更新し、なければ新しく作成する。Salesforce のIDを持たない外部システムとの連携でよく使われる方法である。", "choiceNotes": ["誤り。毎回IDが変わり、関連する活動や商談との紐付けが失われる。", "誤り。名前での照合は不確実で、データ品質も下がる。", "正しい。外部IDを使ったアップサートで作成と更新を一度に処理できる。", "誤り。毎晩の手作業は非効率で、ミスも起きやすい。"], "ref": "外部ID、データローダのアップサート"}, {"id": "DA-010", "domain": "データ管理", "topic": "データスキュー（取引先）", "q": "ある企業では、個人顧客の取引先責任者をすべて「未割当顧客」という1つの取引先にまとめている。その取引先には約30万件の取引先責任者がひもづいており、一括更新のときにロックエラーや処理の遅れが起きている。コンサルタントは何を推奨すべきか？", "choices": ["未割当顧客の取引先に入力規則を追加する", "取引先責任者の項目履歴管理を有効化する", "未割当顧客の取引先の所有者をシステム管理者に変更する", "子レコードを複数の取引先に分散させ、1つの取引先に1万件を超える子レコードが集中しないようにする"], "answer": [3], "explanation": "1つの親レコードに大量の子レコードが集中する状態を取引先データスキューと呼ぶ。子レコードを更新するときに親レコードがロックされるため、競合や処理の遅れが起きやすい。1つの親あたりの子レコードを1万件以下に抑えるよう分散させるのが推奨されている。", "choiceNotes": ["誤り。入力規則を追加するとかえって処理が増え、スキューは解消しない。", "誤り。記録処理が増えるだけで、ロックの原因は解消しない。", "誤り。所有者を変えても、子レコードの集中は残る。", "正しい。子レコードを分散するのがスキュー対策の基本である。"], "ref": "大規模データ量の考慮事項、データスキュー（取引先スキュー）"}, {"id": "DA-011", "domain": "データ管理", "topic": "所有権スキュー", "q": "ある企業では、連携用の統合ユーザーがリード約50万件を所有している。このユーザーはロール階層の中間に置かれており、共有の再計算に時間がかかっている。所有者を変えずに影響を小さくするには、コンサルタントは何を推奨すべきか？", "choices": ["統合ユーザーにリードの「すべて変更」権限を付与する", "統合ユーザーをロールに割り当てないか、ロール階層の最上位に置く", "リードの組織の共有設定を「公開/参照・更新可能」に変更する", "統合ユーザーのプロファイルを毎日変更する"], "answer": [1], "explanation": "1人のユーザーが大量のレコードを所有している状態を所有権スキューと呼ぶ。そのユーザーがロール階層の途中にいると、ロール変更などのたびに大規模な共有の再計算が起きる。推奨されているのは、ロールに割り当てないか、階層の最上位に置くことである。", "choiceNotes": ["誤り。権限を付与しても共有の再計算は減らない。", "正しい。所有権スキューへの推奨される対策である。", "誤り。セキュリティ要件を無視した変更であり、根本的な対策にもならない。", "誤り。変更のたびに再計算が起き、逆効果になる。"], "ref": "所有権データスキュー、大規模データ量のベストプラクティス"}, {"id": "DA-012", "domain": "データ管理", "topic": "項目履歴管理の設定", "q": "ある企業では、取引先の「顧客ランク」が、いつ、誰によって、どの値からどの値に変わったかを営業マネージャーが画面で確認したい。コンサルタントは何を推奨すべきか？", "choices": ["顧客ランクが変わるたびにタスクを作成するよう営業担当者に依頼する", "顧客ランクを数式項目に変更する", "取引先の項目履歴管理を有効化して顧客ランクを対象にし、取引先履歴の関連リストをレイアウトに追加する", "取引先のリストビューに顧客ランクを追加する"], "answer": [2], "explanation": "項目履歴管理を使うと、対象の項目について変更日時、変更者、変更前の値、変更後の値が記録される。履歴の関連リストをページレイアウトに追加すれば、画面から確認できる。", "choiceNotes": ["誤り。手作業に頼るため、漏れが出る。", "誤り。数式項目にすると手入力できず、変更の履歴も残らない。", "正しい。変更内容が自動で記録され、関連リストで確認できる。", "誤り。現在の値しか見えず、変更の履歴はわからない。"], "ref": "項目履歴管理"}, {"id": "DA-013", "domain": "データ管理", "topic": "長期の監査証跡", "q": "ある金融機関では、規制対応のため、取引先の特定項目の変更履歴を10年間保持する必要がある。標準の項目履歴管理だけでは保持期間が足りない。コンサルタントは何を推奨すべきか？", "choices": ["項目履歴管理で追跡する項目数を増やす", "設定変更履歴を有効化する", "毎日レポートを手作業で印刷して保管する", "Salesforce Shield の項目監査履歴（Field Audit Trail）を導入し、保持ポリシーを定義する"], "answer": [3], "explanation": "標準の項目履歴管理は、データの保持期間に上限がある（組織内では18か月が目安）。項目監査履歴を使うと保持ポリシーを定義でき、最長10年間、履歴を保持できる。", "choiceNotes": ["誤り。追跡する項目を増やしても、保持期間は延びない。", "誤り。設定変更履歴は設定の変更を記録するもので、データの変更は対象外。", "誤り。非効率で漏れが出やすく、監査要件を満たしにくい。", "正しい。項目監査履歴なら長期間の保持要件に対応できる。"], "ref": "項目監査履歴（Field Audit Trail）、項目履歴の保持"}, {"id": "DA-014", "domain": "データ管理", "topic": "削除データの復元とバックアップ", "q": "ある企業の営業担当者が、3日前に重要な商談を誤って削除した。システム管理者はデータを復元したいと考えている。あわせて、全データを定期的にバックアップする方法も知りたい。コンサルタントは何を推奨すべきか？", "choices": ["削除した商談はごみ箱から復元し、定期バックアップにはデータエクスポートサービスの定期エクスポートを使う", "削除した商談は項目履歴から再作成し、バックアップは不要と伝える", "削除した商談はリストビューの「最近削除」から編集する", "削除した商談は二度と復元できないため、データローダで新規作成する"], "answer": [0], "explanation": "削除したレコードは、一定期間（通常15日間）ごみ箱に残るため、そこから復元できる。データエクスポートサービスを使うと、組織のデータを週次または月次でCSVとしてエクスポートするよう予約できる。", "choiceNotes": ["正しい。ごみ箱から復元でき、定期エクスポートでバックアップも取れる。", "誤り。履歴から元のレコードは作り直せず、バックアップの要否も見誤っている。", "誤り。そのような機能はない。", "誤り。ごみ箱の保持期間内であれば復元できる。"], "ref": "ごみ箱、データのエクスポート（データエクスポートサービス）"}, {"id": "DA-015", "domain": "データ管理", "topic": "積み上げ集計項目と主従関係", "q": "ある建設会社では、カスタムオブジェクト「工事」と「工事明細」があり、明細は参照関係で工事に紐付いている。どの明細にも必ず工事が設定されている。工事レコードに明細金額の合計を標準機能で表示したい。コンサルタントは何を推奨すべきか？", "choices": ["工事に数式項目を作り、明細金額を参照する", "参照関係を主従関係に変更し、工事に積み上げ集計項目を作成する", "工事明細に積み上げ集計項目を作成する", "工事明細のレポートを作成して、合計を工事の説明欄に手で書き写す"], "answer": [1], "explanation": "積み上げ集計項目は、主従関係の主側オブジェクトに作成する。参照関係のままでは作成できないが、すべての子レコードに親が設定されていれば、主従関係に変更できる。", "choiceNotes": ["誤り。数式項目で子レコードの値を集計することはできない。", "正しい。主従関係に変更すれば、主側に積み上げ集計項目を作成できる。", "誤り。積み上げ集計項目は従側ではなく主側に作る。", "誤り。手作業で、値がすぐに古くなる。"], "ref": "積み上げ集計項目、主従関係への変換"}, {"id": "DA-016", "domain": "データ管理", "topic": "取引先での商談集計", "q": "ある企業の営業部長は、取引先ごとに、今年度の「Closed Won」商談の金額合計を取引先レコードに表示したい。コンサルタントは何を推奨すべきか？", "choices": ["取引先に数式項目を作り、商談の金額を参照する", "取引先と商談の関係を主従関係に変更する", "取引先に、商談の金額を合計する積み上げ集計項目を作り、フェーズと完了予定日で絞り込む条件を設定する", "商談に積み上げ集計項目を作る"], "answer": [2], "explanation": "取引先と商談の関係は主従関係ではないが、標準機能として、取引先に商談を集計する積み上げ集計項目を作成できる。絞り込み条件を設定すれば、Closed Won で今年度の商談だけを合計できる。", "choiceNotes": ["誤り。数式項目では子レコードを集計できない。", "誤り。標準の関係は変更できず、変更しなくても集計できる。", "正しい。取引先には商談を集計する積み上げ集計項目を作成できる。", "誤り。集計結果を表示したいのは親の取引先である。"], "ref": "積み上げ集計項目（取引先での商談の集計）"}, {"id": "DA-017", "domain": "データ管理", "topic": "マルチ通貨と価格表", "q": "ある日本企業は米国に進出し、同じ製品を円とドルで販売することになった。商談には販売通貨で製品を追加したい。コンサルタントが推奨すべき対応はどれか？（2つ選択してください）", "choices": ["マルチ通貨を有効化し、使用する通貨とその換算レートを有効にする", "製品ごとに円用とドル用の別の製品レコードを作る", "価格表に、各製品の円とドルの価格表エントリを作成する", "商談の金額をテキスト項目に変更する", "商談の通貨は常に会社の通貨に固定する"], "answer": [0, 2], "explanation": "マルチ通貨を有効にすると、レコードごとに通貨を持てるようになる。価格表エントリは通貨ごとに作成し、商談に追加できるのは商談と同じ通貨の価格表エントリだけである。", "choiceNotes": ["正しい。複数の通貨を扱うにはマルチ通貨の有効化が必要。", "誤り。1つの製品に通貨ごとの価格表エントリを持たせれば済み、製品マスタを重複させる必要はない。", "正しい。商談と同じ通貨の価格表エントリが必要になる。", "誤り。集計や換算ができなくなる。", "誤り。ドルで販売する商談が作れなくなる。"], "ref": "マルチ通貨の有効化、価格表エントリと通貨"}, {"id": "DA-018", "domain": "データ管理", "topic": "日付別換算レート", "q": "ある多国籍企業では、商談の金額を完了予定日時点の為替レートで会社の通貨に換算し、レポートしたいと考えている。マルチ通貨はすでに有効になっている。コンサルタントは何を推奨すべきか？", "choices": ["会社の通貨を毎月変更する", "通貨ごとに別の Salesforce 組織を用意する", "商談に通貨換算用の数式項目を作り、レートを固定値で書く", "日付別換算レート（高度な通貨管理）を有効化し、期間ごとの換算レートを管理する"], "answer": [3], "explanation": "高度な通貨管理を有効にすると、日付ごとに換算レートを持てる。商談の金額は、完了予定日に該当する期間のレートで換算される。", "choiceNotes": ["誤り。会社の通貨を頻繁に変えるのは非現実的で、データの整合性も崩れる。", "誤り。運用やレポートがかえって複雑になる。", "誤り。固定値ではレートの変動を反映できない。", "正しい。日付別換算レートで完了予定日時点のレートを使える。"], "ref": "高度な通貨管理、日付別換算レート"}, {"id": "DA-019", "domain": "データ管理", "topic": "Data Cloud の役割", "q": "ある小売企業では、ECサイトの購買履歴、マーケティングのメール反応、Sales Cloud の商談データがそれぞれ別のシステムにある。これらを1人の顧客の統合プロファイルにまとめ、セグメントを作って営業活動に活用したい。コンサルタントは何を推奨すべきか？", "choices": ["Data Cloud でデータを取り込み、ID解決で統合プロファイルを作り、セグメントを作成する", "すべてのデータを取引先のロングテキストエリアに貼り付ける", "データインポートウィザードで毎日手作業で取り込む", "各システムのレポートをそれぞれ見るよう営業担当者に依頼する"], "answer": [0], "explanation": "Data Cloud は、複数のソースからデータを取り込んでデータモデルに合わせ、ID解決によって統合された顧客プロファイルを作る。そのプロファイルをもとにセグメントを作り、各チャネルで活用できる。", "choiceNotes": ["正しい。複数ソースの統合とセグメント化は Data Cloud の中心的な役割である。", "誤り。構造化されず、分析にも活用にも使えない。", "誤り。手作業では統合もID解決もできない。", "誤り。統合ビューにならず、要件を満たさない。"], "ref": "Data Cloud の基本、ID解決と統合プロファイル"}, {"id": "DA-020", "domain": "データ管理", "topic": "データ取込み順序", "q": "ある企業では、旧システムから取引先、取引先責任者、商談、商談の取引先責任者の役割をSalesforceに移行する。ユーザーはすでに作成済みである。関連付けの失敗を避けるための適切な取込み順序はどれか？", "choices": ["商談 → 取引先 → 取引先責任者 → 取引先責任者の役割", "取引先責任者 → 商談 → 取引先 → 取引先責任者の役割", "取引先 → 取引先責任者 → 商談 → 取引先責任者の役割", "取引先責任者の役割 → 商談 → 取引先責任者 → 取引先"], "answer": [2], "explanation": "子レコードを取り込むときは、参照先の親レコードがすでに存在している必要がある。取引先責任者と商談は取引先を参照し、取引先責任者の役割は商談と取引先責任者の両方を参照するため、この順序が適切である。", "choiceNotes": ["誤り。商談を取り込む時点で、参照先の取引先がまだない。", "誤り。親の取引先より先に子を取り込んでいる。", "正しい。親から子へと順に取り込んでいる。", "誤り。参照先がない状態で、中間オブジェクトから取り込んでいる。"], "ref": "データ移行のベストプラクティス（読み込み順序）"}, {"id": "DA-021", "domain": "予測AI・生成AI", "topic": "Einstein リードスコアリングとグローバルモデル", "q": "あるスタートアップは Salesforce を導入したばかりで、リードの取引開始の実績がまだ少ない。それでも、営業担当者が有望なリードを優先できるよう、Einstein リードスコアリングを使いたいと考えている。コンサルタントは何を伝えるべきか？", "choices": ["十分な実績がたまるまで、Einstein リードスコアリングは有効化できない", "実績が少ない間はグローバルモデルでスコアが付き、十分なデータがたまると組織固有のモデルに切り替わる", "スコアは営業担当者が手で入力する必要がある", "Einstein リードスコアリングを使うには Data Cloud が必須である"], "answer": [1], "explanation": "組織に十分な取引開始の実績がない場合、Einstein リードスコアリングは、複数の組織から匿名化したデータで作ったグローバルモデルを使う。データが十分にたまると、組織固有のモデルを使うようになる。", "choiceNotes": ["誤り。グローバルモデルを使えば有効化できる。", "正しい。データ量に応じて、グローバルモデルと組織固有のモデルが使い分けられる。", "誤り。スコアは自動で算出される。", "誤り。リードスコアリングに Data Cloud は必要ない。"], "ref": "Einstein リードスコアリング（グローバルモデル）"}, {"id": "DA-022", "domain": "予測AI・生成AI", "topic": "スコア要因の活用", "q": "ある企業では Einstein リードスコアリングを有効にした。営業担当者から「スコアの数字だけでは、なぜ有望なのかがわからない」という声が出ている。コンサルタントは何を推奨すべきか？", "choices": ["スコアを非表示にして、営業担当者の判断だけに任せる", "リードスコアの項目を削除する", "スコアをもとに入力規則を作成する", "リードのレコードページに Einstein スコアのコンポーネントを配置し、スコアに影響した上位の要因を表示する"], "answer": [3], "explanation": "Einstein リードスコアリングは、スコアとあわせて、スコアを上げた要因と下げた要因を示す。レコードページのコンポーネントで要因を表示すれば、営業担当者はスコアの理由を理解して行動できる。", "choiceNotes": ["誤り。予測AIの価値を活かせない。", "誤り。根本的な解決にならない。", "誤り。入力規則で根拠は説明できない。", "正しい。要因を表示すれば、スコアの理由が伝わる。"], "ref": "Einstein リードスコアリング（スコアの要因表示）"}, {"id": "DA-023", "domain": "予測AI・生成AI", "topic": "Einstein 商談スコアリング", "q": "ある企業の営業マネージャーは、パイプラインの中で受注の見込みが高い商談と、リスクのある商談をすばやく見分けたいと考えている。組織には過去数年分の受注と失注の商談データがある。コンサルタントは何を推奨すべきか？", "choices": ["Einstein 商談スコアリングを有効化し、商談のスコアと要因をリストビューやレコードページに表示する", "Einstein 活動キャプチャを有効化する", "商談の確度を手入力させる入力規則を作成する", "Einstein リードスコアリングを商談にも適用する"], "answer": [0], "explanation": "Einstein 商談スコアリングは、過去の受注・失注の商談データや活動をもとに、商談ごとに受注の可能性をスコアで示す。上位の要因も表示されるので、優先順位付けやリスクの把握に役立つ。", "choiceNotes": ["正しい。商談の受注可能性を予測し、要因もあわせて示す。", "誤り。メールや予定を同期する機能で、スコアは付けない。", "誤り。主観的な入力であり、予測AIではない。", "誤り。リードスコアリングの対象はリードだけである。"], "ref": "Einstein 商談スコアリング"}, {"id": "DA-024", "domain": "予測AI・生成AI", "topic": "商談スコアリングの学習データ", "q": "ある企業は Einstein 商談スコアリングを有効にしたが、Salesforce を導入して間もないため、完了した商談の数が少ない。管理者は、スコアが表示されないのではないかと心配している。コンサルタントの説明として正しいものはどれか？", "choices": ["完了した商談がなければ、商談スコアリングは使えない", "商談スコアは営業担当者の入力から計算される", "組織のデータが要件に満たない間はグローバルモデルでスコアが付き、要件を満たすと組織固有のモデルが作られる", "商談スコアリングは、取引先のスコアだけを表示する"], "answer": [2], "explanation": "Einstein 商談スコアリングは、組織固有のモデルを作るのに、一定数以上の受注・失注の商談を必要とする。要件を満たさない間は、グローバルモデルを使ってスコアを付ける。", "choiceNotes": ["誤り。グローバルモデルで使える。", "誤り。スコアは機械学習のモデルが算出する。", "正しい。データ量に応じてモデルが切り替わる。", "誤り。スコアは商談に付く。"], "ref": "Einstein 商談スコアリングの要件、グローバルモデル"}, {"id": "DA-025", "domain": "予測AI・生成AI", "topic": "Einstein 売上予測", "q": "ある企業の営業本部長は、営業担当者が入力した売上予測に加えて、AIが期末にどれくらいの結果になると予測しているかを見て、売上予測の精度を高めたいと考えている。コンサルタントは何を推奨すべきか？", "choices": ["Einstein 活動キャプチャを有効化する", "Einstein リードスコアリングのスコアを売上予測に使う", "商談に数式項目を作り、金額に確度をかける", "コラボレーション売上予測を前提に、Einstein 売上予測を有効化する"], "answer": [3], "explanation": "Einstein 売上予測は、過去の実績やパイプラインをもとに、期末の売上がどれくらいになるかを予測し、売上予測ページに表示する。コラボレーション売上予測の機能の上で動く。", "choiceNotes": ["誤り。活動の同期機能で、売上を予測するものではない。", "誤り。リードのスコアは売上予測ではない。", "誤り。単純な期待値の計算であり、AIによる予測ではない。", "正しい。売上予測ページにAIの予測を表示できる。"], "ref": "Einstein 売上予測、コラボレーション売上予測"}, {"id": "DA-026", "domain": "予測AI・生成AI", "topic": "Einstein 活動キャプチャ", "q": "ある企業では、営業担当者がメールや会議を Salesforce に記録し忘れることが多い。Gmail や Microsoft のメールとカレンダーの活動を自動で取り込みたい。ただし、取り込んだメールで標準のレポートを作りたいという要望もある。コンサルタントの説明として正しいものはどれか？", "choices": ["Einstein 活動キャプチャで活動を自動で取り込める。ただし、取り込んだメールは標準の活動レコードとしては保存されないため、標準レポートの利用は制限される", "Einstein 活動キャプチャで取り込んだメールは、すべてタスクレコードとして保存され、標準レポートで自由に集計できる", "Einstein 活動キャプチャは Salesforce 内で送信したメールにしか対応していない", "Einstein 活動キャプチャを使うには、すべての営業担当者が手動で同期ボタンを押す必要がある"], "answer": [0], "explanation": "Einstein 活動キャプチャは、メールとカレンダーのアカウントを接続して、メールや予定を関連するレコードのタイムラインに自動で表示する。取り込んだメールは標準のタスクや行動のレコードとしては保存されないため、標準レポートの対象には制限がある。集計には活動指標などを使う。", "choiceNotes": ["正しい。自動で取り込める一方、レポートには制約がある。", "誤り。取り込んだメールは標準のタスクとしては保存されない。", "誤り。外部のメールサービスと接続して取り込む機能である。", "誤り。接続後は自動で同期される。"], "ref": "Einstein 活動キャプチャの考慮事項、活動指標"}, {"id": "DA-027", "domain": "予測AI・生成AI", "topic": "Agentforce のトピックとアクション", "q": "ある企業では、営業担当者を支援する Agentforce エージェントを運用している。新たに、担当者が自然言語で依頼すると、商談の次のステップを提案する仕事をエージェントに追加したい。コンサルタントは何を推奨すべきか？", "choices": ["エージェントのプロファイルにシステム管理者権限を付与する", "新しいトピックを作成し、その仕事の範囲と指示を記述して、必要なアクションを割り当てる", "商談に新しい入力規則を追加する", "エージェントを削除して、作り直す"], "answer": [1], "explanation": "Agentforce では、トピックがエージェントが担う仕事の範囲を定め、トピックの指示が振る舞いを導く。アクションは、エージェントが実際に実行する処理（フロー、Apex、プロンプトテンプレートなど）である。新しい仕事を追加するには、トピックを作り、アクションを割り当てる。", "choiceNotes": ["誤り。権限を広げても仕事は追加されず、セキュリティ上も望ましくない。", "正しい。トピック、指示、アクションの組み合わせで仕事を定義する。", "誤り。入力規則はエージェントの機能とは関係ない。", "誤り。トピックを追加すれば拡張できる。"], "ref": "Agentforce の概念（エージェント、トピック、アクション）"}, {"id": "DA-028", "domain": "予測AI・生成AI", "topic": "エージェントアクションの種類", "q": "ある企業では、Agentforce エージェントに独自の業務処理を実行させたい。エージェントのカスタムアクションとして利用できるものはどれか？（2つ選択してください）", "choices": ["自動起動フロー（トリガーなし）", "ページレイアウト", "呼び出し可能な Apex メソッド", "入力規則", "レポートタイプ"], "answer": [0, 2], "explanation": "エージェントのカスタムアクションは、フロー、呼び出し可能な Apex、プロンプトテンプレートなどをもとに作成する。ページレイアウトや入力規則、レポートタイプはアクションの実装には使えない。", "choiceNotes": ["正しい。自動起動フローはエージェントアクションとして使える。", "誤り。画面の構成を決める設定で、アクションにはならない。", "正しい。呼び出し可能な Apex はアクションとして使える。", "誤り。保存時のチェックで、アクションにはならない。", "誤り。レポートの定義で、アクションにはならない。"], "ref": "Agentforce のカスタムアクション（フロー、Apex、プロンプトテンプレート）"}, {"id": "DA-029", "domain": "予測AI・生成AI", "topic": "Sales Development Rep エージェント", "q": "あるSaaS企業では、Webからのリードが急増し、インサイドセールスの人手が足りず、多くのリードにすぐ対応できていない。営業時間外も含めて、リードに自律的にメールで連絡し、質問に答え、商談の打ち合わせを設定したい。コンサルタントは何を推奨すべきか？", "choices": ["Einstein 売上予測を有効化する", "重複ルールでリードを削減する", "Agentforce の Sales Development Rep エージェントを導入する", "リードの割り当てルールで全リードを1人に割り当てる"], "answer": [2], "explanation": "Sales Development Rep（SDR）エージェントは、CRMのデータなどをもとに、リードへの連絡、質問への回答、ナーチャリング、打ち合わせの設定を自律的に行う。人手が足りない状況でも、リードへの対応を拡大できる。", "choiceNotes": ["誤り。売上を予測する機能で、リードへの対応はしない。", "誤り。重複を減らしても、リードへの対応は進まない。", "正しい。SDRエージェントは、まさにこの用途のためのものである。", "誤り。人手不足が悪化する。"], "ref": "Agentforce Sales Development Rep"}, {"id": "DA-030", "domain": "予測AI・生成AI", "topic": "Sales Coach エージェント", "q": "ある企業の営業マネージャーは、重要な商談の前に部下が価格交渉の練習をしてフィードバックを受けられるようにしたい。ただし、マネージャー自身が毎回付き合う時間はない。コンサルタントは何を推奨すべきか？", "choices": ["Einstein 活動キャプチャで過去のメールを同期する", "Agentforce Sales Coach を使い、商談の情報をもとにしたロールプレイとフィードバックを提供する", "商談スコアリングのスコアを部下にメールで送る", "商談の入力規則を厳しくする"], "answer": [1], "explanation": "Agentforce Sales Coach は、商談のコンテキストをもとに、営業担当者が交渉などのロールプレイを行い、フィードバックを受けられるようにする。マネージャーが付き合わなくても練習の機会を増やせる。", "choiceNotes": ["誤り。活動を記録するだけで、練習やフィードバックはできない。", "正しい。商談に合わせたロールプレイとフィードバックを提供する。", "誤り。スコアを見るだけでは交渉の練習にならない。", "誤り。営業スキルの向上とは関係ない。"], "ref": "Agentforce Sales Coach"}, {"id": "DA-031", "domain": "予測AI・生成AI", "topic": "生成メールと人のレビュー", "q": "ある企業では、営業担当者が見込み客へのフォローアップメールを書く時間を減らしたい。同時に、コンプライアンス部門は、AIが作った文面を誰も確認しないまま送ることを懸念している。コンサルタントは何を推奨すべきか？", "choices": ["生成AIの利用を全面的に禁止する", "AIが生成したメールを、営業担当者が確認しないまま自動で送信する", "メールテンプレートだけを使い、差し込み項目を一切使わない", "Einstein の生成メールでCRMのデータを使って下書きを作り、営業担当者が確認・編集してから送信する"], "answer": [3], "explanation": "Einstein の生成メールは、レコードのデータをもとにパーソナライズされた下書きを作る。営業担当者が内容を確認・編集してから送信するので、効率化と人による確認を両立できる。", "choiceNotes": ["誤り。効率化の目的を果たせない。", "誤り。人の確認がなく、コンプライアンスの懸念を解消できない。", "誤り。パーソナライズが不足し、時間の削減も限られる。", "正しい。下書きの生成と人によるレビューを両立できる。"], "ref": "Einstein の生成メール（Sales Emails）"}, {"id": "DA-032", "domain": "予測AI・生成AI", "topic": "Prompt Builder のグラウンディング", "q": "ある企業では、Prompt Builder で商談の要約を作るプロンプトテンプレートを作成している。生成される内容が具体性に欠けるため、対象の商談や関連データにもとづく要約にしたい。グラウンディングの方法として適切なものはどれか？（2つ選択してください）", "choices": ["テンプレートに商談レコードの項目の差し込み項目を追加する", "プロンプトに「詳しく書いて」とだけ追記する", "フローを使って関連レコードのデータを取得し、テンプレートに渡す", "商談のページレイアウトから項目を削除する", "LLMの学習データに自社のデータを追加するよう依頼する"], "answer": [0, 2], "explanation": "Prompt Builder では、差し込み項目やフロー、Apex などを使ってCRMのデータをプロンプトに含めることで、回答をグラウンディングできる。これにより、対象レコードに即した具体的な内容が生成される。", "choiceNotes": ["正しい。レコードの項目値をプロンプトに含められる。", "誤り。データがなければ具体性は上がらない。", "正しい。フローで関連データを取得してグラウンディングできる。", "誤り。生成の品質とは関係ない。", "誤り。Prompt Builder は、モデルを学習させるのではなく、実行時にデータを渡す仕組みである。"], "ref": "Prompt Builder（差し込み項目、フローによるグラウンディング）"}, {"id": "DA-033", "domain": "予測AI・生成AI", "topic": "Einstein Trust Layer", "q": "ある医療機器メーカーでは、生成AIで営業メールの下書きを作ることを検討している。情報セキュリティ部門は、顧客の個人情報が外部の大規模言語モデル（LLM）に渡ったり、LLMの提供元に保存されたりすることを懸念している。Einstein Trust Layer の機能のうち、この懸念に対応するものはどれか？（2つ選択してください）", "choices": ["プロンプトに含まれる個人情報などの機密データを、LLMに送る前にマスキングする", "すべてのユーザーに、生成されたメールを自動で送信させる", "LLMの提供元とゼロデータリテンションの契約を結び、プロンプトと応答がLLM側に保存されないようにする", "営業担当者のプロファイルからメール送信権限を削除する", "AIが生成した文面を、営業担当者が編集できないようにする"], "answer": [0, 2], "explanation": "Einstein Trust Layer は、プロンプト内の機密データをLLMに送る前にマスキングし、応答を返すときに元の値に戻す。また、外部のLLM提供元とはゼロデータリテンションの契約があり、プロンプトや応答がLLM側に保存されたり、モデルの学習に使われたりしない。", "choiceNotes": ["正しい。データマスキングで、機密データがLLMに渡るのを防ぐ。", "誤り。自動送信は Trust Layer の機能ではなく、懸念の解消にもならない。", "正しい。ゼロデータリテンションで、LLM側にデータが保存されない。", "誤り。Trust Layer の機能ではなく、業務も止まってしまう。", "誤り。人による確認と編集は、むしろ推奨される。"], "ref": "Einstein Trust Layer（データマスキング、ゼロデータリテンション、毒性検出）"}, {"id": "DA-034", "domain": "予測AI・生成AI", "topic": "信頼されるAIの原則", "q": "ある企業では、生成AIの導入にあたり、Salesforce の信頼される生成AIのガイドラインに沿った運用ルールを作っている。「AIが生成したコンテンツであることを利用者に明らかにし、データの出所を尊重する」というルールは、どの原則にもっとも当てはまるか？", "choices": ["正確性（Accuracy）", "持続可能性（Sustainability）", "誠実性（Honesty）", "安全性（Safety）"], "answer": [2], "explanation": "Salesforce の信頼される生成AIのガイドラインは、正確性、安全性、誠実性、エンパワーメント、持続可能性の5つで構成されている。誠実性は、データの出所を尊重し、コンテンツがAIによって生成されたことを透明にすることを求めている。", "choiceNotes": ["誤り。正確性は、検証可能で根拠のある結果を出すことに関する原則である。", "誤り。持続可能性は、モデルの規模や環境への影響に関する原則である。", "正しい。AIが生成したことの開示とデータの出所の尊重は、誠実性にあたる。", "誤り。安全性は、偏りや有害な出力、個人情報の保護に関する原則である。"], "ref": "Salesforce の信頼される生成AIのガイドライン"}, {"id": "DA2-001", "domain": "データ管理", "topic": "データ移行の順序", "q": "製造業のA社は旧CRMからSalesforceへ、ユーザー、取引先、取引先責任者、商談、商談商品を移行する。商品と価格表エントリは本番組織で既に作成済みである。参照関係のエラーを最小限にするための読み込み順として最も適切なものはどれか。", "choices": ["取引先 → 商談 → ユーザー → 取引先責任者 → 商談商品", "ユーザー → 取引先 → 取引先責任者 → 商談 → 商談商品", "商談 → 商談商品 → 取引先 → 取引先責任者 → ユーザー", "取引先責任者 → 取引先 → ユーザー → 商談商品 → 商談"], "answer": [1], "explanation": "移行は参照される側（親）から先に読み込むのが原則である。所有者として参照されるユーザー、次に取引先、取引先を参照する取引先責任者と商談、最後に商談と価格表エントリを参照する商談商品の順になる。", "choiceNotes": ["ユーザーより先に取引先・商談を読み込むと所有者を正しく設定できない。", "親から子への依存順になっており正しい。", "子である商談・商談商品を親より先に読み込むことはできない。", "取引先責任者を取引先より先に入れると紐付けができず、商談商品も商談より先には作れない。"], "ref": "データ移行のベストプラクティス / Trailhead: Data Management - データのインポート"}, {"id": "DA2-002", "domain": "データ管理", "topic": "外部IDによるupsert", "q": "B社では基幹システムから毎晩取引先データをSalesforceに連携している。同じファイルを再実行すると重複レコードができてしまう問題が起きている。基幹側の顧客コードを使って解決したい。適切な対応はどれか。2つ選択してください。", "choices": ["毎晩の連携前に全取引先を一括削除してから再投入する", "顧客コード用のカスタム項目を作成し「外部ID」属性を付ける", "取引先名を照合キーにして重複ルールで保存をブロックする", "Data Loaderの操作をinsertからupsertに変更し、照合キーに顧客コード項目を指定する", "連携ファイルにSalesforceのレコードIDを手作業で追記する運用にする"], "answer": [1, 3], "explanation": "外部ID属性を持つ項目をキーにupsertすると、一致するレコードは更新され、一致しないものだけが新規作成されるため再実行しても重複しない。基幹システムのキーをそのまま使えるため、SalesforceのレコードIDを管理する必要もない。", "choiceNotes": ["毎回削除すると関連レコードや履歴が失われ、IDも変わるため不適切。", "upsertの照合キーには外部ID（またはレコードID）が必要であり正しい。", "名前は一意性が保証されず、ブロックしても連携が失敗するだけで根本解決にならない。", "upsertにより既存は更新・未登録は作成となり重複を防げるため正しい。", "手作業は誤りやすく、外部IDで済む作業を増やすだけである。"], "ref": "Data Loader: upsert と外部ID / 外部ID項目の作成"}, {"id": "DA2-003", "domain": "データ管理", "topic": "親子関係の紐付け", "q": "C社の移行チームは取引先を先に読み込み、各取引先に旧システムの取引先コードを外部ID項目として保持させた。次に取引先責任者を読み込むが、ファイルには旧取引先コードしか含まれずSalesforceの取引先IDはない。最も効率的に親子を紐付ける方法はどれか。", "choices": ["取引先を一度エクスポートし、VLOOKUPで全行に取引先IDを埋めてからinsertする", "取引先責任者を取引先なしで読み込み、後で1件ずつ画面から取引先を設定する", "Data Loaderで取引先責任者を読み込む際、取引先への参照を取引先の外部ID項目でマッピングする", "取引先責任者の取引先名テキスト項目に旧コードを入れ、ワークフローで紐付ける"], "answer": [2], "explanation": "Data Loaderでは参照関係を親オブジェクトの外部ID項目で指定できるため、子レコードのファイルに親のSalesforce IDがなくても紐付けられる。ID変換の手作業が不要になり、誤りも減る。", "choiceNotes": ["実現は可能だが手作業が多く、外部ID参照より非効率である。", "大量データでは非現実的で誤りも生じやすい。", "親の外部IDで参照を解決でき、最も効率的で正しい。", "テキスト項目に値を入れても参照関係は設定されない。"], "ref": "Data Loader: 外部IDを使用した関連レコードの指定"}, {"id": "DA2-004", "domain": "データ管理", "topic": "一括削除と復元", "q": "D社の管理者が10日前、Data Loaderの通常の削除（delete）操作で誤って300件の取引先を削除した。取引先にぶら下がっていた取引先責任者と商談も一緒に削除されている。最も適切な対応はどれか。", "choices": ["組織のごみ箱から該当の取引先を復元する。カスケード削除された関連レコードも併せて復元される", "ごみ箱は個人単位なので、管理者であっても他ユーザーの削除レコードは復元できない", "Data Loaderで削除された時点でレコードは物理削除されているため、バックアップからinsertし直すしかない", "取引先だけを復元した後、取引先責任者と商談はそれぞれ別途ごみ箱から個別に復元しなければならない"], "answer": [0], "explanation": "通常のdeleteで削除されたレコードは一定期間ごみ箱に残り、管理者は組織全体のごみ箱から復元できる。親の削除に伴い削除された子レコードは親の復元時に併せて復元され、元のIDと関係も維持される。", "choiceNotes": ["ごみ箱の保持期間内であり、関連レコードも親と一緒に戻るため正しい。", "管理者は組織のごみ箱ビューで他ユーザーの削除レコードも扱える。", "物理削除になるのはハード削除を選んだ場合であり、通常のdeleteはごみ箱に入る。", "親と一緒に削除された子は親の復元時に自動で復元される。"], "ref": "ごみ箱 / 削除されたレコードの復元"}, {"id": "DA2-005", "domain": "データ管理", "topic": "重複ジョブ", "q": "E社では取引先の重複ルールを有効にしたが、ルール有効化以前に登録された大量の重複取引先がそのまま残っている。組織全体の既存重複を洗い出して統合作業につなげたい。最も適切な機能はどれか。", "choices": ["重複ルールのアクションを「ブロック」に変更する", "一致ルールを新規作成すれば既存レコードも自動で統合される", "入力規則で取引先名の重複を検出する", "重複ジョブを一致ルールで実行し、結果の重複レコードセットから統合する"], "answer": [3], "explanation": "重複ルールはレコードの作成・編集時にのみ評価されるため既存データには作用しない。重複ジョブは一致ルールを使って既存レコード全体をスキャンし、重複レコードセットとして結果を出すので、そこから比較・統合できる。", "choiceNotes": ["保存時の挙動が変わるだけで既存の重複は検出されない。", "一致ルールは照合条件の定義であり、それ自体が統合を行うことはない。", "入力規則は他レコードとの比較ができず重複検出には使えない。", "既存データ全体を対象にスキャンでき、統合まで進められるため正しい。"], "ref": "重複ジョブ / 重複レコードセット"}, {"id": "DA2-006", "domain": "データ管理", "topic": "データエクスポート", "q": "F社のCIOは「Salesforceのデータを定期的に社内保管したい。追加費用はかけたくない」と要望している。データエクスポートサービスについてコンサルタントが説明する内容として正しいものはどれか。", "choices": ["エクスポートしたファイルをアップロードすれば、関連付けも含めてボタン一つで組織を元の状態に戻せる", "スケジュール実行でオブジェクトのデータをCSV形式のZIPファイルとして出力でき、取り込みによる復元は別途計画する必要がある", "エクスポートは差分のみ出力されるため、初回以外は変更されたレコードしか含まれない", "エクスポート対象はカスタムオブジェクトに限られ、標準オブジェクトは含められない"], "answer": [1], "explanation": "データエクスポートサービスは手動またはスケジュールでデータをCSVファイル（ZIP）として出力する標準機能である。バックアップ取得の手段であり、復元は自動化されていないため、読み込み順序やID再マッピングを含めた復元手順を別に計画する必要がある。", "choiceNotes": ["データエクスポートには自動復元機能はない。", "スケジュール出力とCSV形式の説明、復元が別作業である点ともに正しい。", "選択したオブジェクトの全件が出力され、差分エクスポートではない。", "標準オブジェクトもカスタムオブジェクトも対象にできる。"], "ref": "データのエクスポート / データのバックアップと復元"}, {"id": "DA2-007", "domain": "データ管理", "topic": "所有権のデータスキュー", "q": "G社では外部システム連携用の1ユーザーが30万件の取引先を所有している。このユーザーのロール変更や共有ルールの更新時に処理が非常に遅くなり、ロックエラーも発生する。Salesforceが推奨する対策として適切なものはどれか。2つ選択してください。", "choices": ["所有レコードを実際の担当者など複数のユーザーに分散する", "そのユーザーを多数の公開グループに追加して共有範囲を広げる", "そのユーザーをロール階層の深い位置に置き、上位の多数のロールが自動で参照できるようにする", "取引先の組織の共有設定を非公開から公開/参照・更新可能へ変更するだけで解決する", "大量所有が避けられない場合、そのユーザーはロールなし、またはロール階層の最上位付近に割り当てる"], "answer": [0, 4], "explanation": "1ユーザーが約1万件を超えるレコードを所有する状態は所有権のデータスキューと呼ばれ、共有の再計算が重くなる。所有の分散が基本の対策であり、避けられない場合はロールを付けないか最上位に置き、公開グループに入れないことで再計算の影響を抑える。", "choiceNotes": ["スキュー自体を解消でき推奨される。", "グループメンバーシップの再計算が増え悪化する。", "階層が深いほど上位への共有計算が増え悪化する。", "共有要件を無視した変更であり、スキューの根本対策ではない。", "ロール階層による共有計算を最小化できる推奨構成である。"], "ref": "大規模データ量のベストプラクティス: 所有権のデータスキュー"}, {"id": "DA2-008", "domain": "データ管理", "topic": "取引先のデータスキュー", "q": "H社では担当未定の取引先責任者をすべて「未割当」という1つの取引先に紐付けており、その取引先配下の取引先責任者は8万件に達した。夜間の一括更新で「UNABLE_TO_LOCK_ROW」エラーが頻発している。最も効果的な対策はどれか。", "choices": ["Data Loaderのバッチサイズを最大値に増やす", "「未割当」取引先の所有者をシステム管理者に変更する", "取引先責任者を複数の取引先に分散し、1つの親に子レコードが集中しないようにする", "取引先責任者の入力規則をすべて無効化する"], "answer": [2], "explanation": "1つの親に大量の子レコードが集中すると、子の更新時に親レコードのロック競合が起きやすい（取引先のデータスキュー）。子を複数の親に分散し、1親あたりの子の件数を抑えるのが根本対策である。", "choiceNotes": ["バッチを大きくしても同一親へのロック競合は解消しない。", "所有者を変えてもロック競合の原因である子の集中は変わらない。", "親への集中を解消でき、ロック競合を根本的に減らせる。", "入力規則はロック競合の原因ではない。"], "ref": "大規模データ量のベストプラクティス: 取引先のデータスキュー / レコードロック"}, {"id": "DA2-009", "domain": "データ管理", "topic": "項目の暗号化の考え方", "q": "I社のセキュリティ部門は「取引先責任者の標準項目を含む個人情報を保存時暗号化（at rest）したい。暗号化後もリストビューやレポートで完全一致による絞り込みは続けたい」と要望している。また「暗号化すれば営業担当者全員から値が見えなくなる」と考えている。コンサルタントの説明として最も適切なものはどれか。", "choices": ["Shield Platform Encryptionで決定論的暗号化方式を使えば完全一致の絞り込みを維持できる。ただし暗号化は権限のあるユーザーには透過的なので、値を見せたくない場合は項目レベルセキュリティで制御する", "クラシック暗号化（暗号化テキスト項目）を使えば標準項目もそのまま暗号化でき、絞り込みも制限なく使える", "Shield Platform Encryptionを有効にすると、項目にアクセス権があるユーザーにも値がすべてマスクされる", "保存時暗号化は標準項目には適用できないため、すべてカスタム項目に移し替える必要がある"], "answer": [0], "explanation": "Shield Platform Encryptionは標準項目・カスタム項目を保存時に暗号化でき、決定論的暗号化方式を選ぶと完全一致の絞り込みが可能になる。暗号化はアクセス権のあるユーザーには透過的に復号表示されるため、誰が値を見られるかは項目レベルセキュリティなどのアクセス制御で設計する。", "choiceNotes": ["暗号化方式と可視性の役割分担を正しく説明している。", "クラシック暗号化はカスタムの暗号化テキスト項目専用で、標準項目には使えず絞り込みにも制限がある。", "Platform Encryptionは権限のあるユーザーには透過的であり、マスク機能ではない。", "Shield Platform Encryptionは多くの標準項目に対応している。"], "ref": "Shield Platform Encryption / 決定論的暗号化 / クラシック暗号化"}, {"id": "DA2-010", "domain": "データ管理", "topic": "データ品質ダッシュボード", "q": "J社の営業本部長は「取引先の主要項目（業種、従業員数、電話、住所）がどれだけ埋まっているかを担当者別に可視化し、改善を追跡したい」と考えている。追加開発を最小限に抑えた方法として最も適切なものはどれか。", "choices": ["四半期ごとに全取引先をエクスポートし、表計算ソフトで空欄を数える", "主要項目をすべて必須項目にし、既存レコードの空欄は無視する", "主要項目の入力有無から完全性スコアを計算する数式項目を作成し、そのスコアを集計するレポートとダッシュボードを作る", "重複ジョブを実行し、その結果をダッシュボードに表示する"], "answer": [2], "explanation": "数式項目で各レコードの入力率をスコア化すれば、標準のレポート・ダッシュボードで担当者別の平均や推移を可視化できる。AppExchangeのデータ品質分析ダッシュボードも同様の考え方であり、宣言的な設定だけで継続的に追跡できる。", "choiceNotes": ["手作業で継続性がなく、リアルタイムに追跡できない。", "今後の入力は改善されるが、既存データの品質を可視化できない。", "宣言的に完全性を測定・可視化でき最も適切である。", "重複ジョブは重複検出用であり、項目の完全性は測れない。"], "ref": "Data Quality Analysis Dashboards（AppExchange）/ 数式項目 / レポートとダッシュボード"}, {"id": "DA2-011", "domain": "データ管理", "topic": "取引先の統合", "q": "K社の営業担当者が重複している3件の取引先を標準の統合機能で統合しようとしている。統合の挙動として正しいものはどれか。2つ選択してください。", "choices": ["統合されたマスター以外のレコードは、関連レコードとともにごみ箱を経由せず物理削除される", "一度に統合できるのは2件までなので、2回に分けて実施する必要がある", "統合後に残すマスターレコードを選び、項目ごとにどのレコードの値を残すかを選択できる", "統合されたマスター以外のレコードに関連していた取引先責任者や商談は、マスターレコードに付け替えられる", "個人取引先と法人取引先を統合して1件の法人取引先にできる"], "answer": [2, 3], "explanation": "取引先の統合では最大3件までを対象に、マスターレコードと残す項目値を選べる。マスター以外のレコードの関連レコードはマスターに付け替えられ、マスター以外のレコード自体は削除される。", "choiceNotes": ["関連レコードはマスターへ移り、統合元レコードはごみ箱に入る。", "取引先は一度に3件まで統合できる。", "マスターと項目値の選択は統合機能の基本動作である。", "関連レコードは失われずマスターに再割り当てされる。", "個人取引先と法人取引先は統合できない。"], "ref": "取引先の統合 / 重複レコードの統合"}, {"id": "DA2-012", "domain": "データ管理", "topic": "移行時の監査項目", "q": "L社は旧システムの商談を移行するにあたり、レポートで過去の作成日ベースの分析を続けたいため、各レコードの元の作成日と作成者を保持したいと考えている。適切な対応はどれか。", "choices": ["移行後に作成日項目を一括更新する", "商談に「旧作成日」カスタム項目を作り、標準の作成日は移行日のままにするしか方法はない", "作成日は数式項目なので、旧システムの値を参照する数式に変更する", "「レコード作成時に監査項目を設定」を有効化し、移行ユーザーに権限を付与したうえで、insert時に作成日と作成者を指定する"], "answer": [3], "explanation": "「レコード作成時に監査項目を設定」を有効にし、該当権限を持つユーザーで読み込めば、新規作成時に限り作成日・作成者などの監査項目へ値を設定できる。既存レコードの更新では変更できないため、insert時に指定する必要がある。", "choiceNotes": ["監査項目は作成後の更新では変更できない。", "標準機能で作成時に監査項目を設定する方法があるため不適切。", "作成日はシステム項目であり数式に変更できない。", "作成時に監査項目を設定する正しい手順である。"], "ref": "レコード作成時に監査項目を設定 / データ移行"}, {"id": "DA2-013", "domain": "データ管理", "topic": "インポートツールの選択", "q": "M社は旧システムから約20万件の商談を一度に移行し、さらに今後は毎週定期的に商談を更新したいと考えている。ツールの選択として最も適切なものはどれか。", "choices": ["データインポートウィザードで5万件ずつ4回に分けて取り込む", "Data Loaderを使用する。大量件数と商談に対応し、コマンドラインから定期実行も構成できる", "データインポートウィザードで取引先と一緒に商談を取り込む", "Salesforce画面から商談をクローン機能で作成する"], "answer": [1], "explanation": "データインポートウィザードは1回5万件までで、商談などの一部標準オブジェクトに対応していない。Data Loaderは数百万件規模と全オブジェクトに対応し、コマンドラインインターフェースで定期実行も可能である。", "choiceNotes": ["インポートウィザードは商談の取り込みに対応していない。", "件数・対象オブジェクト・定期実行のいずれにも対応でき正しい。", "インポートウィザードでは商談は取り込めない。", "手作業であり大量移行には非現実的である。"], "ref": "データインポートウィザードとData Loaderの比較"}, {"id": "DA2-014", "domain": "予測AI・生成AI", "topic": "Einstein スコアの前提", "q": "設立2年目のN社はSalesforce導入直後で、リードと取引開始の履歴がまだほとんどない。営業部長は「Einstein リードスコアリングはデータが溜まるまで全く使えないのか」と質問した。最も適切な回答はどれか。", "choices": ["自社データが不足している間はグローバルモデルでスコアを算出し、十分なデータが蓄積されると自社固有のモデルに切り替わる", "過去の取引開始データが十分に揃うまで、スコア項目は空欄のままになる", "旧システムのデータを手作業でスコア項目に入力すれば代替できる", "リードスコアリングは商談データから学習するため、リードの履歴は不要である"], "answer": [0], "explanation": "Einstein リードスコアリングは、組織に十分な履歴データがない場合、多様な組織の匿名化データから作られたグローバルモデルを使用する。十分なリードと取引開始の履歴がたまると自社データに基づくモデルを使用するようになる。", "choiceNotes": ["データ不足時のグローバルモデル利用の説明として正しい。", "グローバルモデルによりスコアは算出される。", "スコア項目は予測結果であり、手入力で代替するものではない。", "リードスコアリングはリードと取引開始の履歴から学習する。"], "ref": "Einstein リードスコアリング / グローバルモデル"}, {"id": "DA2-015", "domain": "予測AI・生成AI", "topic": "スコアの寄与要因", "q": "O社の営業担当者から「この商談のEinsteinスコアが低いが、理由がわからないので対策できない」と相談があった。最も適切な案内はどれか。", "choices": ["スコアは内部計算のため理由は確認できないと説明する", "管理者にスコアを手動で引き上げてもらうよう依頼する", "商談レコードページのEinstein スコアコンポーネントで、スコアを押し上げている要因と押し下げている要因を確認する", "スコアが低い商談は自動で失注扱いになるため、新規商談を作り直す"], "answer": [2], "explanation": "Einstein 商談スコアリングはスコアとともに、スコアに好影響・悪影響を与えている主な要因をレコードページ上で示す。担当者はこれをもとに次の行動を判断でき、AIの透明性にもつながる。", "choiceNotes": ["寄与要因が表示されるため誤り。", "スコアは予測結果であり手動で変更するものではない。", "寄与要因の確認により具体的な対策を検討できる。", "スコアによって商談のフェーズが自動で変更されることはない。"], "ref": "Einstein 商談スコアリング / スコアの要因"}, {"id": "DA2-016", "domain": "予測AI・生成AI", "topic": "Einstein 売上予測と協調的売上予測", "q": "P社は協調的売上予測を運用中で、営業マネージャーはチームの申告値に対するAIの予測を比較したいと考えている。Einstein 売上予測についての説明として正しいものはどれか。", "choices": ["Einstein 売上予測は協調的売上予測を置き換えるため、有効化すると売上予測の調整機能は使えなくなる", "Einstein 売上予測を有効化すると、マネージャーの調整値がAIの予測値で自動的に上書きされる", "Einstein 売上予測は協調的売上予測とは独立した別画面で、レポートでのみ確認できる", "Einstein 売上予測は協調的売上予測の設定を前提とし、売上予測ページにAIの予測値を表示して担当者の予測と比較できるようにする"], "answer": [3], "explanation": "Einstein 売上予測は協調的売上予測の仕組みの上に機能し、売上予測ページにAIによる予測を表示する。マネージャーは担当者の予測や自身の調整値とAIの予測を見比べて判断材料にでき、調整値が自動で書き換えられることはない。", "choiceNotes": ["協調的売上予測を補完する機能であり、置き換えるものではない。", "AIの予測は参考値として表示され、調整値を上書きしない。", "売上予測ページ上で比較できる。", "協調的売上予測との関係を正しく説明している。"], "ref": "Einstein 売上予測 / 協調的売上予測"}, {"id": "DA2-017", "domain": "予測AI・生成AI", "topic"

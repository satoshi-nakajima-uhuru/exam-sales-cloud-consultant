"重複分割は商談チームメンバーに設定でき、所有者に限定されない。", "正解。重複分割は100%を超えて設定でき、補助的貢献の評価に使える。"], "ref": "商談分割 / 分割タイプ（Salesforce ヘルプ）"}, {"id": "SL-012", "domain": "セールスライフサイクル", "topic": "取引先チーム", "q": "ある企業では、取引先と商談の組織の共有設定は「非公開」である。大手顧客ごとに、営業担当者のほかにカスタマーサクセス担当者や役員スポンサーが関わっており、それぞれに顧客ごとの役割を記録し、取引先と関連する商談へのアクセス権を個別に付与したい。コンサルタントは何を推奨すべきか？", "choices": ["役員スポンサーを営業担当者の上位ロールに配置する", "取引先チームを有効化し、メンバーごとにチームロールと取引先・商談のアクセス権を設定する", "取引先の所有者をカスタマーサクセス担当者に変更する", "すべての取引先を公開グループに共有する条件ベースの共有ルールを作成する"], "answer": [1], "explanation": "取引先チームでは、取引先ごとにメンバーとチームロールを記録でき、取引先および関連する商談・ケースなどへのアクセスレベルをメンバー単位で付与できる。非公開の共有モデルを維持したまま、顧客単位の協業を実現できる。", "choiceNotes": ["ロール階層は組織構造を表すもので、顧客ごとの役割の記録にはならない。", "正解。取引先チームで役割と顧客単位のアクセス権を管理できる。", "営業担当者の所有権が失われ、要件を満たさない。", "顧客ごとの個別設定ができず、過剰な共有になる。"], "ref": "取引先チーム（Salesforce ヘルプ）"}, {"id": "SL-013", "domain": "セールスライフサイクル", "topic": "パスとガイダンス", "q": "ある企業の営業部長は、Lightning Experienceの商談画面で、営業担当者が各フェーズで入力すべき項目と、そのフェーズで行うべき活動のヒントを常に目にできるようにしたい。コンサルタントがパスで設定できると説明すべき内容はどれか？（2つ選択してください）", "choices": ["フェーズごとに表示するキー項目", "フェーズごとの成功のためのガイダンス", "フェーズ移行時に必須となる入力規則", "フェーズ変更時に自動で送信される承認申請", "前のフェーズに戻れないようにするロック"], "answer": [0, 1], "explanation": "パスでは、選択リスト（商談ではフェーズ）の各値に対してキー項目と成功のためのガイダンスを設定でき、レコードタイプごとに作成できる。入力の強制や承認申請、フェーズの後戻り防止はパスの機能ではなく、入力規則や承認プロセスなど別の機能で実現する。", "choiceNotes": ["正解。各フェーズで確認・入力させたいキー項目を表示できる。", "正解。リッチテキストのガイダンスを表示できる。", "パスは入力を強制しない。必須化には入力規則などを使う。", "承認申請は承認プロセスやフローで実現する。", "パス自体にはフェーズの後戻りを禁止する機能はない。"], "ref": "パスのガイダンスでユーザーの成功を後押し（Salesforce ヘルプ / Trailhead）"}, {"id": "SL-014", "domain": "セールスライフサイクル", "topic": "価格表と商品", "q": "ある企業では、代理店向けの販売価格を管理するためにカスタム価格表を作成した。管理者が新しい商品をカスタム価格表に追加しようとしたところ、追加できなかった。考えられる原因として最も適切なものはどれか？", "choices": ["カスタム価格表は商談で使用できないため", "商品に商品ファミリーが設定されていないため", "商品が標準価格表に登録されていないため", "カスタム価格表には同じ商品を1つしか登録できないため"], "answer": [2], "explanation": "商品をカスタム価格表に追加するには、先にその商品に標準価格を設定して標準価格表へ登録しておく必要がある。標準価格表に価格がない商品はカスタム価格表に追加できない。", "choiceNotes": ["カスタム価格表は商談で選択して使用できる。", "商品ファミリーは任意項目であり、価格表への追加の前提条件ではない。", "正解。標準価格の登録がカスタム価格表登録の前提である。", "通貨が同じなら1商品1エントリだが、それは追加できない理由にはならない。"], "ref": "価格表の設定 / 商品への標準価格の追加（Salesforce ヘルプ）"}, {"id": "SL-015", "domain": "セールスライフサイクル", "topic": "見積と商談の同期", "q": "ある企業の営業担当者は、1つの商談に対して値引き条件の異なる見積を3つ作成し、顧客に提示している。顧客が採用した見積の商品と金額を商談にも反映させたい。コンサルタントは何を推奨すべきか？", "choices": ["3つの見積すべてを商談と同期し、最新の見積が優先されるようにする", "採用された見積を商談と同期させ、見積品目と商談商品が同期されるようにする", "採用された見積の金額を商談の金額項目に手入力する", "採用されなかった見積を削除すると、残った見積が自動的に商談に反映される"], "answer": [1], "explanation": "1つの商談に複数の見積を作成できるが、同時に同期できる見積は1つだけである。採用された見積を同期すると、見積品目と商談商品が同期され、商談金額にも反映される。", "choiceNotes": ["商談と同期できる見積は同時に1つだけである。", "正解。見積の同期で見積品目と商談商品が同期される。", "商品明細との整合が取れず、二重管理になる。", "見積を削除しても自動的に同期されることはない。"], "ref": "見積の同期（Salesforce ヘルプ）"}, {"id": "SL-016", "domain": "セールスライフサイクル", "topic": "商談と価格表", "q": "ある企業では、国内向けと海外向けで別のカスタム価格表を使用している。営業担当者から「1つの商談に、国内価格表の商品と海外価格表の商品を混在させたい」と要望があった。コンサルタントの説明として正しいものはどれか？", "choices": ["1つの商談で使用できる価格表は1つだけであるため、混在させることはできない", "商談商品ごとに価格表を選択できるため、混在させることができる", "商品ファミリーを分ければ、異なる価格表の商品を混在させることができる", "標準価格表を選択している場合のみ、複数のカスタム価格表を混在させることができる"], "answer": [0], "explanation": "商談には1つの価格表が関連付けられ、商談商品はすべてその価格表の価格表エントリから追加される。異なる価格表の商品を1つの商談に混在させることはできないため、要件に応じて商談を分けるか、価格表の設計を見直す必要がある。", "choiceNotes": ["正解。商談で使用できる価格表は1つである。", "商談商品ごとに価格表を選ぶことはできない。", "商品ファミリーは価格表の制約に影響しない。", "標準価格表の選択時も、1つの商談で使用する価格表は1つである。"], "ref": "商談への商品の追加 / 価格表（Salesforce ヘルプ）"}, {"id": "SL-017", "domain": "セールスライフサイクル", "topic": "注文と契約", "q": "ある企業では、商談成立後に出荷部門へ渡す受注内容をSalesforceで記録したい。受注内容には商品と数量が含まれ、顧客との取引条件を定めた契約にも関連付けて管理したい。コンサルタントは何を推奨すべきか？", "choices": ["商談を複製して「受注」レコードタイプで管理する", "ケースを作成して商品と数量を説明欄に記載する", "商談のフェーズに「出荷済み」を追加し、商談のみで管理する", "注文を有効化し、取引先と契約に関連付けた注文に注文商品を追加する"], "answer": [3], "explanation": "注文は取引先に関連付けて作成し、価格表の商品を注文商品として追加できる。また、注文を契約に関連付けて管理することもでき、商談成立後の受注・出荷プロセスを標準機能で表現できる。", "choiceNotes": ["商談の重複が発生し、パイプラインや売上予測に悪影響が出る。", "商品・数量が構造化データにならず、集計や連携ができない。", "商談は受注前の案件管理用であり、出荷や契約との関連管理に適さない。", "正解。注文と注文商品、契約との関連付けで要件を満たせる。"], "ref": "注文 / 契約（Salesforce ヘルプ）"}, {"id": "SL-018", "domain": "セールスライフサイクル", "topic": "売上予測タイプ", "q": "ある企業の経営層は、協調的売上予測で、商談全体の金額だけでなく、ハードウェア・ソフトウェア・サービスといった商品ファミリーごとの見込み売上も確認したいと考えている。コンサルタントは何を推奨すべきか？", "choices": ["商品ファミリーごとに商談レコードタイプを作成し、レコードタイプ別の売上予測タイプを作成する", "商品ファミリーごとに別の売上予測階層を作成する", "商談商品の売上を基にした「商品ファミリー」の売上予測タイプを追加する", "商談に商品ファミリーのカスタム項目を作成し、レポートで集計する"], "answer": [2], "explanation": "協調的売上予測では、商談商品の売上・数量を基にした商品ファミリー別の売上予測タイプを作成できる。これにより、商品ファミリーごとの見込みを売上予測ページで確認・調整できる。", "choiceNotes": ["1商談に複数ファミリーの商品が含まれる場合に正しく分けられない。", "売上予測階層はロール階層（テリトリー売上予測ではテリトリー階層）に基づく構造で、商品ファミリーごとに作り分けるものではない。", "正解。商品ファミリーの売上予測タイプで商品別の見込みを確認できる。", "レポートでは売上予測ページでの調整やノルマとの比較ができない。"], "ref": "売上予測タイプ / 商品ファミリーの売上予測（Salesforce ヘルプ）"}, {"id": "SL-019", "domain": "セールスライフサイクル", "topic": "売上予測階層と売上予測マネージャー", "q": "ある企業では協調的売上予測を有効化したが、営業本部長のロール配下の売上予測が、売上予測ページで本部長にロールアップされていない。ロール階層は正しく設定されている。コンサルタントがまず確認すべきことは何か？", "choices": ["売上予測階層で、本部長のロールに売上予測マネージャーとしてユーザーが指定されているか", "本部長のプロファイルで「すべてのデータの編集」権限が付与されているか", "商談の組織の共有設定が「公開/参照・更新可能」になっているか", "本部長がすべての商談の商談チームに追加されているか"], "answer": [0], "explanation": "協調的売上予測の階層はロール階層に基づくが、マネージャーとしてロールアップを受けるには、売上予測階層の設定で各ロールの売上予測マネージャーを指定する必要がある。指定されていないと、部下の売上予測が上位に集計されない。", "choiceNotes": ["正解。売上予測マネージャーの指定がロールアップの前提である。", "システム管理権限は売上予測のロールアップとは関係がない。", "共有設定は売上予測階層のロールアップを決定しない。", "商談チームへの追加は売上予測のロールアップとは無関係である。"], "ref": "売上予測階層の設定 / 売上予測マネージャー（Salesforce ヘルプ）"}, {"id": "SL-020", "domain": "セールスライフサイクル", "topic": "売上予測の調整", "q": "ある企業では協調的売上予測で調整を有効化している。営業マネージャーは、部下の営業担当者の売上予測が楽観的すぎると考え、自分の売上予測ページで部下の数値を調整した。この調整について、コンサルタントが説明すべき正しい内容はどれか？（2つ選択してください）", "choices": ["マネージャーによる調整は、部下自身が見る売上予測の数値を変更しない", "マネージャーによる調整は、対象となる商談の金額も自動的に更新する", "調整は商談レコードの金額を変更せず、売上予測上の数値として保持される", "マネージャーによる調整を行うと、部下は自分の売上予測を調整できなくなる", "マネージャーによる調整は、売上予測タイプにかかわらず常に有効である"], "answer": [0, 2], "explanation": "マネージャー調整は、マネージャーとその上位者が見る売上予測に反映されるが、部下自身の売上予測の数値は変更されない。また、調整は売上予測上の値として保持され、商談レコードの金額は変わらない。調整は売上予測タイプごとに有効化する。", "choiceNotes": ["正解。部下の売上予測はそのままで、マネージャー側の値が変わる。", "調整は商談レコードの金額を更新しない。", "正解。調整は売上予測上の値であり、商談データは変更されない。", "所有者による調整が有効であれば、部下は自分の売上予測を調整できる。", "調整の可否は売上予測タイプごとに設定する。"], "ref": "売上予測の調整（Salesforce ヘルプ）"}, {"id": "SL-021", "domain": "セールスライフサイクル", "topic": "ノルマ", "q": "ある企業では、協調的売上予測で営業担当者ごとの月次ノルマに対する達成状況を表示したい。人事評価システムで決定した数百人分のノルマを、四半期ごとにまとめてSalesforceに登録する必要がある。コンサルタントは何を推奨すべきか？", "choices": ["各営業担当者のユーザーレコードにカスタム項目を作成し、ノルマを入力する", "ノルマを有効化し、データローダーなどのAPIツールで売上予測ノルマのデータを一括読み込みする", "売上予測ページでマネージャーが部下のノルマを手入力する", "目標金額をカスタムオブジェクトで管理し、売上予測タイプに関連付ける"], "answer": [1], "explanation": "協調的売上予測のノルマは、設定で有効化したうえで登録する。設定画面（売上予測ノルマ）で個別に入力することもできるが、外部システムで決めた数百人分を定期的に登録するには、データローダーなどのAPIツールで売上予測ノルマ（ForecastingQuota）として一括読み込みするのが適している。登録されたノルマは売上予測ページで達成率とともに表示される。", "choiceNotes": ["カスタム項目の値は売上予測ページのノルマとして使われない。", "正解。ノルマを有効化し、APIツールで一括読み込みする。", "売上予測ページは大量のノルマを一括登録する仕組みではない。", "カスタムオブジェクトは売上予測のノルマとして参照されない。"], "ref": "売上予測ノルマの有効化と読み込み（Salesforce ヘルプ）"}, {"id": "SL-022", "domain": "セールスライフサイクル", "topic": "テリトリーモデルと割り当て", "q": "ある企業は、エンタープライズテリトリー管理を導入し、取引先の地域と業種に基づいて営業テリトリーを定義した。テリトリーモデルは有効化済みである。取引先をテリトリーに自動で割り当て、さらに商談もテリトリーに紐づけてテリトリー別の売上予測に反映させたい。コンサルタントが推奨すべき対応はどれか？（2つ選択してください）", "choices": ["ロール階層をテリトリー構造に合わせて作り直す", "取引先の条件ベースの共有ルールを作成し、地域ごとの公開グループに共有する", "取引先の割り当てルールを作成してテリトリーに関連付け、ルールを実行する", "商談のテリトリー割り当てフィルター（Apexクラス）を設定し、商談にテリトリーを割り当てる", "テリトリーモデルを「計画中」の状態に戻してから割り当てを行う"], "answer": [2, 3], "explanation": "エンタープライズテリトリー管理では、取引先の割り当てルールで取引先を自動的にテリトリーへ割り当てる。商談は、商談のテリトリー割り当てフィルター（Apexクラス）を利用して取引先のテリトリーに基づき割り当てでき、テリトリー階層を使う売上予測に反映される。", "choiceNotes": ["テリトリー管理はロール階層とは独立した構造であり、作り直しは不要である。", "共有ルールはアクセス権を付与するだけで、テリトリーへの割り当ては行われない。", "正解。取引先の割り当てルールで取引先をテリトリーへ自動割り当てする。", "正解。商談のテリトリー割り当てフィルターで商談にテリトリーを設定できる。", "有効なモデルを計画中に戻すことはできず、要件にも不要である。"], "ref": "エンタープライズテリトリー管理 / 商談のテリトリー割り当てフィルター / テリトリー別の売上予測（Salesforce ヘルプ）"}, {"id": "SL2-001", "domain": "セールスライフサイクル", "topic": "売上予測：ロールアップされない（マネージャー未指定）", "q": "協調売上予測を有効化した。営業部長ロールの下に営業担当ロールがあり、担当者は全員「売上予測を許可」が有効で、各自の売上予測ページには自分の金額が表示されている。しかし営業部長の売上予測ページでは部下の金額が集計されず、部長自身の行も表示されない。最も可能性が高い原因と対処はどれか。", "choices": ["商談の組織の共有設定が非公開のため、部長ロールに共有ルールで商談の参照権限を付与する", "売上予測階層で営業部長ロールに売上予測マネージャーが指定されていないため、部長ユーザーを売上予測マネージャーとして割り当てる", "売上予測期間が月次になっているため、四半期に変更して再計算する", "部長のプロファイルに「すべてのデータの参照」権限がないため、権限セットで付与する"], "answer": [1], "explanation": "協調売上予測では、ロール階層上の各ロールに売上予測マネージャーを割り当てて初めて、部下の売上予測がそのマネージャーへロールアップされる。担当者側の設定が正しく、部長側だけ集計されない場合は、売上予測階層のマネージャー未指定を最初に確認する。", "choiceNotes": ["売上予測のロールアップは売上予測階層に基づいており、商談の共有設定で制御されるものではない。", "正しい。売上予測マネージャーが未指定のロールにはロールアップが発生しない。", "期間の種類を変えてもマネージャー未指定の問題は解消しない。", "売上予測の参照は売上予測階層で決まるため、この権限は対処にならない。"], "ref": "売上予測階層の設定（Enable Users and Define Forecast Managers）"}, {"id": "SL2-002", "domain": "セールスライフサイクル", "topic": "売上予測：ユーザーが階層に出ない", "q": "中途入社した営業担当者の商談が、上長の売上予測に含まれない。担当者のロールは正しく設定され、上長は売上予測マネージャーとして割り当て済みである。売上予測階層の画面を確認すると、この担当者だけが一覧に表示されていない。管理者が最初に行うべき対応はどれか。", "choices": ["担当者に商談の「すべての編集」権限を付与する", "担当者の商談の売上予測分類を「パイプライン」に一括更新する", "担当者のユーザーレコードで「売上予測を許可」を有効にする", "上長を売上予測マネージャーから一度外し、再度割り当てる"], "answer": [2], "explanation": "ユーザーが売上予測に参加するには、ユーザーレコードの「売上予測を許可」が有効である必要がある。無効なユーザーは売上予測階層に表示されず、その商談も上位へロールアップされない。", "choiceNotes": ["オブジェクト権限は売上予測階層への表示条件ではない。", "売上予測分類を変えても、ユーザー自体が売上予測対象外なら集計されない。", "正しい。「売上予測を許可」を有効にすると売上予測階層に表示される。", "上長側の設定は済んでおり、担当者側の設定不足が原因である。"], "ref": "売上予測ユーザーの有効化（Enable Users for Forecasts）"}, {"id": "SL2-003", "domain": "セールスライフサイクル", "topic": "売上予測：調整の無効化の影響", "q": "ある売上予測タイプで、マネージャー調整が四半期ごとに大量に入力されている。新任の営業本部長から「調整は混乱の元なので、マネージャー調整を無効にしてほしい」と依頼があった。管理者が事前に関係者へ説明すべき影響として正しいものはどれか。", "choices": ["無効化しても既存の調整値は残り、次の期間から新しい調整が入力できなくなるだけである", "無効化すると調整値が商談の金額項目に自動で書き戻される", "無効化はユーザー単位で行われ、本部長配下のマネージャーだけが対象になる", "無効化すると既存のマネージャー調整は削除され、後で再度有効化しても復元されない"], "answer": [3], "explanation": "売上予測の調整を無効化すると、その種類の既存の調整は削除される。再度有効にしても以前の値は戻らないため、無効化の前に関係者の合意を取り、必要なら現状の数値を記録しておく必要がある。", "choiceNotes": ["既存の調整値は保持されない。", "調整は売上予測上の値であり、商談の金額には書き戻されない。", "調整の有効・無効は売上予測タイプ単位の設定で、ユーザー単位ではない。", "正しい。既存の調整は削除され、再有効化しても復元されない。"], "ref": "売上予測調整の有効化（Enable Forecast Adjustments）"}, {"id": "SL2-004", "domain": "セールスライフサイクル", "topic": "売上予測：通貨", "q": "マルチ通貨を有効化した組織（会社の通貨は JPY）で、米国と欧州のマネージャーは売上予測をそれぞれ USD、EUR で見ている。本社の経営会議から「全マネージャーが同じ JPY の数値で売上予測を確認できるようにしたい」と要望があった。最も適切な対応はどれか。", "choices": ["売上予測の設定で、売上予測通貨を各ユーザーの個人通貨ではなく会社の通貨（単一通貨）で表示するよう変更する", "米国と欧州のユーザーの個人通貨を JPY に一括変更し、商談の通貨も JPY に統一する", "JPY 換算額を保持するカスタム通貨項目を商談に作り、その項目で新しい売上予測タイプを追加する", "通貨換算レートを毎日更新するスケジュールフローを作成する"], "answer": [0], "explanation": "協調売上予測には、売上予測を各ユーザーの個人通貨で表示するか、会社の通貨（単一の通貨）で表示するかを選ぶ設定がある。会社の通貨に統一すれば、全マネージャーが同じ JPY の数値で確認できる。", "choiceNotes": ["正しい。売上予測通貨の設定で会社の通貨表示に変更するのが標準の方法である。", "ユーザーや商談の通貨を変えるのは業務影響が大きく、要件に対して過剰である。", "標準設定で実現できる要件にカスタム項目と新しい売上予測タイプを追加する必要はない。", "換算レートの更新頻度は表示通貨の統一とは関係がない。"], "ref": "売上予測の通貨設定（Forecast Currency）"}, {"id": "SL2-005", "domain": "セールスライフサイクル", "topic": "売上予測タイプ：商品ファミリ", "q": "同じ商談でハードウェア、ソフトウェア、保守サービスを組み合わせて販売している。営業本部は、商品ラインごとの見込み金額をマネージャーにロールアップして確認し、調整もしたい。管理者が行うべき設定はどれか。2つ選択してください。", "choices": ["商品ラインごとに商談のレコードタイプを作成する", "商品の「商品ファミリ」選択リストに商品ラインを定義し、各商品に設定する", "商品ラインごとにテリトリーを作成し、商談をテリトリーに割り当てる", "商談商品の収益を商品ファミリ別に集計する売上予測タイプを追加する", "商談分割を有効化し、商品ライン別の分割タイプを作成する"], "answer": [1, 3], "explanation": "商品ライン別の売上予測は、商品ファミリと、商談商品を商品ファミリ別に集計する売上予測タイプで実現する。1つの商談に複数の商品ラインが含まれても、商談商品の単位で各ファミリに振り分けて集計される。", "choiceNotes": ["レコードタイプは商談全体に1つしか付かず、複数ラインを含む商談を分けて集計できない。", "正しい。商品ファミリ別売上予測は、商品の商品ファミリ項目を集計単位にする。", "テリトリーは地域や顧客の区分に使うもので、商品ライン別の集計には向かない。", "正しい。商品ファミリ別の売上予測タイプを追加すると、ファミリごとにロールアップと調整ができる。", "分割は担当者間で金額を配分する機能で、商品ライン別の集計手段ではない。"], "ref": "商品ファミリ別売上予測（Product Family Forecasts）"}, {"id": "SL2-006", "domain": "セールスライフサイクル", "topic": "売上予測タイプ：分割（オーバーレイ）", "q": "プリセールスエンジニア（SE）は担当した商談の金額全額を自分の実績として評価される。営業担当者の売上実績は変えずに、SE のマネージャーが SE ごとの貢献額をロールアップして確認できる売上予測を作りたい。商談チームと商談分割は有効化済みである。最も適切な対応はどれか。", "choices": ["SE を商談所有者に変更して商談の金額で売上予測する", "商談の金額を SE と営業で按分する収益分割を使い、合計が 100% になるように配分する", "オーバーレイ分割タイプを有効化し、商談分割（オーバーレイ）に基づく売上予測タイプを追加する", "SE 用に商談のコピーを作成し、SE 専用のレコードタイプで管理する"], "answer": [2], "explanation": "オーバーレイ分割は合計が 100% にならなくてもよく、営業担当者の収益分割に影響を与えずに追加の貢献者へ金額を付与できる。分割に基づく売上予測タイプを追加すれば、SE ごとの金額がマネージャーへロールアップされる。", "choiceNotes": ["所有者を変えると営業担当者の実績が失われる。", "収益分割は合計 100% の制約があり、営業担当者の実績が減ってしまう。", "正しい。オーバーレイ分割に基づく売上予測タイプを使う。", "商談の複製は売上を二重計上させ、データ品質を損なう。"], "ref": "商談分割の売上予測（Opportunity Split Forecasts）"}, {"id": "SL2-007", "domain": "セールスライフサイクル", "topic": "売上予測タイプ：カスタム項目", "q": "サブスクリプション事業の会社が、商談の「金額」ではなく、商談に追加したカスタム通貨項目「年間契約額」で売上予測を行い、マネージャーが調整できるようにしたい。最も適切な対応はどれか。", "choices": ["「金額」項目を「年間契約額」と同じ値にするフローを作り、既存の売上予測タイプを使い続ける", "商談の売上予測タイプを追加する際に、集計対象として商談のカスタム通貨項目「年間契約額」を選択する", "「年間契約額」を集計するカスタムレポートタイプを作成し、売上予測ページの代わりに使う", "商品に「年間契約額」項目を作り、商品ファミリ別売上予測で集計する"], "answer": [1], "explanation": "売上予測タイプでは、商談の金額の代わりに商談のカスタム通貨項目を集計対象にできる。これにより標準の売上予測ページでロールアップや調整を行える。", "choiceNotes": ["標準の「金額」を上書きすると、他のレポートや連携で使う金額が変わってしまう。", "正しい。カスタム通貨項目を集計対象にした売上予測タイプを作成する。", "レポートでは売上予測の調整やマネージャーへのロールアップを再現できない。", "商談上にある項目を商品側で作り直す必要はなく、要件にも合わない。"], "ref": "カスタム通貨項目の売上予測（Forecasts on Custom Currency Fields）"}, {"id": "SL2-008", "domain": "セールスライフサイクル", "topic": "売上予測タイプ：スケジュール日", "q": "12か月の保守契約を、商談商品の収益スケジュールで毎月に分けて登録している。現在の売上予測は商談の完了予定日の月に全額が計上されるため、財務部門から「実際に収益が発生する月で見込みを見たい」と指摘された。最も適切な対応はどれか。", "choices": ["商談の完了予定日を契約期間の最終月に変更する", "契約月ごとに12件の商談を作成する", "商談分割を使い、金額を12等分して各月に配分する", "商品スケジュールの日付に基づいて集計する売上予測タイプを追加する"], "answer": [3], "explanation": "商品スケジュールを使う場合、スケジュール日に基づいて集計する売上予測タイプを使えば、各分割払いや各月の収益をその日付が属する期間に計上できる。完了予定日基準の売上予測では全額が1か月に計上される。", "choiceNotes": ["日付をずらしても全額が1つの月に計上される点は変わらない。", "商談を分割すると管理が煩雑になり、パイプラインの件数も実態と合わなくなる。", "商談分割は担当者間の配分機能で、期間の配分には使えない。", "正しい。スケジュール日基準の売上予測タイプで月ごとの収益を集計する。"], "ref": "商品スケジュールに基づく売上予測（Schedule Date Forecasts）"}, {"id": "SL2-009", "domain": "セールスライフサイクル", "topic": "テリトリーモデルの状態", "q": "エンタープライズテリトリー管理で、来年度の新しいテリトリーモデルを準備している。テリトリーモデルの状態について正しい説明はどれか。2つ選択してください。", "choices": ["計画状態のモデルでも、割り当てたユーザーにはテリトリー経由のレコードアクセスが付与される", "有効状態にできるテリトリーモデルは同時に1つだけである", "アーカイブ状態のモデルは、必要に応じて再度有効状態に戻せる", "新しいモデルを有効化すると、それまで有効だったモデルはアーカイブ状態になる", "計画状態のモデルでは取引先の割り当てルールを実行できないため、割り当て結果は有効化後にしか確認できない"], "answer": [1, 3], "explanation": "有効状態のモデルは一度に1つだけで、新しいモデルを有効化すると以前の有効モデルはアーカイブされる。計画状態のモデルはアクセス権に影響せず、構造やルールを事前に作り込むために使う。", "choiceNotes": ["計画状態のモデルはレコードアクセスに影響しない。", "正しい。有効なモデルは常に1つである。", "アーカイブしたモデルを再び有効にすることはできない。", "正しい。新モデルの有効化で旧モデルはアーカイブされる。", "計画状態のモデルでも割り当てルールを実行でき、有効化前に取引先の割り当て結果をプレビューできる。"], "ref": "テリトリーモデルの状態（Territory Model State）"}, {"id": "SL2-010", "domain": "セールスライフサイクル", "topic": "商談テリトリー割り当て", "q": "有効なテリトリーモデルで、取引先は割り当てルールにより複数のテリトリーに割り当てられている。営業担当者が新しく作成した商談の「テリトリー」項目は空のままで、営業部は取引先のテリトリーに基づいて自動で設定してほしいと考えている。最も適切な対応はどれか。", "choices": ["商談テリトリー割り当てフィルターを実装する Apex クラスを作成し、テリトリー設定で有効にする", "商談オブジェクトを対象とするテリトリー割り当てルールを作成する", "取引先の共有ルールで商談の参照を許可する", "商談のテリトリー項目を必須項目にする"], "answer": [0], "explanation": "商談のテリトリーを自動で設定するには、商談テリトリー割り当てフィルター（Apex インターフェースを実装したクラス）を使い、取引先に割り当てられたテリトリーの中から1つを選ぶロジックを定義する。テリトリー割り当てルールの対象は取引先であり、商談を直接は扱わない。", "choiceNotes": ["正しい。商談テリトリー割り当てフィルターで自動割り当てを行う。", "テリトリー割り当てルールは取引先を対象とし、商談には作成できない。", "共有ルールはアクセス権の設定で、テリトリー項目の値は設定しない。", "必須にすると手入力を強制するだけで、自動割り当てにはならない。"], "ref": "商談テリトリー割り当て（Opportunity Territory Assignment Filter）"}, {"id": "SL2-011", "domain": "セールスライフサイクル", "topic": "テリトリー別売上予測", "q": "テリトリーモデルを有効化し、テリトリーに基づく売上予測タイプを追加した。商談のテリトリー項目も設定されているが、売上予測ページで地域のテリトリー階層を選んでも金額がロールアップされない。最も可能性が高い原因はどれか。", "choices": ["ユーザーのロール階層がテリトリー階層と一致していない", "テリトリー別売上予測には商談分割の有効化が必要である", "テリトリー階層の各テリトリーに売上予測マネージャーが割り当てられていない", "取引先が複数のテリトリーに割り当てられていると売上予測できない"], "answer": [2], "explanation": "テリトリー別売上予測ではロール階層ではなくテリトリー階層を使い、各テリトリーに売上予測マネージャーを割り当てることで金額がロールアップされる。マネージャーが未割り当てだと、そのテリトリーの金額は集計されない。", "choiceNotes": ["テリトリー別売上予測はロール階層に依存しない。", "テリトリー別売上予測に商談分割は必須ではない。", "正しい。各テリトリーへの売上予測マネージャーの割り当てが必要である。", "取引先が複数テリトリーに属していても、商談のテリトリー項目に基づいて集計される。"], "ref": "テリトリー別売上予測（Territory Forecasts）"}, {"id": "SL2-012", "domain": "セールスライフサイクル", "topic": "商談分割の設定条件", "q": "営業部から「1件の商談の実績を複数の担当者で分け合いたい」と要望があり、管理者が商談分割の導入を検討している。商談分割について正しい説明はどれか。2つ選択してください。", "choices": ["商談分割を有効化するには、事前に商談チームを有効にしておく必要がある", "オーバーレイ分割も、合計が必ず 100% になるように配分する必要がある", "分割の対象には、数値型を含む商談の任意のカスタム項目を指定できる", "収益分割は、商談の金額に対する配分の合計が 100% になる必要がある", "商談分割は Unlimited Edition でのみ利用できる"], "answer": [0, 3], "explanation": "商談分割は商談チームの機能を前提としており、チームを有効にした後に設定する。収益分割は合計 100% で商談の金額を配分し、オーバーレイ分割は 100% の制約なしで追加の貢献を記録できる。", "choiceNotes": ["正しい。商談チームの有効化が前提条件である。", "オーバーレイ分割は 100% の制約を受けない。", "分割の対象にできるのは通貨型の項目で、数値型は指定できない。", "正しい。収益分割は合計 100% でなければならない。", "商談分割は Enterprise Edition などでも利用できる。"], "ref": "商談分割の有効化（Enable Opportunity Splits）"}, {"id": "SL2-013", "domain": "セールスライフサイクル", "topic": "キャンペーン階層と ROI", "q": "親キャンペーン「下期展示会」の下に、3つの地域別子キャンペーンがある。各キャンペーンに費用と商談を登録した結果、親キャンペーンの「階層内の実際の費用」は 5,000,000 円、「階層内の成立商談の金額」は 20,000,000 円となった。マーケティング部は子キャンペーンを含む階層全体の ROI を親キャンペーンで表示したい。最も適切な対応と、その結果の値の組み合わせはどれか。", "choices": ["標準の ROI 項目をページレイアウトに追加する。値は 400% になる", "階層内の項目を使って (成立商談の金額 - 実際の費用) / 実際の費用 を計算する数式項目を作成する。値は 300% になる", "子キャンペーンの ROI をロールアップ集計項目で合計する。値は 300% になる", "階層内の項目を使って 成立商談の金額 / 実際の費用 を計算する数式項目を作成する。値は 400% になる"], "answer": [1], "explanation": "標準の ROI 項目はそのキャンペーン単体の値で計算され、子キャンペーンの数値を含まない。階層全体の ROI を表示するには、階層内の項目を使う数式項目を作成する。ROI は (成立商談の金額 - 実際の費用) / 実際の費用 なので (20,000,000 - 5,000,000) / 5,000,000 = 300% となる。", "choiceNotes": ["標準 ROI は単体キャンペーンの値で計算されるため階層全体の要件を満たさず、値も誤りである。", "正しい。階層内の項目を使った数式で 300% となる。", "キャンペーン同士の親子関係では積み上げ集計項目を作成できず、比率を合計するのも誤りである。", "ROI の式から費用が差し引かれておらず、計算方法が誤っている。"], "ref": "キャンペーン階層と ROI（Campaign Hierarchy Statistics）"}, {"id": "SL2-014", "domain": "セールスライフサイクル", "topic": "キャンペーン作成権限", "q": "マーケティング担当者のプロファイルには、キャンペーンの参照・作成・編集の権限が付与されている。しかし、この担当者はキャンペーンを参照できるものの、新規作成や親キャンペーンの設定ができない。最も可能性が高い原因はどれか。", "choices": ["キャンペーンの組織の共有設定が「非公開」になっている", "キャンペーン階層の機能が組織で有効になっていない", "担当者のロールがマーケティング部門のロールでない", "担当者のユーザーレコードで「マーケティングユーザー」が有効になっていない"], "answer": [3], "explanation": "キャンペーンを作成・編集するには、オブジェクト権限に加えて、ユーザーレコードの「マーケティングユーザー」チェックボックスが必要である。このチェックがないユーザーはキャンペーンの参照はできても、作成や編集はできない。", "choiceNotes": ["共有設定は既存レコードへのアクセスを制御するもので、新規作成ができない原因にはならない。", "キャンペーン階層は親キャンペーン項目を使う標準機能で、個別の有効化は不要である。", "ロール名はキャンペーンの作成可否を決めない。", "正しい。「マーケティングユーザー」の設定が必要である。"], "ref": "マーケティングユーザーの設定（Marketing User）"}, {"id": "SL2-015", "domain": "セールスライフサイクル", "topic": "キャンペーンインフルエンス", "q": "マーケティング部は、1件の商談が成立するまでにウェビナー、展示会、メール施策など複数のキャンペーンが影響していると考えている。現在は「主キャンペーンソース」の1件だけに成果が計上されているため、複数のキャンペーンに成果を配分して評価したい。最も適切な機能はどれか。", "choices": ["キャンペーン階層", "主キャンペーンソースの項目を複数選択リストに変更する", "カスタマイズ可能なキャンペーンインフルエンス", "キャンペーンメンバーの状況値の追加"], "answer": [2], "explanation": "カスタマイズ可能なキャンペーンインフルエンスを使うと、1件の商談に対して複数のキャンペーンを関連付け、影響度に応じて成果を配分できる。主キャンペーンソースは1つのキャンペーンしか記録できない。", "choiceNotes": ["キャンペーン階層は親子関係で数値を集計するもので、1件の商談の成果を複数の施策に配分する機能ではない。", "主キャンペーンソースは参照項目で、複数選択リストに変更することはできない。", "正しい。複数のキャンペーンに成果を配分できる。", "状況値はメンバーの反応を表すもので、成果の配分には使えない。"], "ref": "カスタマイズ可能なキャンペーンインフルエンス（Customizable Campaign Influence）"}, {"id": "SL2-016", "domain": "セールスライフサイクル", "topic": "リード変換時の項目対応付け", "q": "インサイドセールスがリードのカスタム選択リスト項目「導入予定時期」に値を入力しているが、リードを取引開始すると、作成された商談でこの値を確認できないと営業部から苦情があった。最も適切な対応はどれか。", "choices": ["リードの取引開始後に、営業担当者が手作業で値をコピーする運用ルールを定める", "リードの「導入予定時期」項目を必須にする", "商談に互換性のあるデータ型のカスタム項目を作成し、リード項目の対応付けでリードの項目と関連付ける", "リードの取引開始時に元のリードを削除しないよう設定を変更する"], "answer": [2], "explanation": "リードのカスタム項目の値を取引開始後のレコードに引き継ぐには、取引先・取引先責任者・商談のいずれかに対応するカスタム項目を用意し、リード項目の対応付けで関連付ける。対応付けは互換性のあるデータ型どうしで行う必要がある。", "choiceNotes": ["手作業のコピーは漏れが生じやすく、標準の対応付けで自動化できる。", "必須にしても、変換後のレコードに値は引き継がれない。", "正しい。対応するカスタム項目を作成して対応付けを行う。", "取引開始済みのリードは削除されずに残り、この設定は値の引き継ぎとは関係がない。"], "ref": "リード項目の対応付け（Map Custom Lead Fields for Lead Conversion）"}, {"id": "SL2-017", "domain": "セールスライフサイクル", "topic": "売上予測に商談が含まれない", "q": "営業担当者から「自分の商談が売上予測の金額に含まれていない」と問い合わせがあった。担当者は売上予測を許可されており、売上予測階層も正しく設定されている。考えられる原因はどれか。2つ選択してください。", "choices": ["商談の売上予測分類が「売上予測から除外」になっている", "商談に商談商品が追加されていない", "商談の完了予定日が、売上予測ページで表示している期間の範囲外にある", "商談の組織の共有設定が「非公開」になっている", "商談の確度が 10% 以下である"], "answer": [0, 2], "explanation": "売上予測分類が「売上予測から除外」の商談は売上予測の金額に含まれない。また、売上予測は商談の完了予定日に基づいて期間に計上されるため、表示中の期間外の商談はその期間の数値に現れない。", "choiceNotes": ["正しい。「売上予測から除外」の商談は集計されない。", "商談の金額を集計する売上予測タイプでは、商談商品がなくても金額が集計される。", "正しい。完了予定日が表示期間外なら、その期間には計上されない。", "売上予測のロールアップは売上予測階層に基づき、商談の共有設定には左右されない。", "確度の値が低いことだけでは売上予測から除外されない。"], "ref": "売上予測分類と売上予測期間（Forecast Categories）"}, {"id": "SL2-018", "domain": "セールスライフサイクル", "topic": "リードキュー", "q": "Web-to-リードで登録されたリードを、インサイドセールスのメンバー5名のうち手の空いた人が引き取って対応する運用にしたい。管理者が設定すべきものはどれか。2つ選択してください。", "choices": ["リードオブジェクトをサポートするキューを作成し、インサイドセールスのメンバーを追加する", "リードの共有ルールで、インサイドセールスにすべてのリードの参照権限を付与する", "Web-to-リードの設定で、デフォルトのリード作成者をインサイドセールスのリーダーにする", "Web-to-リードのリードをキューに割り当てるリード割り当てルールを作成し、有効化する", "インサイドセールスのメンバーごとにリードのレコードタイプを作成する"], "answer": [0, 3], "explanation": "複数のメンバーが共同で受け持つ場合は、リードをキューに割り当て、メンバーがキューのリストビューから引き取る運用が適している。Web-to-リードで作成されたリードをキューへ入れるには、有効なリード割り当てルールでキューを割り当て先に指定する。", "choiceNotes": ["正しい。リード用のキューを作成してメンバーを追加する。", "参照権限を付与しても、所有者の割り当てや引き取りの仕組みにはならない。", "デフォルトのリード作成者は Web-to-リードのリードの作成者として記録されるユーザーで、有効な割り当てルールがない場合はその1名が所有者になるため、メンバーで引き取る運用にならない。", "正しい。割り当てルールでキューに振り分ける。", "レコードタイプは割り当てや引き取りの仕組みとは関係がない。"], "ref": "キューの作成とリード割り当てルール（Lead Queues, Lead Assignment Rules）"}, {"id": "SL2-019", "domain": "セールスライフサイクル", "topic": "キューからの引き取り", "q": "リードキュー「新規問い合わせ」に入ったリードを、別部署から異動してきた営業担当者が引き取ろうとすると、所有者を自分に変更できない。担当者のプロファイルにはリードの参照・編集権限がある。最も可能性が高い原因と対処はどれか。", "choices": ["担当者がキューのメンバーに含まれていないため、本人または所属するロールや公開グループをキューのメンバーに追加する", "リードの組織の共有設定が「公開/参照・更新可能」になっていないため、変更する", "キューのメールアドレスが未設定のため、メールアドレスを設定する", "リード割り当てルールが無効のため、有効化する"], "answer": [0], "explanation": "キュー所有のレコードの所有権を取得できるのは、キューのメンバーや、ロール階層でメンバーより上位のユーザーなどに限られる。異動した担当者がメンバーに含まれていなければ、キューのメンバーに追加する必要がある。", "choiceNotes": ["正しい。キューのメンバーに追加すると所有権を取得できる。", "共有設定を広げるのは影響範囲が大きく、キューのメンバー管理で解決すべき問題である。", "キューのメールアドレスは通知に使うもので、所有権の取得には関係しない。", "割り当てルールはレコードをキューに入れる仕組みで、キューから引き取る権限とは関係がない。"], "ref": "キューのメンバー（Queues）"}, {"id": "SL2-020", "domain": "セールスライフサイクル", "topic": "見積の同期", "q": "1件の商談に、値引き条件の異なる見積を3件作成した。顧客が2番目の見積を採用したため、その内容を商談に反映したい。見積の同期について正しい説明はどれか。2つ選択してください。", "choices": ["見積は状況が「承認済み」になっていないと同期を開始できない", "1件の商談と同期できる見積は、同時に1件だけである", "同期中は、見積品目と商談商品の変更が互いに反映される", "見積品目のカスタム項目は、追加の設定なしで商談商品のカスタム項目と同期される", "見積には、商談とは別の価格表を指定して同期できる"], "answer": [1, 2], "explanation": "商談と同期できる見積は一度に1件で、同期を開始すると見積品目と商談商品が一致し、以後の変更は双方向に反映される。標準で同期されるのは標準項目であり、カスタム項目を同期するには自動化などの追加の仕組みが必要になる。", "choiceNotes": ["見積の状況にかかわらず同期を開始できる。", "正しい。同期中の見積は1件のみである。", "正しい。同期中は見積品目と商談商品が双方向に更新される。", "カスタム項目は標準では同期されない。", "見積は商談の価格表を使用する。"], "ref": "見積と商談の同期（Sync Quotes and Opportunities）"}, {"id": "SL2-021", "domain": "セールスライフサイクル", "topic": "価格表エントリと標準価格表", "q": "管理者が新商品「分析オプション」を作成し、代理店向けのカスタム価格表「代理店価格表」に追加しようとしたが、価格表の商品追加画面にこの商品が表示されない。商品は有効になっている。最も可能性が高い原因はどれか。", "choices": ["代理店価格表が無効になっている", "商品に商品ファミリが設定されていない", "商品に標準価格が設定されていない", "代理店価格表の通貨が会社の通貨と異なる"], "answer": [2], "explanation": "商品をカスタム価格表に追加するには、先に標準価格表で標準価格を設定しておく必要がある。標準価格のない商品はカスタム価格表に追加する対象として表示されない。", "choiceNotes": ["この商品だけが表示されない状況であり、価格表の有効・無効は特定の商品だけが候補に出ない理由にならない。", "商品ファミリは任意の項目で、価格表への追加の条件ではない。", "正しい。標準価格の設定が前提条件である。", "通貨の違いが原因なら、他の商品も同様に表示されないはずである。"], "ref": "価格表エントリと標準価格（Price Books, Standard Price）"}, {"id": "SL2-022", "domain": "セールスライフサイクル", "topic": "商談の価格表変更", "q": "営業担当者が標準価格表で商談に5つの商品を追加したあと、パートナー経由の取引になったため、商談の価格表を「パートナー価格表」に変更しようとしている。この操作について正しい説明はどれか。", "choices": ["既存の商談商品は残り、販売価格がパートナー価格表の価格に自動で更新される", "1件の商談には複数の価格表の商品を混在させられるため、価格表を変更する必要はない", "商談商品が存在する間は価格表を変更できず、エラーになる", "価格表を変更すると既存の商談商品は削除されるため、パートナー価格表から商品を追加し直す必要がある"], "answer": [3], "explanation": "商談で使える価格表は1つで、商品が追加された後に価格表を変更すると既存の商談商品は削除される。新しい価格表から商品を追加し直す必要があるため、変更前に担当者へ影響を説明しておく。", "choiceNotes": ["既存の商談商品は残らず、価格も自動更新されない。", "1件の商談で使用できる価格表は1つだけである。", "変更自体は可能で、その結果として既存の商品が削除される。", "正しい。価格表を変更すると既存の商談商品は削除される。"], "ref": "商談の価格表の変更（Change the Price Book on an Opportunity）"}, {"id": "SL2-023", "domain": "セールスライフサイクル", "topic": "商品スケジュール（収益スケジュール）", "q": "年額 1,200,000 円のクラウドサービスを販売している。商談に商品を追加すると、毎月 100,000 円ずつ12か月分の収益が自動で登録されるようにしたい。最も適切な設定はどれか。", "choices": ["商品で数量スケジュールを有効にし、デフォルトのスケジュール種別を「繰り返し」、期間を「月次」、回数を12に設定する", "商品で収益スケジュールを有効にし、デフォルトのスケジュール種別を「分割」、期間を「月次」、回数を12に設定する", "商品で収益スケジュールを有効にし、デフォルトのスケジュール種別を「繰り返し」、期間を「月次」、回数を12に設定する", "商談分割で金額を12等分し、各分割に月を設定する"], "answer": [1], "explanation": "金額を期間で分けるには収益スケジュールを使う。種別「分割」は合計金額を回数で割って各回に配分し、「繰り返し」は同じ金額を各回に計上するため、年額を月額に分けるには「分割」が適している。", "choiceNotes": ["数量スケジュールは数量を配分するもので、収益の配分ではない。また「繰り返し」では毎月同じ数量が計上される。", "正しい。収益スケジュールを「分割」、月次、12回で設定する。", "「繰り返し」だと毎月 1,200,000 円が計上され、合計が12倍になる。", "商談分割は担当者間で金額を配分する機能で、期間の配分には使えない。"], "ref": "商品スケジュール（Product Schedules）"}, {"id": "SL2-024", "domain": "セールスライフサイクル", "topic": "契約と注文の関係", "q": "受注管理担当者が、取引先 A 社の有効な契約に関連付けて注文を作成しようとしたところ、保存時にエラーになった。注文の取引先欄には、A 社のグループ会社である B 社が入力されていた。最も可能性が高い原因はどれか。", "choices": ["注文の取引先が、関連付けた契約の取引先と一致していない", "有効な契約には注文を1件しか関連付けられない", "注文を保存する前に契約を下書きに戻す必要がある", "注文には商品を1件以上追加してからでないと契約に関連付けられない"], "answer": [0], "explanation": "注文を契約に関連付ける場合、注文の取引先は契約の取引先と同じである必要がある。グループ会社であっても別の取引先レコードであれば一致しないため、保存時にエラーとなる。", "choiceNotes": ["正しい。注文と契約の取引先が一致しないと関連付けられない。", "1件の契約に複数の注文を関連付けられる。", "有効な契約に注文を関連付けるために、契約を下書きに戻す必要はない。", "注文商品の有無は契約への関連付けの条件ではない。"], "ref": "注文と契約（Orders, Contracts）"}, {"id": "SL2-025", "domain": "セールスライフサイクル", "topic": "パス", "q": "新規販売事業部と保守更新事業部では、商談のフェーズの進め方が異なる。各事業部の担当者が商談画面で自分の事業部のフェーズだけを確認し、フェーズごとに入力すべき重要項目と成功のためのガイダンスを参照できるようにしたい。管理者が行うべき設定はどれか。2つ選択してください。", "choices": ["全フェーズを含むパスを1つ作成し、事業部ごとにガイダンスの文言を書き分ける", "事業部ごとにプロファイルを分け、プロファイル単位でパスを割り当てる", "事業部ごとの商談のフェーズを含む営業プロセスを作成し、それぞれのレコードタイプに割り当てる", "商談のリストビューをかんばん表示に切り替え、フェーズ列でグループ化する", "レコードタイプごとにパスを作成し、各ステップに重要項目とガイダンスを設定する"], "answer": [2, 4], "explanation": "事業部ごとに異なるフェーズを使うには、営業プロセスで使用するフェーズを定義し、レコードタイプに割り当てる。パスはオブジェクトとレコードタイプの組み合わせで作成でき、各ステップに重要項目とガイダンスを設定できる。", "choiceNotes": ["1つのパスでは事業部ごとに異なるフェーズを表示できない。", "パスはプロファイル単位ではなく、レコードタイプ単位で作成する。", "正しい。営業プロセスとレコードタイプで事業部ごとのフェーズを分ける。", "かんばん表示は一覧の見せ方で、重要項目やガイダンスは表示できない。", "正しい。レコードタイプ別のパスで重要項目とガイダンスを設定する。"], "ref": "パスの設定（Set Up Path）"}, {"id": "SL3-001", "domain": "セールスライフサイクル", "topic": "リードステータスの取引開始済み設定", "q": "インサイドセールス部門は、要件確認が済んだリードを「引き渡し準備完了」という新しいステータスで取引開始（変換）したいと考えています。管理者がリードの状況（Status）選択リストにこの値を追加しましたが、取引開始画面の「取引開始状況」に表示されません。コンサルタントが推奨すべき対応はどれですか？", "choices": ["商談の販売プロセスにこの値を追加する", "リードの状況選択リストでこの値を「取引開始済み」として設定する", "パスにこの値をステップとして追加する", "リードのレコードタイプでこの値を有効にする"], "answer": [1], "explanation": "リードの状況の各値には「取引開始済み」フラグがあり、このフラグが付いた値だけが取引開始画面の取引開始状況として選択できます。少なくとも1つの値を取引開始済みにする必要があり、そのうち1つを既定値にできます。なお、リードのレコードタイプを使っている場合は、リードプロセスにもその値を含める必要がありますが、取引開始済みフラグがなければ取引開始状況には表示されません。", "choiceNotes": ["販売プロセスは商談のフェーズの選択肢を制御するもので、リードの取引開始状況には関係しません。", "取引開始済みフラグを付けた値だけが取引開始画面に表示されるため正解です。", "パスは画面上のガイドであり、取引開始状況の候補を決めるものではありません。", "レコードタイプで値を有効にしても、取引開始済みフラグがなければ取引開始状況には表示されません。"], "ref": "リードの状況選択リストの設定 / リードの取引開始"}, {"id": "SL3-002", "domain": "セールスライフサイクル", "topic": "取引開始時の入力規則の適用", "q": "営業本部は「予算」と「導入時期」が未入力のリードを取引開始させない運用を求めています。通常の編集時には未入力を許容し、取引開始時だけチェックしたいと考えています。この要件を満たすために必要な対応はどれですか？（2つ選択してください）", "choices": ["IsConverted が真のときに予算と導入時期の未入力を検出するリードの入力規則を作成する", "リードの設定で「取引開始済みリードの入力規則を必須にする」を有効にする", "予算と導入時期をページレイアウトで必須項目にする", "リードの取引開始時の項目対応付けで予算と導入時期を商談に対応付ける", "リードのパスで予算と導入時期を重要項目に設定する"], "answer": [0, 1], "explanation": "取引開始の処理でリードの入力規則を評価させるには、リードの設定で取引開始時の入力規則の適用を有効にする必要があります。そのうえで IsConverted を条件に含めた入力規則にすれば、通常編集時は許容しつつ取引開始時だけ未入力を防げます。", "choiceNotes": ["取引開始時だけ評価される条件を作るため正解です。", "この設定がないと取引開始時にリードの入力規則が評価されないため正解です。", "ページレイアウトの必須は通常の編集時にも常に入力を強制するため要件に合いません。", "項目対応付けは値を引き継ぐ設定であり、未入力の取引開始を防ぎません。", "パスの重要項目は入力を促すだけで、取引開始を阻止しません。"], "ref": "リードの設定 / 取引開始済みリードの入力規則"}, {"id": "SL3-003", "domain": "セールスライフサイクル", "topic": "取引開始の権限", "q": "新しく採用されたインサイドセールス担当者が、リードの編集はできるものの、リードレコードに「取引開始」ボタンが表示されないと報告しました。同じページレイアウトを使う他の担当者には表示されています。最も可能性の高い原因はどれですか？", "choices": ["担当者のプロファイルまたは権限セットに「リードの取引開始」権限が付与されていない", "担当者がリードのキューのメンバーになっていない", "リードの割り当てルールが無効になっている", "担当者のロールが商談の所有者より下位にある"], "answer": [0], "explanation": "リードを取引開始するには「リードの取引開始」ユーザー権限と、取引先・取引先責任者・商談などの作成権限が必要です。レイアウトが同じでも権限がなければボタンは使用できません。", "choiceNotes": ["取引開始には専用のユーザー権限が必要なため正解です。", "キューのメンバーかどうかは取引開始ボタンの表示に関係しません。", "割り当てルールはリード所有者を決めるもので、取引開始権限とは無関係です。", "ロール階層は参照範囲に影響しますが、取引開始ボタンの表示条件ではありません。"], "ref": "リードの取引開始に必要な権限"}, {"id": "SL3-004", "domain": "セールスライフサイクル", "topic": "取引開始時に商談を作成しない既定", "q": "ある企業では、既存顧客からの問い合わせリードの多くは取引先責任者として登録するだけで、商談は別途アップセル案件として作成しています。担当者が取引開始のたびに不要な商談を作ってしまう問題を減らしつつ、必要な場合は商談を作成できるようにしたいと考えています。推奨される対応はどれですか？", "choices": ["商談オブジェクトの作成権限をインサイドセールスから削除する", "リードの設定で、取引開始画面の「商談を作成しない」を既定で選択するよう設定する", "取引開始後に商談を自動削除するフローを作成する", "商談の販売プロセスから初期フェーズを削除する"], "answer": [1], "explanation": "リードの設定には、取引開始画面で商談を作成しないオプションを既定で選択する設定や、商談セクション自体を非表示にする設定があります。既定選択にすれば、必要な場合だけ担当者が商談作成を選べます。", "choiceNotes": ["作成権限を外すと、商談が必要なケースでも作成できなくなります。", "既定で商談を作らず、必要時は選択できるため要件に合致します。", "作成後に削除するのは非効率でデータ不整合の原因になります。", "フェーズの削除は取引開始時の商談作成を抑止しません。"], "ref": "リードの設定 / リードの取引開始"}, {"id": "SL3-005", "domain": "セールスライフサイクル", "topic": "取引開始済みリードの分析", "q": "マーケティング部門は、取引開始されたリードが、どの取引先・商談になったかをリード元別に一覧で分析したいと考えています。最も適切なレポートの作り方はどれですか？", "choices": ["「取引開始済みリード情報を含むリード」レポートタイプを使用する", "商談レポートの「リードソース」で絞り込み、リードの作成日でグループ化する", "取引開始済みリードのリストビューを作成する", "キャンペーンメンバーレポートで状況が「反応あり」のレコードを抽出する"], "answer": [0], "explanation": "取引開始済みリード情報を含むリードのレポートタイプでは、取引開始後に作成・関連付けられた取引先、取引先責任者、商談の情報をリードと合わせて表示できます。取引開始済みリードはリストビューには表示されないため、分析はレポートで行います。", "choiceNotes": ["リードと取引開始後の取引先・商談を合わせて表示できるため正解です。", "商談側からはリード元の情報が限られ、元のリードとの対応を一覧化できません。", "取引開始済みリードは通常のリストビューに表示されません。", "キャンペーンメンバーの状況は取引開始の結果を示すものではありません。"], "ref": "リードレポート / 取引開始済みリード情報"}, {"id": "SL3-006", "domain": "セールスライフサイクル", "topic": "未変換リードの扱い", "q": "インサイドセールスが検討した結果、「現時点では予算なし」と判断されたリードが大量にあります。営業部長は、これらを営業パイプラインから外しつつ、将来の再アプローチに活用したいと考えています。推奨される対応はどれですか？（2つ選択してください）", "choices": ["リードを取引開始せず、取引開始済みでないクローズ系の状況にして、不適格理由を選択リストで記録する", "ナーチャリング用キャンペーンのメンバーとして追加し、マーケティングの継続的な働きかけの対象にする", "取引開始して取引先と商談を作成し、商談を「失注」にする", "データ量を抑えるため、該当リードを一括削除する", "リードの所有者を退職者ユーザーに変更して非表示にする"], "answer": [0, 1], "explanation": "適格でないリードは取引開始せず、未取引開始のクローズ状況と理由を記録することで、パイプラインを汚さずに分析と再活用ができます。キャンペーンに追加すれば、ナーチャリングの対象として反応を追跡できます。", "choiceNotes": ["パイプラインから外しつつ理由を分析に使えるため正解です。", "将来の再アプローチに向けて継続的に育成できるため正解です。", "見込みのない商談を作るとパイプラインや受注率の分析が歪みます。", "削除すると再アプローチや分析に使えなくなります。", "所有者を不適切に変えると責任の所在が不明確になり、運用上の回避策に過ぎません。"], "ref": "リードの状況 / キャンペーンメンバー"}, {"id": "SL3-007", "domain": "セールスライフサイクル", "topic": "インサイドセールスとフィールドセールスの分業", "q": "インサイドセールス（SDR）がリードを見極めて取引開始し、商談はフィールドセールス（AE）が所有する運用です。経営層は、どのSDRが創出した商談が受注につながったかをレポートで集計したいと考えています。商談の所有者はAEのままにする必要があります。適切な設計はどれですか？（2つ選択してください）", "choices": ["リードと商談にユーザー参照のカスタム項目「創出SDR」を作成し、取引開始時の項目対応付けで引き継ぐ", "SDRを「SDR」ロールで商談チームに追加し、商談チームのレポートで集計する", "取引開始時の商談所有者をSDRにして、受注後にAEに変更する", "リードの項目履歴を有効にし、取引開始前の所有者を確認する", "SDRがChatterで商談にコメントした件数を集計する"], "answer": [0, 1], "explanation": "所有者をAEにしたままSDRの貢献を残すには、商談上にSDRを記録する必要があります。項目対応付けでユーザー参照項目を引き継ぐ方法や、商談チームのロールとして記録する方法なら、レポートで受注実績と組み合わせて集計できます。", "choiceNotes": ["取引開始時に自動で商談へSDRを記録でき、集計に使えるため正解です。", "商談チームのロールでSDRを識別でき、レポートで集計できるため正解です。", "所有者を一時的にSDRにすると、パイプラインと予測の担当が不正確になります。", "取引開始済みリードの履歴は商談レポートと組み合わせた集計に向きません。", "コメント件数は商談創出の貢献を示しません。"], "ref": "リードの取引開始の項目対応付け / 商談チーム"}, {"id": "SL3-008", "domain": "セールスライフサイクル", "topic": "Agentforce SDR の位置づけ", "q": "ある企業はWebからの問い合わせリードが多く、インサイドセールスが営業時間外のリードに即時対応できていません。Agentforce の営業開発（SDR）エージェントの導入を検討しています。このエージェントの役割として最も適切な説明はどれですか？", "choices": ["リードに自律的にメールで働きかけ、質問に回答して商談の面談設定を行い、適格なリードを人間の営業担当者に引き継ぐ", "リードの取引開始時に、価格表と割引率を自動で決定して契約を締結する", "すべての商談を自律的にクローズし、売上予測を自動確定する", "リード割り当てルールの代わりに、リードを削除して重複を解消する"], "answer": [0], "explanation": "Agentforce の SDR エージェントは、信頼できるデータに基づいてリードへの働きかけや質問への回答、面談の設定を行い、パイプライン創出を支援します。商談化した後の交渉や契約は人間の営業担当者が担う分業が前提です。", "choiceNotes": ["トップオブファネルでの働きかけと引き継ぎがSDRエージェントの役割であるため正解です。", "価格の決定や契約締結を自律的に行う機能ではありません。", "商談のクローズや売上予測の確定を代行するものではありません。", "重複解消やリード削除は SDR エージェントの役割ではありません。"], "ref": "Agentforce Sales Development / Agentforce for Sales"}, {"id": "SL3-009", "domain": "セールスライフサイクル", "topic": "商談の取引先責任者の役割", "q": "大型案件では、決裁者、予算権限者、技術評価者など、同じ顧客企業の複数人が関与します。営業部長は、商談ごとに誰がどの立場で関与しているかを記録し、決裁者が未特定の商談を把握したいと考えています。最も適切な機能はどれですか？", "choices": ["取引先の「取引先責任者の関係」の役割", "商談の取引先責任者の役割（Opportunity Contact Role）", "取引先チーム", "取引先責任者の「部署」項目"], "answer": [1], "explanation": "商談の取引先責任者の役割は、商談単位で関与者とその立場（決裁者、評価者など）を記録でき、主担当も指定できます。役割の値は設定で変更でき、商談と取引先責任者の役割のレポートで未特定の商談も把握できます。", "choiceNotes": ["取引先との関係は会社単位の関係であり、商談ごとの立場は表せません。", "商談単位で関与者と役割を記録できるため正解です。", "取引先チームは自社側メンバーの役割を管理する機能です。", "部署は組織上の所属で、商談での立場を表しません。"], "ref": "商談の取引先責任者の役割"}, {"id": "SL3-010", "domain": "セールスライフサイクル", "topic": "取引先責任者の役割へのカスタム項目", "q": "同じ人物が、ある商談では導入に賛成し、別の商談では反対の立場をとることがあります。営業部門は、関与者ごとの「商談に対する姿勢（推進派／中立／反対派）」を商談単位で記録したいと考えています。推奨される設計はどれですか？", "choices": ["取引先責任者オブジェクトに姿勢の選択リスト項目を作成する", "商談オブジェクトに姿勢の選択リスト項目を作成する", "商談の取引先責任者の役割オブジェクトに姿勢の選択リスト項目を作成する", "取引先オブジェクトに姿勢のテキスト項目を作成する"], "answer": [2], "explanation": "商談の取引先責任者の役割はカスタム項目を追加でき、商談と取引先責任者の組み合わせごとに値を持てます。人物単位でも商談単位でもなく、その組み合わせに属する情報なので、この中間オブジェクトに持たせるのが適切です。", "choiceNotes": ["取引先責任者の項目は全商談で共通の1値になり、商談ごとの違いを表せません。", "商談の項目では関与者ごとに値を持てません。", "商談と人物の組み合わせごとに記録できるため正解です。", "取引先単位の項目では個人ごと・商談ごとの姿勢を表せません。"], "ref": "商談の取引先責任者の役割のカスタマイズ"}, {"id": "SL3-011", "domain": "セールスライフサイクル", "topic": "競合情報の管理", "q": "1つの商談に複数の競合他社が参加することが多く、営業企画部は競合ごとの提案価格や強み・弱みを商談単位で記録し、競合別の勝率を分析したいと考えています。最も適切な設計はどれですか？", "choices": ["商談に「競合」の複数選択リスト項目を作成する", "商談に競合名のテキスト項目を3つ作成する", "競合他社のマスタと商談をつなぐカスタムの連結オブジェクトを作成し、競合ごとの提案価格や強み・弱みを項目として持たせる", "取引先の説明欄に競合情報を記載する"], "answer": [2], "explanation": "商談と競合が多対多で、かつ組み合わせごとに属性（提案価格、強み・弱み）を持たせたい場合は連結オブジェクトが適しています。競合マスタを参照するため表記ゆれがなく、競合別の勝率もレポートで集計できます。", "choiceNotes": ["複数選択リストでは競合ごとの価格や強み・弱みを保持できず、集計にも不向きです。", "固定数のテキスト項目は表記ゆれが起き、件数も制限されます。", "多対多と組み合わせごとの属性を表現でき、分析にも使えるため正解です。", "自由記述では構造化された分析ができません。"], "ref": "カスタムオブジェクトの多対多リレーション（連結オブジェクト）"}, {"id": "SL3-012", "domain": "セールスライフサイクル", "topic": "失注理由の把握", "q": "営業部長は、失注した商談の理由を必ず記録させ、理由別に失注件数と金額を分析したいと考えています。最も適切な対応はどれですか？", "choices": ["失注理由の選択リスト項目を作成し、フェーズが失注のときに未入力なら保存できない入力規則を設定する", "失注理由をテキストエリア項目にし、パスのガイダンスで入力を促す", "商談の説明欄に失注理由を記載するよう周知する", "フェーズが失注になったらChatterに投稿するフローを作成する"], "answer": [0], "explanation": "分析に使う理由は選択リストで標準化し、フェーズが失注のときだけ入力規則で必須化するのが一般的です。これにより全失注商談で理由が揃い、レポートで理由別に集計できます。", "choiceNotes": ["値の標準化と入力の強制を両立し、集計に使えるため正解です。", "パスのガイダンスは入力を強制せず、自由記述は集計に不向きです。", "周知だけでは入力が保証されず、構造化もされません。", "投稿は記録の強制にも理由の集計にもなりません。"], "ref": "入力規則 / 選択リスト項目"}, {"id": "SL3-013", "domain": "セールスライフサイクル", "topic": "更新商談の自動作成", "q": "サブスクリプション型サービスを販売する企業では、新規商談が受注になったら、契約終了日の90日前を完了予定日とする更新商談を自動で作成したいと考えています。ローコードで実現する最も適切な方法はどれですか？", "choices": ["商談のフェーズが「成立」に変わったときに起動するレコードトリガーフローで、種別を「更新」とした新しい商談を作成する", "承認プロセスの最終承認アクションで新しい商談を作成する", "パスのガイダンスに更新商談の作成手順を記載する", "商談の販売プロセスに「更新」フェーズを追加する"], "answer": [0], "explanation": "レコードトリガーフローは条件を満たしたときに関連レコードを作成でき、日付の計算も可能です。種別などで更新商談を識別すれば、更新パイプラインとして管理・予測できます。", "choiceNotes": ["条件に応じた自動作成と日付計算が可能なため正解です。", "要件に承認は含まれず、承認プロセスは承認の流れを管理する仕組みのため、受注時の更新商談の自動作成には適しません。", "手順の記載だけでは作成漏れが防げません。", "フェーズを追加しても別の更新商談は作成されません。"], "ref": "レコードトリガーフロー / 商談の種別"}, {"id": "SL3-014", "domain": "セールスライフサイクル", "topic": "契約満了の事前通知", "q": "契約を管理している営業担当者が、契約終了日を見落として更新交渉が遅れる事態が続いています。標準機能を使って、契約終了の一定日数前に契約所有者へ通知したい場合、推奨される対応はどれですか？", "choices": ["契約の設定で有効期限通知の送信を有効にし、契約の「所有者への有効期限通知」で通知日数を指定する", "契約の項目履歴管理を有効にする", "契約にレコードタイプを追加する", "契約の承認プロセスを作成する"], "answer": [0], "explanation": "契約の設定で有効期限通知を有効にすると、契約ごとに所有者への有効期限通知の日数を指定でき、終了日前に通知メールが送信されます。更新商談の作成と組み合わせると、更新の取りこぼしを減らせます。", "choiceNotes": ["標準の契約有効期限通知の仕組みであるため正解です。", "項目履歴は変更を記録するだけで通知は行いません。", "レコードタイプは画面や選択肢の切り替えで、通知機能ではありません。", "承認プロセスは承認の流れを管理するもので、期限通知には使いません。"], "ref": "契約の設定 / 契約の有効期限通知"}, {"id": "SL3-015", "domain": "セールスライフサイクル", "topic": "大型商談アラート", "q": "経営層は、金額が5,000万円以上で、かつ確度が70%以上になった商談について、自動でメール通知を受け取りたいと考えています。開発を伴わず標準で用意された機能として最も適切なものはどれですか？", "choices": ["大型商談アラート", "商談の承認プロセス", "パイプラインインスペクションのフィルタ", "商談のキュー"], "answer": [0], "explanation": "大型商談アラートは、指定した金額と確度のしきい値に達した商談について、指定の宛先にメールを自動送信する標準機能です。設定画面で金額・確度のしきい値と通知先を指定するだけで、開発なしで実現できます。", "choiceNotes": ["金額と確度のしきい値で自動通知する標準機能のため正解です。", "承認プロセスは承認申請が必要で、自動通知の仕組みではありません。", "フィルタは画面上での絞り込みで、メール通知は行いません。", "商談はキューで所有する対象オブジェクトではなく、通知機能でもありません。"], "ref": "大型商談アラートの設定"}, {"id": "SL3-016", "domain": "セールスライフサイクル", "topic": "新規・拡大・更新の区分", "q": "営業本部は、パイプラインと受注実績を「新規」「既存顧客への拡大」「更新」に分けて把握したいと考えています。販売の手順自体はどの区分でもほぼ同じです。最もシンプルで保守しやすい設計はどれですか？", "choices": ["区分ごとにレコードタイプと販売プロセスを作成する", "商談の「種別」選択リストの値を整理して区分を記録し、レポートでグループ化する", "区分ごとに別のカスタムオブジェクトを作成する", "区分ごとに別の価格表を作成する"], "answer": [1], "explanation": "販売手順が同じであれば、別の販売プロセスやオブジェクトを作る必要はありません。標準の種別項目で区分を記録すれば、レポートやダッシュボードで簡単に分けて分析できます。", "choiceNotes": ["手順が同じなら複数の販売プロセスは保守負担を増やすだけです。", "標準項目で区分を記録し集計でき、最もシンプルなため正解です。", "オブジェクトを分けるとパイプラインや予測が分断されます。", "価格表は価格を管理するもので、商談区分の記録手段ではありません。"], "ref": "商談の項目（種別） / 商談レポート"}, {"id": "SL3-017", "domain": "セールスライフサイクル", "topic": "納入商品とクロスセル", "q": "機器メーカーの営業部門は、顧客がどの製品を何台、いつ導入したかを把握し、保守更新やまだ導入していない製品のクロスセルの機会を見つけたいと考えています。最も適切な標準機能はどれですか？", "choices": ["納入商品（Asset）を取引先に関連付けて管理し、レポートで分析する", "商談商品のみを参照する", "取引先の説明欄に導入製品を記載する", "価格表エントリに顧客名を記録する"], "answer": [0], "explanation": "納入商品は顧客が保有する製品を取引先や取引先責任者に関連付けて、数量、購入日、保証期限などとともに管理できます。導入済み製品を把握できるため、更新時期の把握や未導入製品の特定に活用できます。", "choiceNotes": ["顧客の導入済み製品を管理・分析できるため正解です。", "商談商品は販売時点の明細で、失注商談も含み、導入状況の管理には向きません。", "自由記述では構造化された分析ができません。", "価格表エントリは商品の価格を管理するもので、顧客別の保有状況は表せません。"], "ref": "納入商品（Asset）"}, {"id": "SL3-018", "domain": "セールスライフサイクル", "topic": "アカウントプランニング", "q": "グローバル企業との取引拡大を目指すキーアカウント担当チームが、年次のアカウントプランを作成しようとしています。アカウントプランに含める内容として最も適切なものはどれですか？", "choices": ["顧客の事業目標、未導入領域（ホワイトスペース）、主要な関係者と関係性、目標に紐づく商談と行動計画", "全リードの割り当てルールと受付キューの一覧", "価格表の全商品と標準価格の一覧", "社内ユーザーのロール階層図"], "answer": [0], "explanation": "アカウントプランは重要顧客の成長戦略を定める計画で、顧客の目標、拡大余地、関係者の把握、それを実現する商談と行動を結びつけます。営業チーム全体で同じ方針に沿って取り組むための基盤になります。", "choiceNotes": ["顧客理解と拡大機会、実行計画を結びつけるため正解です。", "リードの割り当て設定は組織の運用設定で、顧客別の計画ではありません。", "商品価格の一覧は顧客戦略そのものではありません。", "社内ロール階層は顧客の関係者や拡大機会を示しません。"], "ref": "アカウントプランニング / キーアカウント管理"}, {"id": "SL3-019", "domain": "セールスライフサイクル", "topic": "見積の割引承認", "q": "割引率が10%を超える見積は営業マネージャー、25%を超える見積はさらに営業本部長の承認が必要です。承認前の見積を顧客に提示できないようにしたいと考えています。最も適切な設計はどれですか？", "choices": ["見積オブジェクトに、割引率を条件とする複数ステップの承認プロセスを作成し、承認状況に応じて見積の状況を更新する", "商談に割引率の入力規則を作成し、25%を超える値を保存できないようにする", "価格表を割引率ごとに作成する", "割引率が高い見積をChatterでマネージャーにメンションするよう周知する"], "answer": [0], "explanation": "承認プロセスはステップごとに条件と承認者を設定でき、申請中のレコードはロックされます。承認結果で見積の状況を更新すれば、承認済みの見積だけを提示する運用を仕組みで担保できます。", "choiceNotes": ["条件別の多段承認と状況管理ができるため正解です。", "入力規則では承認の流れを作れず、高い割引を一律禁止してしまいます。", "価格表を増やしても承認の統制にはなりません。", "周知では承認の記録も統制も担保できません。"], "ref": "見積 / 承認プロセス"}, {"id": "SL3-020", "domain": "セールスライフサイクル", "topic": "見積テンプレートとPDF", "q": "営業担当者は、商談から作成した見積を、自社ロゴと標準の取引条件を含む統一書式で顧客に送付したいと考えています。標準機能で最も適切な方法はどれですか？", "choices": ["見積テンプレートを作成し、見積からPDFを生成してメールで送付する", "商談レポートをエクスポートして加工する", "商談の説明欄を印刷して送付する", "価格表をPDFで出力して送付する"], "answer": [0], "explanation": "見積テンプレートでロゴ、項目、明細、条件文などの書式を定義でき、見積からPDFを生成して保存やメール送信が行えます。書式が統一され、送付の記録も残せます。", "choiceNotes": ["標準の見積PDF機能で統一書式を作れるため正解です。", "レポートの加工は手作業が多く、書式の統一も担保されません。", "説明欄は見積明細や条件を含まず、正式な見積書になりません。", "価格表は顧客別の見積内容を表しません。"], "ref": "見積テンプレート / 見積PDFの作成"}, {"id": "SL3-021", "domain": "セールスライフサイクル", "topic": "商談商品の割引上限", "q": "価格交渉で営業担当者が過度に値引きするケースが見られます。会社は、商談商品の明細ごとの割引率が20%を超える入力を防ぎたいと考えています。承認フローは不要です。最も適切な対応はどれですか？", "choices": ["商談商品オブジェクトに、割引が20%を超える場合にエラーとする入力規則を作成する", "商談オブジェクトに金額が下がったらエラーとする入力規則を作成する", "価格表の標準価格を20%下げる", "商品オブジェクトの有効フラグを外す"], "answer": [0], "explanation": "商談商品（OpportunityLineItem）には入力規則を作成でき、明細の割引や販売価格を条件にできます。明細単位でのチェックなので、商品ごとの値引き上限を確実に守らせられます。", "choiceNotes": ["明細ごとの割引上限を強制できるため正解です。", "商談の金額だけでは明細ごとの割引率を判定できません。", "標準価格を下げると定価そのものが変わり、目的と異なります。", "商品を無効にすると販売できなくなります。"], "ref": "商談商品 / 入力規則"}, {"id": "SL3-022", "domain": "セールスライフサイクル", "topic": "CPQ / Revenue Cloud の検討場面", "q": "標準の商品・価格表・見積機能に加えて、CPQ や Revenue Cloud の導入を検討すべき要件はどれですか？（2つ選択してください）", "choices": ["構成ルールのあるバンドル商品を、選択内容に応じて必須品や非互換品を制御しながら見積したい", "契約期間中のサブスクリプションの追加・変更を、日割り計算や契約終了日の統一を行いながら見積したい", "商談に商品と数量を追加して金額を自動計算したい", "見積を1つの商談に複数作成し、1つを同期したい", "通貨ごとに異なる価格表を用意したい"], "answer": [0, 1], "explanation": "商品構成ルール、バンドル、サブスクリプションの変更・更新と日割りといった高度な見積・収益管理は、CPQ や Revenue Cloud が得意とする領域です。単純な商品追加、見積の複数作成と同期、通貨別価格表は標準機能で対応できます。", "choiceNotes": ["構成ルールを伴うバンドル見積は CPQ／Revenue Cloud の代表的な用途のため正解です。", "サブスクリプションの変更と日割り計算は CPQ／Revenue Cloud の検討要件のため正解です。", "商談商品と価格表の標準機能で対応できます。", "見積の複数作成と同期は標準の見積機能です。", "マルチ通貨では価格表エントリを通貨ごとに持てるため標準で対応できます。"], "ref": "Salesforce CPQ / Revenue Cloud の概要"}, {"id": "SL3-023", "domain": "セールスライフサイクル", "topic": "パートナーポータルの構成", "q": "ある企業は代理店経由の販売を拡大するため、代理店の担当者がログインしてリードや商談を参照・更新できるポータルを Experience Cloud で構築したいと考えています。必要な構成はどれですか？（2つ選択してください）", "choices": ["代理店の取引先をパートナー取引先として有効化する", "代理店の担当者に Partner Community（パートナー向け）ライセンスのユーザーを作成する", "代理店の担当者に Customer Community ライセンスのユーザーを作成する", "商談の「パートナー」関連リストに代理店を追加するだけで代理店がログインできるようにする", "代理店の担当者に社内ユーザーと同じ Salesforce ライセンスを付与する"], "answer": [0, 1], "explanation": "パートナーユーザーを作成するには、取引先をパートナーとして有効化し、その取引先責任者からパートナー向けライセンスのユーザーを作成します。パートナー向けライセンスはリードや商談へのアクセスに対応していますが、Customer Community ライセンスは対応していません。", "choiceNotes": ["パートナーユーザー作成の前提となるため正解です。", "リードや商談を扱える外部ユーザーのライセンスのため正解です。", "Customer Community ライセンスではリードや商談を扱えません。", "パートナー関連リストは関係の記録であり、ログイン権限を与えません。", "社外の代理店に社内用ライセンスを付与するのは用途に合いません。"], "ref": "Partner Relationship Management / Experience Cloud ユーザーライセンス"}, {"id": "SL3-024", "domain": "セールスライフサイクル", "topic": "パートナーの取引登録", "q": "代理店から案件情報を受け付ける際、同じ顧客に対して直販と代理店の案件が重複する問題が起きています。チャネルマネージャーは、代理店がポータルで案件を登録し、確認・承認された案件だけを正式な商談として扱いたいと考えています。最も適切な設計はどれですか？", "choices": ["パートナーポータルでの取引登録（ディール登録）レコードを作成させ、承認プロセスでチャネルマネージャーが重複を確認して承認後に商談化する", "代理店にメールで案件を送ってもらい、営業事務が商談を作成する", "認証不要の Web-to-リードフォームで代理店から案件を受け付ける", "代理店に社内ユーザーとしてログインさせ、自由に商談を作成させる"], "answer": [0], "explanation": "取引登録はパートナーが案件を登録し、チャネルマネージャーが承認することで案件の帰属を確定する PRM の代表的なプロセスです。ポータル上で登録するため、パートナーは承認状況を確認でき、重複確認も承認時に行えます。", "choiceNotes": ["登録、承認、商談化の流れを統制できるため正解です。", "手作業で遅延や転記ミスが発生し、パートナーが状況を確認できません。", "認証がないため登録者の特定や状況の共有ができません。", "社外パートナーに社内ユーザーを使わせるのは不適切で、統制もできません。"], "ref": "PRM の取引登録 / 承認プロセス"}, {"id": "SL3-025", "domain": "セールスライフサイクル", "topic": "フェーズ推移の分析", "q": "営業企画部は、商談がどのフェーズからどのフェーズへ移動したか、またフェーズごとの滞留状況を分析し、営業プロセスのボトルネックを特定したいと考えています。最も適切なレポートはどれですか？", "choices": ["「商談履歴」レポートタイプを使い、フェーズの変更前後を分析する", "取引先レポートを取引先種別でグループ化する", "リードレポートを状況でグループ化する", "商品レポートを商品ファミリでグループ化する"], "answer": [0], "explanation": "商談のフェーズ、金額、確度、完了予定日の変更は商談履歴として自動で記録されます。商談履歴のレポートタイプを使えば、フェーズの変更前後や変更日時を分析し、ボトルネックの特定に役立てられます。", "choiceNotes": ["フェーズ変更の履歴を分析できるため正解です。", "取引先の分類では商談のフェーズ推移は分かりません。", "リードの状況は商談化前のプロセスで、商談フェーズの分析にはなりません。", "商品ファミリの集計ではフェーズ推移は分かりません。"], "ref": "商談履歴レポート / 商談のステージ履歴"}, {"id": "PA-001", "domain": "Agentforce Sales の実践的な応用", "topic": "動的フォーム", "q": "ある製造業の企業では、商談レコードページに項目が多すぎて営業担当者が必要な情報を見つけにくいという不満が出ている。特に「失注理由」セクションは、フェーズが「完了（失注）」のときだけ表示し、その際は「失注理由」項目の入力を画面上で必須にしたい。コンサルタントが動的フォームで実現できることとして推奨すべきものはどれか？（2つ選択してください）", "choices": ["項目またはセクションに表示ルールを設定し、フェーズの値に応じて表示・非表示を切り替える", "項目レベルセキュリティで参照権限のないユーザーにも、表示ルールを満たせば項目を表示させる", "動的フォームを有効にすると、商談の全項目の変更履歴が自動的に記録される", "Lightning アプリケーションビルダーで、ページ上の項目を「必須」として設定する", "動的フォームの設定を Salesforce Classic のページレイアウトにも自動反映する"], "answer": [0, 3], "explanation": "動的フォームでは、項目やセクションを Lightning レコードページ上に個別に配置し、項目値などの条件で表示ルールを設定できる。また、ページ上の項目をUIレベルで必須に設定することもできる。ただし項目レベルセキュリティを上書きすることはなく、Lightning Experience 専用の機能である。", "choiceNotes": ["正しい。表示ルールでフェーズの値に応じた表示制御ができる。", "誤り。表示ルールは項目レベルセキュリティを上書きしない。", "誤り。変更履歴は項目履歴管理の機能であり、動的フォームとは無関係。", "正しい。動的フォームでは項目のプロパティでページ上の必須設定ができる。", "誤り。動的フォームは Lightning Experience の機能で、Classic には反映されない。"], "ref": "動的フォーム（Dynamic Forms）／Lightning アプリケーションビルダー"}, {"id": "PA-002", "domain": "Agentforce Sales の実践的な応用", "topic": "パス", "q": "あるソフトウェア企業では、新人営業担当者が商談の各フェーズで何を入力し、何を実施すべきか分からず、フェーズを進める際に重要な情報が抜け落ちている。営業部長は、レコード画面上でフェーズごとに入力すべき項目とヒントを示したいと考えている。コンサルタントは何を推奨すべきか？", "choices": ["フェーズごとに別々のレコードタイプとページレイアウトを作成する", "商談のパスを設定し、フェーズごとに主要項目と「成功のためのガイダンス」を設定する", "フェーズが変わるたびに Chatter 投稿でガイダンスを送信するフローを作成する", "商談の入力規則で、フェーズごとの手順を記載したエラーメッセージを表示する"], "answer": [1], "explanation": "パスは選択リスト（商談のフェーズなど）の各段階を視覚的に表示し、段階ごとに主要項目と成功のためのガイダンスを提示できる。レコード画面上で直接入力でき、新人の行動を誘導するのに最適である。", "choiceNotes": ["誤り。フェーズごとにレコードタイプを分けると管理が複雑になり、ガイダンス表示もできない。", "正しい。パスの主要項目とガイダンスが要件を直接満たす。", "誤り。フィードへの投稿は画面上で入力すべき項目を示す手段として不適切。", "誤り。入力規則は保存時のエラーであり、事前のガイダンスにはならない。"], "ref": "パスのガイダンス（Path）／Trailhead: Lightning Experience のカスタマイズ"}, {"id": "PA-003", "domain": "Agentforce Sales の実践的な応用", "topic": "営業コンソール", "q": "ある企業のインサイドセールスチームは、1日に多数の商談とリードを処理する。担当者はリストビューとレコード詳細を行き来するたびにページを切り替える必要があり、生産性が落ちていると訴えている。コンサルタントは何を推奨すべきか？", "choices": ["標準ナビゲーションの Sales アプリケーションにタブを追加する", "すべてのリストビューを Kanban 表示に切り替える", "コンソールナビゲーションの営業コンソールアプリケーションを使用し、分割ビューとワークスペースタブで作業させる", "レコードページをすべて1列レイアウトに変更する"], "answer": [2], "explanation": "コンソールナビゲーションのアプリケーション（営業コンソール）では、分割ビューでリストを表示したまま、ワークスペースタブ・サブタブで複数レコードを並行して開ける。ユーティリティバーも利用でき、大量のレコードを扱う担当者に適している。", "choiceNotes": ["誤り。タブを追加するだけでは、リストとレコードを行き来する画面切り替えは減らない。", "誤り。Kanban は視覚化には有効だが、画面切り替えの問題は解決しない。", "正しい。分割ビューとタブにより画面遷移を減らせる。", "誤り。レイアウト変更はページ切り替えの問題を解決しない。"], "ref": "Lightning コンソールアプリケーション／営業コンソール"}, {"id": "PA-004", "domain": "Agentforce Sales の実践的な応用", "topic": "モバイルのクイックアクション", "q": "ある医療機器メーカーの外勤営業担当者は、顧客訪問直後にスマートフォンから訪問結果を記録したいが、入力項目が多く記録が後回しになっている。営業部長は、取引先から数タップで通話・訪問の記録を残せるようにしたい。コンサルタントは何を推奨すべきか？", "choices": ["必要最小限の項目と事前定義値を持つ取引先のオブジェクト固有のクイックアクション（活動の記録）を作成し、ページレイアウトの「Salesforce モバイルおよび Lightning Experience のアクション」セクションに追加する", "モバイル専用のカスタムオブジェクトを作成し、夜間バッチで ToDo に変換する", "取引先のページレイアウトからすべての項目を削除し、活動関連リストだけを残す", "担当者にメールで訪問結果を送らせ、事務担当者が Salesforce に転記する"], "answer": [0], "explanation": "オブジェクト固有のクイックアクションは、親レコードとの関連付けが自動で行われ、項目を絞り込み事前定義値も設定できる。ページレイアウトのモバイル／Lightning アクションセクションに追加すると、Salesforce モバイルアプリのアクションバーから利用できる。", "choiceNotes": ["正しい。入力負荷を減らし、モバイルから素早く記録できる。", "誤り。不要なカスタム開発で、データ整合性も損なう。", "誤り。取引先情報が見られなくなり、記録の簡素化にもならない。", "誤り。二重入力が発生し、リアルタイム性も失われる。"], "ref": "クイックアクション（オブジェクト固有のアクション）／Salesforce モバイルアプリのアクションバー"}, {"id": "PA-005", "domain": "Agentforce Sales の実践的な応用", "topic": "モバイルのオフライン", "q": "ある建材メーカーの営業担当者は、電波の届きにくい建設現場で、担当する取引先と未完了の商談を Salesforce モバイルアプリで参照したいと考えている。管理者は、オフラインで利用できるレコードをユーザーごとに適切に絞り込みたい。コンサルタントは何を推奨すべきか？", "choices": ["すべての営業担当者に毎朝レポートを PDF でダウンロードさせる", "モバイルアプリの代わりにモバイルブラウザで Salesforce を利用させる", "取引先と商談の共有設定を「公開/参照・更新可能」に変更する", "ブリーフケースビルダーで、オフライン用にプライミングする取引先と商談の条件を定義する"], "answer": [3], "explanation": "ブリーフケースビルダーを使うと、オフラインで利用するレコードをオブジェクトと条件（所有者、未完了など）で定義し、Salesforce モバイルアプリに事前に読み込ませることができる。これにより、ユーザーごとに必要なレコードだけを効率よくオフライン利用できる。", "choiceNotes": ["誤り。静的なファイルで、更新や操作ができない。", "誤り。ブラウザはオフラインでのレコード参照に対応しない。", "誤り。共有設定の変更はオフライン利用とは無関係で、セキュリティを弱める。", "正しい。ブリーフケースでオフライン対象レコードを定義できる。"], "ref": "ブリーフケースビルダー／Salesforce モバイルアプリのオフラインアクセス"}, {"id": "PA-006", "domain": "Agentforce Sales の実践的な応用", "topic": "Einstein 活動キャプチャ", "q": "ある企業では、営業担当者が Microsoft 365 のメールと予定を Salesforce に手作業で記録する手間を減らすため、Einstein 活動キャプチャの導入を検討している。コンサルタントが導入前に説明すべき内容はどれか？（2つ選択してください）", "choices": ["Einstein 活動キャプチャを有効にすると、営業担当者は Outlook から1通ずつ手動でメールを記録する操作が必須になる", "社内メールや指定したメールアドレス・ドメインをキャプチャ対象から除外するなど、取り込むメールを制御できる", "Einstein 活動キャプチャを有効にすると、Salesforce 上の過去の ToDo がすべて外部に移行される", "Einstein 活動キャプチャは Salesforce モバイルアプリでは一切表示されない", "行動（カレンダーの予定）を外部カレンダーと Salesforce の間で同期できる"], "answer": [1, 4], "explanation": "Einstein 活動キャプチャは、接続したメール・カレンダーのアカウントからメールや予定を自動で取り込み、活動タイムラインに表示する機能である。社内メールや特定のアドレス・ドメインを除外するなど、キャプチャ対象を制御できる点はプライバシーの観点から導入前に説明すべきである。また、行動（予定）の同期機能では、外部カレンダーと Salesforce の行動レコードを同期できる。なお、メールを Salesforce のレコードとして保存してレポート等で利用するかどうかは「Sync Email as Salesforce Activity」の設定に依存する。", "choiceNotes": ["誤り。活動キャプチャはメールを自動で取り込む機能であり、手動での記録は不要。", "正しい。除外設定などで取り込み対象を制御できることは重要な説明事項。", "誤り。既存の ToDo が移行されることはない。", "誤り。キャプチャされた活動はモバイルアプリの活動タイムラインでも参照できる。", "正しい。行動の同期により予定を Salesforce の行動として扱える。"], "ref": "Einstein 活動キャプチャの設定と考慮事項／Sync Email as Salesforce Activity／活動タイムライン"}, {"id": "PA-007", "domain": "Agentforce Sales の実践的な応用", "topic": "Outlook 連携", "q": "ある商社の営業担当者は Outlook を主に使用している。営業部長は、重要な顧客とのメールだけを担当者の判断で Salesforce の取引先責任者や商談に記録させ、記録したメールを Salesforce のレコードとしてレポートでも確認したいと考えている。コンサルタントは何を推奨すべきか？", "choices": ["すべてのメールを自動で取り込む Einstein 活動キャプチャのみを有効にする", "Outlook 連携を設定し、Outlook 上の Salesforce パネルからメールを関連レコードに記録させる", "Outlook のルールで、すべてのメールを営業部長に転送させる", "メール本文をコピーして Chatter に投稿させる"], "answer": [1], "explanation": "Outlook 連携を使うと、Outlook の受信トレイから Salesforce の関連レコードを参照し、選択したメールを Salesforce のレコードに記録できる。記録したメールは Salesforce 上のレコードとして保存されるため、レポートでも扱える。", "choiceNotes": ["誤り。活動キャプチャは条件に合うメールを自動で取り込む仕組みであり、担当者が重要なメールだけを選んで記録するという要件に合わない。", "正しい。担当者が選んだメールを Salesforce レコードとして記録できる。", "誤り。Salesforce への記録にならず、情報管理上も問題がある。", "誤り。メールが活動として関連付けられず、レポートにも適さない。"], "ref": "Outlook 連携（Outlook Integration）／メールの記録"}, {"id": "PA-008", "domain": "Agentforce Sales の実践的な応用", "topic": "ToDo と行動", "q": "ある企業の営業担当者は、来週火曜日 14時〜15時に顧客と打ち合わせを予定した。この予定を Salesforce のカレンダーに表示し、商談に関連付けて管理したい。コンサルタントはどの活動を使用するよう推奨すべきか？", "choices": ["開始日時と終了日時を指定した行動（Event）を商談に関連付けて作成する", "期日のみを持つ ToDo（Task）を商談に関連付けて作成する", "商談に Chatter 投稿を作成し、日時を本文に記載する", "商談のメモにスケジュールを記載する"], "answer": [0], "explanation": "日時が決まった会議や訪問は行動（Event）として登録すると、開始・終了日時を持ちカレンダーに表示される。ToDo は期日を持つ作業項目であり、時間帯を占有する予定の管理には行動が適している。", "choiceNotes": ["正しい。時間帯のある予定は行動で管理する。", "誤り。ToDo は期日ベースで、カレンダーの時間帯として表示されない。", "誤り。Chatter 投稿は予定管理に使えない。", "誤り。メモではカレンダー表示やリマインドができない。"], "ref": "行動と ToDo（活動の管理）／Salesforce カレンダー"}, {"id": "PA-009", "domain": "Agentforce Sales の実践的な応用", "topic": "Sales Engagement（ケイデンス）", "q": "ある SaaS 企業のインサイドセールス部門は、新規リードに対して「メール送信→2日後に電話→電話がつながらなければ再度メール」といった一連のアプローチを標準化したい。担当者には毎日次に行うべき作業を一覧で示したい。コンサルタントが Sales Engagement について説明すべき内容はどれか？（2つ選択してください）", "choices": ["ケイデンスでは、通話結果などに応じて次のステップを分岐させることができる", "ケイデンスの対象にできるのは取引先レコードのみである", "作業キューに、担当者が実行すべきケイデンスの次のステップが表示される", "ケイデンスからメールを送信するには Marketing Cloud のライセンスが必須である", "ケイデンスの実行結果は Salesforce のレポートで分析できない"], "answer": [0, 2], "explanation": "Sales Engagement のケイデンスは、メール・電話・カスタムステップなどを順序立てて定義し、通話結果やメールの反応に基づく分岐を設定できる。担当者は作業キューから次に実行すべきステップを確認して作業する。", "choiceNotes": ["正しい。分岐ステップで通話結果などに応じた流れを作れる。", "誤り。リードや取引先責任者などもケイデンスの対象にできる。", "正しい。作業キューが担当者の日々の作業リストになる。", "誤り。ケイデンスのメールは Sales Engagement の機能で送信でき、Marketing Cloud は不要。", "誤り。ケイデンスの活動や結果はレポートで分析できる。"], "ref": "Sales Engagement のケイデンス／作業キュー"}, {"id": "PA-010", "domain": "Agentforce Sales の実践的な応用", "topic": "パイプラインインスペクション", "q": "ある企業の営業マネージャーは、週次の商談レビューで「今週、完了予定日が延期された商談」や「金額が変化した商談」を素早く把握し、チームのパイプライン全体の変化を確認したいと考えている。コンサルタントは何を推奨すべきか？", "choices": ["商談の項目履歴管理を有効にし、各商談の履歴関連リストを1件ずつ確認させる", "毎週月曜日に全商談をエクスポートして、スプレッドシートで前週と比較させる", "パイプラインインスペクションを有効にし、期間内の金額や完了予定日などの変化をハイライト表示で確認させる", "商談のリストビューを完了予定日順に並べ替えて確認させる"], "answer": [2], "explanation": "パイプラインインスペクションは、パイプラインの主要指標と、指定期間内の商談の変化（金額、完了予定日、フェーズなど）を一覧でハイライト表示する。マネージャーは個々のレコードを開かずにパイプライン全体の動きを把握できる。", "choiceNotes": ["誤り。1件ずつの確認では非効率で、全体把握に向かない。", "誤り。手作業が多く、即時性もない。", "正しい。期間内の変化を一覧で可視化できる。", "誤り。現在の値は見えるが、変化が分からない。"], "ref": "パイプラインインスペクション（Pipeline Inspection）"}, {"id": "PA-011", "domain": "Agentforce Sales の実践的な応用", "topic": "商談の重要な変更（項目履歴）", "q": "ある企業では、商談のカスタム項目「主要競合」が誰によっていつ変更されたかを監査目的で記録し、商談レコード上で確認したいと考えている。フェーズや金額の変化はすでに標準のフェーズ履歴で確認できている。コンサルタントは何を推奨すべきか？", "choices": ["「主要競合」の変更時に新しい ToDo を作成するフローを作成する", "商談の履歴トレンドレポートを作成する", "「主要競合」を数式項目に変更する", "商談の項目履歴管理を有効にし、「主要競合」を追跡対象に追加して、商談の項目履歴関連リストをページに配置する"], "answer": [3], "explanation": "項目履歴管理を有効にすると、追跡対象項目の変更について、変更者・日時・旧値・新値が記録され、項目履歴関連リストで確認できる。標準のフェーズ履歴は金額やフェーズなど一部の項目のみを対象とするため、カスタム項目には項目履歴管理が必要である。", "choiceNotes": ["誤り。旧値・新値の監査記録として不十分で、不要なレコードが増える。", "誤り。履歴トレンドは期間比較の分析用で、恒常的な監査証跡には適さない。", "誤り。数式項目にすると入力自体ができなくなる。", "正しい。項目履歴管理が監査要件を満たす。"], "ref": "項目履歴管理／商談のフェーズ履歴"}, {"id": "PA-012", "domain": "Agentforce Sales の実践的な応用", "topic": "Chatter フィード追跡", "q": "ある企業の営業部長は、関心のある大型商談をフォローし、その商談のフェーズが変更されたときに自分の Chatter フィードで変更を把握したいと考えている。コンサルタントは何を推奨すべきか？", "choices": ["商談のフェーズが変わるたびに営業部長へメールを送信する承認プロセスを作成する", "商談のフィード追跡を有効にし、「フェーズ」項目を追跡対象にしたうえで、営業部長に対象商談をフォローさせる", "営業部長を商談の所有者に変更する", "商談のページレイアウトに「フェーズ」項目を追加する"], "answer": [1], "explanation": "フィード追跡を有効にして項目を追跡対象にすると、その項目の変更がレコードのフィードに投稿される。レコードをフォローしているユーザーは、自分のフィードでその変更を確認できる。", "choiceNotes": ["誤り。承認プロセスは承認のための仕組みで、変更通知目的には不適切。", "正しい。フィード追跡とフォローで変更を把握できる。", "誤り。所有者変更は業務上不適切で、通知の仕組みにもならない。", "誤り。ページへの項目追加だけでは変更の通知はされない。"], "ref": "フィード追跡のカスタマイズ／Chatter でのレコードのフォロー"}, {"id": "PA-013", "domain": "Agentforce Sales の実践的な応用", "topic": "個人取引先", "q": "ある自動車販売会社は、法人顧客に加えて個人顧客への販売を Salesforce で管理するため、個人取引先の有効化を検討している。コンサルタントが有効化の前に説明すべき考慮事項はどれか？（2つ選択してください）", "choices": ["個人取引先を有効にすると、取引先責任者オブジェクトが削除される", "個人取引先は商談やケースに関連付けることができない", "有効化には、取引先責任者の組織の共有設定が「親レコードに連動」である必要がある", "個人取引先は一度有効にすると無効にできない", "個人取引先を有効にすると、既存の法人取引先がすべて個人取引先に変換される"], "answer": [2, 3], "explanation": "個人取引先は一度有効化すると無効にできないため、慎重な判断が必要である。また、有効化の前提として取引先責任者の組織の共有設定を「親レコードに連動」にしておく必要がある。法人取引先と個人取引先は並行して利用できる。", "choiceNotes": ["誤り。取引先責任者オブジェクトは引き続き利用できる。", "誤り。個人取引先も商談やケースに関連付けられる。", "正しい。取引先責任者の共有設定が「親レコードに連動」であることが前提条件。", "正しい。有効化は元に戻せない。", "誤り。既存の法人取引先は自動変換されない。"], "ref": "個人取引先の有効化に関する考慮事項"}, {"id": "PA-014", "domain": "Agentforce Sales の実践的な応用", "topic": "取引先責任者と複数取引先の関連付け", "q": "あるコンサルティング会社では、顧客企業の担当者が子会社の取締役を兼務しているなど、1人の取引先責任者が複数の取引先と関係を持つケースが多い。取引先責任者レコードを重複作成せずに管理したい。コンサルタントが「取引先責任者と複数取引先の関連付け」について説明すべき内容はどれか？（2つ選択してください）", "choices": ["関連付けを追加するたびに、取引先責任者レコードが取引先ごとに複製される", "取引先責任者は主取引先とは別に、他の取引先と間接的な関係を持つことができる", "間接的な取引先を追加すると、取引先責任者の所有者が自動的に変更される", "この機能は Salesforce Classic でのみ利用できる", "取引先と取引先責任者の関係ごとに役割などの情報を記録できる"], "answer": [1, 4], "explanation": "取引先責任者と複数取引先の関連付けを有効にすると、取引先責任者は主取引先（直接の関係）に加えて他の取引先と間接的な関係を持てる。関係は取引先責任者リレーションレコードとして管理され、役割などを記録できるため、重複レコードを作らずに済む。", "choiceNotes": ["誤り。レコードは複製されず、1件の取引先責任者を関連付ける。", "正しい。間接的な関係で複数の取引先と関連付けられる。", "誤り。所有者は変更されない。", "誤り。Lightning Experience でも利用できる。", "正しい。リレーションごとに役割などを設定できる。"], "ref": "取引先責任者と複数取引先の関連付け（取引先責任者リレーション）"}, {"id": "PA-015", "domain": "Agentforce Sales の実践的な応用", "topic": "取引先階層", "q": "ある企業の顧客には、持株会社の下に複数の事業会社や地域法人を持つグループ企業がある。営業部長は、グループ全体の親子関係を Salesforce 上で一目で確認したいと考えている。コンサルタントは何を推奨すべきか？", "choices": ["各取引先の「親取引先」項目を設定し、取引先階層の表示を利用する", "グループ企業ごとに別のレコードタイプを作成する", "グループ会社名をテキスト項目に入力し、リストビューで並べ替える", "持株会社の取引先責任者として各事業会社を登録する"], "answer": [0], "explanation": "取引先の「親取引先」項目で親子関係を設定すると、取引先階層を表示してグループ全体の構造を確認できる。標準機能で実現でき、追加開発は不要である。", "choiceNotes": ["正しい。親取引先と階層表示が標準の解決策。", "誤り。レコードタイプは業務プロセスの違いを表すもので、親子関係は表せない。", "誤り。テキスト項目では階層構造を表現できない。", "誤り。取引先責任者は人を表すオブジェクトで、会社の階層には使えない。"], "ref": "取引先階層の表示／親取引先"}, {"id": "PA-016", "domain": "Agentforce Sales の実践的な応用", "topic": "パートナー", "q": "あるIT機器メーカーは、販売代理店が関与した商談について、どの代理店がどの役割（再販業者、システムインテグレーターなど）で関わったかを記録したい。現時点では代理店に Salesforce へのアクセス権を付与する予定はない。コンサルタントは何を推奨すべきか？", "choices": ["パートナーポータルとして Experience Cloud サイトを構築し、代理店ユーザーを作成する", "代理店ごとに商談のレコードタイプを作成する", "代理店を取引先として登録し、商談の「パートナー」関連リストでパートナーの役割とともに関連付ける", "商談の説明欄に代理店名を記入させる"], "answer": [2], "explanation": "商談の「パートナー」関連リストを使うと、取引先として登録した代理店を、パートナーの役割（設定で定義）とともに商談に関連付けられる。代理店にログインさせる必要がないため、Experience Cloud サイトは不要である。", "choiceNotes": ["誤り。代理店のアクセスが不要なため過剰な構成である。", "誤り。代理店ごとのレコードタイプは管理が破綻する。", "正しい。パートナー関連リストと役割で要件を満たす。", "誤り。構造化されず、レポートでも分析しにくい。"], "ref": "パートナー（パートナーの役割）／商談のパートナー関連リスト"}, {"id": "PA-017", "domain": "Agentforce Sales の実践的な応用", "topic": "承認プロセス", "q": "ある企業では、値引率が20%を超える商談について、営業担当者の上司の承認を必須にしたい。承認待ちの間は商談が編集されないようにし、承認されたら商談の「承認ステータス」項目を自動で更新したい。コンサルタントは何を推奨すべきか？", "choices": ["値引率が20%を超える場合に保存をエラーにする入力規則を作成する", "値引率が20%を超えたら上司に Chatter で通知するフローを作成する", "商談の共有ルールで上司に参照・更新権限を付与する", "値引率が20%を超える商談を対象とする承認プロセスを作成し、承認者に上司（マネージャー項目）を指定して、申請時のロックと承認時の項目自動更新を設定する"], "answer": [3], "explanation": "承認プロセスでは開始条件、承認者（ユーザーのマネージャー項目など）、申請時のレコードロック、承認・却下時の項目自動更新などのアクションを定義できる。承認待ちの編集防止と承認後のステータス更新という要件を標準機能で満たせる。", "choiceNotes": ["誤り。保存できなくなるだけで、承認の仕組みにはならない。", "誤り。通知だけでは承認の記録やレコードロックができない。", "誤り。共有設定は承認の仕組みではない。", "正しい。承認プロセスで条件・承認者・ロック・自動更新を設定できる。"], "ref": "承認プロセス／承認アクション（項目自動更新）"}, {"id": "PA-018", "domain": "Agentforce Sales の実践的な応用", "topic": "フロー自動化", "q": "ある企業では、商談が「完了（成立）」になったときに、商談所有者に対して「導入後フォローの連絡」という ToDo を自動作成したいと考えている。新しい自動化はすべて推奨されるツールで構築する方針である。コンサルタントは何を推奨すべきか？", "choices": ["ワークフロールールを作成し、ToDo アクションを設定する", "商談のレコードトリガーフロー（保存後）を作成し、フェーズが「完了（成立）」に変更された場合に ToDo レコードを作成する", "承認プロセスを作成し、承認時に ToDo を作成する", "営業担当者に手作業で ToDo を作成するよう周知する"], "answer": [1], "explanation": "レコードトリガーフローは、レコードの作成・更新時に条件を評価し、関連レコードの作成などを自動実行できる。他のレコード（ToDo）の作成には保存後フローを使う。ワークフロールールとプロセスビルダーは2025年12月31日でサポートが終了しており、新規の自動化にはフローを使用する。", "choiceNotes": ["誤り。ワークフロールールはサポートが終了しており、新規の自動化には使用しない。", "正しい。保存後のレコードトリガーフローで ToDo を作成できる。", "誤り。承認は不要な業務であり、手順が増えるだけである。", "誤り。自動化の要件を満たさない。"], "ref": "レコードトリガーフロー／フロービルダー"}, {"id": "PA-019", "domain": "Agentforce Sales の実践的な応用", "topic": "レポートタイプとクロス条件", "q": "ある企業の営業部長は、過去1年間に商談が1件も作成されていない取引先の一覧を作成し、休眠顧客の掘り起こしに使いたいと考えている。コンサルタントは何を推奨すべきか？", "choices": ["「取引先と商談」の標準レポートタイプでレポートを作成し、商談金額が0の行を抽出する", "商談レポートを作成し、取引先名でグループ化する", "取引先レポートを作成し、「商談なしの取引先」のクロス条件に作成日が過去1年間のサブ条件を設定する", "取引先のリストビューで「最終活動日」を並べ替える"], "answer": [2], "explanation": "クロス条件を使うと、関連オブジェクトのレコードが存在する／しない取引先を抽出できる。「商談なしの取引先」に作成日のサブ条件を加えることで、過去1年間に商談がない取引先を抽出できる。「取引先と商談」レポートタイプは商談を持つ取引先しか含まないため使えない。", "choiceNotes": ["誤り。このレポートタイプは商談のない取引先を含まない。", "誤り。商談レポートには商談のない取引先が現れない。", "正しい。クロス条件（without）とサブ条件で要件を満たす。", "誤り。最終活動日は商談の有無を表さない。"], "ref": "レポートのクロス条件／カスタムレポートタイプ（A と B の関連の有無）"}, {"id": "PA-020", "domain": "Agentforce Sales の実践的な応用", "topic": "バケット項目", "q": "ある企業の営業企画担当者は、商談を金額に応じて「小規模（100万円未満）」「中規模（100万〜1,000万円）」「大規模（1,000万円以上）」に分類し、レポートでグループ化したい。この分類は一時的な分析用であり、新しい項目は作成したくない。コンサルタントは何を推奨すべきか？", "choices": ["レポートにバケット項目を作成し、金額の範囲ごとに分類する", "商談に選択リスト項目を追加し、営業担当者に手入力させる", "商談に数式項目を作成して分類する", "金額ごとに別々のレポートを3つ作成する"], "answer": [0], "explanation": "バケット項目は、レポート内でのみ使用する分類を作成する機能で、数値の範囲や選択リスト値などをグループに分けられる。オブジェクトに項目を追加せずに分類・グループ化できるため、一時的な分析に適している。", "choiceNotes": ["正しい。項目を追加せずにレポート内で分類できる。", "誤り。項目追加が必要で、手入力による誤りも生じる。", "誤り。オブジェクトに新しい項目を作成することになる。", "誤り。分類ごとの比較が1つのレポートでできない。"], "ref": "バケット項目／レポートビルダー"}, {"id": "PA-021", "domain": "Agentforce Sales の実践的な応用", "topic": "結合レポート", "q": "あるソフトウェア企業のアカウントマネージャーは、主要取引先ごとに「進行中の商談」と「未解決のケース」を1つのレポートで並べて確認し、更新提案のリスクを把握したいと考えている。コンサルタントは何を推奨すべきか？", "choices": ["商談レポートにケースの数式項目を追加する", "ケースレポートと商談レポートを別々に作成し、メールで送付する", "取引先にケース数のカスタム項目を作成し、商談レポートに表示する", "商談とケースの2つのブロックを持つ結合レポートを作成し、取引先でグループ化する"], "answer": [3], "explanation": "結合レポートでは、異なるレポートタイプのブロックを1つのレポートにまとめ、共通の項目（取引先など）でグループ化して表示できる。商談とケースのように別オブジェクトのデータを取引先単位で並べて比較するのに適している。", "choiceNotes": ["誤り。レポートの数式で別オブジェクトのケースを集計することはできない。", "誤り。1つのビューで比較する要件を満たさない。", "誤り。項目追加と集計の仕組みが必要で、詳細も確認できない。", "正しい。結合レポートで複数ブロックを共通項目でグループ化できる。"], "ref": "結合レポート（Joined Reports）"}, {"id": "PA-022", "domain": "Agentforce Sales の実践的な応用", "topic": "履歴トレンドレポート", "q": "ある企業の営業部長は、四半期のパイプラインが数週間前と比べて金額や完了予定日の面でどう変化したかを、日付を指定して比較したいと考えている。コンサルタントは何を推奨すべきか？", "choices": ["商談のフェーズ履歴を毎日エクスポートする", "レポートスナップショットを作成し、今日以降の変化だけを分析する", "商談の履歴トレンドを有効にし、金額と完了予定日を追跡対象にして履歴トレンドレポートを作成する", "商談のリストビューで「最終更新日」を表示する"], "answer": [2], "explanation": "履歴トレンドレポートは、指定した日付時点の値と現在の値を比較し、項目値の変化を分析できる。商談で有効にして金額や完了予定日を追跡対象に選択すると、パイプラインの推移を日付ごとに比較できる。", "choiceNotes": ["誤り。手作業が多く、比較レポートも作れない。", "誤り。スナップショットは設定後のデータしか蓄積されず、柔軟な日付比較の用途には履歴トレンドが適する。", "正しい。履歴トレンドで日付ごとの値を比較できる。", "誤り。最終更新日では何がどう変わったか分からない。"], "ref": "履歴トレンドレポート（Historical Trend Reporting）"}, {"id": "PA-023", "domain": "Agentforce Sales の実践的な応用", "topic": "動的ダッシュボード", "q": "ある企業には50名の営業担当者がおり、各担当者が自分の商談だけを表示するダッシュボードを見たいと考えている。管理者は担当者ごとにダッシュボードを作成・保守することを避けたい。コンサルタントは何を推奨すべきか？", "choices": ["担当者ごとにダッシュボードをコピーし、所有者条件を設定する", "ダッシュボードの実行ユーザーを「ダッシュボードを表示するユーザー」に設定した動的ダッシュボードを作成する", "実行ユーザーを営業部長に固定したダッシュボードを全員に共有する", "すべての担当者にシステム管理者プロファイルを付与する"], "answer": [1], "explanation": "動的ダッシュボードでは、閲覧するユーザーの権限と共有設定でデータが表示されるため、1つのダッシュボードで各担当者に自分のデータを表示できる。担当者ごとのダッシュボード作成や保守が不要になる。", "choiceNotes": ["誤り。50個のダッシュボードの保守が必要になる。", "正しい。閲覧ユーザーとして実行することで各自のデータが表示される。", "誤り。営業部長の権限で表示されるため、他者のデータも見えてしまう。", "誤り。重大なセキュリティ上の問題がある。"], "ref": "動的ダッシュボード（ダッシュボードの実行ユーザー）"}, {"id": "PA-024", "domain": "Agentforce Sales の実践的な応用", "topic": "ダッシュボードコンポーネント", "q": "ある企業の営業部長は、チームの当四半期の成立金額が目標額に対してどこまで達しているかを、赤・黄・緑の範囲で一目で分かるように表示したい。コンサルタントはどのダッシュボードコンポーネントを推奨すべきか？", "choices": ["目標値とブレークポイントを設定したゲージ", "担当者別の積み上げ縦棒グラフ", "商談の全項目を表示した明細テーブル", "フェーズ別の散布図"], "answer": [0], "explanation": "ゲージは単一の値が目標に対してどの位置にあるかを示すコンポーネントで、範囲ごとに色（例：赤・黄・緑）を設定できる。目標達成状況を一目で把握する用途に最適である。", "choiceNotes": ["正しい。ゲージは目標に対する進捗表示に適している。", "誤り。内訳の比較には有効だが、目標達成度を直感的に示しにくい。", "誤り。詳細データの表示であり、一目での把握には向かない。", "誤り。2つの数値の相関を見るもので、目標進捗には不適切。"], "ref": "ダッシュボードコンポーネントの種類（ゲージ）"}, {"id": "PA-025", "domain": "Agentforce Sales の実践的な応用", "topic": "Lightning レコードページの割り当て", "q": "ある企業では、営業担当者と営業事務担当者が同じ商談オブジェクトを使用しているが、営業事務担当者には請求関連のコンポーネントを中心にした別の商談レコードページを表示したい。両者は同じ Sales アプリケーションを使用し、プロファイルは異なる。コンサルタントは何を推奨すべきか？", "choices": ["営業事務担当者用に別の商談オブジェクトをカスタムオブジェクトとして作成する", "営業事務担当者のみ Salesforce Classic を使用させる", "ページレイアウトの割り当てだけを変更し、Lightning レコードページは共通のままにする", "営業事務用の Lightning レコードページを作成し、アプリケーション・レコードタイプ・プロファイルの組み合わせで営業事務担当者のプロファイルに割り当てる"], "answer": [3], "explanation": "Lightning レコードページは、組織のデフォルト、アプリケーションのデフォルト、アプリケーション・レコードタイプ・プロファイルの組み合わせで割り当てられる。これにより、同じアプリケーション内でもプロファイルごとに異なるページ構成を表示できる。", "choiceNotes": ["誤り。データが分断され、不要な複雑さが生じる。", "誤り。Lightning の機能が使えず、方針に反する。", "誤り。ページレイアウトだけではコンポーネント構成を変えられない。", "正しい。プロファイル単位でレコードページを割り当てられる。"], "ref": "Lightning レコードページの有効化と割り当て"}, {"id": "PA-026", "domain": "Agentforce Sales の実践的な応用", "topic": "ゲーミフィケーション（リーダーボード）", "q": "ある企業の営業部長は、営業担当者の競争意識を高めるため、当月の成立金額の上位10名をランキング形式で表示するリーダーボードを営業部のホームページに表示したいと考えている。コンサルタントは何を推奨すべきか？", "choices": ["各担当者の成立金額を毎月手作業で Chatter に投稿する", "成立金額の上位10名を表示する入力規則を作成する", "当月の成立商談を所有者でグループ化したレポートを元に、金額の降順・最大10件で表示するダッシュボードコンポーネントを作成し、ホームページに配置する", "担当者ごとに個別のダッシュボードを作成する"], "answer": [2], "explanation": "所有者別に成立金額を集計したレポートを元に、降順の並べ替えと表示件数の上限を設定したダッシュボードコンポーネント（横棒グラフや表など）を作成すると、リーダーボードとして利用できる。ダッシュボードはホームページに配置して常に確認できる。", "choiceNotes": ["誤り。手作業で鮮度も低く、継続運用に向かない。", "誤り。入力規則はデータ検証の機能で、表示には使えない。", "正しい。並べ替えと件数上限を設定したコンポーネントでランキングを表示できる。", "誤り。ランキング比較にならず、保守負荷も大きい。"], "ref": "ダッシュボードコンポーネントの並べ替えと表示件数／Lightning ホームページのカスタマイズ"}, {"id": "PA2-001", "domain": "Agentforce Sales の実践的な応用", "topic": "クロス条件（without）", "q": "営業部長は「過去12か月に商談が1件も作成されていない取引先」の一覧を求めています。標準の取引先レポートタイプを使い、管理者が最小の手間で実現する方法はどれですか？", "choices": ["取引先レポートに商談の作成日を条件とする標準の検索条件を追加する", "「商談のない取引先」のクロス条件を追加し、その副条件に作成日が過去12か月を指定する", "「取引先と商談」のカスタムレポートタイプを作成し、商談の金額が0の行を抽出する", "取引先に商談件数の積み上げ集計項目を作成し、0件のレコードを抽出する"], "answer": [1], "explanation": "クロス条件の「without（～のない）」を使うと、関連レコードを持たない親レコードを抽出できます。副条件で作成日を絞り込めば「過去12か月に商談のない取引先」になります。レポート上の設定のみで完結するため最小の手間です。", "choiceNotes": ["通常の検索条件は商談を持つ行しか対象にできず、商談のない取引先は抽出できない。", "without クロス条件と副条件の組み合わせで要件どおりに抽出できる。", "with 関係のレポートタイプでは商談のない取引先は行として現れない。", "積み上げ集計項目の追加が必要で最小の手間ではなく、「過去12か月」のような相対的な期間での集計にも向かない。"], "ref": "レポートのクロス条件 / Filter Reports Using Cross Filters"}, {"id": "PA2-002", "domain": "Agentforce Sales の実践的な応用", "topic": "カスタムレポートタイプの with/without", "q": "「取引先（A）と取引先責任者（B）」のカスタムレポートタイプで作成したレポートに、取引先責任者が登録されていない取引先が表示されません。取引先責任者の有無にかかわらず全取引先を表示するにはどうしますか？", "choices": ["レポートの表示条件を「すべての取引先」に変更する", "レポートを表形式からサマリー形式に変更する", "取引先（A）と取引先責任者（B）の関係を「A レコードは関連する B レコードを持つ場合と持たない場合があります」に設定したカスタムレポートタイプでレポートを作成する", "取引先の組織の共有設定を公開/参照・更新可能に変更する"], "answer": [2], "explanation": "カスタムレポートタイプで「A は少なくとも1件の B を持つ」を選ぶと、B のない A は結果から除外されます。「持つ場合と持たない場合がある」の関係を設定したレポートタイプを使うと外部結合となり、B のない A も表示されます。", "choiceNotes": ["表示範囲の条件は所有者等の範囲であり、関連レコード有無による除外は解消しない。", "レポート形式を変えても結合条件は変わらない。", "with or without の関係に変更することで取引先責任者のない取引先も表示される。", "共有設定の問題ではなく、レポートタイプの結合定義が原因である。"], "ref": "カスタムレポートタイプのオブジェクト関係 / Create a Custom Report Type"}, {"id": "PA2-003", "domain": "Agentforce Sales の実践的な応用", "topic": "行レベルの数式", "q": "営業企画担当者は、商談レポートの各行に「作成日から完了予定日までの日数」を表示したいと考えています。項目の追加は行わず、レポート上だけで実現したい場合に適切な機能はどれですか？", "choices": ["行レベルの数式", "集計項目（サマリー数式）", "バケット項目", "条件付き書式"], "answer": [0], "explanation": "行レベルの数式はレコード（行）ごとに計算結果を表示するレポート上の数式で、日付間の日数計算などに使えます。オブジェクトに数式項目を作らずに済みます。集計項目はグループや総計の集計値に対して計算する機能です。", "choiceNotes": ["行ごとの日数計算はレポート上の行レベルの数式で実現できる。", "集計項目は集計値に対する計算であり、行ごとの値は出せない。", "バケット項目は値を区分に分類する機能で、日数計算はできない。", "条件付き書式は集計値の色分けであり、値の計算はしない。"], "ref": "行レベルの数式の追加 / Add a Row-Level Formula to a Report"}, {"id": "PA2-004", "domain": "Agentforce Sales の実践的な応用", "topic": "集計項目と集計方法", "q": "営業マネージャーは、商談レポートを所有者でグループ化し、所有者ごとの「平均商談金額」を表示したいと考えています。この要件を満たす方法はどれですか？（2つ選択してください）", "choices": ["金額項目の集計方法で「平均」を選択する", "金額の行レベルの数式を作成し、グループごとに表示する", "AMOUNT:SUM を RowCount で割る集計項目（サマリー数式）を作成し、グループレベルで表示する", "金額に条件付き書式を設定する", "金額をバケット項目で区分する"], "answer": [0, 2], "explanation": "グループごとの平均は、数値項目の集計方法「平均」を選ぶか、合計を件数で割る集計項目で求められます。行レベルの数式は行ごとの値を計算するもので、グループ単位の平均は計算しません。", "choiceNotes": ["集計方法の「平均」でグループごとの平均金額を表示できる。", "行レベルの数式は行単位の計算で、集計値の算出には使えない。", "合計を件数で割る集計項目でグループごとの平均を算出できる。", "条件付き書式は表示色を変えるだけで平均は計算しない。", "バケット項目は値の分類であり平均は計算しない。"], "ref": "レポートの集計項目 / Add a Summary Formula Column to a Report"}, {"id": "PA2-005", "domain": "Agentforce Sales の実践的な応用", "topic": "条件付き書式", "q": "ある営業マネージャーが、表形式の商談レポートで金額を「達成状況に応じて赤・黄・緑」に色分けしようとしましたが、条件付き書式の設定を見つけられません。最も適切な対応はどれですか？", "choices": ["金額項目の項目レベルセキュリティを編集可能に変更する", "レポートを行でグループ化したサマリー形式にし、集計された金額に条件付き書式を設定する", "ダッシュボードの表コンポーネントでのみ色分けできると伝え、レポートでは不可と回答する", "金額項目のページレイアウトで色を設定する"], "answer": [1], "explanation": "Lightning レポートの条件付き書式は、集計値（サマリー・マトリックス形式の合計等）に対して適用されます。表形式のままでは設定できないため、グループ化して集計値に書式を設定します。", "choiceNotes": ["項目レベルセキュリティは条件付き書式の可否に関係しない。", "グループ化して集計値に対して条件付き書式を設定するのが正しい。", "レポートでもグループ化すれば色分けは可能である。", "ページレイアウトに項目の色を指定する機能はない。"], "ref": "レポートの条件付き書式 / Conditional Formatting in Lightning Reports"}, {"id": "PA2-006", "domain": "Agentforce Sales の実践的な応用", "topic": "レポート登録", "q": "営業部長は、チームの今四半期パイプライン合計がしきい値を下回った週だけ、自分とチームメンバー全員にレポートをメールで受け取りたいと考えています。必要な設定はどれですか？（2つ選択してください）", "choices": ["レポート登録に、パイプライン合計がしきい値を下回る場合の条件を追加する", "レポートに条件付き書式を設定し、しきい値を下回ると赤くする", "部長に「レポートの登録：受信者の追加」権限を付与し、チームを受信者に追加する", "ダッシュボードにしきい値フィルタを追加する", "チームメンバーそれぞれのパスワードを使って各自で登録させる"], "answer": [0, 2], "explanation": "レポート登録には集計値に基づく条件を設定でき、条件を満たした場合のみ通知できます。自分以外を受信者に加えるには「レポートの登録：受信者の追加」権限が必要です。", "choiceNotes": ["条件付きの登録で、しきい値を下回った場合のみ送信できる。", "条件付き書式は表示上の色分けで、メール送信の条件にはならない。", "他ユーザーを受信者に追加するにはこの権限が必要である。", "ダッシュボードフィルタはメール送信条件を制御しない。", "他人のパスワードを使う運用はセキュリティ上不適切であり、権限付与で対応できる。"], "ref": "レポートの登録 / Subscribe to Reports"}, {"id": "PA2-007", "domain": "Agentforce Sales の実践的な応用", "topic": "動的ダッシュボードの上限", "q": "Enterprise Edition の組織で、管理者が新しいダッシュボードの実行ユーザーを「ダッシュボードを表示しているユーザー」に設定しようとしたところ、保存できませんでした。組織には同設定のダッシュボードがすでに5つあります。原因として最も適切なものはどれですか？", "choices": ["管理者に「すべてのデータの参照」権限がない", "ダッシュボードのコンポーネント数が上限を超えている", "ダッシュボードフィルタが3つを超えている", "Enterprise Edition の動的ダッシュボードの上限（5つ）に達している"], "answer": [3], "explanation": "動的ダッシュボードには エディションごとの上限があり、Enterprise Edition は5つ、Unlimited/Performance Edition は10です。上限に達している場合、既存の動的ダッシュボードを静的に変更するか、統合を検討します。", "choiceNotes": ["動的設定の保存可否は件数上限の問題であり、本シナリオの原因ではない。", "コンポーネント数の上限は動的設定の保存エラーとは別の問題である。", "フィルタ数の制約は実行ユーザー設定とは関係しない。", "Enterprise Edition は動的ダッシュボードが5つまでである。"], "ref": "動的ダッシュボード / Dynamic Dashboards Limits"}, {"id": "PA2-008", "domain": "Agentforce Sales の実践的な応用", "topic": "静的ダッシュボードの実行ユーザー", "q": "全営業担当者に公開しているダッシュボードで、担当者が本来参照権限のない他部門の商談金額まで見えていると報告がありました。ダッシュボードの実行ユーザーは営業本部長に固定されています。原因として最も適切なものはどれですか？", "choices": ["静的ダッシュボードは指定した実行ユーザーの権限でデータを表示するため、閲覧者全員に本部長の参照範囲のデータが見える", "ダッシュボードフォルダの共有が「参照のみ」になっている", "元レポートの表示範囲が「自分の商談」になっている", "ダッシュボードの更新日時が古いため"], "answer": [0], "explanation": "実行ユーザーを固定した静的ダッシュボードでは、閲覧者の権限ではなく実行ユーザーの参照範囲でデータが表示されます。閲覧者ごとの権限で表示させたい場合は動的ダッシュボード（表示しているユーザーとして実行）を使います。", "choiceNotes": ["固定の実行ユーザーの参照範囲で全員に表示されることが原因である。", "フォルダの共有レベルはデータの参照範囲を広げる原因ではない。", "「自分の商談」であれば他部門のデータは表示されない方向に働く。", "更新日時はデータの参照範囲とは無関係である。"], "ref": "ダッシュボードの実行ユーザー / Set the Running User for Dashboards"}, {"id": "PA2-009", "domain": "Agentforce Sales の実践的な応用", "topic": "ダッシュボードフィルタ", "q": "ダッシュボードに「地域」フィルタを追加したところ、6つのコンポーネントのうち1つだけがフィルタで絞り込まれません。最も可能性の高い原因はどれですか？", "choices": ["そのコンポーネントがグラフではなく表形式で作成されている", "そのコンポーネントのソースレポートのレポートタイプに、フィルタ対象の地域項目が含まれていない", "ダッシュボードが動的ダッシュボードになっている", "フィルタの値が50個を超えている"], "answer": [1], "explanation": "ダッシュボードフィルタは、ソースレポートでフィルタ項目を使用できるコンポーネントにのみ適用されます。地域項目を持たないレポートタイプのコンポーネントは絞り込まれません。", "choiceNotes": ["コンポーネントの表示形式はフィルタの適用可否を決めない。", "ソースレポートにフィルタ項目がないとそのコンポーネントには適用されない。", "動的ダッシュボードでもフィルタは利用できる。", "値の上限を超えると保存できないため、一部だけ効かない原因にはならない。"], "ref": "ダッシュボードフィルタ / Filter a Dashboard"}, {"id": "PA2-010", "domain": "Agentforce Sales の実践的な応用", "topic": "Lightning ページのコンポーネント表示条件", "q": "商談レコードページに「契約手続き」用のコンポーネントを配置します。フェーズが「成立」の商談でのみ表示し、かつ特定のカスタム権限を持つユーザーにだけ表示したい場合、最も適切な方法はどれですか？", "choices": ["ページレイアウトを2つ作成し、プロファイルごとに割り当てる", "レコードタイプを「成立」用に分け、レコードタイプごとにページを割り当てる", "Lightning アプリケーションビルダーでコンポーネントの表示条件に、レコード項目（フェーズ）と権限（カスタム権限）の条件を設定する", "フローでフェーズが成立になったときにページを切り替える"], "answer": [2], "explanation": "Lightning レコードページのコンポーネント表示条件では、レコード項目の値、ユーザーの権限、デバイス種別などを組み合わせられます。ページを分けずに1つのコンポーネントの表示を制御できます。", "choiceNotes": ["ページレイアウトはフェーズ値に応じた動的な表示切り替えができない。", "フェーズ変化のたびにレコードタイプを変える運用は過剰で不適切である。", "表示条件でレコード項目と権限を組み合わせるのが最適である。", "フローでページ割り当てを動的に切り替えることはできない。"], "ref": "コンポーネントの表示条件 / Dynamic Lightning Pages"}, {"id": "PA2-011", "domain": "Agentforce Sales の実践的な応用", "topic": "動的関連リスト", "q": "取引先レコードページで、商談の関連リストに「未完了の商談」だけを完了予定日の昇順で表示したいという要望があります。最も適切な方法はどれですか？", "choices": ["ページレイアウトの関連リストのプロパティで検索条件を設定する", "商談のリストビューを作成し、取引先ページにリンクを置く", "商談の共有ルールで完了済み商談を非表示にする", "Lightning レコードページに「動的関連リスト - 単一」コンポーネントを追加し、検索条件と並び順を設定する"], "answer": [3], "explanation": "「動的関連リスト - 単一」コンポーネントでは、表示項目、並び順に加えて検索条件で表示するレコードを絞り込めます。従来のページレイアウトの関連リストは項目と並び順は設定できますが、検索条件は設定できません。", "choiceNotes": ["ページレイアウトの関連リストには絞り込み条件の設定がない。", "リストビューは取引先単位の関連レコードを直接表示しない。", "共有ルールは参照権限の付与であり、表示の絞り込みには使えない。", "動的関連リストで条件と並び順を指定できる。"], "ref": "動的関連リスト / Dynamic Related Lists"}, {"id": "PA2-012", "domain": "Agentforce Sales の実践的な応用", "topic": "かんばん表示", "q": "営業担当者が商談タブの「最近参照したデータ」リストビューでかんばん表示に切り替えようとしましたが、選択できません。適切な対応はどれですか？", "choices": ["新しいリストビューを作成（または既存のリストビューを選択）してから、かんばん表示に切り替える", "商談のフェーズ項目を必須項目にする", "ユーザーに「すべてのデータの編集」権限を付与する", "商談のページレイアウトにかんばん用の項目を追加する"], "answer": [0], "explanation": "「最近参照したデータ」リストビューはかんばん表示に対応していません。通常のリストビューを使えば、フェーズなどの選択リストでグループ化したかんばん表示を利用できます。", "choiceNotes": ["最近参照したデータ以外のリストビューならかんばん表示を使える。", "必須設定はかんばん表示の可否とは関係しない。", "かんばん表示に管理権限は不要である。", "ページレイアウトはリストビューの表示形式に影響しない。"], "ref": "かんばん表示 / Work with Records in Kanban View"}, {"id": "PA2-013", "domain": "Agentforce Sales の実践的な応用", "topic": "リストビューのインライン編集", "q": "商談には「新規」と「更新」の2つのレコードタイプがあります。営業担当者から「全商談のリストビューでインライン編集ができない」と問い合わせがありました。インライン編集を可能にする方法として最も適切なものはどれですか？", "choices": ["リストビューの共有範囲を「自分のみ」に変更する", "リストビューに1つのレコードタイプで絞り込む条件を追加する", "リストビューの表示項目を10個以下に減らす", "リストビューをかんばん表示に切り替える"], "answer": [1], "explanation": "複数のレコードタイプを含むリストビューではインライン編集が利用できません。レコードタイプを1つに絞り込む条件を加えると、インライン編集が可能になります。", "choiceNotes": ["共有範囲はインライン編集の可否に影響しない。", "単一レコードタイプに絞り込むことでインライン編集が可能になる。", "表示項目数の削減では解決しない。", "かんばんはカードのドラッグで更新するもので、インライン編集の代替ではない。"], "ref": "リストビューのインライン編集 / Edit Records Inline in List Views"}, {"id": "PA2-014", "domain": "Agentforce Sales の実践的な応用", "topic": "営業コンソールの分割表示", "q": "インサイドセールスチームは、リード一覧から1件ずつ開いて対応する際、毎回リストに戻る手間を減らしたいと考えています。営業コンソールアプリで最も適切な機能はどれですか？", "choices": ["ユーティリティバーに最近使ったデータを追加する", "ホームページにリードのレポートグラフを配置する", "分割表示を使い、リストビューを画面左側に表示したままレコードをタブで開く", "リードのコンパクトレイアウトに項目を追加する"], "answer": [2], "explanation": "コンソールアプリの分割表示では、リストビューを横のパネルに表示したまま、レコードをワークスペースタブで開けます。リストへ戻らずに次のレコードへ移動できます。", "choiceNotes": ["ユーティリティバーの最近使ったデータでは一覧を順に処理できない。", "レポートグラフはレコードの連続処理には向かない。", "分割表示でリストを表示したまま連続対応できる。", "コンパクトレイアウトはレコードの強調表示項目の設定である。"], "ref": "コンソールの分割表示 / Split View in Console Apps"}, {"id": "PA2-015", "domain": "Agentforce Sales の実践的な応用", "topic": "モバイルのコンパクトレイアウト", "q": "外回りの営業担当者から「Salesforce モバイルアプリで商談を開いたとき、上部に金額とフェーズと完了予定日をすぐ確認したい」と要望がありました。商談には複数のレコードタイプがあり、レコードタイプごとに表示項目を変えたい場合の設定はどれですか？", "choices": ["モバイル専用のページレイアウトを作成し、プロファイルに割り当てる", "Lightning レコードページのデバイス条件で項目を非表示にする", "グローバルアクションのレイアウトに項目を追加する", "コンパクトレイアウトを作成し、コンパクトレイアウトの割り当てでレコードタイプごとに割り当てる"], "answer": [3], "explanation": "レコード上部の強調表示パネルやモバイルのレコードヘッダーに表示される主要項目はコンパクトレイアウトで定義します。コンパクトレイアウトはレコードタイプごとに割り当てられます。", "choiceNotes": ["ページレイアウトはヘッダー部分の主要項目を決めない。", "デバイス条件はコンポーネントの表示制御であり、ヘッダー項目は定義しない。", "グローバルアクションのレイアウトは作成画面の項目である。", "コンパクトレイアウトをレコードタイプ別に割り当てるのが正しい。"], "ref": "コンパクトレイアウト / Compact Layouts"}, {"id": "PA2-016", "domain": "Agentforce Sales の実践的な応用", "topic": "Lightning メールテンプレートの差し込み", "q": "管理者は、商談からメールを送信する際に商談名と金額を差し込む Lightning メールテンプレートを作成しようとしていますが、差し込み項目の選択肢に商談の項目が表示されません。最も適切な対応はどれですか？", "choices": ["テンプレートの「関連エンティティ種別」に商談を指定する", "テンプレートをクラシック形式のテキストテンプレートで作成し直す", "商談の項目レベルセキュリティを全プロファイルで編集可能にする", "受信者を取引先責任者ではなくユーザーに変更する"], "answer": [0], "explanation": "Lightning メールテンプレートでは、関連エンティティ種別に指定したオブジェクトの項目を差し込みできます。商談を指定すると商談名や金額などの差し込み項目を選択できるようになります。", "choiceNotes": ["関連エンティティ種別を商談にすると商談の差し込み項目が利用できる。", "形式を変える必要はなく、関連エンティティ種別の設定で解決する。", "項目レベルセキュリティの問題ではなく、関連オブジェクトが未指定なことが原因である。", "受信者の種類を変えても商談の項目は差し込めない。"], "ref": "Lightning メールテンプレート / Create Lightning Email Templates"}, {"id": "PA2-017", "domain": "Agentforce Sales の実践的な応用", "topic": "Outlook インテグレーション", "q": "Outlook インテグレーションを利用している組織で、営業チームの Outlook 上の Salesforce パネルに商談情報と社内ナレッジ用のカスタムコンポーネントを表示し、サポートチームには別の構成を表示したいと考えています。最も適切な方法はどれですか？", "choices": ["Outlook の受信トレイルールでチームごとにフォルダを分ける", "Lightning アプリケーションビルダーでチームごとのメールアプリケーションペインを作成し、各チームのプロファイルに割り当てる", "各ユーザーの Lightning ホームページをチームごとに作成する", "Einstein 活動キャプチャの設定でチームごとの表示項目を指定する"], "answer": [1], "explanation": "Outlook インテグレーションで表示される Salesforce の画面は、Lightning アプリケーションビルダーで作成するメールアプリケーションペインでカスタマイズできます（設定で「App Builder でコンテンツをカスタマイズ」を有効化）。ペインは組織のデフォルトとして、またはプロファイル単位で割り当てられます。", "choiceNotes": ["Outlook 側のルールでは Salesforce パネルの内容は変えられない。", "チームごとのメールアプリケーションペインを作成し、プロファイルに割り当てるのが正しい。", "Lightning ホームページは Outlook パネルの構成を決めない。", "活動キャプチャはメールや行動の同期機能であり、パネル構成は指定しない。"], "ref": "Outlook インテグレーションのメールアプリケーションペイン / Customize the Content in Outlook Integration"}, {"id": "PA2-018", "domain": "Agentforce Sales の実践的な応用", "topic": "承認プロセスの全員一致", "q": "大型値引きの商談は、経理部長と法務部長の両方が承認した場合のみ次のステップへ進めたいと考えています。承認ステップの設定として最も適切なものはどれですか？", "choices": ["承認者を経理部長とし、法務部長は申請後に Chatter で通知する", "承認者に両名を指定し、「最初の承認者の応答に基づいて承認または却下」を選択する", "承認者に両名を指定し、「すべての選択された承認者による全員一致の承認を要求」を選択する", "経理部長と法務部長を同じキューに入れ、キューを承認者にする"], "answer": [2], "explanation": "1つのステップに複数の承認者を指定する場合、全員一致の承認を要求するか、最初の応答で決めるかを選べます。両名の承認が必須なら全員一致を選択します。", "choiceNotes": ["通知だけでは法務部長の承認が必須にならない。", "最初の応答で決まるため、片方の承認だけで進んでしまう。", "全員一致を選ぶと両名の承認が必要になる。", "キューを承認者にするとキューのメンバー1人の応答で処理される。"], "ref": "承認プロセスの承認ステップ / Create Approval Steps"}, {"id": "PA2-019", "domain": "Agentforce Sales の実践的な応用", "topic": "承認の委任", "q": "営業部長が2週間の休暇を取る間、部長宛ての値引き承認申請を副部長が代わりに承認できるようにしたいと考えています。必要な設定はどれですか？（2つ選択してください）", "choices": ["営業部長のユーザーレコードで「代理承認者」に副部長を設定する", "副部長に営業部長のログイン情報を共有する", "承認ステップで「承認者の代理承認者による要求の承認または却下を許可」を有効にする", "承認プロセスを無効化し、休暇明けに再有効化する", "副部長のプロファイルに「すべてのデータの編集」権限を付与する"], "answer": [0, 2], "explanation": "代理承認はユーザーレコードの代理承認者項目と、承認ステップでの代理承認者の許可設定を組み合わせて実現します。どちらかが欠けると副部長は承認できません。", "choiceNotes": ["ユーザーレコードの代理承認者に副部長を設定する必要がある。", "ログイン情報の共有はセキュリティ上不適切である。", "ステップで代理承認者による承認を許可する必要がある。", "無効化すると承認の統制が失われ、要件を満たさない。", "過剰な権限付与であり、代理承認の仕組みで対応すべきである。"], "ref": "代理承認者 / Delegated Approvers"}, {"id": "PA2-020", "domain": "Agentforce Sales の実践的な応用", "topic": "承認申請のトラブルシュート", "q": "営業担当者が商談で「承認申請」ボタンを押したところ、「該当する承認プロセスが見つかりません」というエラーが表示されました。最も可能性の高い原因はどれですか？", "choices": ["承認者が休暇中で代理承認者が設定されていない", "商談がすでにロックされている", "承認プロセスの最終承認アクションにメール通知がない", "商談が有効な承認プロセスの開始条件を満たしていない（または申請者が許可された申請者に含まれていない）"], "answer": [3], "explanation": "申請時、レコードが有効な承認プロセスの開始条件に一致しない場合や、申請者が許可されていない場合、該当するプロセスがないというエラーになります。開始条件と申請可能なユーザーの設定を確認します。", "choiceNotes": ["承認者の不在は申請自体のエラー原因にならない。", "ロック状態はこのエラーメッセージの原因ではない。", "最終承認アクションの内容は申請可否に影響しない。", "開始条件や申請者の不一致がこのエラーの典型的な原因である。"], "ref": "承認プロセスの開始条件 / Approval Process Considerations"}, {"id": "PA2-021", "domain": "Agentforce Sales の実践的な応用", "topic": "ホームのパフォーマンスグラフ", "q": "営業担当者は Lightning Experience のホームに表示されるパフォーマンスグラフで、自分の四半期目標に対する進捗を確認したいと考えています。このグラフの説明として正しいものはどれですか？", "choices": ["ユーザーが設定した目標に対し、今四半期の成立商談と、確度が70%を超える未完了の商談を表示する", "すべての未完了商談の金額を目標に関係なく表示する", "チーム全体の売上予測をカテゴリごとに表示する", "目標は管理者がデータローダでしか設定できない"], "answer": [0], "explanation": "ホームのパフォーマンスグラフは、今四半期の成立商談と確度70%超の未完了商談を、ユーザー自身が設定した目標と並べて表示します。担当者はグラフ上で目標を編集できます。", "choiceNotes": ["成立商談と確度70%超の未完了商談を目標とともに表示する。", "すべての未完了商談を表示するわけではない。", "チームの売上予測カテゴリを表示するのは売上予測ページである。", "目標はユーザーがグラフから直接設定できる。"], "ref": "ホームのパフォーマンスグラフ / Performance Chart on Home"}, {"id": "PA2-022", "domain": "Agentforce Sales の実践的な応用", "topic": "売上予測の目標（クォータ）", "q": "協調売上予測を利用している組織で、各営業担当者の月次目標を売上予測ページに表示し、達成率を把握したいと考えています。必要な対応はどれですか？（2つ選択してください）", "choices": ["売上予測の設定で「目標を表示」を有効にする", "ユーザーレコードにカスタム項目「目標金額」を作成する", "データローダや API で売上予測目標（ForecastingQuota）のレコードを登録する", "商談チームに目標金額を登録する", "ホームのパフォーマンスグラフの目標を全員に入力させる"], "answer": [0, 2], "explanation": "協調売上予測で目標を使うには、設定で目標の表示を有効にし、ForecastingQuota レコードとして目標を登録します。登録はデータローダや API で行えます。", "choiceNotes": ["目標を表示する設定の有効化が必要である。", "ユーザーのカスタム項目は売上予測ページの目標として使われない。", "ForecastingQuota として目標を読み込む必要がある。", "商談チームには目標を登録する仕組みがない。", "パフォーマンスグラフの目標は売上予測の目標とは別物である。"], "ref": "売上予測の目標 / Enable Quotas in Collaborative Forecasts"}, {"id": "PA2-023", "domain": "Agentforce Sales の実践的な応用", "topic": "ケイデンスの分岐", "q": "Sales Engagement でケイデンスを設計しています。「電話ステップの結果が『折り返し希望』ならすぐ再架電、『興味なし』ならケイデンスを終える」という分岐を作るために必要な準備として最も適切なものはどれですか？", "choices": ["リードの評価項目に選択リスト値を追加する", "Sales Engagement の設定で通話結果（コールアウトカム）を定義し、ケイデンスの通話ステップの後に分岐ステップを追加する", "電話ステップを ToDo 作成のフローに置き換える", "作業キューの並び順を通話結果順に変更する"], "answer": [1], "explanation": "ケイデンスの分岐は、通話結果やメールの反応などを条件にできます。通話結果で分岐させるには、あらかじめ通話結果を定義しておき、通話ステップの後に分岐ステップを置きます。", "choiceNotes": ["リードの評価項目は通話結果による分岐には使われない。", "通話結果を定義して分岐ステップで条件にするのが正しい。", "フローに置き換えるとケイデンスの分岐機能を使えない。", "作業キューの並び順は分岐ロジックに関係しない。"], "ref": "ケイデンスの分岐ステップ / Sales Engagement Cadence Builder"}, {"id": "PA2-024", "domain": "Agentforce Sales の実践的な応用", "topic": "ケイデンスのターゲット", "q": "営業担当者が、あるリードを新しいケイデンスに追加しようとしたところ追加できませんでした。リードは2週間前に別の担当者が別のケイデンスに追加しています。最も可能性の高い原因はどれですか？", "choices": ["リードの所有者が営業担当者ではない", "ケイデンスにメールステップが含まれていない", "1つのターゲットは同時に1つのケイデンスにしか登録できず、既存のケイデンスで有効なため", "作業キューが無効になっている"], "answer": [2], "explanation": "Sales Engagement では、1件のターゲット（リードや取引先責任者など）は同時に1つのケイデンスにしか所属できません。新しいケイデンスに追加するには、既存のケイデンスから削除するか完了させる必要があります。", "choiceNotes": ["所有者の違いはこの追加失敗の主な原因ではない。", "ステップ構成はターゲットの追加可否を決めない。", "同時に1つのケイデンスにしか所属できない制約が原因である。", "作業キューを無効にする設定はなく、追加可否とは無関係である。"], "ref": "ケイデンスへのターゲットの追加 / Add Targets to a Cadence"}, {"id": "PA2-025", "domain": "Agentforce Sales の実践的な応用", "topic": "動的ダッシュボードの閲覧者と実行ユーザー", "q": "営業本部は1つのパイプラインダッシュボードで、各担当者には自分の参照可能なデータだけを表示し、マネージャーは部下の視点でも同じダッシュボードを確認できるようにしたいと考えています。適切な設定はどれですか？（2つ選択してください）", "choices": ["実行ユーザーを営業本部長に固定し、所有者でダッシュボードフィルタを追加する", "実行ユーザーを「ダッシュボードを表示しているユーザー」に設定する", "1時間ごとの定期更新をスケジュールする", "「承認済みユーザーに実行ユーザーの変更を許可」を有効にし、マネージャーに「自分のチームのダッシュボードの参照」権限を付与する", "担当者ごとにダッシュボードを複製してフォルダを分ける"], "answer": [1, 3], "explanation": "動的ダッシュボードにすると閲覧者自身の参照範囲でデータが表示されます。さらに実行ユーザーの変更を許可し、マネージャーに「自分のチームのダッシュボードの参照」権限を与えると、部下として表示を切り替えられます。", "choiceNotes": ["固定の実行ユーザーでは閲覧者全員が本部長の範囲のデータを見られてしまう。", "閲覧者自身の権限でデータを表示する動的ダッシュボードにする。", "動的ダッシュボードは定期更新をスケジュールできず、要件とも無関係である。", "実行ユーザー変更の許可と権限付与で部下の視点を確認できる。", "複製は保守負荷が高く、1つのダッシュボードという要件に反する。"], "ref": "動的ダッシュボード / Dynamic Dashboards"}, {"id": "PA3-001", "domain": "Agentforce Sales の実践的な応用", "topic": "ホームのアシスタント", "q": "営業部長から「営業担当者が毎朝ホームを開いたときに、期限切れの ToDo や一定期間活動が記録されていない商談など、対応すべき更新情報をまとめて確認できるようにしたい」と要望があった。カスタム開発を避けたい場合、コンサルタントが推奨すべき対応はどれか。", "choices": ["Lightning アプリケーションビルダーでホームページに標準の「アシスタント」コンポーネントを配置する", "ホームページにリストビューコンポーネントを配置し、期限切れ ToDo のリストビューを表示する", "毎朝実行されるスケジュールトリガーフローで、更新情報を Chatter に投稿する", "ToDo オブジェクトのレポートを作成し、全担当者に毎朝メールで登録送信する"], "answer": [0], "explanation": "アシスタントはホームページ用の標準コンポーネントで、期限切れの ToDo や活動のない商談、新しく割り当てられたリードなど、ユーザーが対応すべき更新情報をまとめて表示する。設定だけで追加でき、ユーザーごとの情報が自動で表示されるため要件に最も合う。", "choiceNotes": ["正解。標準のアシスタントコンポーネントで複数種類の更新情報を一か所に表示できる。", "リストビューは単一オブジェクトの一覧であり、商談の無活動など複数種類の情報をまとめられない。", "フロー開発が必要で、Chatter 投稿はホームで対応事項を一覧する体験にならない。", "メール送信ではホームを開いたときに確認する要件を満たさず、商談の情報も含まれない。"], "ref": "Lightning Experience ホームのアシスタント"}, {"id": "PA3-002", "domain": "Agentforce Sales の実践的な応用", "topic": "ホームの主要取引", "q": "営業担当者が、自分の大型の進行中の商談をホームから素早く確認し、そこから商談レコードへ移動できるようにしたい。新しいレポートやダッシュボードを作らずに実現できる方法として最も適切なものはどれか。", "choices": ["ホームページに標準の「主要取引」コンポーネントを配置する", "ホームページに「最近使ったデータ」コンポーネントを配置する", "商談タブのデフォルトリストビューを「最近参照したデータ」にする", "ホームページに「リッチテキスト」コンポーネントを配置し、商談へのリンクを手入力する"], "answer": [0], "explanation": "主要取引（Key Deals）はホームページ用の標準コンポーネントで、ユーザーの重要な進行中の商談を一覧し、各商談に直接移動できる。レポートやダッシュボードを新たに作成する必要はない。", "choiceNotes": ["正解。標準の主要取引コンポーネントで重要な商談をホームに表示できる。", "最近使ったデータは閲覧履歴に基づくもので、商談の重要度とは関係がない。", "商談タブの設定でありホームでの確認にはならず、大型商談の抽出にもならない。", "リンクの手入力は保守できず、商談の変化に追随しない。"], "ref": "Lightning Experience ホームの

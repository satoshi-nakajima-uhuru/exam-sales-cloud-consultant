<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentforce Sales 問題集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: single centered study column; header with exam countdown, domain meters, then the quiz card */
:root {
  --bg: #f6f7f9; --surface: #ffffff; --fg: #1b2330; --muted: #5d6878; --line: #dde2ea;
  --accent: #0b5cad; --accent-weak: #e6f0fb;
  --ok: #1f7a4d; --ok-weak: #e3f4ea; --ng: #b3261e; --ng-weak: #fbe9e7; --warn: #9a6400;
  --sans: "IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12161d; --surface: #1a2029; --fg: #e5e9f0; --muted: #98a3b3; --line: #2c3441;
  --accent: #6aa8ec; --accent-weak: #1b2b40;
  --ok: #5cc48d; --ok-weak: #15301f; --ng: #f08a80; --ng-weak: #3a1b19; --warn: #e3b25a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12161d; --surface: #1a2029; --fg: #e5e9f0; --muted: #98a3b3; --line: #2c3441;
  --accent: #6aa8ec; --accent-weak: #1b2b40;
  --ok: #5cc48d; --ok-weak: #15301f; --ng: #f08a80; --ng-weak: #3a1b19; --warn: #e3b25a; color-scheme: dark }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.7 var(--sans); }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 20px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }
h1 { font-size: 20px; margin: 0; text-wrap: balance; }
h2 { font-size: 15px; margin: 0; color: var(--muted); font-weight: 500; letter-spacing: .04em; }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.count { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.count b { color: var(--accent); font-size: 18px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.domains { display: grid; gap: 10px; }
.drow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; }
.drow .name { font-size: 14px; }
.drow .num { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.bar { grid-column: 1 / -1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .c { background: var(--ok) } .bar .w { background: var(--ng); opacity: .75 }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
button { font: inherit; color: inherit; cursor: pointer; }
.mode { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.mode:hover { border-color: var(--accent); }
.mode strong { font-size: 15px; }
.mode span { font-size: 12px; color: var(--muted); }
.mode.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.mode.primary span { color: var(--surface); opacity: .85 }
.mode:disabled { opacity: .45; cursor: default; }
select { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; max-width: 100%; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 8px 14px; }
.btn.go { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 500; }
.btn:disabled { opacity: .4; cursor: default; }
.btn:focus-visible, .mode:focus-visible, .choice:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; }
.chip.multi { border-color: var(--warn); color: var(--warn); }
.q { font-size: 16px; white-space: pre-wrap; }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 10px; align-items: start; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; }
.choice input { margin-top: 5px; }
.choice.sel { border-color: var(--accent); background: var(--accent-weak); }
.choice.right { border-color: var(--ok); background: var(--ok-weak); }
.choice.wrong { border-color: var(--ng); background: var(--ng-weak); }
.note { grid-column: 2; font-size: 13px; color: var(--muted); }
.verdict { font-weight: 700; font-size: 16px; }
.verdict.ok { color: var(--ok) } .verdict.ng { color: var(--ng) }
.expl { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.ref { font-size: 12px; color: var(--muted); }
.progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); }
.timer { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.timer.low { color: var(--ng); }
.result-big { font-size: 40px; font-weight: 700; font-family: var(--mono); }
.list { display: flex; flex-direction: column; gap: 6px; }
.li { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 10px; font-size: 13px; padding: 8px 0; border-bottom: 1px solid var(--line); cursor: pointer; text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; }
.mark { font-family: var(--mono); font-weight: 700; }
.mark.ok { color: var(--ok) } .mark.ng { color: var(--ng) }
.star { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 2px 10px; font-size: 13px; }
.star.on { color: var(--warn); border-color: var(--warn); }
.small { font-size: 12px; color: var(--muted); }
.danger { color: var(--ng); background: none; border: 0; padding: 0; font-size: 12px; text-decoration: underline; }
@media (prefers-reduced-motion: no-preference) { .choice, .mode { transition: border-color .12s, background .12s; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const QUESTIONS = [{"id": "AI3-001", "domain": "予測AI・生成AI", "topic": "予測AIと生成AIの使い分け", "q": "営業本部長から「AIで、どの商談が受注しやすいかを知りたい。さらに、顧客へのフォローアップメールの下書きも作らせたい」という要望が出た。コンサルタントが2つの要望を整理するときの説明として最も適切なものはどれか。", "choices": ["どちらも生成AIの機能であり、Prompt Builder のテンプレート1つで両方を実現できる", "受注しやすさの判定は過去データのパターンから結果を見積もる予測AIの領域で、メールの下書きは新しいテキストを作る生成AIの領域である", "どちらも予測AIの機能であり、商談スコアリングを有効にすればメール下書きも自動生成される", "受注しやすさの判定は生成AIに任せ、メール下書きは予測AIのモデルを学習させて作成する"], "answer": [1], "explanation": "予測AIは過去の結果データから傾向を学習し、スコアや予測値などの数値・分類を出す。生成AIは大規模言語モデルを使って文章や要約などの新しいコンテンツを作る。要望ごとに適した種類のAIを選び、商談スコアリングと生成メール（Prompt Builder の営業メールテンプレートなど）を組み合わせるのが妥当である。", "choiceNotes": ["受注しやすさの数値化は予測AIの役割であり、プロンプトテンプレートだけで統計的なスコアは作れない。", "予測AIと生成AIの役割分担を正しく説明している。", "商談スコアリングはスコアを出す機能で、メールは作らない。", "役割が逆になっている。"], "ref": "Trailhead: Artificial Intelligence Fundamentals / Generative AI Basics"}, {"id": "AI3-002", "domain": "予測AI・生成AI", "topic": "リードスコアのリストビュー活用", "q": "インサイドセールスチームは毎朝、自分が所有する未対応リードの中から優先して電話する相手を決めている。Einstein リードスコアリングはすでに有効で、スコアが表示されている。最も手軽に日々の優先順位付けに使える方法はどれか。", "choices": ["リードスコアを含むリストビューを作成し、スコアの高い順に並べて上から対応する", "毎朝リードをエクスポートし、表計算ソフトでスコアを計算し直す", "商談スコアリングを有効にして、リードにも商談スコアを表示させる", "リードの評価（Rating）項目をすべて手動で「Hot」に更新してから並べ替える"], "answer": [0], "explanation": "Einstein リードスコアリングのスコアはリストビューやレポートで項目として利用できる。自分の未対応リードのリストビューにスコア列を追加して降順に並べれば、追加の作業なしで毎日の優先順位付けができる。", "choiceNotes": ["スコア列を使ったリストビューは日々の優先順位付けに最も手軽で適切である。", "スコアは Einstein が算出するもので、手作業の再計算は不要かつ非効率である。", "商談スコアは商談オブジェクト向けで、リードには表示されない。", "手動で評価を一律に変えるとスコアの意味が失われる。"], "ref": "Salesforce ヘルプ: Einstein リードスコアリング"}, {"id": "AI3-003", "domain": "予測AI・生成AI", "topic": "リードスコアリングの対象と取引開始の定義", "q": "ある企業ではリードを取引開始する前に、インサイドセールスが「商談化可（SQL）」というカスタム項目を設定する運用をしている。マーケティング部門は、取引開始よりもSQLへの到達しやすさをスコアの基準にしたいと考えている。また、パートナー経由のリードはスコア対象から外したい。Einstein リードスコアリングの設定で検討すべきことはどれか。2つ選択してください。", "choices": ["スコアリングの成功（コンバージョン）の基準として、リードの取引開始ではなく特定の項目値への到達を指定する", "スコアリング対象のリードを項目条件で絞り込み、パートナー経由のリードを除外する", "パートナー経由のリードを毎晩一括削除して学習データから外す", "SQL 項目を数式項目に変更してから、商談スコアリングを有効にする", "リードスコアを手動入力用のカスタム項目として作成し、営業が値を入力する"], "answer": [0, 1], "explanation": "Einstein リードスコアリングでは、スコア対象とするリードの範囲と、何をもって成功（コンバージョン）とみなすかを設定で調整できる。取引開始の代わりに項目値で成功を定義すれば SQL 到達をスコアの基準にでき、対象条件を指定すれば特定のリード群をスコア対象外にできる。", "choiceNotes": ["成功の基準を項目値で定義できるため要件に合う。", "対象リードの絞り込みでパートナー経由を除外できる。", "データ削除は不要で、業務記録まで失うため不適切である。", "商談スコアリングはリードの評価には使えない。", "手動入力ではAIによるスコアリングにならない。"], "ref": "Salesforce ヘルプ: Einstein リードスコアリングの設定"}, {"id": "AI3-004", "domain": "予測AI・生成AI", "topic": "商談スコアと確度の違い", "q": "営業マネージャーから「商談の確度（%）がフェーズで決まっているのに、Einstein の商談スコアと数字が合わない。どちらかがおかしいのではないか」と質問があった。最も適切な回答はどれか。", "choices": ["商談スコアは確度項目をそのまま表示しているため、値が違う場合は設定エラーである", "確度はフェーズに対応付けた標準値であり、商談スコアは過去の受注・失注データや商談の活動などから個々の商談の受注可能性を予測したもので、意味が異なる", "商談スコアは担当者が入力した値なので、マネージャーが修正すべきである", "確度はAIが計算した値で、商談スコアはフェーズの標準値である"], "answer": [1], "explanation": "確度はフェーズごとに定義された既定値で、同じフェーズの商談はすべて同じ値になる。商談スコアは商談ごとの特徴や履歴から算出される予測値のため、同じフェーズでもスコアが異なるのは自然である。両者を比べることで、フェーズの割に勢いがない商談を見つけられる。", "choiceNotes": ["商談スコアは確度のコピーではない。", "両者の意味の違いを正しく説明している。", "商談スコアは Einstein が算出し、担当者は入力しない。", "説明が逆になっている。"], "ref": "Salesforce ヘルプ: Einstein 商談スコアリング"}, {"id": "AI3-005", "domain": "予測AI・生成AI", "topic": "商談スコアの低下要因からのアクション", "q": "パイプラインレビューで、大型商談の Einstein 商談スコアが先週から大きく下がっていることに気付いた。寄与要因には「最近の活動が少ない」「完了予定日が何度も延期されている」が表示されている。マネージャーが取るべき対応として最も適切なものはどれか。", "choices": ["スコアが下がった商談は自動的に失注になるため、何もしない", "スコアを上げるため、内容のない活動を大量に登録するよう担当者に指示する", "担当者と寄与要因を確認し、顧客との接点を増やす計画や完了予定日の妥当性を見直す", "商談スコアリングを無効にして、スコアが表示されないようにする"], "answer": [2], "explanation": "寄与要因はスコアが上下した理由を示すため、コーチングや案件戦略の見直しの手がかりとして使うのが正しい活用法である。スコアは判断材料であり、数字そのものを操作することが目的ではない。", "choiceNotes": ["スコアの低下で商談が自動的に失注になることはない。", "形だけの活動登録はデータ品質を損ない、将来の予測精度も下げる。", "寄与要因をもとに実際の案件状況を見直す、適切な活用である。", "問題を見えなくするだけで、改善につながらない。"], "ref": "Salesforce ヘルプ: 商談スコアの要因"}, {"id": "AI3-006", "domain": "予測AI・生成AI", "topic": "予測モデルとバイアス対策", "q": "Einstein リードスコアリングの導入を検討している企業で、法務部門から「担当者の年齢層や性別を推測できる項目がスコアに影響するのは避けたい」という指摘があった。コンサルタントの対応として最も適切なものはどれか。", "choices": ["スコアリングの設定で、該当する項目をモデルの学習対象から除外する", "AIは中立なので、どの項目を使っても偏りは生じないと説明する", "該当する項目を削除するまでスコアリングの導入は一切できないと伝える", "スコア表示を管理者だけに限定すれば問題は解消すると説明する"], "answer": [0], "explanation": "Einstein リードスコアリングでは、モデルで考慮しない項目を除外する設定ができる。過去データに含まれる偏りはモデルに学習されるため、差別につながる可能性のある項目や、その代わりになる項目を除外して検討することが責任あるAI活用につながる。", "choiceNotes": ["学習対象から項目を除外する設定で懸念に対応できる。", "過去データの偏りはモデルに引き継がれるため、AIが常に中立とは言えない。", "項目の削除は必須ではなく、除外の設定で対応できる。", "表示範囲を変えても、スコアの算出に偏りが残る。"], "ref": "Salesforce ヘルプ: Einstein リードスコアリングの項目除外 / Trailhead: Responsible Creation of Artificial Intelligence"}, {"id": "AI3-007", "domain": "予測AI・生成AI", "topic": "活動キャプチャのデータ保存とレポート", "q": "Einstein 活動キャプチャを数年前から利用している企業で、営業部長が「キャプチャされたメールの件数を、従来の ToDo・行動のレポートで集計したい」と要望した。この企業はメールを Salesforce の活動として同期するオプション（Sync Email as Salesforce Activity）を有効にしておらず、従来のストレージ構成のまま運用している。説明すべき内容として最も適切なものはどれか。", "choices": ["現在の構成でも、キャプチャされたメールは標準の ToDo レコードとして保存されるため、既存の活動レポートでそのまま集計できる", "現在の構成ではキャプチャされたメールは ToDo・行動レコードとして保存されないため、活動指標や活動キャプチャ用のダッシュボードで分析するか、メールを Salesforce の活動として同期するオプションへの移行を検討する必要がある", "キャプチャされたメールは個人の受信トレイにしか存在せず、Salesforce からは一切参照できない", "活動キャプチャを有効にすると、過去の ToDo レポートはすべて削除される"], "answer": [1], "explanation": "従来のストレージ構成の Einstein 活動キャプチャでは、取り込んだメールは Salesforce の標準活動レコードとは別に保存され、活動タイムラインには表示されるが、標準のレポートでは集計できない。この場合は活動指標や活動分析用のダッシュボードを使う。Summer '25 以降は、キャプチャしたメールを ToDo と EmailMessage レコードとして同期するオプション（Sync Email as Salesforce Activity）が提供されており、有効にすると既存の活動レポートでも集計できる（データストレージを消費する点に注意）。どの構成かによってレポートの可否が変わることを、導入・移行前に期待値として伝えておくことが重要である。", "choiceNotes": ["従来のストレージ構成では ToDo レコードとして保存されないため、既存レポートでは集計できない。", "従来構成での保存方法とレポートへの影響、および移行の選択肢を正しく説明している。", "キャプチャした活動は関連レコードの活動タイムラインで参照できる。", "活動キャプチャの有効化で既存レポートが削除されることはない。"], "ref": "Salesforce ヘルプ: Guidelines for Using Sync Email as Salesforce Activity / Einstein 活動キャプチャのデータの保存方法 / 活動指標"}, {"id": "AI3-008", "domain": "予測AI・生成AI", "topic": "活動キャプチャの除外アドレスと共有", "q": "Einstein 活動キャプチャの導入にあたり、人事部や法務部とのやり取り、社内の給与関連の通知メールが Salesforce に取り込まれることを懸念する声が上がった。また、一部の役員は自分がキャプチャしたメールを他の人に見せたくないと考えている。対応として適切なものはどれか。2つ選択してください。", "choices": ["活動キャプチャの設定で、特定のメールアドレスやドメインをキャプチャ対象から除外する", "活動キャプチャの共有設定を使い、キャプチャした活動を他のユーザーと共有しないようにする", "活動キャプチャを有効にしたまま、役員のメールボックスのパスワードを変更する", "該当するメールを毎週手作業で ToDo に変換してから削除する", "組織の共有設定で ToDo と行動のデフォルトアクセス権を「公開/参照・更新可能」にする"], "answer": [0, 1], "explanation": "Einstein 活動キャプチャでは、特定のアドレスやドメインを取り込み対象から除外できる。また、キャプチャした活動をどの範囲に共有するかを設定でき、ユーザーが自分の活動を共有しないよう選ぶこともできる。導入時はこうしたプライバシー面の設定を関係部門と合意しておくことが重要である。", "choiceNotes": ["除外アドレス・ドメインの設定で機密性の高いやり取りの取り込みを防げる。", "共有設定で、キャプチャした活動の公開範囲を制限できる。", "パスワード変更はキャプチャ範囲の制御にならない。", "手作業の運用は非効率で、懸念も解消しない。", "アクセス権を広げるのは要望と逆である。"], "ref": "Salesforce ヘルプ: Einstein 活動キャプチャの除外アドレス / 共有設定"}, {"id": "AI3-009", "domain": "予測AI・生成AI", "topic": "Einstein 売上予測の位置づけ", "q": "営業本部では、各マネージャーが提出する売上予測（コミット）に加えて、Einstein 売上予測を参考にしたいと考えている。Einstein 売上予測の位置づけとして最も適切な説明はどれか。", "choices": ["Einstein 売上予測を有効にすると、マネージャーの調整値は自動的に Einstein の予測値に置き換えられる", "Einstein 売上予測は、過去の傾向とパイプラインをもとにした予測値を参考情報として示すもので、人の判断による売上予測と比較してリスクや上振れを検討するために使う", "Einstein 売上予測は担当者が入力した完了予定日だけを合計したもので、予測モデルは使っていない", "Einstein 売上予測を使うには、ノルマ（クォータ）をすべて削除する必要がある"], "answer": [1], "explanation": "Einstein 売上予測はAIによる予測値を売上予測画面に表示し、マネージャーの見立てと比べる材料を提供する。最終的な予測やコミットは人が判断するもので、AIの値が自動で置き換わるわけではない。", "choiceNotes": ["AIの値が人の調整値を自動で上書きすることはない。", "参考値として人の判断と比べる位置づけを正しく説明している。", "過去の傾向を学習した予測モデルに基づく値である。", "ノルマの削除は必要ない。"], "ref": "Salesforce ヘルプ: Einstein 売上予測"}, {"id": "AI3-010", "domain": "予測AI・生成AI", "topic": "Agentforce アシスタントの位置づけ", "q": "営業担当者から「Lightning の画面上で、開いている商談について会話形式で質問したり要約してもらったりしたい」という要望があった。以前は Einstein Copilot と呼ばれていた機能を検討している。この要望に対する説明として最も適切なものはどれか。", "choices": ["Agentforce アシスタント（社員向けの会話型AIアシスタント）を有効にすると、標準のトピックとアクションでレコードの要約や質問への回答ができ、必要に応じて独自のアクションを追加できる", "この機能は外部向けのWebチャットでのみ使用でき、Lightning 画面には表示できない", "会話形式で使うには、すべての回答をあらかじめ固定文で登録しておく必要がある", "Einstein リードスコアリングを有効にすれば、会話形式の要約機能も自動的に使えるようになる"], "answer": [0], "explanation": "Einstein Copilot は Agentforce の社員向けアシスタントへと発展し、Lightning Experience 内で会話形式の支援を行う。標準で用意されたトピックやアクションに加え、組織固有の業務に合わせたアクションを追加して拡張できる。", "choiceNotes": ["社員向けアシスタントの役割と拡張性を正しく説明している。", "社内ユーザーが Lightning Experience で使うアシスタントである。", "生成AIが回答を作成するため、固定文の登録は不要である。", "リードスコアリングは予測AIで、会話機能とは別である。"], "ref": "Salesforce ヘルプ: Agentforce アシスタント / Trailhead: Agentforce for Sales"}, {"id": "AI3-011", "domain": "予測AI・生成AI", "topic": "トピックの分類説明の改善", "q": "Agentforce の社員向けエージェントに「見積作成支援」と「商談状況の確認」という2つのカスタムトピックを作成した。テストすると「この商談の見積はどうなっている？」という質問が、たびたび「商談状況の確認」トピックに振り分けられてしまう。最初に見直すべきものはどれか。", "choices": ["各トピックの分類の説明（どのような依頼がそのトピックに該当するか）を、区別がつくように具体的に書き直す", "エージェントを削除して、トピックを1つにまとめて作り直す", "「見積作成支援」トピックのアクションを、すべて「商談状況の確認」トピックにコピーする", "ユーザーのプロファイルを変更して、見積オブジェクトへのアクセス権を外す"], "answer": [0], "explanation": "エージェントはユーザーの発話と各トピックの分類の説明を照らし合わせて、どのトピックで対応するかを判断する。振り分けが誤る場合は、分類の説明や対象範囲を具体的にし、トピック同士の違いがはっきりするよう見直すのが基本である。", "choiceNotes": ["振り分けの判断に使われる分類の説明を改善するのが最も適切である。", "作り直しは過剰で、振り分けの原因も特定できない。", "アクションを重複させるとトピックの役割があいまいになる。", "アクセス権を外すと必要な業務ができなくなる。"], "ref": "Salesforce ヘルプ: Agentforce のトピック / Agent Builder"}, {"id": "AI3-012", "domain": "予測AI・生成AI", "topic": "フローをエージェントアクションにする条件", "q": "管理者は、商談の情報から次回訪問の ToDo を作成する自動起動フローを、Agentforce のエージェントアクションとして使いたい。エージェントが商談IDを渡し、作成した ToDo の件名を受け取れるようにするための準備として最も適切なものはどれか。", "choices": ["フローを画面フローに変更し、すべての値をユーザーに画面で入力させる", "フローの変数のうち商談IDを「入力で使用可能」、ToDo の件名を「出力で使用可能」に設定し、フローを有効化する", "フローを無効化した状態でアクションに登録する", "フローの変数名をすべて英語の大文字にすれば自動的に入出力が連携される"], "answer": [1], "explanation": "フローをエージェントアクションとして呼び出すには、エージェントとやり取りする値を入力・出力として公開した変数にしておく必要がある。アクションの説明や入出力の説明もエージェントが判断する材料になるため、わかりやすく書いておくとよい。", "choiceNotes": ["エージェントアクションでは自動起動フローを利用でき、画面入力に切り替える必要はない。", "入出力を公開した変数を用意し、有効化するのが正しい準備である。", "無効なフローは実行できない。", "変数名の書き方で入出力が決まるわけではない。"], "ref": "Salesforce ヘルプ: エージェントアクションの作成（フロー）"}, {"id": "AI3-013", "domain": "予測AI・生成AI", "topic": "Apex をエージェントアクションにする", "q": "開発チームは、基幹システムの在庫数を問い合わせる既存の Apex ロジックを、Agentforce のエージェントから呼び出したい。Apex をエージェントアクションとして使うための前提として最も適切なものはどれか。", "choices": ["Apex クラスのメソッドを呼び出し可能メソッド（@InvocableMethod）として公開する", "Apex トリガーとして実装し、在庫オブジェクトの更新時に動かす", "Apex を Visualforce ページに埋め込み、エージェントに URL を渡す", "Apex のコードをプロンプトテンプレートの本文にそのまま貼り付ける"], "answer": [0], "explanation": "Apex をエージェントアクションとして登録するには、フローなどと同様に呼び出し可能メソッドとして公開する必要がある。入力と出力に説明を付けておくと、エージェントが適切なタイミングでアクションを選びやすくなる。", "choiceNotes": ["呼び出し可能メソッドがエージェントアクションに登録する前提である。", "トリガーはデータ変更で動くもので、エージェントから直接呼び出せない。", "Visualforce ページの URL はアクションにならない。", "プロンプト本文に貼り付けたコードは実行されない。"], "ref": "Salesforce ヘルプ: エージェントアクションの作成（Apex）"}, {"id": "AI3-014", "domain": "予測AI・生成AI", "topic": "指示だけに頼らない業務ルールの実装", "q": "Agentforce のエージェントに「値引率が20%を超える場合は商談を更新しない」というルールを守らせたい。トピックの指示に書き込むだけでは、まれに守られないことが心配である。最も確実な設計はどれか。", "choices": ["同じ指示をトピックの指示に何度も繰り返し書く", "値引率のチェックを商談を更新するフローや Apex アクションの中に組み込み、条件を満たさない場合は更新しないようにする", "エージェントの名前に「20%ルール厳守」と付ける", "ユーザーに、20%を超える依頼をしないよう口頭で周知するだけにする"], "answer": [1], "explanation": "トピックの指示は大規模言語モデルが解釈するため、表現次第で判断がぶれる可能性がある。必ず守るべき業務ルールは、アクションの処理（フローや Apex）や入力規則など決まった結果になる仕組みで実装し、指示は補助的に使うのが確実である。", "choiceNotes": ["指示を繰り返してもモデルの解釈に頼る点は変わらない。", "アクション内でチェックすれば、エージェントの判断に関係なくルールが守られる。", "名前はルールの強制にならない。", "周知だけではシステム上の担保にならない。"], "ref": "Salesforce ヘルプ: Agentforce のトピックの指示 / エージェントアクション"}, {"id": "AI3-015", "domain": "予測AI・生成AI", "topic": "エージェントのテストと評価", "q": "Agentforce の社員向けエージェントを本番に展開する前に、代表的な質問50件について、想定どおりのトピックとアクションが選ばれるかをまとめて確認したい。最も適切な方法はどれか。", "choices": ["本番で営業担当者に使ってもらい、問い合わせがあった不具合だけを修正する", "Agentforce Testing Center でテストケース（発話と期待するトピック・アクション・結果）を用意し、一括でテストを実行して結果を評価する", "エージェントのトピックをすべて削除してから展開し、使われ方を見て後から追加する", "管理者が1件だけ質問して、正しく答えれば全体が問題ないと判断する"], "answer": [1], "explanation": "Agentforce Testing Center では、発話と期待されるトピック・アクション・結果をまとめたテストを一括で実行し、エージェントの振る舞いを評価できる。Agent Builder のプレビューで個別の会話を確認したうえで、まとまった件数で回帰的にテストしてから展開するのが望ましい。", "choiceNotes": ["本番利用者を検証に使うのはリスクが高い。", "一括テストで期待どおりの振る舞いを体系的に確認できる。", "トピックがないとエージェントは業務に対応できない。", "1件の確認では網羅的な評価にならない。"], "ref": "Salesforce ヘルプ: Agentforce Testing Center"}, {"id": "AI3-016", "domain": "予測AI・生成AI", "topic": "Agent Builder のプレビューでの確認", "q": "管理者が Agent Builder でエージェントを調整している。ある質問に対して想定外のアクションが実行されたため、エージェントがどのトピックを選び、どのアクションをどの順で呼んだのかを確認したい。最も適切な方法はどれか。", "choices": ["Agent Builder の会話プレビューで、エージェントの推論の過程（選ばれたトピック、呼び出されたアクション、入出力）を確認する", "設定変更履歴（Setup Audit Trail）でエージェントの会話内容を確認する", "デバッグログを無効にしてから同じ質問を繰り返す", "エージェントを無効化し、ユーザーの画面のスクリーンショットを集める"], "answer": [0], "explanation": "Agent Builder のプレビューでは、エージェントがどのトピックを選択し、どのアクションをどの入力で実行したかといった計画の流れを確認できる。指示やアクションの説明を修正しながら同じ質問で再確認することで、効率的に調整できる。", "choiceNotes": ["プレビューで推論の過程を確認できるため最も適切である。", "設定変更履歴は設定の変更を記録するもので、会話の推論過程は表示しない。", "ログを無効にしても調査には役立たない。", "スクリーンショットでは内部の判断過程がわからない。"], "ref": "Salesforce ヘルプ: Agent Builder でのエージェントのテスト"}, {"id": "AI3-017", "domain": "予測AI・生成AI", "topic": "社員向けエージェントの実行権限", "q": "情報システム部門から「営業担当者が Agentforce アシスタントに他部門の商談を尋ねたら、本来見られない情報まで答えてしまうのではないか」という懸念が出た。社員向けアシスタントの動作の説明として最も適切なものはどれか。", "choices": ["アシスタントはシステム管理者の権限で動作するため、全商談が回答対象になる", "社員向けアシスタントは利用しているユーザーの権限と共有設定の範囲で動作するため、ユーザーが参照できないレコードの情報は扱われない", "アシスタントは Salesforce のデータを一切参照しないため、懸念は当てはまらない", "アシスタントを使うユーザーには、すべての「すべてのデータの参照」権限を付与する必要がある"], "answer": [1], "explanation": "社員向けのアシスタントは操作しているユーザーのコンテキストで動作し、オブジェクト権限、項目レベルセキュリティ、共有設定が適用される。そのため、既存のセキュリティモデルを適切に設計しておくことがAI活用の前提になる。", "choiceNotes": ["管理者権限で動作するわけではない。", "ユーザーの権限と共有設定が適用されるという正しい説明である。", "レコードの要約などで Salesforce のデータを参照する。", "過剰な権限付与は不要で、セキュリティ上も望ましくない。"], "ref": "Salesforce ヘルプ: Agentforce アシスタントのセキュリティ / Einstein Trust Layer"}, {"id": "AI3-018", "domain": "予測AI・生成AI", "topic": "項目生成テンプレートと動的フォーム", "q": "管理者は、商談の「次のステップ案」というロングテキスト項目に、ボタン操作で生成AIの提案文を入力できるようにしたい。Prompt Builder で項目生成テンプレートを作成した。ユーザーの画面で使えるようにするために必要な作業はどれか。", "choices": ["商談の Lightning レコードページで動的フォームを使用し、対象項目に項目生成テンプレートを割り当てる", "ページレイアウトに Visualforce ページを追加し、テンプレート名を表示する", "テンプレートを営業メールテンプレートに変換してから、メール作成画面に追加する", "対象項目を数式項目に変更し、数式にテンプレート名を入力する"], "answer": [0], "explanation": "項目生成テンプレートは、動的フォームを使った Lightning レコードページの項目に割り当てて利用する。割り当て後、ユーザーは項目の編集時にAIで文章を生成し、内容を確認・修正してから保存できる。", "choiceNotes": ["動的フォームの項目にテンプレートを割り当てるのが正しい手順である。", "Visualforce ページでは項目生成テンプレートは使えない。", "営業メールテンプレートは用途が異なる。", "数式項目には生成テキストを保存できない。"], "ref": "Salesforce ヘルプ: Prompt Builder の項目生成テンプレート"}, {"id": "AI3-019", "domain": "予測AI・生成AI", "topic": "フレックステンプレートの用途", "q": "マーケティング部門は、キャンペーンと取引先の両方の情報を入力として受け取り、業界別のイベント招待文を生成するプロンプトを作りたい。生成はフローから呼び出す予定である。最も適したテンプレート種類はどれか。", "choices": ["営業メール", "項目生成", "レコードの要約", "フレックス"], "answer": [3], "explanation": "フレックステンプレートは、複数のオブジェクトなど任意の入力を定義でき、フローや Apex、エージェントアクションから呼び出して使える汎用的なテンプレートである。特定のレコードページやメール作成画面に結び付かない用途に適している。", "choiceNotes": ["営業メールはメール作成画面での下書き作成向けで、今回のフロー連携の汎用用途には合わない。", "項目生成はレコードページの特定項目への入力用である。", "レコードの要約は1件のレコードの要約用途である。", "複数の入力を定義でき、フローから呼び出せるため最適である。"], "ref": "Salesforce ヘルプ: Prompt Builder のプロンプトテンプレートの種類"}, {"id": "AI3-020", "domain": "予測AI・生成AI", "topic": "フローによるグラウンディング", "q": "営業メールテンプレートで、商談に関連する直近3件の未完了ケースのうち、優先度が「高」のものだけを要約してプロンプトに含めたい。標準の差し込み項目では条件付きの絞り込みができない。最も適切な方法はどれか。", "choices": ["プロンプトテンプレートから呼び出すフロー（テンプレートトリガー型プロンプトフロー）で対象ケースを取得・整形し、その結果をグラウンディングとして差し込む", "ユーザーに毎回ケース番号をメール本文に手入力させる", "ケースオブジェクトの共有設定を非公開にする", "テンプレート本文に「重要なケースだけを考慮して」と書けば、モデルが自動的にケースを検索する"], "answer": [0], "explanation": "Prompt Builder では、差し込み項目や関連リストに加えて、フローや Apex を使ったグラウンディングが可能である。条件で絞り込んだデータや整形したデータが必要な場合は、フローで取得した結果をプロンプトに差し込むのが適切である。", "choiceNotes": ["フローで条件付きのデータを取得してグラウンディングできる。", "手入力は非効率で、プロンプトの品質も安定しない。", "共有設定の変更はグラウンディングとは関係がない。", "モデルは指示だけでは組織のデータを検索しない。データを差し込む必要がある。"], "ref": "Salesforce ヘルプ: Prompt Builder のフローを使ったグラウンディング"}, {"id": "AI3-021", "domain": "予測AI・生成AI", "topic": "プロンプトテンプレートの検証と有効化", "q": "管理者は既存の営業メールテンプレートの指示を改善したい。営業担当者が使っている現行の内容に影響を与えずに、新しい指示を試してから切り替えたい。最も適切な進め方はどれか。", "choices": ["現行のテンプレートを削除し、新しいテンプレートを同じ名前で作り直す", "テンプレートの新しいバージョンを作成し、サンプルレコードでプレビューして結果を確認してから、そのバージョンを有効化する", "営業担当者全員に、改善が終わるまで生成機能を使わないよう依頼し、本番で直接編集する", "テンプレートの指示を空欄にして、モデルに自由に生成させる"], "answer": [1], "explanation": "プロンプトテンプレートはバージョンを管理でき、有効なバージョンがユーザーに使われる。新しいバージョンをサンプルレコードでプレビューし、グラウンディングされたデータや応答を確認してから有効化すれば、利用中の内容に影響を与えずに改善できる。", "choiceNotes": ["削除すると利用中の機能が止まり、元に戻せなくなる。", "バージョン管理とプレビューを使った安全な進め方である。", "利用停止の依頼は業務に影響し、本番での直接編集もリスクがある。", "指示がないと出力の品質と一貫性を保てない。"], "ref": "Salesforce ヘルプ: Prompt Builder でのテンプレートのテストと有効化"}, {"id": "AI3-022", "domain": "予測AI・生成AI", "topic": "Prompt Builder の権限", "q": "管理者は、一部の営業企画担当者にプロンプトテンプレートの作成・編集を任せ、一般の営業担当者にはテンプレートの実行だけを許可したい。最も適切な権限の付与方法はどれか。", "choices": ["全員にシステム管理者プロファイルを割り当てる", "営業企画担当者には Prompt Template Manager 権限セット、営業担当者には Prompt Template User 権限セットを割り当てる", "営業担当者には Prompt Template Manager 権限セットだけを割り当て、営業企画担当者には権限を付与しない", "権限は不要で、Einstein を有効にすれば全員が作成・編集できる"], "answer": [1], "explanation": "Prompt Builder では、テンプレートを作成・管理する権限と、テンプレートを実行する権限が分かれている。最小権限の原則に沿って、役割に応じた権限セットを割り当てるのが適切である。", "choiceNotes": ["過剰な権限であり、最小権限の原則に反する。", "役割に応じた権限セットの割り当てとして適切である。", "割り当てが逆であり、要件を満たさない。", "作成や実行には適切な権限が必要である。"], "ref": "Salesforce ヘルプ: Prompt Builder の権限セット"}, {"id": "AI3-023", "domain": "予測AI・生成AI", "topic": "Trust Layer のデータマスキング", "q": "個人情報保護担当者から「プロンプトに含まれる顧客の電話番号やメールアドレスが、そのまま外部の大規模言語モデルに送られるのが心配だ」という指摘があった。Einstein Trust Layer のどの機能がこの懸念に最も直接的に対応するか。", "choices": ["毒性の検出", "データマスキング", "監査証跡", "動的グラウンディング"], "answer": [1], "explanation": "データマスキングは、プロンプト内の個人情報など機密性の高いデータを検出してプレースホルダーに置き換えてから大規模言語モデルに送信し、応答を受け取った後に元の値へ戻す機能である。マスキングの対象とするデータの種類は設定で調整できる。 なお、Agentforce のエージェント（計画やアクションの実行を伴う会話）ではLLM向けのデータマスキングは無効化されており、マスキングが適用されるのは Prompt Builder のテンプレート実行など、エージェント以外の生成AI機能である。エージェントでは、ゼロデータリテンションやオブジェクト・項目レベルのアクセス制御などで保護する。", "choiceNotes": ["毒性の検出は有害な表現の評価で、個人情報の送信を防ぐものではない。", "機密データを置き換えて送信する機能であり、懸念に直接対応する。", "監査証跡は記録のための機能で、送信内容自体は変えない。", "動的グラウンディングはデータを安全に差し込む仕組みで、マスキングとは異なる。"], "ref": "Salesforce ヘルプ: Einstein Trust Layer のデータマスキング"}, {"id": "AI3-024", "domain": "予測AI・生成AI", "topic": "Trust Layer のゼロデータリテンション", "q": "顧客企業のセキュリティ審査で「生成AIの利用時に送ったデータが、外部のLLMプロバイダーのモデルの学習に使われたり保存されたりしないか」と質問された。回答の根拠となる Einstein Trust Layer の考え方として最も適切なものはどれか。", "choices": ["ゼロデータリテンション：Salesforce と契約したLLMプロバイダーとの間で、プロンプトと応答がプロバイダー側で保存・学習に使われない取り決めがある", "監査証跡：すべてのプロンプトがLLMプロバイダーの学習データとして保存される", "毒性スコア：有害度が低いデータだけがプロバイダーに保存される", "データマスキング：マスキングしたデータはプロバイダーが無期限に保存する"], "answer": [0], "explanation": "Einstein Trust Layer のゼロデータリテンションは、外部のLLMプロバイダーがプロンプトや応答を保持したり、モデルの学習に使ったりしないことを契約上担保する考え方である。一方、監査証跡は顧客自身の組織側でAI利用を記録するための仕組みである。", "choiceNotes": ["質問に直接答える、ゼロデータリテンションの正しい説明である。", "監査証跡は顧客側の記録で、プロバイダーの学習に使う仕組みではない。", "毒性スコアは応答などの有害性の評価で、保存可否を決める仕組みではない。", "マスキングしたデータをプロバイダーが保存するという説明は誤りである。"], "ref": "Salesforce ヘルプ: Einstein Trust Layer / Trailhead: The Einstein Trust Layer"}, {"id": "AI3-025", "domain": "予測AI・生成AI", "topic": "Trust Layer の監査証跡と毒性", "q": "コンプライアンス部門から、生成AIの導入後に次の2点を求められた。(a) 後から、どのようなプロンプトが送られ、どのような応答が返ったかを確認できること。(b) 応答に有害・不適切な表現が含まれていないかを評価できること。それぞれに対応する Einstein Trust Layer の機能の組み合わせとして正しいものはどれか。2つ選択してください。", "choices": ["(a) には監査証跡（プロンプト・応答・評価結果などの記録）が対応する", "(b) には毒性の検出（応答の有害性のスコア付け）が対応する", "(a) にはゼロデータリテンションが対応する", "(b) にはデータマスキングが対応する", "(a) と (b) はどちらも Einstein リードスコアリングで対応する"], "answer": [0, 1], "explanation": "Einstein Trust Layer では、プロンプトや応答、毒性スコア、ユーザーのフィードバックなどを監査用のデータとして記録し、後から確認できる。毒性の検出は応答の有害性を評価してスコア化する機能であり、記録されたデータと合わせて品質やリスクの監視に使える。", "choiceNotes": ["監査証跡でプロンプトと応答を後から確認できる。", "毒性の検出で有害な表現を評価できる。", "ゼロデータリテンションはプロバイダー側でデータを保持しない仕組みで、記録の確認ではない。", "データマスキングは機密データの置き換えで、有害表現の評価ではない。", "リードスコアリングは予測AIで、生成AIの監査とは無関係である。"], "ref": "Salesforce ヘルプ: Einstein Trust Layer の監査証跡と毒性の検出"}, {"id": "AI3-026", "domain": "予測AI・生成AI", "topic": "Data Cloud と RAG", "q": "営業担当者が顧客からの技術的な質問に答えられるよう、社内の製品マニュアル（PDFなどの非構造化データ）の内容をもとに、生成AIが根拠のある回答を作れるようにしたい。最も適切な構成はどれか。", "choices": ["マニュアルを Data Cloud に取り込んで検索インデックスを作成し、リトリーバーを使って関連する内容をプロンプトに取り込む（RAG）", "マニュアルの全文をプロンプトテンプレートの本文に毎回手で貼り付ける", "商談スコアリングの学習データにマニュアルを追加する", "マニュアルを添付ファイルとして商談に保存すれば、モデルが自動的にすべての内容を学習する"], "answer": [0], "explanation": "RAG（検索拡張生成）は、質問に関連する情報を検索してプロンプトに加え、その内容に基づいて回答を生成する手法である。Data Cloud で非構造化データの検索インデックスを作成し、リトリーバーを Prompt Builder やエージェントから使うことで、組織固有の知識に根拠を置いた回答が可能になる。 なお、Data Cloud は2025年10月に Data 360 へ名称変更されたが、機能は同じである。", "choiceNotes": ["Data Cloud の検索とリトリーバーによる RAG が適切な構成である。", "手作業の貼り付けは保守できず、関連部分の抽出もできない。", "商談スコアリングは予測AIで、文章の回答生成には使えない。", "添付しただけではモデルが学習・参照することはない。"], "ref": "Salesforce ヘルプ: Data Cloud のベクトル検索とリトリーバー / Prompt Builder"}, {"id": "AI3-027", "domain": "予測AI・生成AI", "topic": "Data Cloud とAIの関係", "q": "ある企業は、Salesforce の商談データに加えて、Webサイトの行動履歴や基幹システムの購買履歴も生成AIの回答や予測に活用したいと考えている。Data Cloud の役割として適切な説明はどれか。2つ選択してください。", "choices": ["複数のデータソースを取り込み、顧客単位に統合したデータを生成AIのグラウンディングに使えるようにする", "データグラフなどで関連するデータをまとめ、プロンプトやエージェントから素早く参照できるようにする", "Data Cloud を導入すると、Salesforce 上の共有設定やアクセス権が不要になる", "Data Cloud は予測AI専用で、生成AIとは連携できない", "Data Cloud に取り込んだデータは、外部のLLMプロバイダーの学習データとして自動提供される"], "answer": [0, 1], "explanation": "Data Cloud は社内外のさまざまなデータを取り込み、統合したプロファイルとして扱えるようにする。そのデータをデータグラフやリトリーバーなどを通じてプロンプトテンプレートやエージェントに提供することで、より文脈に沿った生成AIの応答が可能になる。 なお、Data Cloud は2025年10月に Data 360 へ名称変更されたが、機能は同じである。", "choiceNotes": ["複数ソースの統合データをグラウンディングに使える。", "データグラフで関連データをまとめて参照しやすくできる。", "アクセス権の考え方が不要になるわけではない。", "Data Cloud は生成AIのグラウンディングでも中心的な役割を担う。", "Trust Layer のゼロデータリテンションの考え方に反し、誤りである。"], "ref": "Trailhead: Data Cloud for Agentforce / Salesforce ヘルプ: データグラフ"}, {"id": "AI3-028", "domain": "予測AI・生成AI", "topic": "AI導入時の期待値調整", "q": "Einstein 商談スコアリングと生成メールを導入する直前、営業担当者の間で「AIのスコアが低い商談は追わなくていい」「AIが書いたメールはそのまま送ればいい」という受け止め方が広がっている。コンサルタントが導入計画に盛り込むべき対応として最も適切なものはどれか。", "choices": ["AIの出力は判断を支援する材料であり、最終判断と送信前の確認は人が行うことを、具体的な使い方の例とともにトレーニングで伝え、パイロットで利用状況とフィードバックを集める", "誤解は使っているうちに解消するため、特に説明せずに全社展開する", "誤解を避けるため、AI機能の存在を営業担当者に知らせずに有効化する", "スコアが低い商談は自動で失注にするルールを作り、受け止め方に合わせる"], "answer": [0], "explanation": "AI導入の成功には、AIで何ができて何ができないかを利用者に正しく理解してもらう期待値の調整が欠かせない。役割の説明、具体的な使い方のトレーニング、パイロットでのフィードバック収集と改善を組み合わせたチェンジマネジメントが有効である。", "choiceNotes": ["期待値の調整とチェンジマネジメントの両方を押さえた適切な対応である。", "誤解を放置すると、誤った判断や不適切なメール送信につながる。", "透明性を欠き、利用も定着しない。", "予測を確定事項として扱う誤った運用であり、機会損失を招く。"], "ref": "Trailhead: Change Management for AI Adoption / Responsible Creation of Artificial Intelligence"}, {"id": "AI3-029", "domain": "予測AI・生成AI", "topic": "AIの透明性と説明責任", "q": "営業マネージャーが Einstein のスコアを担当者の評価面談で使い始めたところ、「なぜこのスコアなのか説明されないまま評価されるのは納得できない」という声が上がった。信頼されるAI活用の観点から最も適切な対応はどれか。", "choices": ["スコアの算出ロジックは機密なので、説明せずに引き続き評価に使う", "スコアと合わせて寄与要因を示して根拠を共有し、スコアは人事評価を自動的に決めるものではなく、人が総合的に判断する材料の一つであると位置づけを明確にする", "苦情が出たため、すべてのユーザーからスコアを非表示にして、マネージャーだけが評価に使う", "スコアが低い担当者の商談を自動的に別の担当者へ再割り当てする"], "answer": [1], "explanation": "信頼されるAIの活用には、結果の根拠を示す透明性と、最終判断に人が責任を持つ説明責任が重要である。寄与要因を使って根拠を共有し、AIの出力をどの判断にどこまで使うかを明確にすることで、利用者の納得感と適切な活用につながる。", "choiceNotes": ["説明のない評価は透明性に欠け、信頼を損なう。", "透明性と人による説明責任を確保した適切な対応である。", "見えないところでスコアを評価に使うのは、さらに透明性を下げる。", "AIの出力だけで人に影響する決定を自動化するのは不適切である。"], "ref": "Trailhead: Responsible Creation of Artificial Intelligence / Salesforce の信頼されるAIの原則"}, {"id": "AI3-030", "domain": "予測AI・生成AI", "topic": "生成結果の品質改善のフィードバック", "q": "Prompt Builder のレコード要約テンプレートを導入して1か月が経過した。営業担当者からは「要約が長すぎる」「重要な競合情報が抜けている」という声が個別に寄せられている。継続的な改善の進め方として最も適切なものはどれか。2つ選択してください。", "choices": ["生成結果に対するユーザーのフィードバックや監査用のデータを確認し、どのような不満が多いかを把握する", "把握した課題をもとに、指示（長さや含めるべき観点）やグラウンディングする項目・関連リストを見直した新バージョンを作成し、プレビューで検証してから有効化する", "不満が出たため、生成AIの機能を全面的に停止する", "モデルの温度などの設定を変えれば、グラウンディングされていない競合情報も正確に補える", "営業担当者に、要約を確認せずにそのまま顧客へ転送するよう指示する"], "answer": [0, 1], "explanation": "生成AIの品質は、利用者のフィードバックや記録されたデータを分析し、指示やグラウンディングを改善するサイクルで高めていく。必要な情報が抜けている場合は、その情報をグラウンディングに含めることが基本で、変更はバージョンを分けてプレビューで確認してから展開する。", "choiceNotes": ["フィードバックとデータの確認は改善の出発点になる。", "指示とグラウンディングの見直しを安全に展開する適切な手順である。", "全面停止は過剰で、改善の機会も失う。", "参照データにない情報をモデルの設定だけで正確に補うことはできず、事実と異なる内容の生成を招く。", "人によるレビューを省くのは不適切である。"], "ref": "Salesforce ヘルプ: Prompt Builder / Einstein Trust Layer のフィードバックと監査データ"}, {"id": "CI-001", "domain": "コンサルティングおよび実装戦略", "topic": "ディスカバリーの進め方", "q": "ある製造業の企業では、営業部門がスプレッドシートとメールで商談を管理しており、Sales Cloud の導入を決定した。キックオフ直後、営業本部長は「すぐに画面を作り始めてほしい」と要望している。コンサルタントは最初に何を行うべきか？", "choices": ["標準の商談ページレイアウトを先に構築し、営業担当者に触ってもらいながら要件を集める", "主要な部門の担当者へのインタビューやワークショップを通じて現状の営業プロセスと課題を把握する", "AppExchange で評価の高い営業管理アプリをインストールして要件の代わりとする", "既存のスプレッドシートの列をそのままカスタム項目として作成する"], "answer": [1], "explanation": "実装の最初の段階はディスカバリーであり、現状の業務プロセス・課題・目標を把握することが設計の前提となる。現状を理解せずに構築を始めると、手戻りや定着しないシステムにつながる。ステークホルダーの期待に応えつつも、短期間のディスカバリーを先行させるべきである。", "choiceNotes": ["要件を把握する前に構築を始めると、プロセスに合わない設計や手戻りを招く。", "現状プロセスと課題の把握はディスカバリーの中核であり、最初に行うべき活動である。", "要件を定義せずにアプリを導入しても、ビジネス課題を解決できる保証はない。", "既存のスプレッドシートを複製するだけでは、非効率なプロセスをそのまま移植してしまう。"], "ref": "Trailhead: Salesforce ビジネスアナリストのディスカバリー / 要件の引き出し"}, {"id": "CI-002", "domain": "コンサルティングおよび実装戦略", "topic": "ユーザーストーリーと受け入れ基準", "q": "ある企業では、要件定義の段階で「営業マネージャーとして、部下の停滞している商談を把握したい」という要望が挙がった。開発チームとテストチームが同じ理解で作業できるようにするため、コンサルタントはこの要件をどのように文書化すべきか？", "choices": ["システムの技術仕様書として項目のAPI参照名のみを記載する", "要望をそのまま議事録に残し、構築者の解釈に任せる", "「停滞」の定義（例: 30日間フェーズ変更なし）を含む受け入れ基準を持つユーザーストーリーとして記述する", "ダッシュボードのスクリーンショットを先に作成し、要件の代わりとする"], "answer": [2], "explanation": "ユーザーストーリーは「誰が・何を・なぜ」を表現し、受け入れ基準によって完了条件を検証可能にする。「停滞」のような曖昧な語を具体的な条件に落とし込むことで、構築とテストの解釈のずれを防げる。", "choiceNotes": ["項目名だけではビジネス上の目的や完了条件が伝わらない。", "解釈を構築者に委ねると、期待とのずれが発生しやすい。", "測定可能な受け入れ基準付きのユーザーストーリーにより、構築とテストが同じ基準で判断できる。", "画面イメージは補助にはなるが、完了条件を定義する要件の代わりにはならない。"], "ref": "Trailhead: ユーザーストーリーの作成 / 受け入れ基準"}, {"id": "CI-003", "domain": "コンサルティングおよび実装戦略", "topic": "ステークホルダー管理", "q": "ある企業の Sales Cloud 導入プロジェクトでは、営業部門とマーケティング部門がリードの受け渡し基準で対立し、要件が確定しない状態が続いている。両部門とも自部門の基準を譲らない。コンサルタントは何を推奨すべきか？", "choices": ["プロジェクトのエグゼクティブスポンサーを交えて、ビジネス目標に基づき意思決定を行う場を設ける", "両部門の基準をそれぞれ別のリードレコードタイプとして実装し、対立を回避する", "コンサルタントが技術的に実装しやすい方の基準を採用する", "要件が確定するまでリード管理の範囲をプロジェクトから外し、議論を無期限に保留する"], "answer": [0], "explanation": "部門間で利害が対立する場合、組織全体の目標に照らして判断できる権限を持つエグゼクティブスポンサーの関与が有効である。意思決定の仕組み（ガバナンス）を通じて合意を形成することで、プロジェクトの停滞を防げる。", "choiceNotes": ["権限を持つスポンサーによる意思決定は、部門間の対立解消に適したガバナンス手段である。", "対立を技術で回避すると、一貫性のないプロセスとデータが生まれる。", "実装の容易さはビジネス上の判断基準として適切ではない。", "無期限の保留はスケジュールとスコープに悪影響を与え、問題を解決しない。"], "ref": "Trailhead: ステークホルダーの特定と管理 / プロジェクトガバナンス"}, {"id": "CI-004", "domain": "コンサルティングおよび実装戦略", "topic": "現状とあるべき姿（ギャップ分析）", "q": "ある企業では、見積承認に平均5日かかっており、営業担当者が承認状況を電話で確認している。経営層は承認リードタイムを1日以内にしたいと考えている。コンサルタントが設計に入る前に実施すべき分析として最も適切なものはどれか？", "choices": ["競合他社が使用している承認ツールの一覧を作成する", "全営業担当者に Salesforce のモバイルアプリをインストールさせる", "承認プロセスを削除し、すべての見積を自動承認にする", "現状（As-Is）の承認フローを可視化し、あるべき姿（To-Be）との差分と遅延の原因を特定する"], "answer": [3], "explanation": "ギャップ分析では、現状のプロセスを可視化して課題の根本原因を特定し、目標とするあるべき姿との差分を明らかにする。これにより、どの機能や業務変更で目標を達成するかを根拠を持って設計できる。", "choiceNotes": ["他社のツール調査は自社の遅延原因の特定にはつながらない。", "モバイルアプリの導入は手段の一つにすぎず、原因分析の前に決めるべきではない。", "統制上必要な承認を一律に廃止するのは、ビジネスリスクを無視した極端な対応である。", "As-Is と To-Be の比較と原因の特定は、設計の前に行うべき基本的な分析である。"], "ref": "Trailhead: ビジネスプロセスマッピング / As-Is と To-Be の分析"}, {"id": "CI-005", "domain": "コンサルティングおよび実装戦略", "topic": "ユーザー受け入れテスト（UAT）", "q": "ある企業では、Sales Cloud の構築とシステムテストが完了し、本番リリースまで3週間となった。プロジェクトマネージャーは、業務部門がシステムを承認したことを確認する手順を求めている。コンサルタントは何を推奨すべきか？", "choices": ["開発者が作成した単体テストのカバー率を報告して承認とする", "実際の業務シナリオに基づくテストケースを用いて、業務部門の代表ユーザーが Sandbox でユーザー受け入れテストを実施する", "本番環境に直接リリースし、問題があればユーザーからの問い合わせで対応する", "コンサルタントが全テストケースを代行して実行し、結果を業務部門に共有する"], "answer": [1], "explanation": "ユーザー受け入れテスト（UAT）は、実際の業務を担うユーザーが業務シナリオに沿ってシステムを検証し、要件を満たしていることを確認する工程である。本番相当のデータを持つ Sandbox で実施することで、リリース前に業務上の問題を発見できる。", "choiceNotes": ["単体テストのカバー率は技術的な品質指標であり、業務部門の受け入れを示すものではない。", "業務ユーザーが実際のシナリオで検証することがUATの目的である。", "受け入れを確認せずに本番リリースすると、業務停止などのリスクが高い。", "コンサルタントによる代行では業務部門自身の受け入れ確認にならない。"], "ref": "Salesforce ヘルプ: アプリケーションライフサイクル管理 / Trailhead: テスト戦略"}, {"id": "CI-006", "domain": "コンサルティングおよび実装戦略", "topic": "パイロット展開", "q": "ある企業では、全国12支店・800名の営業担当者に Sales Cloud を展開する予定である。新しい商談管理プロセスが現場で機能するか不安があり、全社展開前にリスクを抑えたいと考えている。コンサルタントは何を推奨すべきか？", "choices": ["全支店に同日一斉展開し、問題を一度にすべて洗い出す", "展開を延期し、要件定義をもう一度最初からやり直す", "1〜2支店でパイロット展開を行い、フィードバックを収集して改善した後に段階的に展開する", "展開前に全機能を Sandbox で凍結し、本番では変更を一切受け付けない"], "answer": [2], "explanation": "パイロット展開は、限られたユーザーで実運用を行い、プロセスやトレーニングの課題を早期に発見する手法である。得られたフィードバックを反映してから段階的に展開することで、全社展開時のリスクと混乱を低減できる。", "choiceNotes": ["一斉展開では問題発生時の影響範囲が全社に及び、リスクが最も高い。", "懸念があるからといって要件定義をやり直す根拠はなく、スケジュールを大きく損なう。", "パイロットで検証し改善してから段階展開するのは、リスク低減の標準的な手法である。", "変更を一切受け付けないと、現場からのフィードバックを反映できない。"], "ref": "Trailhead: ユーザー導入戦略 / 展開計画"}, {"id": "CI-007", "domain": "コンサルティングおよび実装戦略", "topic": "トレーニング計画", "q": "ある企業では、Sales Cloud の稼働後に営業担当者の利用率が低いことが懸念されている。過去のシステム導入では、全員に同じ2時間の集合研修を実施しただけで定着しなかった。今回のトレーニング計画としてコンサルタントが推奨すべきことはどれか？（2つ選択してください）", "choices": ["営業担当者、マネージャー、オペレーション担当など役割ごとに内容を分けたトレーニングを実施する", "システム管理者向けの設定マニュアルを全営業担当者に配布する", "アプリ内ガイダンスやヘルプテキストを活用し、業務の流れの中で操作を支援する", "トレーニングは稼働の3か月前に一度だけ実施する", "トレーニングを省略し、ユーザーが自分で操作を覚えるのを待つ"], "answer": [0, 2], "explanation": "効果的なトレーニングは役割ごとの業務に即した内容であることが重要で、各ユーザーが自分の業務で何をすべきかを理解できる。また、アプリ内ガイダンスやヘルプテキストにより、作業中に必要な情報を提供することで定着を促進できる。", "choiceNotes": ["役割別のトレーニングは各ユーザーの業務に直結し、理解と定着を高める。", "管理者向けの設定情報は営業担当者の業務には不要で、混乱を招く。", "アプリ内ガイダンスは業務中の継続的な支援となり、定着に効果的である。", "稼働から離れすぎた一度きりの研修は記憶に残りにくい。", "トレーニングの省略は利用率低下の典型的な原因である。"], "ref": "Salesforce ヘルプ: アプリ内ガイダンス / Trailhead: ユーザートレーニング"}, {"id": "CI-008", "domain": "コンサルティングおよび実装戦略", "topic": "変更管理と定着の測定", "q": "ある企業では Sales Cloud 稼働から2か月が経過した。経営層は「現場が本当に使っているのか」を把握し、定着が遅れている部門に対策を打ちたいと考えている。コンサルタントは何を推奨すべきか？", "choices": ["ログイン状況やレコードの作成・更新状況を部門別に可視化する導入状況のレポートとダッシュボードを作成する", "全ユーザーのパスワードを毎週リセットしてログインを促す", "利用率の低い部門のユーザーライセンスを即時に削除する", "システムの利用状況は測定せず、四半期末の売上だけで評価する"], "answer": [0], "explanation": "変更管理では、定着状況を測定可能な形で把握し、課題のある部門に追加のトレーニングやサポートを行うことが重要である。ログイン履歴やレコードの作成・更新状況をレポートとダッシュボードで可視化することで、データに基づく対策が可能になる。", "choiceNotes": ["定着状況を測定・可視化することで、対策が必要な部門を特定できる。", "パスワードのリセットは利用促進にならず、ユーザーの不満を招く。", "ライセンス削除は原因分析や支援をせず、利用をさらに阻害する。", "売上だけでは利用状況や定着の課題を把握できない。"], "ref": "Trailhead: ユーザー導入の測定 / Salesforce ヘルプ: ログイン履歴"}, {"id": "CI-009", "domain": "コンサルティングおよび実装戦略", "topic": "Sandbox の種類（Full）", "q": "ある企業では、本番稼働前に本番と同等のデータ量を使ってパフォーマンステストと最終的なユーザー受け入れテストを行いたい。テストには本番のすべてのレコードと添付ファイルが必要である。コンサルタントはどの種類の Sandbox を推奨すべきか？", "choices": ["Developer Sandbox", "Developer Pro Sandbox", "Partial Copy Sandbox", "Full Sandbox"], "answer": [3], "explanation": "Full Sandbox は本番組織のメタデータとすべてのデータ（レコードや添付ファイルを含む）をコピーでき、パフォーマンステスト、負荷テスト、ステージングに適している。一方で更新間隔は29日と長い。", "choiceNotes": ["Developer Sandbox はメタデータのみをコピーし、本番データは含まれない。", "Developer Pro Sandbox もメタデータのみで、ストレージ容量が大きいだけである。", "Partial Copy Sandbox は Sandbox テンプレートで選択したデータのサンプルのみをコピーする。", "Full Sandbox は本番のすべてのデータをコピーでき、本番相当のテストに適している。"], "ref": "Salesforce ヘルプ: Sandbox の種類とテンプレート"}, {"id": "CI-010", "domain": "コンサルティングおよび実装戦略", "topic": "Sandbox の種類（Partial Copy）", "q": "ある企業では、トレーニング環境として本番の一部の取引先・商談データを含む Sandbox が必要である。トレーニングは毎週実施され、数日ごとに環境をリフレッシュしたい。Full Sandbox は契約に含まれていない。コンサルタントは何を推奨すべきか？", "choices": ["Developer Sandbox を作成し、毎回すべてのデータを手作業で入力する", "Sandbox テンプレートで対象オブジェクトを指定した Partial Copy Sandbox を使用する", "本番組織でトレーニング用のレコードを作成し、終了後に削除する", "Developer Pro Sandbox を作成し、本番データを自動でコピーするよう設定する"], "answer": [1], "explanation": "Partial Copy Sandbox は Sandbox テンプレートで選択したオブジェクトのデータのサンプルとメタデータをコピーでき、更新間隔は5日である。本番データの一部を使ったトレーニングやテストに適している。", "choiceNotes": ["Developer Sandbox にはデータがコピーされず、毎回の手入力は非効率である。", "Partial Copy Sandbox はテンプレートで選んだデータのサンプルを含み、5日ごとに更新できる。", "本番でのトレーニングは実データを汚染し、レポートや自動化に影響するリスクがある。", "Developer Pro Sandbox はメタデータのみをコピーし、本番データはコピーされない。"], "ref": "Salesforce ヘルプ: Sandbox の種類とテンプレート / Sandbox テンプレートの作成"}, {"id": "CI-011", "domain": "コンサルティングおよび実装戦略", "topic": "変更セットによる展開", "q": "ある企業では、Sandbox で構築した商談の入力規則とページレイアウトを、変更セットを使って本番組織へリリースしたい。管理者は変更セットを初めて使用する。コンサルタントが説明すべき内容はどれか？（2つ選択してください）", "choices": ["変更セットを使用するには、送信元と送信先の組織間でリリース接続を設定し、受信側で受信変更セットを許可する必要がある", "変更セットは本番組織のレコードデータも一緒に移行できる", "変更セットは同じ本番組織に関連付けられた組織間（本番とその Sandbox など）でのみ使用できる", "変更セットは任意の他社の Salesforce 組織へも送信できる", "変更セットを使用すると、本番で削除したコンポーネントが Sandbox からも自動的に削除される"], "answer": [0, 2], "explanation": "変更セットは、本番組織とその Sandbox など、関連する組織間でメタデータをリリースするための仕組みである。利用にはリリース接続が必要で、受信側の組織で送信元からの受信変更セットを許可する設定を行う。データは移行対象に含まれない。", "choiceNotes": ["リリース接続の設定と受信側での許可は変更セット利用の前提条件である。", "変更セットはメタデータ（設定）を移行するもので、レコードデータは含まれない。", "変更セットは同じ本番組織に関連付けられた組織間でのみ利用できる。", "無関係な他社の組織へは変更セットを送信できない。", "変更セットはコンポーネントの削除を伝播しない。"], "ref": "Salesforce ヘルプ: 変更セット / リリース接続"}, {"id": "CI-012", "domain": "コンサルティングおよび実装戦略", "topic": "KPI定義と成功指標", "q": "ある企業の経営層は Sales Cloud 導入の目的として「営業生産性の向上」を掲げている。プロジェクトの成功を判断するため、コンサルタントはどのような成功指標を定義すべきか？（2つ選択してください）", "choices": ["導入前の値をベースラインとして測定した、商談の平均成約期間（日数）", "Salesforce に作成されたカスタム項目の総数", "導入前後で比較できる、営業担当者1人あたりの商談成約率", "プロジェクトで作成した設計書のページ数", "Sandbox の作成数"], "answer": [0, 2], "explanation": "成功指標はビジネス目標と結び付き、測定可能で、導入前のベースラインと比較できるものであるべきである。成約期間や成約率は営業生産性を直接反映する指標であり、導入効果の評価に適している。", "choiceNotes": ["ベースラインと比較できる成約期間は、生産性向上を測る測定可能な指標である。", "項目数はシステムの構成量であり、ビジネス成果を示さない。", "成約率は営業生産性に直結し、導入前後で比較できる成果指標である。", "設計書の量はプロジェクトの成果物の量であり、ビジネス価値を示さない。", "Sandbox の数は技術的な環境の数であり、成功指標にならない。"], "ref": "Trailhead: ビジネス価値の測定 / KPIの定義"}, {"id": "CI-013", "domain": "コンサルティングおよび実装戦略", "topic": "データ移行の順序", "q": "ある企業では、旧CRMから取引先、取引先責任者、商談、商談商品のデータを Salesforce に移行する計画を立てている。参照関係を正しく保持したまま移行するため、コンサルタントが推奨すべきロード順序はどれか？", "choices": ["商談商品 → 商談 → 取引先責任者 → 取引先", "商談 → 取引先 → 商談商品 → 取引先責任者", "取引先 → 取引先責任者 → 商談 → 商談商品", "取引先責任者 → 商談商品 → 取引先 → 商談"], "answer": [2], "explanation": "データ移行では、参照される側（親）のレコードを先にロードし、子レコードがその親を参照できるようにする必要がある。取引先を最初に、次にそれを参照する取引先責任者と商談、最後に商談を参照する商談商品をロードする。", "choiceNotes": ["子から先にロードすると、参照先の親レコードが存在せず関連付けできない。", "商談は取引先を参照するため、取引先より先にロードするのは不適切である。", "親から子の順でロードすることで参照関係を正しく設定できる。", "商談商品は商談を親とするため、商談より先にはロードできない。"], "ref": "Trailhead: データ移行計画 / Salesforce ヘルプ: データローダ"}, {"id": "CI-014", "domain": "コンサルティングおよび実装戦略", "topic": "データ移行ツールの選択", "q": "ある企業では、旧システムから約30万件の商談レコードを Salesforce に移行する必要がある。移行は事前にテストしたうえで、同じ手順を本番でも再実行したい。コンサルタントはどのツールを推奨すべきか？", "choices": ["データローダ", "データインポートウィザード", "レコードを1件ずつ手作業で入力する", "変更セット"], "answer": [0], "explanation": "データローダは大量のレコード（数百万件規模）のインポートに対応し、商談を含む標準・カスタムオブジェクトを扱える。設定を保存して繰り返し実行したり、コマンドラインで自動化したりできるため、テストと本番で同じ手順を再現しやすい。", "choiceNotes": ["データローダは大量データと商談オブジェクトに対応し、繰り返し実行にも適している。", "データインポートウィザードは一度に50,000件までで、商談のインポートには対応していない。", "30万件を手入力するのは非現実的で、誤りも発生しやすい。", "変更セットはメタデータを移行するもので、レコードデータは移行できない。"], "ref": "Salesforce ヘルプ: データのインポート方法の選択 / データローダ"}, {"id": "CI-015", "domain": "コンサルティングおよび実装戦略", "topic": "データ移行の設計", "q": "ある企業では、旧システムの取引先データを Salesforce に移行する。移行後も旧システムの顧客コードで再ロードや照合ができること、および旧システムでの作成日を Salesforce の作成日として保持することが求められている。コンサルタントは何を推奨すべきか？（2つ選択してください）", "choices": ["旧システムの顧客コードを格納する項目を外部IDとして定義し、upsert で移行する", "移行後に旧システムの顧客コードは削除し、Salesforce ID のみで管理する", "「レコード作成時に監査項目を設定」機能を有効化し、移行ユーザーに必要な権限を付与して作成日をロードする", "作成日は入力規則で旧システムの日付に自動変換する", "すべての取引先を一度削除し、毎回新規作成で再ロードする"], "answer": [0, 2], "explanation": "外部ID項目を使うと、旧システムのキーでレコードを特定して upsert でき、重複を防ぎつつ再ロードや照合が可能になる。作成日などの監査項目は通常は書き込めないが、「レコード作成時に監査項目を設定」を有効化し、権限を持つユーザーであれば作成時に値を設定できる。", "choiceNotes": ["外部IDと upsert により、旧システムのキーで照合・再ロードが可能になる。", "旧システムのキーを削除すると、移行後の照合やトレーサビリティが失われる。", "監査項目の設定機能と権限により、作成時に旧システムの作成日を保持できる。", "入力規則はデータの検証を行う機能であり、値を変換・設定することはできない。", "毎回削除して再作成するとIDが変わり、関連レコードや履歴が失われる。"], "ref": "Salesforce ヘルプ: 外部ID項目 / レコード作成時に監査項目を設定"}, {"id": "CI-016", "domain": "コンサルティングおよび実装戦略", "topic": "送信メッセージ", "q": "ある企業では、商談が「成立」になったときに、商談の情報を社内の受注管理システムへ自動送信したい。受注管理システムは SOAP の受信エンドポイントを提供している。開発コストを最小限に抑えたい一方で、送信に失敗した場合は自動的に再試行してほしい。コンサルタントは何を推奨すべきか？", "choices": ["受注管理システムから5分おきに Salesforce へ全商談をポーリングさせる", "営業担当者に商談の CSV を毎日エクスポートしてもらい、手動で取り込む", "Salesforce Connect で受注管理システムのデータを外部オブジェクトとして参照する", "レコードの変更をきっかけに送信メッセージを使って受注管理システムのエンドポイントへ通知する"], "answer": [3], "explanation": "送信メッセージは、レコードの変更を契機に指定した項目の値を SOAP メッセージとして外部エンドポイントへ送信する宣言的な機能である。コードを書かずに設定でき、受信側から確認応答が返らない場合は一定期間自動的に再送が行われる。", "choiceNotes": ["ポーリングは即時性に欠け、API呼び出しも無駄に消費する。", "手動のエクスポートは自動化の要件を満たさず、ミスも発生しやすい。", "Salesforce Connect は外部データを Salesforce から参照する仕組みで、Salesforce から外部へ送信する用途ではない。", "送信メッセージは宣言的に設定でき、SOAP送信と自動再試行の要件を満たす。"], "ref": "Salesforce ヘルプ: 送信メッセージ"}, {"id": "CI-017", "domain": "コンサルティングおよび実装戦略", "topic": "Salesforce Connect と外部オブジェクト", "q": "ある企業では、営業担当者が取引先ページで基幹システムにある請求履歴を確認したいと考えている。請求データは数千万件あり、常に基幹システムが正となるため、Salesforce にはコピーを保存したくない。基幹システムは OData のエンドポイントを公開している。コンサルタントは何を推奨すべきか？", "choices": ["毎晩、請求データ全件をカスタムオブジェクトへバッチで取り込む", "Salesforce Connect を使い、請求データを外部オブジェクトとして参照し取引先に関連付ける", "請求データを取引先のメモ項目に手作業で転記する", "Platform Event で請求データを Salesforce に保存する"], "answer": [1], "explanation": "Salesforce Connect は外部システムのデータをコピーせずに外部オブジェクトとしてリアルタイムに参照できる。OData などのアダプタに対応しており、大量データを Salesforce のストレージに保存せず、常に最新の外部データを表示できる。", "choiceNotes": ["全件コピーはストレージを消費し、データが最新でなくなる時間差も生じる。", "外部オブジェクトは外部データをコピーせずに参照でき、要件に合致する。", "手作業の転記は大量データでは非現実的で、正確性も保てない。", "Platform Event はイベント通知の仕組みであり、大量の参照データを表示する用途には適さない。"], "ref": "Salesforce ヘルプ: Salesforce Connect / 外部オブジェクト"}, {"id": "CI-018", "domain": "コンサルティングおよび実装戦略", "topic": "Platform Event", "q": "ある企業では、商談のフェーズが変わったときに、在庫システム・請求システム・データ分析基盤の3つの外部システムがそれぞれその変化をほぼリアルタイムに受け取る必要がある。今後、受け取るシステムが増える可能性もある。コンサルタントは何を推奨すべきか？", "choices": ["Platform Event を発行し、各システムがイベントを購読するパブリッシュ/サブスクライブ型の連携にする", "各外部システムがそれぞれ1時間ごとに商談を全件取得する", "Salesforce Connect で3つのシステムのデータを外部オブジェクトとして参照する", "商談のフェーズ変更時に、営業担当者が各システムの担当者へメールで連絡する"], "answer": [0], "explanation": "Platform Event はイベント駆動型のパブリッシュ/サブスクライブモデルを提供し、1つのイベントを複数の購読者がほぼリアルタイムに受け取れる。送信側と受信側が疎結合となるため、購読するシステムが増えても送信側の変更を最小限に抑えられる。", "choiceNotes": ["Platform Event は複数の購読者への疎結合なリアルタイム通知に適している。", "定期的な全件取得はリアルタイム性に欠け、API呼び出しの負荷も大きい。", "外部オブジェクトは外部データを参照する仕組みで、Salesforce の変更を外部へ通知するものではない。", "手動のメール連絡は自動化・リアルタイム性の要件を満たさない。"], "ref": "Salesforce ヘルプ: Platform Event / Trailhead: Platform Event の基本"}, {"id": "CI-019", "domain": "コンサルティングおよび実装戦略", "topic": "API の選択", "q": "ある企業では、毎晩、データウェアハウスから数百万件の取引先スコアを Salesforce に一括更新する連携を構築する。処理はリアルタイムである必要はないが、APIの呼び出し回数を抑えて効率的に処理したい。コンサルタントはどの方式を推奨すべきか？", "choices": ["REST API で1件ずつ更新する", "送信メッセージで取引先を1件ずつ更新する", "Bulk API を使用して非同期にまとめて処理する", "Streaming API を使用して更新を受信する"], "answer": [2], "explanation": "Bulk API は大量のレコードを非同期でまとめて処理するために設計されており、数十万件以上のデータロードに適している。レコードを一括で送信できるため、1件ずつ処理する場合に比べてAPI呼び出し回数を大幅に削減できる。", "choiceNotes": ["REST API で1件ずつ更新すると呼び出し回数が膨大になり、制限に達するおそれがある。", "送信メッセージは Salesforce から外部へ送信する機能であり、外部からの更新には使えない。", "Bulk API は大量データの非同期処理に最適化されている。", "Streaming API は Salesforce の変更を通知として受信する仕組みであり、データの一括更新には使えない。"], "ref": "Salesforce ヘルプ: 使用する API の選択 / Bulk API 2.0"}, {"id": "CI-020", "domain": "コンサルティングおよび実装戦略", "topic": "組織の共有設定（OWD）", "q": "ある企業では、営業担当者は自分の商談のみ参照でき、他の担当者の商談は参照できないようにしたい。ただし、営業マネージャーは部下の商談を参照・編集できる必要がある。コンサルタントは何を推奨すべきか？", "choices": ["商談の組織の共有設定を「公開/参照・更新可能」にし、ページレイアウトで項目を非表示にする", "商談の組織の共有設定を「公開/参照のみ」にし、プロファイルで編集権限を外す", "すべての営業担当者に「すべてのデータの参照」権限を付与する", "商談の組織の共有設定を「非公開」にし、ロール階層でマネージャーに部下のレコードへのアクセスを付与する"], "answer": [3], "explanation": "組織の共有設定はレコードアクセスの最も制限的なベースラインを定める。商談を「非公開」にすると所有者のみがアクセスでき、ロール階層によって上位ロールのユーザーは下位ロールのユーザーが所有するレコードに自動的にアクセスできる。", "choiceNotes": ["公開/参照・更新可能では全員がすべての商談にアクセスでき、要件に反する。", "公開/参照のみでは他の担当者の商談を参照できてしまう。", "「すべてのデータの参照」は全レコードの参照を許可し、要件に反する。", "非公開をベースラインとし、ロール階層で上位者にアクセスを付与するのが適切である。"], "ref": "Salesforce ヘルプ: 組織の共有設定 / ロール階層"}, {"id": "CI-021", "domain": "コンサルティングおよび実装戦略", "topic": "共有ルール", "q": "ある企業では、商談の組織の共有設定が「非公開」である。金額が1億円以上の商談については、所有者やロールに関係なく、全社の「戦略案件チーム」ロールのメンバーが参照できるようにしたい。コンサルタントは何を推奨すべきか？", "choices": ["金額が1億円以上という条件で、「戦略案件チーム」ロールに参照のみのアクセスを付与する条件ベースの共有ルールを作成する", "商談の組織の共有設定を「公開/参照のみ」に変更する", "戦略案件チームのメンバーをすべての営業担当者の上位ロールに配置する", "該当する商談ごとに、所有者が手動で共有する運用にする"], "answer": [0], "explanation": "条件ベースの共有ルールは、レコードの項目値に基づいて特定のグループやロールにアクセスを付与できる。組織の共有設定を非公開に保ったまま、条件に合致するレコードだけを対象者に共有できるため、要件に最も適している。", "choiceNotes": ["条件ベースの共有ルールにより、金額条件を満たす商談のみを自動的に共有できる。", "組織の共有設定を緩めると、全員がすべての商談を参照できてしまう。", "ロール階層を変更すると、条件に関係なくすべての部下の商談にアクセスでき、組織構造も歪む。", "手動共有は漏れが発生しやすく、条件に基づく自動共有の要件を満たさない。"], "ref": "Salesforce ヘルプ: 共有ルール / 条件ベースの共有ルール"}, {"id": "CI-022", "domain": "コンサルティングおよび実装戦略", "topic": "共有ルールの制約", "q": "ある企業では、取引先の組織の共有設定が「公開/参照・更新可能」になっている。セキュリティ監査の結果、特定の業種の取引先については、営業部の一部のユーザーから参照できないように制限したいという要望が出た。コンサルタントはこの要望についてどのように説明すべきか？", "choices": ["共有ルールで対象ユーザーのアクセスを「アクセス権なし」に制限できる", "共有ルールは組織の共有設定より制限を厳しくすることはできないため、組織の共有設定をより制限的に見直し、必要なアクセスを共有ルールで開放する設計が必要である", "ロール階層でユーザーを下位に配置すれば参照を禁止できる", "手動共有を削除すれば対象ユーザーから参照できなくなる"], "answer": [1], "explanation": "共有ルールや手動共有、ロール階層は組織の共有設定で定めたベースラインよりも広いアクセスを付与するための仕組みであり、アクセスを制限することはできない。アクセスを制限したい場合は、組織の共有設定を制限的にし、必要なユーザーに共有ルールなどで開放する。なお、特定ユーザーのアクセスを絞り込む「制限ルール」は取引先オブジェクトをサポートしておらず、「スコープルール」も既定の表示範囲を絞るだけでアクセス権自体は制限しないため、この要件には使えない。", "choiceNotes": ["共有ルールはアクセスを拡大する仕組みであり、制限には使えない。", "ベースラインを制限的にし、共有ルールで開放するのが正しい設計である。", "ロール階層は上位者にアクセスを付与するもので、ベースラインのアクセスを奪うことはできない。", "公開/参照・更新可能では手動共有がなくても全員がアクセスできるため、制限にならない。"], "ref": "Salesforce ヘルプ: 共有設定の概要 / レコードアクセスの制御"}, {"id": "CI-023", "domain": "コンサルティングおよび実装戦略", "topic": "取引先階層とアクセス", "q": "ある企業では、取引先の組織の共有設定が「非公開」である。グローバル企業の本社取引先とその子会社取引先を取引先階層（親取引先）で関連付けた。本社取引先の所有者は「子会社取引先もすべて参照できるようになる」と期待している。コンサルタントはどのように説明すべきか？", "choices": ["親取引先を設定すると、親取引先の所有者は子取引先を自動的に参照・編集できる", "親取引先を設定すると、親取引先の所有者は子取引先を自動的に参照のみできる", "取引先階層は取引先の関係を表示するためのもので、レコードへのアクセス権は付与されない。必要に応じて共有ルールや取引先チームを検討する", "取引先階層を設定すると、子取引先の所有者が親取引先の所有者に自動的に変更される"], "answer": [2], "explanation": "取引先階層は親取引先項目によって企業間の関係を表示・把握するための機能であり、それ自体がレコードの共有を行うことはない。親取引先の所有者に子取引先へのアクセスが必要な場合は、共有ルールや取引先チームなどの共有の仕組みを別途設計する必要がある。", "choiceNotes": ["取引先階層は参照・編集のアクセス権を付与しない。", "取引先階層は参照のみのアクセス権も付与しない。", "取引先階層は関係の表示用であり、アクセスには共有の仕組みが別途必要である。", "親取引先を設定しても子取引先の所有者は変わらない。"], "ref": "Salesforce ヘルプ: 取引先階層 / 共有設定の概要"}, {"id": "CI-024", "domain": "コンサルティングおよび実装戦略", "topic": "商談チームと取引先チーム", "q": "ある企業では、商談の組織の共有設定が「非公開」である。大型商談ごとに、営業担当者・プリセールス・営業事務が協力して対応しており、メンバーは商談ごとに異なる。また、主要顧客ごとに担当する営業・サポートのメンバーが決まっており、その顧客の取引先レコードへのアクセスが必要である。コンサルタントが推奨すべきことはどれか？（2つ選択してください）", "choices": ["商談チームを有効化し、商談ごとにメンバーと役割、アクセス権を設定する", "すべての関係者を全営業担当者の上位ロールに配置する", "取引先チームを有効化し、主要顧客ごとに担当メンバーと役割を設定する", "商談の組織の共有設定を「公開/参照・更新可能」に変更する", "関係者全員に「すべてのデータの編集」権限を付与する"], "answer": [0, 2], "explanation": "商談チームは商談単位で共同作業するメンバーと役割を定義し、レコードへのアクセスを付与できる。取引先チームは取引先単位で担当メンバーを定義し、取引先レコードなどへのアクセスを付与できる。いずれもベースラインを非公開に保ったまま、必要なメンバーだけに共有できる。", "choiceNotes": ["商談チームは商談ごとに異なるメンバーへのアクセス付与に適している。", "ロールを上位に置くと不要な商談まで参照でき、組織構造も歪む。", "取引先チームは顧客ごとの担当メンバーへのアクセス付与に適している。", "組織の共有設定を緩めると、全員がすべての商談にアクセスできてしまう。", "「すべてのデータの編集」は過剰な権限であり、最小権限の原則に反する。"], "ref": "Salesforce ヘルプ: 商談チーム / 取引先チーム"}, {"id": "CI-025", "domain": "コンサルティングおよび実装戦略", "topic": "手動共有", "q": "ある企業では、商談の組織の共有設定が「非公開」である。ある営業担当者が、特定の1件の商談について一時的に別部門の同僚に参照してもらい、助言を受けたいと考えている。このような例外的な共有はまれにしか発生しない。コンサルタントは何を推奨すべきか？", "choices": ["該当商談の所有者が、その同僚に対して手動共有で参照アクセスを付与する", "同僚を対象とした所有者ベースの共有ルールを作成する", "同僚のロールを営業担当者の上位に変更する", "商談の組織の共有設定を「公開/参照のみ」に変更する"], "answer": [0], "explanation": "手動共有は、レコードの所有者などが個々のレコードを特定のユーザーやグループと共有する仕組みであり、まれに発生する例外的な共有に適している。組織全体の共有設定や構造を変えずに、必要最小限のアクセスを付与できる。", "choiceNotes": ["手動共有は個別レコードの一時的・例外的な共有に適している。", "所有者ベースの共有ルールでは、その担当者が所有するすべての商談が共有されてしまう。", "ロール変更は組織構造に影響し、他の商談へのアクセスも付与してしまう。", "組織の共有設定を緩めると、全員がすべての商談を参照できてしまう。"], "ref": "Salesforce ヘルプ: 手動共有 / レコードの共有"}, {"id": "CI-026", "domain": "コンサルティングおよび実装戦略", "topic": "ユーザーライセンスの選択", "q": "ある企業では、営業担当者に加えて、製造部門の200名が Salesforce を利用する予定である。製造部門のユーザーは、カスタムオブジェクトの品質管理アプリと取引先・取引先責任者の参照のみを使用し、リードや商談にはアクセスしない。コストを抑えたい。コンサルタントは何を推奨すべきか？", "choices": ["製造部門にも Sales Cloud ライセンスを付与する", "製造部門は Salesforce を利用せず、スプレッドシートで管理する", "製造部門に Salesforce Platform ライセンスを付与する", "製造部門のユーザーは営業担当者のアカウントを共有して使用する"], "answer": [2], "explanation": "Salesforce Platform ライセンスは、カスタムアプリと取引先・取引先責任者などの一部の標準オブジェクトを利用するユーザー向けのライセンスで、リードや商談などの CRM 機能は含まれない。要件がカスタムアプリ中心であれば、Sales Cloud ライセンスよりコストを抑えられる。", "choiceNotes": ["使用しない営業機能を含むライセンスを付与すると、コストが過剰になる。", "Salesforce を利用しないと、品質管理アプリと顧客情報の連携という目的を達成できない。", "Platform ライセンスはカスタムアプリと取引先・取引先責任者の利用に適しており、コスト効率が良い。", "アカウントの共有はライセンス規約とセキュリティの両面で不適切である。"], "ref": "Salesforce ヘルプ: ユーザーライセンス / Salesforce Platform ライセンス"}, {"id": "CI-027", "domain": "コンサルティングおよび実装戦略", "topic": "エディションと Sandbox", "q": "ある企業は Enterprise Edition の Sales Cloud を契約している。プロジェクト計画では、本番の全データを使ったステージング環境が必要とされている。コンサルタントがプロジェクト計画の段階で確認すべきことはどれか？", "choices": ["Enterprise Edition ではいかなる Sandbox も作成できないため、エディションをアップグレードする必要がある", "Enterprise Edition には Full Sandbox が標準では含まれていないため、追加購入するか、Partial Copy Sandbox で代替できるかを検討する", "Developer Sandbox で本番の全データをコピーできるため、追加の検討は不要である", "Full Sandbox は無制限に作成でき、更新も毎日可能である"], "answer": [1], "explanation": "エディションによって付属する Sandbox の種類と数は異なり、Enterprise Edition には Full Sandbox が標準では含まれていない。本番の全データを使う環境が必要な場合は、追加購入の要否や Partial Copy Sandbox での代替可否を計画段階で確認する必要がある。", "choiceNotes": ["Enterprise Edition でも Developer Sandbox や Partial Copy Sandbox を利用できる。", "Full Sandbox が標準で含まれないことを踏まえ、購入または代替を検討するのが適切である。", "Developer Sandbox はメタデータのみをコピーし、本番データは含まれない。", "Full Sandbox の数は契約に依存し、更新間隔は29日である。"], "ref": "Salesforce ヘルプ: エディションごとの Sandbox ライセンス / Sandbox の種類"}, {"id": "CI-028", "domain": "コンサルティングおよび実装戦略", "topic": "AppExchange 活用判断", "q": "ある企業では、見積書のPDF生成と電子署名の機能が必要になった。社内開発チームは独自開発を提案しているが、AppExchange にも該当する機能を持つアプリが複数ある。コンサルタントが AppExchange アプリを評価する際に確認すべき点はどれか？（2つ選択してください）", "choices": ["アプリの開発元の本社所在地が自社と同じ都道府県であるか", "アプリのユーザーレビュー・評価や導入実績、Salesforce のセキュリティレビューを通過していることを確認する", "アプリのアイコンのデザインが自社のブランドに合っているか", "アプリが要件をどの程度満たすか、および独自開発と比較したライセンス費用・保守負担などの総コストを評価する", "アプリが無料であれば要件を確認せずに導入する"], "answer": [1, 3], "explanation": "AppExchange アプリを採用するかどうかは、要件の適合度、導入実績やレビュー、セキュリティレビューの通過状況、そして独自開発と比較した総所有コストを踏まえて判断する。既製のアプリは開発・保守の負担を軽減できるが、要件とのギャップやライセンス費用も考慮する必要がある。", "choiceNotes": ["開発元の所在地は機能や品質の評価基準として本質的ではない。", "レビュー、導入実績、セキュリティレビューは品質と信頼性の重要な判断材料である。", "アイコンのデザインは機能や価値と無関係である。", "要件の適合度と総コストの比較は、構築か購入かの判断の中核である。", "無料でも要件に合わなければ価値がなく、保守やセキュリティのリスクもある。"], "ref": "Trailhead: AppExchange の基本 / AppExchange のセキュリティレビュー"}, {"id": "CI2-001", "domain": "コンサルティングおよび実装戦略", "topic": "共有のトラブルシュート", "q": "商談の組織の共有設定（OWD）は「非公開」。営業部長から「自分の部下ではない別部署の担当者が、ある大型商談を参照できている理由を知りたい」と依頼された。コンサルタントがまず使うべき機能はどれか。", "choices": ["商談レコードの［共有階層］ボタンで、アクセスできるユーザーとその理由を確認する", "項目履歴管理を有効にして、所有者の変更履歴を追う", "設定変更履歴を確認して、最近変更された共有ルールを探す", "ログイン履歴を確認して、その担当者のアクセス日時を調べる"], "answer": [0], "explanation": "レコードの［共有階層］（Sharing Hierarchy）では、そのレコードにアクセスできるユーザーと、ロール階層・共有ルール・チームなどアクセス元の理由を確認できます。誰が見られるかを調べるときは、まずこの機能を使います。ほかの履歴機能は補助にはなりますが、アクセスの理由そのものは示しません。", "choiceNotes": ["正解。アクセスできるユーザーとその理由をレコード単位で確認できる。", "項目履歴は値の変更を記録するだけで、アクセス元はわからない。", "設定変更履歴からは変更の有無しかわからず、そのレコードへのアクセス理由は特定できない。", "ログイン履歴はログインの記録で、レコードを参照できる理由とは関係がない。"], "ref": "レコードにアクセスできるユーザーの確認（共有階層）"}, {"id": "CI2-002", "domain": "コンサルティングおよび実装戦略", "topic": "暗黙の共有", "q": "取引先と商談のOWDはどちらも「非公開」。インサイドセールス担当のAさんは、他の営業が所有する取引先に紐づく商談の所有者になった。取引先の共有ルールはない。Aさんはその取引先に対してどのアクセス権を持つか。", "choices": ["アクセスできない", "参照・編集の両方ができる", "暗黙の共有により参照のみできる", "取引先の所有者が手動共有した場合に限り参照できる"], "answer": [2], "explanation": "子レコード（商談・ケース・取引先責任者）にアクセスできるユーザーには、親の取引先への参照のみのアクセス権が暗黙の共有で付与されます。これは親の暗黙の共有と呼ばれ、管理者が無効にすることはできません。編集権限までは付与されません。", "choiceNotes": ["子の商談にアクセスできるため、取引先にもアクセスできる。", "暗黙の共有で付与されるのは参照のみで、編集はできない。", "正解。親の暗黙の共有で参照のみのアクセス権が付与される。", "手動共有がなくても暗黙の共有で参照できる。"], "ref": "暗黙の共有（Implicit Sharing）"}, {"id": "CI2-003", "domain": "コンサルティングおよび実装戦略", "topic": "ロール階層を経由しないアクセス", "q": "人事評価のメモを入れるカスタムオブジェクト「面談記録」がある。OWDは「非公開」。要件は「作成した本人と人事部だけが参照でき、本人の上司（ロール階層の上位者）には見せない」。最も適切な設定はどれか。", "choices": ["ロール階層から上司のロールを外す", "「階層を使用したアクセス許可」をオフにし、人事部向けに共有ルールを作成する", "ページレイアウトから関連リストを外し、上司が開けないようにする", "上司のプロファイルからこのオブジェクトの参照権限を外し、人事部にだけ付与する"], "answer": [1], "explanation": "カスタムオブジェクトでは、OWDの「階層を使用したアクセス許可」をオフにすると、ロール階層の上位者に自動でアクセス権が付与されなくなります。人事部には共有ルールで別途アクセスを与えます。この設定をオフにできるのはカスタムオブジェクトだけです。", "choiceNotes": ["ロール構成を崩すとほかのオブジェクトの共有や予測にも影響し、不適切。", "正解。カスタムオブジェクトなら階層によるアクセスを止め、必要な相手にだけ共有できる。", "レイアウトでは非表示にするだけで、検索やレポートからアクセスできてしまう。", "上司の役職にある人全員が自分の面談記録も作れなくなり、要件に合わない。"], "ref": "組織の共有設定：階層を使用したアクセス許可"}, {"id": "CI2-004", "domain": "コンサルティングおよび実装戦略", "topic": "共有のトラブルシュート", "q": "商談のOWDは「非公開」で、共有ルールもチームも使っていない。ところが、ある営業事務ユーザーが全社の商談を編集できている。原因として考えられるものはどれか。2つ選択してください。", "choices": ["プロファイルか権限セットで、商談の「すべて変更」が付与されている", "「すべてのデータの編集」システム権限が付与されている", "商談のページレイアウトで全項目が編集可能になっている", "商談の項目レベルセキュリティで全項目が「参照のみ」になっていない", "そのユーザーのロールがロール階層の最下位にある"], "answer": [0, 1], "explanation": "オブジェクト権限の「すべて変更」や、システム権限の「すべてのデータの編集」は共有設定より優先されます。これらがあると、OWDに関係なく全レコードを編集できます。トラブルシュートでは、プロファイルと割り当て済みの権限セットの両方を確認します。", "choiceNotes": ["正解。「すべて変更」はそのオブジェクトの共有設定を無視して全レコードを編集できる。", "正解。「すべてのデータの編集」は全オブジェクトの共有を無視する。", "レイアウトは項目の表示方法を決めるだけで、レコードへのアクセス権は与えない。", "項目レベルセキュリティはレコードへのアクセス範囲を広げない。", "ロールが最下位なら階層によるアクセスは減るため、原因にならない。"], "ref": "オブジェクト権限：すべて参照とすべて変更"}, {"id": "CI2-005", "domain": "コンサルティングおよび実装戦略", "topic": "項目が見えないときの切り分け", "q": "営業担当は商談レコードを開けるが、新しく作ったカスタム項目「値引率」が画面に表示されないと報告があった。レコード自体へのアクセスに問題はない。確認すべき項目はどれか。2つ選択してください。", "choices": ["営業担当のプロファイルか権限セットで、その項目の項目レベルセキュリティが参照可能になっているか", "営業担当のレコードタイプとプロファイルに割り当てられたページレイアウトに、その項目が配置されているか", "商談のOWDが「公開/参照・更新可能」になっているか", "営業担当のロールが、商談所有者のロールより上位にあるか", "項目履歴管理がその項目で有効になっているか"], "answer": [0, 1], "explanation": "レコードにはアクセスできるのに項目だけ見えないときは、項目レベルセキュリティとページレイアウト（Dynamic Formsを使っている場合はLightningページの項目配置）を確認します。共有設定やロールはレコード単位のアクセスを決めるもので、項目の表示には関係しません。", "choiceNotes": ["正解。項目レベルセキュリティで参照不可なら、どの画面にも表示されない。", "正解。参照権限があっても、レイアウトに配置されていなければ画面に出ない。", "OWDはレコード単位のアクセスを決めるもので、項目の表示には関係しない。", "ロールはレコードへのアクセスに関わるだけで、項目の表示には影響しない。", "項目履歴管理は変更の記録で、表示されるかどうかとは関係しない。"], "ref": "項目レベルセキュリティとページレイアウト"}, {"id": "CI2-006", "domain": "コンサルティングおよび実装戦略", "topic": "ロール階層を経由しないアクセス", "q": "大阪支店の大型商談に、東京本社の製品スペシャリスト（ロール階層上は別の系統）が参加することになった。この商談にだけ参照・編集のアクセス権を与え、商談画面でメンバーと役割も記録したい。最も適切な方法はどれか。", "choices": ["スペシャリストのロールを大阪支店長の配下に移す", "チームセリングを有効にし、商談チームにスペシャリストを読み取り/書き込み権限で追加する", "商談のOWDを「公開/参照・更新可能」に変更する", "スペシャリストのプロファイルに商談の「すべて変更」を付与する"], "answer": [1], "explanation": "商談チームを使うと、特定の商談にだけ、役割（チームロール）とアクセスレベルを指定してメンバーを追加できます。ロール階層を変えなくても、必要なレコードだけに個別にアクセス権を与えられます。ほかの選択肢はアクセス範囲が広すぎるか、組織の構造を崩します。", "choiceNotes": ["ロールを移すと、ほかの東京本社の業務や共有に影響する。", "正解。特定の商談にだけ、役割付きでアクセス権を与えられる。", "全社の商談が公開になり、要件より広すぎる。", "全社の商談を編集できるようになり、最小権限の原則に反する。"], "ref": "商談チーム（チームセリング）"}, {"id": "CI2-007", "domain": "コンサルティングおよび実装戦略", "topic": "ロール階層を経由しないアクセス", "q": "製造業A社では、ロール階層は人事上の組織（部・課）どおりに作られている。一方で営業活動は「地域×業種」の担当区分で行われ、1つの取引先を複数の区分の担当者が見る必要がある。担当区分は取引先の住所や業種から自動で決めたい。最も適切な機能はどれか。", "choices": ["ロール階層を地域×業種の組み合わせで作り直す", "取引先チームを全取引先に手動で設定する", "エンタープライズテリトリー管理で担当区分を定義し、割り当てルールで取引先を自動割り当てする", "取引先のレコードタイプを地域ごとに作る"], "answer": [2], "explanation": "エンタープライズテリトリー管理では、ロール階層とは別にテリトリー階層を作れます。取引先の項目に基づく割り当てルールで取引先を自動割り当てでき、1つの取引先を複数のテリトリーに割り当てることもできます。テリトリーのユーザーには、取引先と関連する商談などへのアクセス権が付与されます。", "choiceNotes": ["人事組織とは別の軸でロール階層を作り直すと、管理が複雑になり報告系統とも合わなくなる。", "手動設定では件数が多いと維持できず、自動割り当てにならない。", "正解。ロール階層とは別のテリトリー階層を作り、ルールで自動割り当てできる。", "レコードタイプはレイアウトや選択リストを切り替えるもので、アクセス権を与えない。"], "ref": "エンタープライズテリトリー管理"}, {"id": "CI2-008", "domain": "コンサルティングおよび実装戦略", "topic": "権限セットグループ", "q": "「営業基本」権限セットグループを営業全員に割り当てている。グループに含まれる権限セットのうち1つに「レポートのエクスポート」があるが、派遣社員の営業にだけはこの権限を与えたくない。既存の権限セットはほかの部門でも使っている。最も保守しやすい方法はどれか。", "choices": ["派遣社員用に、「営業基本」と同じ権限セットを含む別の権限セットグループを作り、そのグループにミュート権限セットを追加して「レポートのエクスポート」をミュートする", "既存の権限セットから「レポートのエクスポート」を外す", "派遣社員用に新しいプロファイルを作り、プロファイルで「レポートのエクスポート」をオフにする", "派遣社員にだけ権限セットを個別に割り当て、グループは使わない"], "answer": [0], "explanation": "権限セットグループにはミュート権限セットを1つだけ追加でき、グループ内の特定の権限だけを無効にできます。ミュートの効果はそのグループの中だけに及び、含まれている権限セット自体は変わらないため、ほかの部門への影響がありません。なお、同じ権限がプロファイルや別の権限セットで付与されている場合、ミュートではその権限は消えません。", "choiceNotes": ["正解。元の権限セットを変えずに、派遣社員用のグループでだけ権限を外せる。", "ほかの部門で使っている権限セットを変えると影響が広がる。", "グループ側で付与されている権限は、プロファイルでオフにしても打ち消せない。", "個別に割り当てると管理対象が増え、グループを使うメリットがなくなる。"], "ref": "権限セットグループとミュート権限セット"}, {"id": "CI2-009", "domain": "コンサルティングおよび実装戦略", "topic": "プロファイル最小化", "q": "既存組織にはプロファイルが60個あり、部署が変わるたびに新しいプロファイルが作られて保守できなくなっている。Salesforceが推奨するユーザーアクセス管理への移行方針として最も適切なものはどれか。", "choices": ["部署ごとのプロファイルをそのまま残し、項目追加時の作業を自動化する", "全ユーザーにシステム管理者プロファイルを割り当て、共有ルールで制御する", "プロファイルはライセンスごとにまとめ、権限セットに入れた権限をまとめてユーザーに付与する", "プロファイルを1つにまとめ、すべての権限をそのプロファイルに入れる"], "answer": [2], "explanation": "Salesforceは、プロファイルにはログイン時間・IP制限・デフォルト設定など最小限のものだけを残し、権限は権限セットと権限セットグループで付与する方式を推奨しています。最小アクセス権のプロファイル（Minimum Access - Salesforce）を基本にすると、役割の組み合わせを柔軟に表現できます。", "choiceNotes": ["根本原因であるプロファイルの増殖が解決しない。", "過剰な権限を与えることになり、セキュリティ上問題外。", "正解。プロファイルは最小限にし、権限は権限セットで足していく。", "1つのプロファイルに権限を集めると、全員が過剰な権限を持つことになる。"], "ref": "ユーザーアクセス管理のベストプラクティス（最小アクセス権のプロファイル）"}, {"id": "CI2-010", "domain": "コンサルティングおよび実装戦略", "topic": "組織の拡張（複数事業部）", "q": "法人向け事業部が使っている組織に、個人向け事業部を追加する。個人向けは商談のフェーズが少なく、必要な項目も違う。1つの組織の中で両事業部を運用するための設計として適切なものはどれか。2つ選択してください。", "choices": ["個人向けのフェーズだけを含む商談の営業プロセスを作り、個人向けの商談レコードタイプに関連付ける", "個人向けのレコードタイプに専用のページレイアウトを作り、プロファイルとレコードタイプの組み合わせごとに割り当てる", "個人向け用に「商談2」というカスタムオブジェクトを新しく作る", "フェーズの選択リストに個人向けの値を追加し、入力規則で事業部ごとに選べる値を制限する", "個人向け事業部のために別の本番組織を契約する"], "answer": [0, 1], "explanation": "商談のフェーズの選択肢は営業プロセスで管理し、営業プロセスは商談レコードタイプに関連付けます。項目の違いは、レコードタイプとプロファイルごとのページレイアウト割り当てで表現します。標準オブジェクトを使い続けることで、レポートや予測もそのまま活用できます。", "choiceNotes": ["正解。事業部ごとにフェーズを分けるには、営業プロセスとレコードタイプを使う。", "正解。レコードタイプ別のレイアウトで、事業部ごとに必要な項目を出し分けられる。", "商談の標準機能（予測・パイプラインレポートなど）を使えなくなる。", "入力規則でも制限はできるが、選択肢自体は全員に見え、使い勝手と保守性が悪い。", "要件はレコードタイプで満たせるため、組織を分けるのは過剰でデータも分断される。"], "ref": "営業プロセスとレコードタイプ"}, {"id": "CI2-011", "domain": "コンサルティングおよび実装戦略", "topic": "Sandbox戦略", "q": "本番には約800万件の商談がある。リリース前の最終段階で、本番と同じデータ量を使って業務部門のユーザー受け入れテストと、夜間バッチの性能確認を行いたい。使うべきSandboxはどれか。", "choices": ["Developer Sandbox", "Developer Pro Sandbox", "Partial Copy Sandbox", "Full Sandbox"], "answer": [3], "explanation": "Full Sandboxは本番のメタデータとすべてのデータをコピーするため、本番と同じデータ量での受け入れテストや性能テストに向いています。更新間隔は29日です。ほかのSandboxはデータを含まないか、一部のデータしかコピーしません。", "choiceNotes": ["データはコピーされず、容量も小さいため、データ量を伴うテストには使えない。", "Developerより容量は大きいが、本番データはコピーされない。", "テンプレートで選んだデータの一部（最大5GB）しかコピーされない。", "正解。本番の全データを含むので、本番と同じ条件で検証できる。"], "ref": "Sandboxの種類とライセンス"}, {"id": "CI2-012", "domain": "コンサルティングおよび実装戦略", "topic": "Sandbox戦略", "q": "新人営業の研修を毎週行う。研修環境には本番の一部の取引先と商談を入れておきたく、研修のたびに（週1回程度）環境を初期状態に戻したい。コストも考慮すると、最も適切なSandboxはどれか。", "choices": ["Partial Copy Sandbox（Sandboxテンプレートで対象オブジェクトを選んでコピー）", "Full Sandbox", "Developer Sandbox（研修前に毎回手作業でデータを入れる）", "本番組織に研修用のレコードタイプを作る"], "answer": [0], "explanation": "Partial Copy Sandboxは、Sandboxテンプレートで選んだオブジェクトの本番データの一部をコピーでき、更新間隔は5日なので週1回の更新に対応できます。Full Sandboxは更新間隔が29日で、毎週は戻せません。", "choiceNotes": ["正解。本番データの一部を含み、5日ごとに更新できるので毎週の研修に使える。", "更新間隔が29日なので毎週は初期化できず、コストも高い。", "データがコピーされないため、毎回手作業でデータを入れる負担が大きい。", "本番で研修すると本番データやレポートを汚してしまう。"], "ref": "Sandboxの種類とライセンス（更新間隔）"}, {"id": "CI2-013", "domain": "コンサルティングおよび実装戦略", "topic": "段階的リリース", "q": "全国12支店、営業600名にSalesforceを新しく導入する。現場の抵抗が強いことが予想され、業務を止めずに定着させたい。展開計画として適切なものはどれか。2つ選択してください。", "choices": ["まず1〜2支店でパイロット運用し、フィードバックを反映してから他支店に順次展開する", "各支店から現場のキーユーザー（チャンピオン）を選び、研修と問い合わせの一次窓口を担ってもらう", "混乱を避けるため、全支店で同じ日に一斉に切り替え、旧システムはその日に停止する", "研修は導入後3か月たって利用が定着してから行う", "展開中は要望を一切受け付けず、すべて次年度に回す"], "answer": [0, 1], "explanation": "段階的な展開では、パイロットで課題を早めに見つけて直し、成功事例を作ってから横展開することでリスクを抑えられます。現場のチャンピオンは、利用定着とフィードバック収集に効果があります。研修は導入前後に行い、要望は優先順位をつけて計画的に取り込みます。", "choiceNotes": ["正解。パイロットで課題を見つけて直してから展開するとリスクが小さい。", "正解。現場のチャンピオンが定着を促し、フィードバックの窓口になる。", "抵抗が強い状況での一斉切り替えは、問題が全社に波及するリスクが高い。", "研修が遅いと定着が進まず、誤った使い方が広がる。", "要望を一切受け付けないと現場の不満が高まり、定着を妨げる。"], "ref": "Trailhead：ユーザー導入と変更管理"}, {"id": "CI2-014", "domain": "コンサルティングおよび実装戦略", "topic": "ユーザー受け入れテスト", "q": "商談管理の改修についてユーザー受け入れテスト（UAT）を計画している。UATの進め方として最も適切なものはどれか。", "choices": ["開発者が単体テストと同じ手順で実施し、結果を業務部門に報告する", "業務部門の実ユーザーが、ユーザーストーリーと受け入れ基準をもとにしたテストシナリオを、本番に近いデータのSandboxで実施する", "本番リリース後に、ユーザーの問い合わせをUATの代わりとして扱う", "システム管理者プロファイルでログインし、全機能が動くことを確認する"], "answer": [1], "explanation": "UATは、業務要件を満たしているかを実際の利用者が確かめる工程です。受け入れ基準に基づいたシナリオを、実際の権限で、本番に近いデータを使って実施することで、権限や業務フローの問題も見つかります。", "choiceNotes": ["開発者のテストでは業務の観点が欠け、UATの目的を果たせない。", "正解。実ユーザーが受け入れ基準に沿って、本番に近い環境で検証する。", "リリース後に見つかると、修正のコストと業務への影響が大きい。", "管理者権限では、現場ユーザーの権限で起きる問題を見逃す。"], "ref": "Trailhead：アプリケーションライフサイクル管理（テスト）"}, {"id": "CI2-015", "domain": "コンサルティングおよび実装戦略", "topic": "ガバナンス・CoE", "q": "導入から3年たち、各部門が個別に管理者を置いて設定を変えた結果、似た項目や自動化が重複している。Center of Excellence（CoE）を立ち上げる際に、CoEが担う役割として適切なものはどれか。2つ選択してください。", "choices": ["命名規則・設計標準・リリース手順を定め、全部門の変更が従うようにする", "部門から上がる要望を集約し、ビジネス価値に基づいて優先順位を決める", "すべての設定変更を本番組織で直接行い、スピードを優先する", "各部門の管理者権限を残し、変更内容は年1回の棚卸しでまとめて確認する", "カスタム開発を全面的に禁止し、標準機能だけを使う"], "answer": [0, 1], "explanation": "CoEは標準やベストプラクティスを定め、要望の受付・優先順位付けとリリース管理を一元化して、組織の健全性を保ちます。経営層の関与のもとで意思決定の仕組みを作ることが重要です。", "choiceNotes": ["正解。共通の標準とリリース手順で、重複や品質のばらつきを防ぐ。", "正解。要望を一元管理し、価値に基づいて優先順位を決める。", "本番で直接変更すると、テストされない変更が入るリスクがある。", "年1回の確認では重複の発生を防げない。", "全面禁止は極端で、要件によってはカスタム開発が適切な場合もある。"], "ref": "Trailhead：Salesforceのガバナンス（Center of Excellence）"}, {"id": "CI2-016", "domain": "コンサルティングおよび実装戦略", "topic": "要件の優先順位付け", "q": "初回リリースの期限が決まっているのに、ワークショップで集まった要件が80件あり、全部は入らない。ステークホルダーと合意しながら範囲を決める手法として最も適切なものはどれか。", "choices": ["要望を出した人の役職が高い順に実装する", "実装しやすいものから順に、入るだけ入れる", "MoSCoW法でMust/Should/Could/Won't（今回は対象外）に分け、Mustを初回リリースの範囲にする", "すべての要件を初回に入れられるよう、リリース日を未定にする"], "answer": [2], "explanation": "MoSCoW法は、要件をビジネスへの影響に基づいて分類し、期限内に必ず必要なものを明確にする手法です。Won'tとしたものも記録して、次のリリースの候補として管理します。ステークホルダーと合意した基準で範囲を決めることが重要です。", "choiceNotes": ["役職ではなくビジネス価値で判断すべき。", "実装しやすさだけで選ぶと、重要な要件が漏れる恐れがある。", "正解。ビジネス上の必要度で分類し、合意のうえで範囲を決める。", "期限を守らないと価値の提供が遅れ、プロジェクトのリスクが増える。"], "ref": "Trailhead：ビジネス要件の優先順位付け"}, {"id": "CI2-017", "domain": "コンサルティングおよび実装戦略", "topic": "宣言的ツールとカスタム開発", "q": "要件は「商談のフェーズを『受注』にするとき、『契約開始日』が空なら保存させず、エラーメッセージを項目の横に出す」。開発チームはApexトリガーを提案している。コンサルタントとして推奨するものはどれか。", "choices": ["Apexトリガーで addError を使う", "入力規則を作り、エラーメッセージの表示位置を『契約開始日』に設定する", "レコードトリガーフローで、保存後に契約開始日を今日の日付で埋める", "ページレイアウトで契約開始日を必須項目にする"], "answer": [1], "explanation": "保存時に条件をチェックしてエラーにする要件は、入力規則で宣言的に実現でき、エラーの表示位置も指定できます。コードを使わないので保守が容易で、テストクラスも不要です。ページレイアウトで必須にすると、フェーズに関係なく常に必須になってしまいます。", "choiceNotes": ["実現はできるが、宣言的に実現できる要件にコードを使うのは保守コストが高い。", "正解。条件付きの必須チェックは入力規則で実現できる。", "値を自動で埋めると、誤った日付が登録される。要件はエラーにすること。", "レイアウトでの必須は常に必須になり、APIやインポートには効かない。"], "ref": "入力規則"}, {"id": "CI2-018", "domain": "コンサルティングおよび実装戦略", "topic": "フローの使い分け", "q": "商談が作成・更新されたら、同じ商談の『確度区分』項目を金額とフェーズから計算して設定したい。ほかのレコードは更新しない。性能を最も重視する場合、適切な実装はどれか。", "choices": ["レコードトリガーフローを、レコードの作成または更新時に起動し『高速項目更新』（保存前）に最適化して作る", "レコードトリガーフローを『アクションと関連レコード』（保存後）で作り、同じレコードを更新する", "スケジュールトリガーフローで1時間ごとに全商談を再計算する", "画面フローを作り、営業担当に毎回実行してもらう"], "answer": [0], "explanation": "同じレコードの項目だけを更新する場合は、保存前に実行される高速項目更新のフローを使います。保存前の処理なので、追加のDML処理が発生せず、保存後フローよりかなり高速です。保存後フローで同じレコードを更新すると、余分な保存処理が発生します。", "choiceNotes": ["正解。保存前フローなら追加の保存処理なしで同じレコードを更新できる。", "保存後に同じレコードを更新すると余分なDMLが発生し、性能が落ちる。", "リアルタイムに反映されず、大量の不要な処理が発生する。", "手作業に頼ると漏れが出て、自動化の要件を満たさない。"], "ref": "レコードトリガーフロー（保存前の高速項目更新）"}, {"id": "CI2-019", "domain": "コンサルティングおよび実装戦略", "topic": "フローの使い分け", "q": "「商談の完了予定日の7日前になっても、フェーズが『交渉』より前なら、所有者にタスクを作成する」という要件がある。商談ごとの完了予定日を基準にしたい。最も適切な実装はどれか。", "choices": ["画面フローで営業担当が毎朝手動実行する", "商談のレコードトリガーフローに、完了予定日の7日前に実行するスケジュール済みパスを追加し、実行時にもフェーズを確認する", "Apexトリガーで、商談保存時にすぐタスクを作成する", "完了予定日の項目に入力規則を追加する"], "answer": [1], "explanation": "レコードトリガーフローのスケジュール済みパスは、レコードの日付項目を基準にした相対時間で処理を実行できます。実行時点でのフェーズを判定できるよう、パス内で条件を再確認する設計にします。", "choiceNotes": ["手動実行では漏れが出て、日付基準の自動化にならない。", "正解。レコードの日付項目を基準に、指定したタイミングで処理を実行できる。", "保存時にすぐ作成すると、7日前というタイミング要件を満たさない。", "入力規則は保存時のチェックで、指定日にタスクを作ることはできない。"], "ref": "レコードトリガーフローのスケジュール済みパス"}, {"id": "CI2-020", "domain": "コンサルティングおよび実装戦略", "topic": "フローの使い分け", "q": "毎週月曜の朝6時に、『最終活動日』が60日以上前の未完了商談をすべて抽出し、『要フォロー』チェックボックスをオンにしたい。レコードの作成や更新とは関係なく、決まった時刻に一括で処理する。適切なフローはどれか。", "choices": ["レコードトリガーフロー（保存前）", "画面フロー", "スケジュールトリガーフロー（毎週実行、対象を商談に設定し条件で絞り込む）", "プラットフォームイベントトリガーフロー"], "answer": [2], "explanation": "スケジュールトリガーフローは、指定した日時と頻度で起動し、条件に合うレコードの一括処理に使います。レコードの変更をきっかけにしない定期処理に向いています。", "choiceNotes": ["レコードが保存されたときにしか動かず、更新されない商談は対象にならない。", "画面フローはユーザーの操作で起動するもので、定期実行には使わない。", "正解。決まった時刻に、条件に合うレコードをまとめて処理できる。", "プラットフォームイベントの受信で起動するもので、定期実行の要件には合わない。"], "ref": "スケジュールトリガーフロー"}, {"id": "CI2-021", "domain": "コンサルティングおよび実装戦略", "topic": "フローの使い分け", "q": "営業担当が値引き申請を行う際、条件によって入力項目が変わり、途中で上限値のチェック結果を見せながら、最後に承認申請まで行わせたい。商談画面のボタンから起動したい。最も適切な方法はどれか。", "choices": ["画面フローを作り、商談のクイックアクションまたはLightningページに配置する", "レコードトリガーフロー（保存後）で処理する", "入力規則で上限値をチェックする", "スケジュールトリガーフローで夜間にまとめて承認申請する"], "answer": [0], "explanation": "画面フローはユーザーとの対話を伴うガイド付き入力に使い、条件分岐で画面を切り替えたり、承認申請などのアクションを実行したりできます。クイックアクションやLightningページから起動できます。", "choiceNotes": ["正解。ユーザーとの対話と条件分岐が必要な処理には画面フローを使う。", "レコードトリガーフローは画面を表示できない。", "入力規則ではチェックしかできず、段階的な入力や申請はできない。", "夜間処理ではユーザーとの対話もリアルタイムの申請もできない。"], "ref": "画面フロー"}, {"id": "CI2-022", "domain": "コンサルティングおよび実装戦略", "topic": "外部連携（ERP）設計", "q": "営業担当は取引先画面で、ERPにある受注・出荷状況をリアルタイムに見たい。データ量は数千万件で、Salesforceのストレージにはコピーしたくない。ERPはOData 4.0のエンドポイントを公開している。最も適切な方法はどれか。", "choices": ["Data Loaderで毎晩ERPから全件インポートする", "Salesforce Connectで外部オブジェクトを定義し、取引先との関連を設定する", "ERPのデータを毎時CSV出力し、Salesforceのファイルとして添付する", "営業担当にERPのアカウントを発行し、別画面で確認してもらう"], "answer": [1], "explanation": "Salesforce Connectは外部データをSalesforceにコピーせず、外部オブジェクトとして参照時にリアルタイムで取得します。ODataに対応しており、外部オブジェクトに間接参照関係を作成して取引先の一意な外部ID項目と照合すると、取引先の関連リストに表示できます。大容量のデータをストレージを消費せずに扱えます。", "choiceNotes": ["データをコピーするのでストレージを消費し、リアルタイム性もない。", "正解。データをコピーせずに、リアルタイムで参照できる。", "ファイルでは検索や関連付けがしにくく、リアルタイムでもない。", "別画面での確認はユーザー体験が悪く、ライセンスコストもかかる。"], "ref": "Salesforce Connect（外部オブジェクト）"}, {"id": "CI2-023", "domain": "コンサルティングおよび実装戦略", "topic": "外部連携（ERP）設計", "q": "ERPの商品マスタと価格表（約200万件）を、毎晩ミドルウェア経由でSalesforceに同期する。処理時間とAPI呼び出し数を抑えたい。ミドルウェアが使うべきAPIはどれか。", "choices": ["REST API で1件ずつ作成・更新する", "Bulk API 2.0 で非同期の一括処理を行う", "Streaming API で変更を購読する", "Metadata API でデータを配置する"], "answer": [1], "explanation": "Bulk API 2.0は大量レコードの非同期処理に最適化されており、数十万件以上の読み込みに向いています。少ない呼び出し回数で大量のデータを処理できるため、API制限の消費も抑えられます。", "choiceNotes": ["1件ずつでは呼び出し回数が膨大になり、時間もAPI制限も足りない。", "正解。大量データの夜間一括同期に適している。", "Streaming APIはSalesforce側の変更を通知するもので、データ取り込みには使わない。", "Metadata APIは設定（メタデータ）を扱うもので、レコードのデータは扱わない。"], "ref": "Bulk API 2.0"}, {"id": "CI2-024", "domain": "コンサルティングおよび実装戦略", "topic": "外部連携（ERP）設計", "q": "商談が『受注』になったら、受注情報をERPに連携して受注伝票を作りたい。ERPの停止中もSalesforceの保存処理を止めたくないので、疎結合なイベント駆動にしたい。適切な方法はどれか。2つ選択してください。", "choices": ["レコードトリガーフローでプラットフォームイベントを発行し、ミドルウェアがそれを購読してERPに登録する", "商談の変更データキャプチャ（CDC）を有効にし、ミドルウェアが変更イベントを購読してERPに登録する", "営業事務が毎日レポートをエクスポートし、ERPに手入力する", "Apexトリガーから同期でERPのAPIを呼び出し、失敗したら商談の保存をエラーにする", "ERPのユーザーがSalesforceにログインし、受注商談を目視で確認する"], "answer": [0, 1], "explanation": "プラットフォームイベントやCDCを使うと、Salesforceはイベントを発行するだけで、購読側が非同期に処理します。ERPの停止中もSalesforceの保存処理には影響しない疎結合な連携になり、購読側は保持期間内であれば再取得できます。", "choiceNotes": ["正解。フローから発行するイベントを外部の購読者が非同期に処理する。", "正解。レコードの変更を自動でイベントとして配信でき、疎結合に連携できる。", "手作業は遅く、転記ミスも起きる。", "同期呼び出しはERPに依存した密結合になり、トリガー内での同期コールアウトもできない。", "目視確認は自動連携にならず、漏れが出る。"], "ref": "プラットフォームイベントと変更データキャプチャ"}, {"id": "CI2-025", "domain": "コンサルティングおよび実装戦略", "topic": "外部連携（ERP）設計", "q": "ERPの取引先コードをもとに、Salesforceの取引先を毎日新規作成・更新している。ERP側で再送が起きると取引先が重複してしまう。最も適切な対策はどれか。", "choices": ["取引先に『ERP取引先コード』項目を外部IDかつ一意として作り、その項目をキーにupsertで連携する", "取引先名が同じレコードを毎週手作業でマージする", "重複ルールを無効にして連携エラーを減らす", "連携のたびに全取引先を削除してから作り直す"], "answer": [0], "explanation": "外部ID（一意）項目をキーにupsertすると、既存レコードがあれば更新、なければ作成となり、再送されても重複しません。Salesforce IDを外部システムに持たせる必要もありません。", "choiceNotes": ["正解。外部IDをキーにしたupsertで、再送しても冪等な連携になる。", "事後のマージは手間がかかり、重複の発生自体は防げない。", "重複ルールを無効にすると重複を防げなくなる。", "削除して作り直すと、関連する商談や活動の参照が切れてしまう。"], "ref": "外部ID項目とupsert"}, {"id": "CI3-001", "domain": "コンサルティングおよび実装戦略", "topic": "現行業務分析（観察）", "q": "ある製造業の営業部門で Sales Cloud の導入プロジェクトが始まった。マネージャーへのヒアリングでは「見積作成は標準化されている」と説明されたが、コンサルタントは実際の運用との乖離を懸念している。現行業務を正確に把握するために最も効果的なアプローチはどれか。", "choices": ["マネージャーの説明をそのまま現行業務フローとして文書化し、早期に設計へ進む", "営業担当者の実際の作業に同席して観察（シャドーイング）し、例外処理や手作業の回避策を洗い出したうえで業務フローを作成する", "Salesforce の標準商談プロセスを提示し、現行業務の確認は省略して標準に合わせてもらう", "全営業担当者にアンケートを配布し、回答の多数決で現行業務フローを決定する"], "answer": [1], "explanation": "現行業務分析では、管理者の認識と現場の実態が異なることが多い。実際の作業を観察することで、表計算ソフトでの二重入力や例外承認など、ヒアリングでは表に出にくい課題を把握できる。これがギャップ分析と要件定義の精度を高める。", "choiceNotes": ["管理者の認識だけでは現場の例外や回避策を見落とす。", "観察により実態と課題を把握でき、最も正確な現行分析になる。", "現行業務を理解せずに標準を押し付けると定着や要件漏れのリスクが高い。", "アンケートの多数決では業務の詳細や例外を正確に把握できない。"], "ref": "Trailhead: Salesforce Business Analyst（Discovery と業務プロセスマッピング）"}, {"id": "CI3-002", "domain": "コンサルティングおよび実装戦略", "topic": "非機能要件の定義", "q": "要件定義ワークショップで営業部門から機能要件は多数挙がったが、コンサルタントは非機能要件が不足していると判断した。非機能要件として整理すべき項目はどれか。2つ選択してください。", "choices": ["顧客の個人情報を扱う項目について、閲覧できる利用者の範囲と監査ログの保持期間", "商談フェーズに「価格交渉」を追加すること", "モバイル回線環境の外出先でも主要画面が実用的な速度で表示されること", "見積承認を部長に回す承認プロセスを作成すること", "取引先に業種別の選択リスト値を追加すること"], "answer": [0, 2], "explanation": "非機能要件は、システムが何をするかではなく、どの程度の品質・制約で動くかを定める要件である。セキュリティ、監査、性能、可用性などが該当する。フェーズ追加や承認プロセス、選択リスト値は機能要件にあたる。", "choiceNotes": ["アクセス範囲と監査ログ保持はセキュリティ・コンプライアンスの非機能要件である。", "商談フェーズの追加は業務機能に関する機能要件である。", "表示性能や利用環境は非機能要件である。", "承認プロセスは業務機能を定める機能要件である。", "選択リスト値の追加はデータ項目に関する機能要件である。"], "ref": "Trailhead: Requirements Gathering（機能要件と非機能要件）"}, {"id": "CI3-003", "domain": "コンサルティングおよび実装戦略", "topic": "MVP のスコープ定義", "q": "予算と期間が限られた中で、ある企業は6か月後に Sales Cloud を稼働させたい。要件一覧には商談管理、売上予測、CPQ 的な複雑な見積、ERP連携、パートナーポータルが含まれる。最初のリリース（MVP）のスコープを決める考え方として最も適切なのはどれか。", "choices": ["要件一覧のすべてを最初のリリースに含め、稼働日を遅らせる", "最も技術的に難しい要件から着手し、難易度の低い要件は後回しにする", "営業担当者が日常的に使い、ビジネス価値を早期に測定できる中核プロセス（例：商談管理と売上予測）に絞り、それ以外は後続リリースのロードマップに配置する", "各部門から1つずつ要件を選び、部門間の公平性を優先してスコープを決める"], "answer": [2], "explanation": "MVP は、最小限の範囲で利用者に価値を届け、フィードバックを得て改善を重ねるための最初のリリースである。中核業務に絞ることでリスクを下げ、定着と効果測定を早期に始められる。残りの要件はロードマップとして合意しておく。", "choiceNotes": ["全要件を詰め込むと期間とリスクが膨らみ、MVP の目的に反する。", "難易度ではなく価値と依存関係で優先度を決めるべきである。", "中核価値に絞り後続をロードマップ化するのが MVP の正しい考え方である。", "部門間の公平性はビジネス価値に基づく優先順位付けの基準として不適切である。"], "ref": "Trailhead: Agile/Iterative Delivery、Salesforce 導入計画"}, {"id": "CI3-004", "domain": "コンサルティングおよび実装戦略", "topic": "ROI とベースライン測定", "q": "経営層から「Sales Cloud 導入の投資対効果を1年後に示してほしい」と求められた。コンサルタントがプロジェクト初期に行うべき最も重要な作業はどれか。", "choices": ["稼働後に Salesforce のレポートを作成し、その数値だけで効果を説明する", "導入前の時点で、商談化率、平均商談期間、見積作成時間などの指標を現状値（ベースライン）として測定・記録しておく", "ライセンス費用を他社製品と比較した資料を作成する", "稼働後にユーザー満足度アンケートのみを実施する"], "answer": [1], "explanation": "効果を示すには、導入前と導入後を同じ指標で比較する必要がある。導入前のベースラインがないと改善幅を定量化できない。指標はビジネスケースで掲げた目的と結び付けて選定する。", "choiceNotes": ["導入前の値がなければ改善幅を示せない。", "ベースラインを先に取ることで導入前後の比較が可能になる。", "ライセンス比較は費用面の資料であり、効果測定にはならない。", "満足度だけでは投資対効果を定量的に示せない。"], "ref": "Trailhead: Business Value / ROI の測定（Salesforce 導入の成功指標）"}, {"id": "CI3-005", "domain": "コンサルティングおよび実装戦略", "topic": "プロトタイプによる要件確認", "q": "営業部門のステークホルダーは、文章で書かれた要件定義書を読んでも画面のイメージが湧かず、承認が進まない。要件の合意形成を早める手段として最も適切なのはどれか。", "choices": ["要件定義書の分量を増やし、より詳細な文章で説明する", "Sandbox で主要画面や商談プロセスの簡易プロトタイプを構成し、デモを見せながらフィードバックを得る", "本番組織で直接構成し、利用者に試してもらう", "承認者を減らし、IT 部門だけで要件を確定する"], "answer": [1], "explanation": "Salesforce は宣言的に素早く構成できるため、Sandbox でプロトタイプを作りデモすることで、利用者は具体的なイメージを持って意見を出せる。認識のずれを早期に発見でき、手戻りが減る。本番での試行はリスクが高い。", "choiceNotes": ["文章を増やしても画面イメージの問題は解消しにくい。", "Sandbox でのプロトタイプとデモは合意形成を早める有効な手段である。", "本番で試すと実データや利用者に影響するリスクがある。", "業務部門を除外すると要件の妥当性と定着が損なわれる。"], "ref": "Trailhead: Salesforce Business Analyst（プロトタイピング）"}, {"id": "CI3-006", "domain": "コンサルティングおよび実装戦略", "topic": "ログイン率と利用状況の可視化", "q": "稼働から1か月後、経営層は営業担当者が実際に Sales Cloud を使っているかを把握したいと考えている。開発工数をかけずに、ログイン状況や主要オブジェクトの利用状況をダッシュボードで確認する方法として最も適切なのはどれか。", "choices": ["Apex で独自のログ収集処理を開発する", "Salesforce Labs が AppExchange で提供する Salesforce Adoption Dashboards をインストールし、ログインや取引先・商談などの利用状況を確認する", "各営業担当者に毎週利用状況を自己申告させる", "システム管理者がユーザーごとにログイン履歴を目視で確認する"], "answer": [1], "explanation": "Salesforce Adoption Dashboards は、ログイン状況や主要オブジェクトの作成・更新状況などを可視化するダッシュボードとレポートを無償で提供するパッケージである。開発せずに定着度を継続的に監視できる。自己申告や目視確認は不正確で手間がかかる。", "choiceNotes": ["既存の無償パッケージで実現でき、開発は過剰である。", "Adoption Dashboards で開発なしに利用状況を可視化できる。", "自己申告は不正確で継続性もない。", "目視確認は手間がかかり、傾向分析にも向かない。"], "ref": "AppExchange: Salesforce Adoption Dashboards"}, {"id": "CI3-007", "domain": "コンサルティングおよび実装戦略", "topic": "定着度と成果の指標", "q": "ある企業では稼働後のログイン率が95%に達したが、経営層は「売上予測の精度が上がっていない」と不満を持っている。コンサルタントが定着度の評価として追加で確認すべき指標はどれか。2つ選択してください。", "choices": ["商談の次のステップや完了予定日が期限切れのまま更新されていない件数", "ログイン回数のユーザー別ランキング", "ユーザーのプロフィール写真の登録率", "商談の金額・完了予定日・フェーズなど売上予測に使う主要項目の入力率", "ホーム画面の表示回数"], "answer": [0, 3], "explanation": "ログイン率は利用の入口にすぎず、業務成果に結び付くかはデータの質と鮮度で判断する。売上予測の精度には、主要項目の入力率や古いままの商談の件数が直接影響する。成果に結び付く指標を見て、トレーニングやプロセス改善の対象を特定する。", "choiceNotes": ["更新されない商談は予測精度を下げる直接要因であり、確認すべき指標である。", "ログイン回数を増やしても予測精度の改善には直結しない。", "プロフィール写真は売上予測と関係しない。", "主要項目の入力率は予測精度に直結する重要な指標である。", "画面表示回数はログイン率と同様に表面的な利用指標である。"], "ref": "Trailhead: User Adoption Strategies（定着度の測定）"}, {"id": "CI3-008", "domain": "コンサルティングおよび実装戦略", "topic": "ユーザーフィードバックの収集と反映", "q": "稼働後、営業担当者から改善要望が個別のメールやチャットで管理者に散発的に届き、対応漏れや重複が発生している。継続的改善の仕組みとして最も適切なのはどれか。", "choices": ["要望は受け付けず、次回の大規模改修まで凍結する", "フィードバックを受け付ける窓口（例：専用の Chatter グループや要望登録用のレコード）を一本化し、内容を評価・優先順位付けしてバックログに登録し、対応状況を利用者に共有する", "管理者が受け取った要望を、届いた順にすべて即座に本番組織へ反映する", "要望を出した人数が最も多い部門の要望だけを採用する"], "answer": [1], "explanation": "フィードバックの窓口を一本化し、評価・優先順位付けを経てバックログで管理することで、漏れや重複を防げる。対応状況を共有すると利用者は意見が反映されていると感じ、定着が進む。無計画な即時反映は品質とガバナンスを損なう。", "choiceNotes": ["要望を凍結すると利用者の不満が蓄積し定着を妨げる。", "窓口の一本化、優先順位付け、結果の共有が継続的改善の基本である。", "評価やテストを経ずに本番へ反映すると障害や不整合を招く。", "人数だけで判断するとビジネス価値に基づく優先順位付けにならない。"], "ref": "Trailhead: User Adoption Strategies（フィードバックループ）"}, {"id": "CI3-009", "domain": "コンサルティングおよび実装戦略", "topic": "In-App Guidance の活用", "q": "新しい商談の入力ルールを展開したが、営業担当者は研修資料を読まず、入力ミスが続いている。利用者が実際に作業する Lightning ページ上で、操作のタイミングに合わせて案内を表示したい。最も適切な方法はどれか。", "choices": ["In-App Guidance のプロンプトを作成し、対象の Lightning ページやプロファイル・権限を条件に表示する", "全社メールで入力ルールを再度通知する", "入力ルールを記載した PDF をファイルとしてアップロードする", "商談のすべての項目を必須項目に変更する"], "answer": [0], "explanation": "In-App Guidance は、Lightning Experience の特定ページ上にフローティングまたはドッキング型のプロンプトを表示できる。対象ユーザーや表示頻度・期間を設定でき、作業の文脈で案内を届けられる。必須項目の乱用は入力負担を増やし、定着を損なう。", "choiceNotes": ["作業画面上で対象者に案内でき、要件に最も合う。", "メールは読まれにくく、作業時の文脈で届かない。", "資料を置くだけでは参照されない課題は解決しない。", "すべてを必須にすると入力負担が増え、データ品質もかえって下がりうる。"], "ref": "Salesforce ヘルプ: In-App Guidance（プロンプトとウォークスルー）"}, {"id": "CI3-010", "domain": "コンサルティングおよび実装戦略", "topic": "ヘルプテキストと説明の使い分け", "q": "カスタム項目「重点案件区分」の入力基準を営業担当者が理解しておらず、入力がばらついている。管理者は項目の「説明」欄に基準を記載したが、改善されなかった。最も適切な対応はどれか。", "choices": ["項目の「説明」欄の記載をさらに詳しくする", "項目の「ヘルプテキスト」に入力基準を記載し、ページ上でアイコンにカーソルを合わせると表示されるようにする", "項目の API 参照名を基準がわかる名前に変更する", "項目を数式項目に変更する"], "answer": [1], "explanation": "項目の「説明」は管理者が設定画面で参照するためのもので、利用者の入力画面には表示されない。「ヘルプテキスト」はレコードの詳細・編集画面で情報アイコンとして表示され、利用者が入力時に参照できる。入力基準の周知にはヘルプテキストが適している。", "choiceNotes": ["説明欄は利用者の画面に表示されないため効果がない。", "ヘルプテキストは入力画面で参照でき、要件に合う。", "API 参照名は利用者の画面に表示されず、変更は連携等に影響しうる。", "手入力が必要な判断項目を数式にすることはできない。"], "ref": "Salesforce ヘルプ: 項目レベルのヘルプの定義"}, {"id": "CI3-011", "domain": "コンサルティングおよび実装戦略", "topic": "チャンピオン（スーパーユーザー）制度", "q": "全国20拠点に Sales Cloud を展開する。本社の管理者は2名しかおらず、各拠点からの操作質問への対応が追いつかないと予想される。定着を支える体制として最も適切なのはどれか。", "choices": ["質問はすべて本社管理者が電話で受け付ける", "各拠点で業務に詳しい利用者をチャンピオン（スーパーユーザー）として選び、先行トレーニングを行って拠点内の一次サポートと現場の声の吸い上げを担ってもらう", "拠点ごとにシステム管理者権限を持つユーザーを置き、自由に設定変更できるようにする", "質問が多い拠点は展開を延期する"], "answer": [1], "explanation": "チャンピオン制度は、現場に近い利用者が仲間を支援し、課題を中央に伝える役割を担う。少人数の管理チームでも広域展開の定着を支えられる。管理者権限の分散はガバナンス上のリスクが大きい。", "choiceNotes": ["2名の管理者では対応が追いつかず、定着を妨げる。", "チャンピオンが一次サポートとフィードバックの窓口となり定着を支える。", "管理者権限の乱発は設定の不整合やセキュリティリスクを招く。", "展開延期は根本的な解決にならない。"], "ref": "Trailhead: User Adoption Strategies（チャンピオンプログラム）"}, {"id": "CI3-012", "domain": "コンサルティングおよび実装戦略", "topic": "エディション外の要件への対応", "q": "Professional Edition を利用している企業から、「基幹システムから Salesforce へ API で受注データを連携し、さらに Apex トリガーで独自の計算処理を行いたい」という要件が出た。コンサルタントの対応として適切なものはどれか。2つ選択してください。", "choices": ["Professional Edition では Apex を作成できないため、宣言的な機能（フローなど）で計算処理を実現できるか検討し、できない場合は上位エディションへの移行を提案する", "Professional Edition でも Apex トリガーは制限なく作成できると説明する", "API 連携には API アクセスのアドオン購入または上位エディションが必要であることを説明し、費用と合わせて選択肢を提示する", "Sandbox で Apex を開発すれば Professional Edition の本番にも展開できると説明する", "要件を満たせないことを伏せて、手動のデータ入力で運用してもらう"], "answer": [0, 2], "explanation": "Professional Edition では独自の Apex コードを作成できず、API アクセスも標準では含まれず追加購入が必要である。エディションで利用できない機能が要件になった場合は、代替手段の検討、アドオン、上位エディションへの移行などの選択肢を費用と合わせて提示する。制約を伏せることはコンサルタントとして不適切である。", "choiceNotes": ["宣言的代替を検討し、不可なら上位エディションを提案するのは適切である。", "Professional Edition では独自の Apex を作成できない。", "API はアドオンまたは上位エディションが必要であり、選択肢の提示は適切である。", "エディションの制約は Sandbox で開発しても回避できない。", "制約を伏せることは顧客の意思決定を誤らせる。"], "ref": "Salesforce ヘルプ: Salesforce エディションの比較"}, {"id": "CI3-013", "domain": "コンサルティングおよび実装戦略", "topic": "技術的負債の棚卸し", "q": "10年前から Salesforce を利用している企業で、カスタム項目やプロファイルが増えすぎて保守が困難になっている。再構築の前に、組織の現状を効率よく診断したい。最初に活用すべき機能として最も適切なのはどれか。", "choices": ["メタデータの棚卸しを行う。カスタム項目ごとの入力率と「使用場所」、プロファイルと権限セットの数と割り当て状況、ページレイアウトや自動化の数を一覧化し、利害関係者と改善候補を評価する", "すべてのカスタム項目を一括削除してから必要なものだけ再作成する", "新しい組織を契約し、既存組織の分析は行わない", "利用者に不要と思う項目を挙げてもらい、その項目をすぐに削除する"], "answer": [0], "explanation": "再構築の前に、組織のメタデータと利用状況を体系的に棚卸しし、未使用の項目、重複したプロファイル、複雑なレイアウトや自動化を特定することが技術的負債の解消の出発点になる。かつて診断に使われた Salesforce Optimizer アプリは Winter '26 以降順次廃止されたため、標準の設定画面やレポート、「使用場所」などを使って現状を把握する。根拠のない一括削除はデータや連携の破壊につながる。", "choiceNotes": ["利用状況と依存関係に基づく棚卸しで改善候補を把握でき、最初の作業として適切である。", "一括削除はデータ損失や依存関係の破壊を招く。", "現状分析をせずに新組織へ移るのは移行リスクとコストが大きい。", "利用状況や依存関係を確認せずに削除すると影響

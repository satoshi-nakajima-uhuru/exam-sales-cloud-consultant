が出る。"], "ref": "Salesforce ヘルプ: カスタム項目の「使用場所」、Salesforce Product & Feature Retirements（Optimizer の廃止）"}, {"id": "CI3-014", "domain": "コンサルティングおよび実装戦略", "topic": "項目削除前の影響確認", "q": "技術的負債の解消のため、使われていないと思われるカスタム項目を削除したい。削除前に、その項目がフロー、数式、レイアウト、Apex などから参照されていないかを確認する方法として最も適切なのはどれか。", "choices": ["項目を削除し、エラーが出たら復元する", "カスタム項目の詳細画面で「使用場所」を確認し、参照しているコンポーネントを把握したうえで、データの入力状況も確認して削除を判断する", "項目の表示ラベルを変更して様子を見る", "項目レベルセキュリティですべてのプロファイルから非表示にすれば削除と同じ効果がある"], "answer": [1], "explanation": "カスタム項目の「使用場所」ボタンで、その項目を参照しているレイアウトやフロー、Apex などを確認できる。参照元の修正と、データ値の有無・保管の要否の確認をしてから削除する。削除後の復元は可能な場合もあるが、影響確認の代わりにはならない。", "choiceNotes": ["影響確認を省くと本番の自動化や連携が停止するおそれがある。", "「使用場所」とデータの確認で安全に削除判断できる。", "表示ラベルの変更は依存関係の確認にならない。", "非表示にしても項目とデータ、参照は残り、負債は解消しない。"], "ref": "Salesforce ヘルプ: カスタム項目の「使用場所」"}, {"id": "CI3-015", "domain": "コンサルティングおよび実装戦略", "topic": "ワークフロールールとプロセスビルダーの移行", "q": "既存組織には多数のワークフロールールとプロセスビルダーが残っており、同じオブジェクトに複数の自動化が混在している。技術的負債の解消計画として最も適切なのはどれか。", "choices": ["サポートが終了した機能なので、すべて無効化して自動化をやめる", "「フローに移行」ツールを活用してフローへの移行を進め、オブジェクトごとに自動化を整理・統合したうえで Sandbox でテストしてから展開する", "新しい要件はすべてプロセスビルダーで作り続ける", "ワークフロールールとフローを同じ処理で並行稼働させ、結果を比較しながら運用する"], "answer": [1], "explanation": "ワークフロールールとプロセスビルダーはサポートが終了しており、今後の自動化はフローで構築することが推奨される。「フローに移行」ツールで移行を支援でき、移行時にオブジェクトごとの自動化を整理すると保守性が上がる。移行後は Sandbox で十分にテストする。", "choiceNotes": ["無効化するだけでは業務に必要な自動化が失われる。", "移行ツールとオブジェクト単位の整理、テストを組み合わせるのが適切である。", "サポートが終了した機能での新規開発は負債を増やす。", "同じ処理の並行稼働は二重更新や競合を引き起こす。"], "ref": "Salesforce ヘルプ: フローに移行ツール"}, {"id": "CI3-016", "domain": "コンサルティングおよび実装戦略", "topic": "ハードコードされた設定値", "q": "既存のフローに、特定ユーザーのレコード ID や割引率がハードコードされており、Sandbox から本番へ展開するたびに修正が必要になっている。環境間で展開可能な設定値の持ち方として最も適切なのはどれか。", "choices": ["レコード ID を Sandbox と本番で同じになるよう手動で作り直す", "カスタムメタデータ型に設定値を保持し、フローから参照する。カスタムメタデータ型のレコードは変更セットなどでメタデータとして展開できる", "カスタム設定に値を保持すれば、レコードも自動的に変更セットで展開される", "設定値をすべてフローの説明欄に記載する"], "answer": [1], "explanation": "カスタムメタデータ型のレコードはメタデータとして扱われ、変更セットやパッケージで環境間に展開できる。フローや数式、Apex から参照できるため、設定値のハードコードを避けられる。カスタム設定のレコードはデータとして扱われるため、変更セットでは展開されない。", "choiceNotes": ["レコード ID は環境ごとに異なり、手動で揃えることは現実的でない。", "カスタムメタデータ型は展開可能で、設定値の外部化に適している。", "カスタム設定のレコードはデータであり、変更セットでは展開されない。", "説明欄の記載は処理から参照できない。"], "ref": "Salesforce ヘルプ: カスタムメタデータ型"}, {"id": "CI3-017", "domain": "コンサルティングおよび実装戦略", "topic": "Sandbox の更新間隔", "q": "UAT 用の Full Sandbox を3日前に更新したが、本番データの取り込みに誤りがあったことがわかり、プロジェクトマネージャーはすぐに再更新したいと考えている。コンサルタントの説明として正しいのはどれか。", "choices": ["Full Sandbox はいつでも何度でも更新できる", "Full Sandbox の更新間隔は29日であるため、すぐには再更新できない。UAT 計画では更新タイミングを事前に確定しておく必要がある", "Full Sandbox は1日に1回更新できる", "Full Sandbox は一度作成すると更新できない"], "answer": [1], "explanation": "Sandbox の更新間隔は種類によって異なり、Developer と Developer Pro は1日、Partial Copy は5日、Full は29日である。Full Sandbox は頻繁に更新できないため、UAT やトレーニングのスケジュールに合わせて更新日を計画しておく必要がある。", "choiceNotes": ["Full Sandbox には29日の更新間隔がある。", "Full Sandbox の更新間隔は29日であり、計画的な更新が必要である。", "1日ごとに更新できるのは Developer 系の Sandbox である。", "Full Sandbox は更新間隔を空ければ更新できる。"], "ref": "Salesforce ヘルプ: Sandbox のライセンスとストレージ（更新間隔）"}, {"id": "CI3-018", "domain": "コンサルティングおよび実装戦略", "topic": "Sandbox 更新後のメール設定", "q": "Sandbox を更新した後、UAT 参加者に「パスワードリセットや承認依頼のメールが届かない」と言われた。Sandbox の仕様として考えられる原因と対応の組み合わせで最も適切なのはどれか。", "choices": ["Sandbox ではメール送信機能が存在しないため、テストは本番で行う", "Sandbox 作成・更新時にユーザーのメールアドレスに「.invalid」が付加され、メール配信設定も制限されている。テスト対象ユーザーのメールアドレスを修正し、必要に応じてメール配信のアクセスレベルを変更する", "メールが届かないのは本番のプロファイル設定が原因なので本番を修正する", "Sandbox のユーザーはパスワードを持たないため、ログインには本番の資格情報を使う"], "answer": [1], "explanation": "Sandbox では誤って顧客や利用者へメールが送られないよう、ユーザーのメールアドレスに「.invalid」が付加され、メール配信のアクセスレベルも既定で制限される。テストに必要なユーザーのみメールアドレスを修正し、配信設定を変更して検証する。", "choiceNotes": ["Sandbox でもメール送信は設定次第で可能である。", "「.invalid」の付加と配信設定の制限が原因であり、対応も適切である。", "本番の設定ではなく Sandbox 側の仕様が原因である。", "Sandbox のユーザーにもパスワードはある。作成・更新時に本番のユーザー情報がコピーされ、ユーザー名に Sandbox 名が付加されたものでログインする。"], "ref": "Salesforce ヘルプ: Sandbox のメール配信、Sandbox 作成後のユーザーのメールアドレス"}, {"id": "CI3-019", "domain": "コンサルティングおよび実装戦略", "topic": "Sandbox プレビューとリリース対応", "q": "Salesforce の次回メジャーリリースが本番に適用される前に、既存のカスタマイズへの影響を確認したい。コンサルタントの推奨として最も適切なのはどれか。", "choices": ["本番に新リリースが適用されてから問題を確認する", "Sandbox プレビューの案内に従い、指定期限までに Sandbox を更新するなどしてプレビューインスタンスに乗せ、主要な業務シナリオを回帰テストする", "Developer Edition 組織を新規作成し、本番と無関係な機能だけを試す", "リリースノートは読まず、トラブル発生時にサポートへ問い合わせる"], "answer": [1], "explanation": "Salesforce は年3回のメジャーリリースの前に Sandbox プレビュー期間を設けている。Sandbox をプレビューインスタンスに乗せることで、本番適用前に新リリースでの既存カスタマイズの動作を確認できる。リリースノートと合わせて回帰テストを計画する。", "choiceNotes": ["本番適用後の確認では業務影響を防げない。", "Sandbox プレビューでの回帰テストが事前確認として適切である。", "本番のカスタマイズを含まない組織では影響を確認できない。", "リリースノートの確認と事前テストを怠ると障害リスクが高まる。"], "ref": "Salesforce ヘルプ: Sandbox プレビューの手順、リリースノート"}, {"id": "CI3-020", "domain": "コンサルティングおよび実装戦略", "topic": "リリース更新の管理", "q": "設定画面の「リリース更新」に、適用期限が近い更新が複数表示されている。管理者はどのように扱うべきか。", "choices": ["期限が来れば自動適用されるので何もしない", "各更新の内容と影響を確認し、Sandbox で有効化してテストしたうえで、期限前に本番で計画的に有効化する", "すべての更新を本番で即座に有効化する", "リリース更新は無効化したままにすれば永久に適用されない"], "answer": [1], "explanation": "リリース更新は、セキュリティや動作に影響する変更を段階的に適用するための仕組みで、適用期限を過ぎると強制的に有効になる。事前に Sandbox でテストし、影響を把握したうえで計画的に本番で有効化することで、予期しない障害を防げる。", "choiceNotes": ["強制適用時に既存処理が影響を受けるおそれがある。", "Sandbox で検証し計画的に有効化するのが適切である。", "テストせずに本番で有効化すると業務に影響が出るおそれがある。", "期限を過ぎると強制的に適用されるため、永久に回避はできない。"], "ref": "Salesforce ヘルプ: リリース更新"}, {"id": "CI3-021", "domain": "コンサルティングおよび実装戦略", "topic": "DevOps Center の採用", "q": "これまで変更セットで展開してきたが、誰がいつ何を変更したか追跡できず、複数の管理者の作業が衝突している。プログラミングに不慣れな管理者も多い。ソース管理を取り入れつつクリック操作中心で展開を管理したい場合、最も適切な選択肢はどれか。", "choices": ["DevOps Center を導入し、作業項目単位で変更を追跡して、GitHub リポジトリと連携したパイプラインで環境間に昇格させる", "変更セットのまま運用し、変更内容を口頭で共有する", "すべての変更を本番で直接行い、Sandbox を廃止する", "管理者ごとに別の本番組織を用意する"], "answer": [0], "explanation": "DevOps Center は、GitHub をソース管理として使いながら、作業項目ごとに変更を追跡し、パイプラインのステージを通じて展開できるツールである。クリック操作中心で使えるため、管理者が多いチームでもソース管理に基づくリリースを実現しやすい。", "choiceNotes": ["ソース管理と変更追跡、宣言的な操作を両立でき要件に合う。", "口頭共有では追跡と衝突の問題を解決できない。", "本番での直接変更は品質とガバナンスのリスクが大きい。", "本番組織を分けると業務データが分断される。"], "ref": "Salesforce ヘルプ: DevOps Center"}, {"id": "CI3-022", "domain": "コンサルティングおよび実装戦略", "topic": "Sandbox の個人情報保護", "q": "外部ベンダーの開発者が Full Sandbox で作業する予定だが、Full Sandbox には本番の顧客の氏名、電話番号、メールアドレスがコピーされる。個人情報保護の観点から最も適切な対策はどれか。", "choices": ["Full Sandbox の使用をやめ、テストはすべて本番で行う", "Salesforce Data Mask を利用し、Sandbox 内の個人情報をマスキングまたは匿名化してから開発者に提供する", "開発者に秘密保持契約を結ばせれば、技術的な対策は不要である", "Sandbox の項目ラベルを変更して個人情報だと分からないようにする"], "answer": [1], "explanation": "Salesforce Data Mask は、Sandbox 内の機密データを置換・匿名化・削除できる機能である。本番と同等のデータ量や構造を保ちつつ個人情報の露出を抑えられる。契約だけでなく技術的な保護措置を組み合わせることが望ましい。", "choiceNotes": ["本番でのテストは業務データの破損や情報露出のリスクがさらに高い。", "Data Mask で Sandbox の個人情報を保護できる。", "契約のみでは漏えいリスクを技術的に低減できない。", "ラベルを変えても実データはそのまま見える。"], "ref": "Salesforce ヘルプ: Salesforce Data Mask"}, {"id": "CI3-023", "domain": "コンサルティングおよび実装戦略", "topic": "データ保護とプライバシーの設定", "q": "欧州の顧客を扱う企業で、リードや取引先責任者ごとに「追跡を拒否する」「個人データの消去を求める」などのプライバシーに関する意向を記録したい。標準機能で実現する方法として最も適切なのはどれか。", "choices": ["データ保護とプライバシーの設定を有効にし、個人（Individual）オブジェクトでプライバシー設定を管理して、リードや取引先責任者と関連付ける", "取引先の説明項目に意向を自由記述で入力する", "プライバシーの意向を記録した Excel ファイルを共有フォルダで管理する", "リードと取引先責任者のレコードをすべて削除する"], "answer": [0], "explanation": "データ保護とプライバシーの設定を有効にすると、個人（Individual）オブジェクトを使ってプライバシーの意向を記録し、リードや取引先責任者、個人取引先に関連付けられる。追跡拒否や個人データの消去要求などの項目が用意されており、規制対応の業務プロセスの基盤になる。", "choiceNotes": ["個人オブジェクトで意向を構造化して管理でき、要件に合う。", "自由記述では検索や自動処理に使えず、管理が不十分である。", "システム外管理では業務プロセスに反映されにくい。", "一律削除は業務を破壊し、要件にも合わない。"], "ref": "Salesforce ヘルプ: データ保護とプライバシー、個人オブジェクト"}, {"id": "CI3-024", "domain": "コンサルティングおよび実装戦略", "topic": "データ分類の設定", "q": "コンプライアンス部門から、個人情報や機密情報を含む項目を一覧で把握し、規制区分ごとに管理したいという要望があった。項目定義の段階で対応できる標準機能として最も適切なのはどれか。", "choices": ["各項目の「データ機密レベル」や「コンプライアンス分類」などのデータ分類メタデータを設定し、項目一覧を管理する", "機密情報を含む項目の表示ラベルの先頭に「機密」と付ける", "機密項目をすべて数式項目に変更する", "機密項目を別の Salesforce 組織に移す"], "answer": [0], "explanation": "カスタム項目と標準項目には、データ所有者、項目の使用状況、データ機密レベル、コンプライアンス分類（例：PII、GDPR など）といったデータ分類のメタデータを設定できる。これにより機密項目を体系的に把握でき、アクセス制御や暗号化の検討にも役立つ。", "choiceNotes": ["データ分類メタデータで規制区分ごとに項目を管理できる。", "ラベル変更は利用者にも見え、体系的な管理にならない。", "入力が必要な項目を数式にすることはできず目的にも合わない。", "組織の分割は業務データを分断し、過剰な対応である。"], "ref": "Salesforce ヘルプ: データ分類（Data Classification）"}, {"id": "CI3-025", "domain": "コンサルティングおよび実装戦略", "topic": "Salesforce Shield の構成要素の選択", "q": "金融業の顧客から次の要件が出た。(1) 保存データを顧客管理の鍵で暗号化したい、(2) 誰がどのレポートをエクスポートしたかを監視し、必要に応じて大量エクスポートをブロックしたい。Salesforce Shield の構成要素として適切なものはどれか。2つ選択してください。", "choices": ["Shield Platform Encryption", "Event Monitoring（トランザクションセキュリティを含む）", "Field Audit Trail", "Data Loader", "Health Check"], "answer": [0, 1], "explanation": "Shield Platform Encryption は保存データを暗号化し、テナントシークレットや鍵の管理を顧客側で行える。Event Monitoring はレポートのエクスポートなどのユーザー操作をイベントとして記録し、トランザクションセキュリティポリシーで特定の操作をブロックできる。Field Audit Trail は項目履歴の長期保持のための機能である。", "choiceNotes": ["保存データの暗号化と鍵管理の要件に合う。", "レポートエクスポートの監視とブロックの要件に合う。", "項目履歴の長期保持の機能であり、今回の要件には該当しない。", "データの入出力ツールであり Shield の構成要素ではない。", "セキュリティ設定の評価機能であり、要件を満たさない。"], "ref": "Salesforce ヘルプ: Salesforce Shield（Platform Encryption、Event Monitoring）"}, {"id": "CI3-026", "domain": "コンサルティングおよび実装戦略", "topic": "SAML SSO とジャストインタイムプロビジョニング", "q": "社内では Microsoft Entra ID で認証を一元管理しており、Salesforce でも同じ ID でシングルサインオンしたい。また、新入社員が初めてアクセスした時点で Salesforce ユーザーを自動作成したい。最も適切な設計はどれか。", "choices": ["Entra ID を ID プロバイダー、Salesforce をサービスプロバイダーとする SAML シングルサインオンを構成し、ジャストインタイムプロビジョニングで初回ログイン時にユーザーを作成する", "Salesforce のパスワードを Entra ID のパスワードと同じ値に手動で揃える", "全社員で1つの Salesforce ユーザーを共有する", "新入社員ごとにデータインポートウィザードで毎日ユーザーを作成する"], "answer": [0], "explanation": "SAML シングルサインオンでは、既存の ID プロバイダーで認証し、その結果を Salesforce が受け入れる。ジャストインタイムプロビジョニングを有効にすると、SAML アサーションの情報を使って初回ログイン時にユーザーを作成または更新できる。シングルサインオンにはマイドメインの設定が前提となる。", "choiceNotes": ["SAML SSO と JIT プロビジョニングで両方の要件を満たせる。", "パスワードを手動で揃えるのは SSO ではなく、運用・セキュリティ上も不適切である。", "ユーザーの共有はライセンス規約と監査の観点で不適切である。", "手作業でのユーザー作成は要件の自動化を満たさない。"], "ref": "Salesforce ヘルプ: SAML シングルサインオン、ジャストインタイムプロビジョニング"}, {"id": "CI3-027", "domain": "コンサルティングおよび実装戦略", "topic": "多要素認証と SSO", "q": "Salesforce の多要素認証（MFA）要件への対応を検討している。この企業では全ユーザーが社内の ID プロバイダー経由の SSO でログインし、ID プロバイダー側で MFA を必須にしている。コンサルタントの説明として最も適切なのはどれか。", "choices": ["SSO 経由のログインでも、Salesforce 側で必ず別途 MFA を設定しなければならない", "ID プロバイダー側で MFA を実施していれば、SSO でログインするユーザーの MFA 要件を満たせる。直接 Salesforce にログインできるユーザーがいれば、そのユーザーには Salesforce 側の MFA が必要になる", "SSO を使っていれば MFA は一切考慮しなくてよい", "MFA はシステム管理者だけが対象である"], "answer": [1], "explanation": "Salesforce の MFA 要件は、SSO を利用している場合は ID プロバイダー側の MFA で満たすことができる。一方、管理者など Salesforce のログイン画面から直接ログインできるユーザーには、Salesforce 側で MFA を有効にする必要がある。ログイン経路ごとに確認することが重要である。", "choiceNotes": ["ID プロバイダー側の MFA で要件を満たせるため、必ずしも二重には不要である。", "SSO 経由と直接ログインを分けて考える説明として正しい。", "直接ログインの経路や IdP 側の設定を確認せずに不要とするのは誤りである。", "MFA の要件は管理者に限らずすべての利用者が対象である。"], "ref": "Salesforce ヘルプ: 多要素認証（MFA）とシングルサインオン"}, {"id": "CI3-028", "domain": "コンサルティングおよび実装戦略", "topic": "Marketing Cloud Account Engagement 連携", "q": "マーケティング部門は Marketing Cloud Account Engagement（旧 Pardot）を利用している。営業部門から「マーケティングが渡すリードの質が低い」「顧客がどのメールやページに反応したか分からない」という不満が出ている。コンサルタントの提案として適切なものはどれか。2つ選択してください。", "choices": ["営業とマーケティングで MQL（営業に引き渡す基準）をスコアとグレードを用いて合意し、基準を満たしたプロスペクトだけを自動化ルールなどで営業のユーザーやキューに割り当てる", "リードおよび取引先責任者の Lightning ページに Engagement History のコンポーネントを配置し、メール開封やページ閲覧などのエンゲージメントを営業が確認できるようにする", "Account Engagement と Salesforce の連携を停止し、毎週 CSV で全プロスペクトを取り込む", "すべてのプロスペクトを即時に営業担当者へ割り当てる", "営業担当者全員に Account Engagement の管理者権限を付与する"], "answer": [0, 1], "explanation": "リードの質の問題は、営業とマーケティングが合意した引き渡し基準（スコアとグレードの組み合わせなど）で解決するのが基本である。また、Engagement History のコンポーネントを配置すると、営業は Salesforce 上でプロスペクトのマーケティング活動への反応を確認できる。連携停止や全件割り当ては課題を悪化させる。", "choiceNotes": ["合意した基準での引き渡しはリードの質の課題に対応する。", "Engagement History で営業がエンゲージメントを確認でき、もう一つの課題に対応する。", "連携停止と CSV 運用は鮮度と効率を損なう。", "未成熟なプロスペクトまで渡すとリードの質の不満が強まる。", "管理者権限の付与は不要であり、ガバナンス上も不適切である。"], "ref": "Trailhead: Marketing Cloud Account Engagement と Salesforce の連携、Engagement History"}, {"id": "CI3-029", "domain": "コンサルティングおよび実装戦略", "topic": "AppExchange 製品の評価基準", "q": "名刺管理の AppExchange 製品の導入を検討している。コンサルタントが評価時に確認すべき事項として適切なものはどれか。2つ選択してください。", "choices": ["製品がセキュリティレビューを通過して AppExchange に掲載されているか、またデータを外部サービスに送信するかどうかとその保存場所", "Sandbox にインストールして、既存の項目・自動化・共有設定との干渉や必要な権限を検証する", "掲載画面のロゴのデザインが会社のブランドに合っているか", "無償の製品であれば検証せずに本番へ直接インストールしてよいか", "インストール後に管理パッケージ内のコードを自由に書き換えられるか"], "answer": [0, 1], "explanation": "AppExchange 製品の評価では、セキュリティレビューの通過状況や外部へのデータ送信の有無を確認し、自社のセキュリティ・コンプライアンス要件に合うかを判断する。また、Sandbox で既存のカスタマイズとの干渉や必要な権限を検証してから本番へ導入する。管理パッケージのコードは利用者が変更できない。", "choiceNotes": ["セキュリティとデータの所在の確認は評価の基本である。", "Sandbox での事前検証は導入リスクを下げる。", "ロゴのデザインは製品評価の基準ではない。", "無償でも本番へ直接インストールするとリスクがあり、事前検証が必要である。", "管理パッケージのコードは利用者が編集できず、評価基準として誤っている。"], "ref": "Trailhead: AppExchange Basics、AppExchange セキュリティレビュー"}, {"id": "CI3-030", "domain": "コンサルティングおよび実装戦略", "topic": "Agentforce のユースケース選定とパイロット", "q": "営業部門で Agentforce を初めて導入する。経営層は「全営業業務を一度に AI 化したい」と求めているが、コンサルタントは段階的な導入を提案したい。進め方として適切なものはどれか。2つ選択してください。", "choices": ["件数が多く手順が明確で、必要なデータが Salesforce 内に揃っており、効果を測定しやすいユースケース（例：問い合わせリードへの初回フォローの下書き）を最初の対象に選ぶ", "少人数の営業チームでパイロットを行い、想定される発話でのテストやユーザーのフィードバックで回答の正確性と業務効果を評価してから対象を広げる", "最初から全営業担当者と全業務を対象に一斉展開する", "データが整備されていない業務を優先して AI に任せ、データ不足を AI に補完させる", "本番データでのテストは行わず、デモ環境での印象だけで展開可否を判断する"], "answer": [0, 1], "explanation": "Agentforce の導入は、明確で頻度が高く、データとアクションが揃い、効果測定しやすいユースケースから始めるのが有効である。パイロットではテスト用の発話によるバッチテストやユーザーフィードバックで精度とガードレールを確認し、評価結果に基づいて範囲を広げる。データ品質が低い業務は AI の回答品質も下がる。", "choiceNotes": ["明確で測定しやすいユースケースから始めるのは適切である。", "パイロットで評価してから拡大する段階的導入は適切である。", "一斉展開は品質問題が発生した際の影響が大きい。", "グラウンディングするデータが不十分だと AI の出力品質は下がる。", "実際の業務データや条件に近いテストなしの判断は不十分である。"], "ref": "Trailhead: Agentforce の導入計画、Agentforce Testing Center"}, {"id": "DM3-001", "domain": "データ管理", "topic": "標準オブジェクト活用 vs カスタム", "q": "ある製造業の営業部門は、旧システムの「案件」をそのまま再現するため、Salesforce にカスタムオブジェクト「案件__c」を作成して受注見込みを管理する計画を立てている。営業部長は今後、売上予測、パイプラインインスペクション、Einstein 商談スコアリングを使いたいと考えている。コンサルタントの推奨として最も適切なものはどれか。", "choices": ["カスタムオブジェクト「案件__c」を作成し、売上予測はカスタムレポートで代替する", "標準の商談オブジェクトを使い、旧システム固有の項目はカスタム項目として商談に追加する", "取引先オブジェクトに案件情報のカスタム項目を追加し、1取引先1案件で管理する", "カスタムオブジェクトを作成し、夜間バッチで商談オブジェクトに同期する"], "answer": [1], "explanation": "売上予測、パイプラインインスペクション、Einstein 商談スコアリングなどの標準機能は商談オブジェクトを前提としている。業務上の呼び名が異なっても標準オブジェクトを活用し、不足する属性をカスタム項目で補うのが基本的な設計方針である。二重管理や同期処理は複雑さとデータ不整合の原因になる。", "choiceNotes": ["カスタムオブジェクトでは標準の売上予測や商談スコアリングを利用できない。", "標準機能をそのまま活用でき、固有の要件もカスタム項目で満たせる。", "1取引先に複数の案件がある実態に合わず、商談の標準機能も使えない。", "同じデータを2か所に持つことになり、保守負荷と不整合のリスクが高い。"], "ref": "Trailhead: データモデリング / 標準オブジェクトとカスタムオブジェクト"}, {"id": "DM3-002", "domain": "データ管理", "topic": "多対多（連結オブジェクト）", "q": "ある会社では、1件の商談に複数の競合他社が関わり、1社の競合他社も多くの商談に登場する。競合他社はカスタムオブジェクト「競合__c」で管理しており、商談ごとに競合の提示価格を記録し、競合単位で関与商談数を積み上げ集計したい。この要件を満たす設計を2つ選択してください。", "choices": ["商談と競合__c の両方への主従関係を持つ連結オブジェクト「商談競合__c」を作成する", "商談に競合__c への参照項目を5つ作成する", "連結オブジェクトに提示価格の項目を作成する", "競合__c に商談への参照関係を作成する", "商談に競合名の複数選択リストを作成する"], "answer": [0, 2], "explanation": "多対多の関係は、2つの主従関係を持つ連結オブジェクトで表現する。主従関係にすることで、競合__c 側で連結レコードの件数を積み上げ集計できる。商談と競合の組み合わせごとに異なる提示価格は、連結オブジェクトの項目として持たせるのが適切である。", "choiceNotes": ["2つの主従関係を持つ連結オブジェクトは多対多の標準的な実装である。", "参照項目の数で上限が固定され、競合単位の集計にも向かない。", "組み合わせごとの属性は連結オブジェクトに持たせるのが正しい。", "1件の競合が参照できる商談が1件になり、多対多にならない。", "複数選択リストでは提示価格の記録や競合単位の積み上げ集計ができない。"], "ref": "Salesforce ヘルプ: 多対多のリレーションの作成 / 連結オブジェクト"}, {"id": "DM3-003", "domain": "データ管理", "topic": "外部オブジェクト", "q": "営業担当者は取引先ページで、ERP にある請求履歴を参照したいと考えている。請求データは数千万件あり、ERP が正となるデータのため Salesforce に複製したくない。ERP は OData エンドポイントを公開している。最も適切な方法はどれか。", "choices": ["Data Loader で請求データを毎晩カスタムオブジェクトにアップサートする", "Salesforce Connect で外部オブジェクトを定義し、取引先に関連付けて表示する", "請求データをビッグオブジェクトに一括取込みする", "ERP の画面へのリンクをテキスト項目に格納する"], "answer": [1], "explanation": "Salesforce Connect の外部オブジェクトは、データを Salesforce に保存せず外部システムのデータをリアルタイムに参照できる。OData に対応した外部システムであれば宣言的に接続でき、間接参照関係（外部データ側の項目と取引先の一意な外部 ID 項目を照合する関係）で取引先と関連付けて関連リストに表示できる。データストレージも消費しない。", "choiceNotes": ["データを複製することになり、ストレージ消費と鮮度の問題が生じる。", "複製せずにリアルタイム参照でき、要件に合致する。", "ビッグオブジェクトも Salesforce 内へのデータ複製であり要件に反する。", "画面遷移が必要で、関連レコードとして参照する要件を満たさない。"], "ref": "Salesforce ヘルプ: Salesforce Connect / 外部オブジェクト"}, {"id": "DM3-004", "domain": "データ管理", "topic": "ビッグオブジェクト", "q": "ある通信会社は、顧客ごとの利用ログを10年分（数十億件）Salesforce 内に保持し、特定顧客の履歴を必要時に参照したいと考えている。データは追加のみで更新はほとんどない。ビッグオブジェクトを採用する場合の考慮点として正しいものはどれか。", "choices": ["ビッグオブジェクトは通常のカスタムオブジェクトと同様に標準レポートで自由に集計できる", "ビッグオブジェクトはインデックスとして定義した項目に基づいて照会するため、検索パターンを事前に設計する必要がある", "ビッグオブジェクトのデータは外部システムに保存され、Salesforce には格納されない", "ビッグオブジェクトは数十万件までのデータを想定したオブジェクトである"], "answer": [1], "explanation": "ビッグオブジェクトは数十億件規模のデータを Salesforce 内に保持するための仕組みで、照会はインデックスとして定義した項目に基づいて行う。そのため、どの項目で絞り込むかを事前に設計しておく必要がある。通常のカスタムオブジェクトのような標準レポートでの自由な集計には向かない。", "choiceNotes": ["ビッグオブジェクトは標準レポートでの自由な集計には対応していない。", "インデックス項目に基づく照会となるため、検索パターンの事前設計が重要である。", "外部にデータを置くのは外部オブジェクトであり、ビッグオブジェクトは Salesforce 内に格納する。", "ビッグオブジェクトは数十億件規模を想定している。"], "ref": "Salesforce ヘルプ: ビッグオブジェクト"}, {"id": "DM3-005", "domain": "データ管理", "topic": "項目データ型（通貨）", "q": "マルチ通貨を有効にしている組織で、商談に「見込み粗利」というカスタム項目を追加する。各国の担当者は現地通貨で入力し、本社では企業通貨に換算した値でレポートを見たい。この項目に選ぶべきデータ型はどれか。", "choices": ["数値", "テキスト", "通貨", "パーセント"], "answer": [2], "explanation": "マルチ通貨環境では、通貨型の項目はレコードの通貨で保存され、レポートなどで企業通貨やユーザーの通貨に換算して表示できる。数値型は通貨として扱われないため換算されない。金額を表す項目には通貨型を選ぶのが基本である。", "choiceNotes": ["数値型は通貨として扱われず、換算表示されない。", "テキスト型では集計も換算もできない。", "レコードの通貨で保存され、レポートで換算表示できる。", "パーセント型は比率を表す型であり、金額には使わない。"], "ref": "Salesforce ヘルプ: カスタム項目のデータ型 / マルチ通貨"}, {"id": "DM3-006", "domain": "データ管理", "topic": "複数選択リストの制約", "q": "ある会社は取引先に「関心のある製品領域」を記録したい。管理者は複数選択リストを提案したが、営業企画部は製品領域ごとの取引先数をレポートでグループ化して比較し、数式でも条件判定に使いたいとしている。コンサルタントが伝えるべき考慮点として最も適切なものはどれか。", "choices": ["複数選択リストは値ごとのグループ化や数式での扱いに制約があるため、分析要件が強い場合は製品領域ごとのチェックボックスや連結オブジェクトを検討する", "複数選択リストはレポートで選択値ごとに自動的に行が分かれて集計されるため問題ない", "複数選択リストは数式で ISPICKVAL 関数を使えば通常の選択リストと同様に扱える", "複数選択リストは API で更新できないため避けるべきである"], "answer": [0], "explanation": "複数選択リストは1項目に複数値を保持するため、レポートで値ごとに分けた集計がしにくく、数式でも INCLUDES など限られた関数でしか扱えない。分析や自動化で値ごとに扱う要件が強い場合は、値ごとのチェックボックスや関連レコード（連結オブジェクト）で持つ設計が適している。", "choiceNotes": ["分析要件を踏まえた適切な代替案を示している。", "選択値ごとに自動で分かれて集計されるわけではない。", "複数選択リストは ISPICKVAL ではなく INCLUDES などで判定する。", "複数選択リストは API でも更新できる。"], "ref": "Salesforce ヘルプ: 複数選択リスト / 数式での選択リストの使用"}, {"id": "DM3-007", "domain": "データ管理", "topic": "グローバル選択リスト", "q": "ある会社では「業種区分」の値を、リード、取引先、カスタムオブジェクト「案件審査__c」の3か所で同じ値リストとして使っている。値の追加は年に数回あり、毎回3か所を個別に更新して表記ゆれが起きている。最も適切な対応はどれか。", "choices": ["各オブジェクトの選択リストに入力規則を追加して表記を揃える", "グローバル選択リスト値セットを作成し、3つの項目でその値セットを共有する", "テキスト項目に変更し、入力ガイドを配布する", "値の追加時に Data Loader で全レコードを更新する"], "answer": [1], "explanation": "グローバル選択リスト値セットを使うと、複数のオブジェクトの選択リスト項目で同じ値リストを共有でき、値の追加や変更を1か所で管理できる。グローバル選択リストは制限付き選択リストとして動作するため、API 経由でも定義外の値が入らず表記ゆれを防げる。", "choiceNotes": ["値リスト自体の重複管理という根本原因が解消されない。", "1か所の値セットを共有することで保守と標準化の両方を満たす。", "自由入力になり、表記ゆれがさらに増える。", "値リストの管理問題を解決せず、作業負荷も大きい。"], "ref": "Salesforce ヘルプ: グローバル選択リスト値セット"}, {"id": "DM3-008", "domain": "データ管理", "topic": "レコード所有者の一括変更", "q": "営業担当者Aが退職するため、Aが所有する約800件の取引先を後任のBに移したい。各取引先にはAが所有する未完了の商談と完了済みの商談がある。管理者がノーコードで効率よく対応する方法として最も適切なものはどれか。", "choices": ["取引先を1件ずつ開き、所有者の変更でBを指定する", "設定の「レコードの一括移行」で取引先を移行し、未完了・完了済みの商談も移行するオプションを選択する", "Aのユーザーレコードを無効化すると、所有レコードは自動的にマネージャーへ移る", "Aのユーザー名をBに変更してそのまま使い続ける"], "answer": [1], "explanation": "「レコードの一括移行」では、条件で絞り込んだ取引先の所有者をまとめて変更でき、関連する未完了の商談や完了済みの商談なども一緒に移行するオプションがある。800件を手作業で変更するのは非効率である。ユーザーを無効化しても所有レコードが自動で移ることはない。", "choiceNotes": ["件数が多く非効率で、関連商談の移行漏れも起きやすい。", "一括移行ツールで取引先と関連商談をまとめて移行できる。", "無効化しても所有者は自動では変わらない。", "ユーザーの使い回しは監査証跡やライセンス運用上不適切である。"], "ref": "Salesforce ヘルプ: レコードの一括移行 / 取引先の移行"}, {"id": "DM3-009", "domain": "データ管理", "topic": "非アクティブ所有者でのデータ移行", "q": "旧 CRM からの移行で、取引先と商談を「元の担当者」を所有者として登録したい。元の担当者の一部はすでに退職しており、Salesforce では無効化されたユーザーとして作成済みである。管理者が事前に行うべき対応として最も適切なものはどれか。", "choices": ["退職者のユーザーを一時的に有効化してライセンスを割り当てる", "ユーザーインターフェース設定で監査項目の設定と非アクティブな所有者のレコード更新のユーザー権限を有効にし、移行ユーザーに権限を付与する", "退職者のレコードはすべて管理者を所有者として登録し、元の担当者名はテキスト項目に残すしか方法はない", "共有ルールで退職者に所有権を付与する"], "answer": [1], "explanation": "ユーザーインターフェース設定で「レコード作成時に監査項目を設定」と「非アクティブな所有者のレコードを更新」のユーザー権限を有効化できる。移行ユーザーにこれらの権限を（プロファイルまたは権限セットで）付与すれば、無効なユーザーを所有者としてレコードを登録できる。ライセンスを一時的に割り当てる必要はない。", "choiceNotes": ["不要なライセンス消費やセキュリティ上の懸念が生じる。", "専用のユーザー権限で無効ユーザーを所有者に設定できる。", "権限を有効化すれば元の担当者を所有者として登録できる。", "共有ルールは所有権を付与するものではない。"], "ref": "Salesforce ヘルプ: 監査項目の設定と非アクティブな所有者のレコード更新の有効化"}, {"id": "DM3-010", "domain": "データ管理", "topic": "データアーカイブ方針", "q": "ある企業の組織では、10年分の完了済み商談と活動が蓄積され、データストレージが上限に近づき、リストビューやレポートの応答も遅くなっている。コンサルタントがアーカイブ方針を策定するときに行うべきことを2つ選択してください。", "choices": ["法務・コンプライアンス部門と保持期間の要件を確認し、アーカイブ対象の条件を定義する", "ストレージ削減のため、古いデータは保管先を用意せずすべて削除する", "アーカイブ後もデータを参照する必要性と参照方法（ビッグオブジェクト、外部システムなど）を決める", "すべてのレコードを毎日別組織にコピーする", "ユーザーにレポートの条件を絞るよう周知するだけで対応する"], "answer": [0, 2], "explanation": "アーカイブ方針では、まず法的・業務上の保持要件を確認し、どの条件のデータをいつアーカイブするかを定義する。そのうえで、アーカイブ後に誰がどの頻度で参照するかに応じて、ビッグオブジェクトや外部ストレージなどの保管先と参照手段を決める。保管なしの削除は保持要件に反するおそれがある。", "choiceNotes": ["保持要件の確認と対象条件の定義は方針策定の出発点である。", "保持義務に反する可能性があり、業務上必要な履歴も失われる。", "保管先と参照手段の決定はアーカイブ設計の中心的な要素である。", "ストレージやパフォーマンスの課題を解決せず、コストも増える。", "根本原因であるデータ量の増加に対処していない。"], "ref": "Trailhead: 大量データの管理 / データアーカイブ戦略"}, {"id": "DM3-011", "domain": "データ管理", "topic": "バックアップと復元", "q": "ある会社で、誤った一括更新により数千件の取引先と関連する取引先責任者の項目値が上書きされる事故が起きた。再発時に、指定時点のデータと比較して関連レコードの関係を保ったまま元に戻せる仕組みを用意したい。最も適切なものはどれか。", "choices": ["週次のデータエクスポートを有効にし、CSV を Data Loader で手作業で戻す", "Salesforce Backup（Backup & Recover）で定期バックアップを取得し、必要時に比較・復元する", "ごみ箱から復元する", "項目履歴管理を有効にし、履歴レポートを見て1件ずつ戻す"], "answer": [1], "explanation": "Salesforce Backup は定期的な自動バックアップを取得し、バックアップ時点との差分を確認したうえで、関連レコードの関係を考慮して復元できる。週次エクスポートは取得はできても、復元は手作業となり関係性の再構築も必要になる。ごみ箱は削除されたレコードにしか使えず、更新の誤りは戻せない。", "choiceNotes": ["復元が手作業となり、件数が多いと時間がかかりミスも起きやすい。", "定期バックアップと比較・復元の機能が要件に合う。", "ごみ箱は削除の取り消し用であり、上書き更新は戻せない。", "履歴の確認はできても一括復元の仕組みではない。"], "ref": "Salesforce ヘルプ: Salesforce Backup"}, {"id": "DM3-012", "domain": "データ管理", "topic": "データエンリッチメント", "q": "営業部門から、取引先の業種・従業員数・売上規模などの企業情報が古く空欄も多いため、外部の企業データベースで継続的に補完・更新したいという要望が出た。コンサルタントの提案として最も適切なものはどれか。", "choices": ["Data.com Clean を有効にする", "AppExchange で企業情報のエンリッチメントやクレンジングを提供するソリューションを評価し、更新ルールと上書き方針を決めて導入する", "営業担当者に年1回すべての取引先情報を手入力で見直させる", "入力規則で業種と従業員数を必須にする"], "answer": [1], "explanation": "Data.com Clean は提供が終了しており、現在は AppExchange のデータサービスなどで外部企業データによる補完・更新を行うのが一般的である。導入時はどの項目を自動更新するか、既存値を上書きするかなどの方針を決める必要がある。入力規則の必須化は新規入力時の欠落は防げるが、既存データの鮮度は改善しない。", "choiceNotes": ["Data.com Clean はすでに提供終了している。", "外部データによる継続的な補完を適切な方針とともに実現できる。", "手作業では負荷が大きく、正確性や継続性も担保できない。", "既存データの欠落や陳腐化を解消できない。"], "ref": "AppExchange: データクレンジング・エンリッチメント / Data.com の提供終了"}, {"id": "DM3-013", "domain": "データ管理", "topic": "Data Cloud の ID 解決", "q": "ある企業は、Sales Cloud の取引先責任者、EC サイトの会員データ、イベント参加者データを Data Cloud に取り込んだ。同一人物が各ソースで別々に登録されており、1人の顧客として統合プロファイルを作りたい。また、メールアドレスが食い違う場合は最新の更新値を採用したい。必要な設定を2つ選択してください。", "choices": ["メールアドレスや氏名・電話番号などで同一人物を判定する一致ルールを ID 解決ルールセットに定義する", "Sales Cloud の重複ルールでブロックを設定する", "競合時に採用する値を決める調整ルールで「最終更新」を指定する", "すべてのソースデータを Sales Cloud の取引先責任者にインポートしてから統合する", "セグメントを作成して同一人物を手作業で統合する"], "answer": [0, 2], "explanation": "Data Cloud の ID 解決では、一致ルールで同一人物とみなす条件を定義し、統合個人（統合プロファイル）を作成する。調整ルールでは、ソース間で値が異なる場合に最終更新、最頻値、ソースの優先順位などのどれで採用値を決めるかを指定する。元のソースデータを変更せずに統合できる点が特徴である。（Data Cloud は2025年10月に Data 360 に名称変更されているが、ID 解決の仕組みは同じである。）", "choiceNotes": ["一致ルールは同一人物を判定する ID 解決の中核である。", "Sales Cloud 内の重複防止であり、Data Cloud の統合プロファイル作成とは別の機能である。", "調整ルールで最新値を採用する方針を設定できる。", "ソースを CRM に集約する必要はなく、Data Cloud 上で統合できる。", "セグメントは対象者の抽出であり、ID の統合手段ではない。"], "ref": "Salesforce ヘルプ: Data Cloud の ID 解決 / 一致ルールと調整ルール"}, {"id": "DM3-014", "domain": "データ管理", "topic": "Data Cloud のセグメントとアクティベーション", "q": "マーケティング部門は Data Cloud の統合プロファイルをもとに、「過去90日に EC で購入し、かつ Sales Cloud で未完了の商談がある顧客」を抽出し、Marketing Cloud のキャンペーン配信に使いたい。最も適切な方法はどれか。", "choices": ["Sales Cloud のレポートでリストを作成し、CSV で Marketing Cloud に手作業で取り込む", "Data Cloud でセグメントを作成し、Marketing Cloud をアクティベーション対象として公開する", "Data Cloud の ID 解決ルールに抽出条件を追加する", "Sales Cloud のキャンペーンメンバーにすべての顧客を登録する"], "answer": [1], "explanation": "Data Cloud では、統合プロファイルと関連データを条件にセグメントを作成し、アクティベーションによって Marketing Cloud などの対象へ公開できる。複数ソースをまたいだ条件で抽出できるのが利点である。ID 解決ルールは同一人物の統合条件であり、抽出条件を定義する場所ではない。", "choiceNotes": ["EC データを含められず、手作業で鮮度も保てない。", "セグメントとアクティベーションで要件を満たせる。", "ID 解決ルールはプロファイル統合のための設定である。", "条件による抽出ができず、要件を満たさない。"], "ref": "Salesforce ヘルプ: Data Cloud のセグメント / アクティベーション"}, {"id": "DM3-015", "domain": "データ管理", "topic": "Data Cloud のデータストリームとマッピング", "q": "Data Cloud に EC サイトの注文データを取り込むため、データストリームを作成した。取り込んだデータを ID 解決やセグメントで使えるようにするために、次に必要な作業はどれか。", "choices": ["データレイクオブジェクトのデータを Sales Cloud の注文オブジェクトにコピーする", "データレイクオブジェクトの項目をデータモデルオブジェクト（DMO）にマッピングする", "Data Loader で Data Cloud に再インポートする", "Sales Cloud にカスタムオブジェクトを作成する"], "answer": [1], "explanation": "Data Cloud ではデータストリームで取り込んだデータがデータレイクオブジェクトに格納され、それを標準化されたデータモデルオブジェクト（DMO）にマッピングする。マッピングによって、異なるソースのデータを共通のモデルで扱えるようになり、ID 解決やセグメントで利用できる。", "choiceNotes": ["Sales Cloud へのコピーは不要で、Data Cloud 内で利用可能にする作業が必要である。", "DMO へのマッピングにより ID 解決やセグメントで利用できる。", "データはデータストリームで取り込み済みであり、再インポートは不要である。", "Data Cloud の利用に Sales Cloud のカスタムオブジェクトは不要である。"], "ref": "Salesforce ヘルプ: Data Cloud のデータストリーム / データモデルオブジェクトへのマッピング"}, {"id": "DM3-016", "domain": "データ管理", "topic": "入力規則での書式統一", "q": "取引先の請求先郵便番号を「123-4567」の形式に統一したい。空欄は許可するが、値が入力された場合はこの形式以外を保存させないようにしたい。入力規則のエラー条件数式として最も適切なものはどれか。", "choices": ["NOT(REGEX(BillingPostalCode, \"[0-9]{3}-[0-9]{4}\"))", "AND(NOT(ISBLANK(BillingPostalCode)), NOT(REGEX(BillingPostalCode, \"[0-9]{3}-[0-9]{4}\")))", "REGEX(BillingPostalCode, \"[0-9]{3}-[0-9]{4}\")", "ISBLANK(BillingPostalCode)"], "answer": [1], "explanation": "入力規則は、エラー条件数式が TRUE のときに保存を止める。空欄を許可しつつ形式違反だけを止めるには、値が空でないことと REGEX の形式に一致しないことを AND で組み合わせる。REGEX 関数は値全体がパターンに一致するかを判定する。", "choiceNotes": ["空欄も形式不一致とみなされ、空欄の保存まで止めてしまう。", "空欄を許可し、形式違反の値だけを止められる。", "正しい形式のときにエラーになり、意図と逆になる。", "空欄を禁止するだけで書式はチェックしない。"], "ref": "Salesforce ヘルプ: 入力規則の例 / REGEX 関数"}, {"id": "DM3-017", "domain": "データ管理", "topic": "保存時のデータ標準化", "q": "取引先の電話番号が「03 1234 5678」「03-1234-5678」などさまざまな形式で入力されている。入力をエラーで止めるのではなく、保存時に自動でハイフン区切りの形式に変換して格納したい。また API で作成されたレコードにも適用したい。最も適切な方法はどれか。", "choices": ["数式項目で整形した電話番号を表示する", "保存前に実行されるレコードトリガーフロー（高速項目更新）で値を整形して更新する", "入力規則でハイフン区切り以外をエラーにする", "ページレイアウトに入力ヘルプテキストを追加する"], "answer": [1], "explanation": "保存前のレコードトリガーフローは、レコードが保存される前に同じレコードの項目値を変更でき、UI・API どちらの保存にも動作する。数式項目は表示用の計算結果で、元の項目値自体は標準化されない。入力規則は保存を止めるだけで、自動変換はできない。", "choiceNotes": ["元の電話番号の値は変わらず、格納データは標準化されない。", "保存前に値を整形して格納でき、API 経由の作成にも適用される。", "エラーで止める方式であり、自動変換の要件に合わない。", "入力時の案内にすぎず、強制力も自動変換もない。"], "ref": "Salesforce ヘルプ: レコードトリガーフロー（保存前の高速項目更新）"}, {"id": "DM3-018", "domain": "データ管理", "topic": "州と国/地域の選択リスト", "q": "グローバル展開に伴い、取引先の住所の国と州をテキスト入力から州と国/地域の選択リストに切り替えることになった。既存データには「日本」「Japan」「JP」など表記ゆれがある。ユーザーに選択リストを有効化する前に行うべきこととして最も適切なものはどれか。", "choices": ["既存の住所データを Data Loader ですべて削除する", "データのスキャンを実行し、既存のテキスト値を標準の国/州の値へ変換する", "入力規則で国を必須にする", "国と州のカスタム選択リスト項目を新たに作成する"], "answer": [1], "explanation": "州と国/地域の選択リストを導入する際は、使用する国と州を設定したうえで、既存データとカスタマイズをスキャンし、既存のテキスト値を標準の値に変換してからユーザー向けに有効化する。変換によって表記ゆれのある値を統一できる。標準の住所項目のまま選択リスト化できるため、カスタム項目は不要である。", "choiceNotes": ["既存の住所情報が失われ、不適切である。", "スキャンと変換で既存データを標準値に揃えてから有効化するのが正しい手順である。", "表記ゆれのある既存データの問題を解決しない。", "標準の住所項目で選択リストを使えるため、別項目は不要である。"], "ref": "Salesforce ヘルプ: 州と国/地域の選択リストの実装 / データの変換"}, {"id": "DM3-019", "domain": "データ管理", "topic": "リードと取引先責任者の重複検出", "q": "ある会社では、すでに取引先責任者として登録済みの人物が Web フォームから再度リードとして登録されることが多い。リード作成時に、既存の取引先責任者と重複している可能性を営業担当者に知らせたい。最も適切な設定はどれか。", "choices": ["リードオブジェクトに重複ルールを作成し、取引先責任者の一致ルールで比較する条件を追加して、アラートを表示する", "取引先責任者オブジェクトにリードの入力規則を作成する", "リード割り当てルールで取引先責任者と同じメールアドレスのリードを管理者に割り当てる", "リードのメール項目を外部 ID かつユニークに設定する"], "answer": [0], "explanation": "リードの重複ルールでは、リード同士だけでなく取引先責任者の一致ルールを使って既存の取引先責任者と比較できる。アクションをアラートにすれば、作成を止めずにユーザーへ重複の可能性を知らせられる。ユニーク設定はリード内の重複しか防げない。", "choiceNotes": ["オブジェクトをまたいだ比較とアラートで要件を満たせる。", "入力規則は他オブジェクトのレコードとの重複を判定できない。", "割り当てルールは重複を判定する機能ではない。", "リード内でしか一意性を判定せず、取引先責任者との重複は検出できない。"], "ref": "Salesforce ヘルプ: 重複ルール / オブジェクト間の一致ルール"}, {"id": "DM3-020", "domain": "データ管理", "topic": "インポートウィザードの照合方法", "q": "展示会で取得した約3,000件の名刺データを取り込む。既存の取引先責任者と同じ人物であればメールアドレスで照合して部署と役職を更新し、存在しなければ新規作成したい。データインポートウィザードでの設定として最も適切なものはどれか。", "choices": ["「新規レコードの追加」を選び、照合条件は指定しない", "「新規レコードの追加および既存レコードの更新」を選び、取引先責任者の照合条件にメールを指定する", "「既存レコードの更新」を選び、照合条件に Salesforce ID を指定する", "インポート前に既存の取引先責任者をすべて一括削除する"], "answer": [1], "explanation": "データインポートウィザードでは、追加・更新・追加および更新の動作を選び、取引先責任者の照合条件として名前、メール、Salesforce ID などを指定できる。名刺データには Salesforce ID がないため、メールでの照合と「追加および更新」の組み合わせが要件に合う。", "choiceNotes": ["既存の人物も新規作成され、重複が発生する。", "メールで既存レコードを更新し、該当なしは新規作成できる。", "名刺データに Salesforce ID はなく、新規作成もできない。", "既存の履歴や関連データを失うため不適切である。"], "ref": "Salesforce ヘルプ: データインポートウィザード / 重複レコードの照合"}, {"id": "DM3-021", "domain": "データ管理", "topic": "主従関係と参照関係の違い", "q": "カスタムオブジェクト「訪問報告__c」を取引先に関連付ける。要件は「訪問報告の参照権限は親の取引先と同じにしたい」「取引先を削除したら訪問報告も削除したい」である。この要件に関して正しい説明を2つ選択してください。", "choices": ["主従関係にすると、子レコードの共有とセキュリティは親レコードから継承される", "参照関係では、親を削除すると子は常に自動削除される", "主従関係にすると、親レコードを削除したときに子レコードも削除される", "主従関係の子レコードにも独自の所有者項目があり、個別に共有ルールを設定できる", "参照関係でなければ積み上げ集計項目は作成できない"], "answer": [0, 2], "explanation": "主従関係では、子レコードは所有者を持たず、共有とセキュリティは親レコードから継承される。また親を削除すると子も連鎖して削除される。参照関係ではデフォルトで親を削除しても子は残り、参照項目の値がクリアされる。", "choiceNotes": ["主従関係の子は親の共有設定を継承する。", "参照関係では通常、親を削除しても子は残る。", "主従関係では親の削除に伴って子も削除される。", "主従関係の子には所有者項目がなく、独自の共有ルールは設定できない。", "積み上げ集計項目は主従関係の親で作成する。"], "ref": "Salesforce ヘルプ: オブジェクトリレーションの概要"}, {"id": "DM3-022", "domain": "データ管理", "topic": "参照検索条件", "q": "商談にカスタム参照項目「販売代理店」（取引先への参照）がある。営業担当者が誤って顧客の取引先を選んでしまう問題があり、取引先種別が「代理店」かつ有効な取引先だけを選択できるようにしたい。最も適切な設定はどれか。", "choices": ["参照項目に必須の参照検索条件を設定し、種別が代理店かつ有効の取引先に限定する", "代理店用のレコードタイプを作成してページレイアウトを分ける", "取引先の共有設定を非公開にする", "代理店の一覧をヘルプテキストに記載する"], "answer": [0], "explanation": "参照検索条件を使うと、参照項目で選択できるレコードを項目値に基づいて絞り込める。必須の検索条件にすると、条件を満たさない値は保存できないため、誤選択を確実に防げる。共有設定の変更は他業務にも影響し、目的に合わない。", "choiceNotes": ["選択可能な取引先を条件で限定でき、要件に合う。", "レイアウトを分けても参照先の候補は絞り込まれない。", "代理店以外の取引先が見えなくなり業務に支障が出るうえ、目的に合わない。", "強制力がなく、誤選択を防げない。"], "ref": "Salesforce ヘルプ: 参照検索条件"}, {"id": "DM3-023", "domain": "データ管理", "topic": "データ分類メタデータ", "q": "個人情報保護の監査対応として、どの項目が個人情報や機密情報を含むかを組織全体で一覧化し、項目ごとに機密度とデータオーナーを記録したい。追加開発なしで実現する方法として最も適切なものはどれか。", "choices": ["項目の説明欄に自由記述で機密度を記載する", "項目のデータ分類設定（データ機密度レベル、コンプライアンス分類、データオーナーなど）を設定し、一覧化する", "機密項目をすべてプラットフォーム暗号化する", "機密項目の項目レベルセキュリティをすべて非表示にする"], "answer": [1], "explanation": "Salesforce の項目には、データ機密度レベル、コンプライアンス分類、データオーナー、項目の使用状況といったデータ分類のメタデータを設定できる。これにより項目の機密性やコンプライアンス区分を標準的な形式で記録し、管理できる。暗号化やアクセス制御は保護の手段であり、分類の記録とは別の目的である。", "choiceNotes": ["形式が統一されず、一覧化や監査での活用が難しい。", "標準のデータ分類メタデータで要件を満たせる。", "保護手段であり、機密度やオーナーの記録にはならない。", "業務での利用を妨げ、分類の記録にもならない。"], "ref": "Salesforce ヘルプ: データ分類メタデータ項目"}, {"id": "DM3-024", "domain": "データ管理", "topic": "データストレージの見積り", "q": "移行計画で、カスタムオブジェクトに約500万件のレコードを取り込む予定である。データストレージの消費量を概算するとき、コンサルタントが前提とすべき考え方として最も適切なものはどれか。", "choices": ["カスタムオブジェクトのレコードは項目数に比例して1件あたり数十KBを消費する", "多くのレコードは項目数に関係なく1件あたり約2KBとして計算される", "添付ファイルを含め、すべてのデータはデータストレージとして計算される", "カスタムオブジェクトのレコードはストレージを消費しない"], "answer": [1], "explanation": "Salesforce のデータストレージは、多くのオブジェクトでレコード1件あたり約2KBとして計算され、項目数や入力内容の量には左右されない（一部の例外オブジェクトを除く）。ファイルや添付ファイルはデータストレージではなくファイルストレージとして計算される。500万件なら概算で約10GBとなり、上限との比較や追加購入の検討が必要になる。", "choiceNotes": ["項目数に比例して消費量が変わるわけではない。", "多くのレコードは1件あたり約2KBとして計算される。", "添付ファイルなどはファイルストレージとして別に計算される。", "カスタムオブジェクトのレコードもデータストレージを消費する。"], "ref": "Salesforce ヘルプ: データストレージとファイルストレージの割り当て"}, {"id": "DM3-025", "domain": "データ管理", "topic": "移行リハーサル用 Sandbox", "q": "大規模なデータ移行の前に、本番と同等のデータ量と構成でリハーサルを行い、処理時間やデータスキューの影響、自動化との干渉を検証したい。この目的に関する正しい説明を2つ選択してください。", "choices": ["Full Sandbox は本番のメタデータとすべてのデータをコピーするため、本番相当のデータ量での検証に適している", "Developer Sandbox には本番のデータがすべてコピーされる", "移行リハーサルでは、トリガーやフローなどの自動化を有効にした状態で処理時間や影響を確認しておく", "Partial Copy Sandbox はデータ量の上限がないため大規模リハーサルに最適である", "リハーサルは不要で、本番で直接少量ずつ試行すればよい"], "answer": [0, 2], "explanation": "Full Sandbox は本番組織のメタデータとデータを丸ごとコピーするため、本番相当のデータ量での性能やスキューの検証に向いている。リハーサルでは、本番移行時と同じ自動化の有効・無効の状態で実行し、処理時間やエラー、干渉の有無を確認しておく必要がある。Partial Copy Sandbox はテンプレートで選択したデータの一部のみをコピーし、容量にも上限がある。", "choiceNotes": ["本番相当のデータでの検証に適した Sandbox である。", "Developer Sandbox はメタデータのみで、本番データはコピーされない。", "本番と同じ条件で自動化の影響を確認することがリハーサルの目的に合う。", "Partial Copy Sandbox にはデータ容量やレコード数の上限がある。", "本番での試行はデータ破損や業務影響のリスクが高い。"], "ref": "Salesforce ヘルプ: Sandbox の種類とテンプレート / データ移行のベストプラクティス"}, {"id": "DA-001", "domain": "データ管理", "topic": "インポートツールの選択（件数）", "q": "ある製造業の企業では、旧CRMから約12万件の取引先責任者を Salesforce へ移行する予定である。管理者はコードを書かずに作業したいと考えている。コンサルタントは何を推奨すべきか？", "choices": ["データインポートウィザードを使用して、一度にすべての取引先責任者をインポートする", "データローダを使用して取引先責任者をインポートする", "取引先責任者を手動で入力するよう営業担当者に依頼する", "レポートのインポート機能を使用して取引先責任者を作成する"], "answer": [1], "explanation": "データインポートウィザードが一度に処理できるのは最大5万件である。それを超える件数を扱う場合は、クライアントアプリケーションであるデータローダが適している。データローダはGUIで操作でき、コードを書く必要はない。", "choiceNotes": ["誤り。12万件はインポートウィザードの上限（5万件）を超える。", "正しい。データローダは大量レコードをGUIで処理でき、コードは不要。", "誤り。件数が多く非効率で、入力ミスも起きやすい。", "誤り。レポートにはレコードを作成するインポート機能はない。"], "ref": "データのインポート方法の選択（データインポートウィザードとデータローダ）"}, {"id": "DA-002", "domain": "データ管理", "topic": "インポートウィザードの適用場面", "q": "ある不動産会社では、展示会で集めた約800件のリードを営業企画担当者が毎月自分で登録している。担当者はIT部門に頼らず、ブラウザだけで作業し、取込み時に重複も避けたいと考えている。コンサルタントは何を推奨すべきか？", "choices": ["Bulk API を使用するカスタム連携を開発する", "データローダをコマンドラインで実行するようにスケジュールする", "データインポートウィザードを使用し、メールアドレスなどで既存リードと照合する", "Apex トリガでリードを一括作成する"], "answer": [2], "explanation": "データインポートウィザードはブラウザから使えるため、件数が少なく現場担当者が自分で取り込むケースに向いている。リードや取引先責任者は、名前やメールアドレスで既存レコードと照合して重複を避けられる。", "choiceNotes": ["誤り。800件程度の取込みに開発は過剰。", "誤り。コマンドライン実行には設定の知識が必要で、担当者だけでは運用できない。", "正しい。ブラウザで完結し、照合条件で重複も防げる。", "誤り。開発が必要で、要件に合わない。"], "ref": "データインポートウィザード、データのインポートに関するよくある質問"}, {"id": "DA-003", "domain": "データ管理", "topic": "エクスポートと一括削除", "q": "ある企業では、テスト用に作った古い商談データを定期的にCSVでバックアップしてから一括削除したいと考えている。対象は約3万件である。コンサルタントは何を推奨すべきか？", "choices": ["データローダでエクスポートを実行し、その後IDを指定して削除を実行する", "データインポートウィザードでエクスポートと削除を行う", "商談リストビューで全件を選択し、手動で削除する", "商談の入力規則でレコードを無効化する"], "answer": [0], "explanation": "データローダは、挿入・更新・アップサートに加え、エクスポートと削除にも対応している。データインポートウィザードはインポート専用で、エクスポートや削除はできない。", "choiceNotes": ["正しい。データローダならエクスポートと削除の両方ができる。", "誤り。インポートウィザードはエクスポートや削除に対応していない。", "誤り。3万件を手作業で消すのは現実的でなく、バックアップも取れない。", "誤り。入力規則は保存時のチェックで、削除やバックアップには使えない。"], "ref": "データローダ（エクスポートと削除操作）"}, {"id": "DA-004", "domain": "データ管理", "topic": "一致ルールと重複ルール", "q": "ある保険代理店では、営業担当者が同じ取引先責任者を何度も作成してしまう。保存時に重複の可能性を警告しつつ、作成は許可し、発生した重複を後でレポートで確認したい。コンサルタントが推奨すべき設定はどれか？（2つ選択してください）", "choices": ["取引先責任者の一致ルールを有効化する", "取引先責任者の重複ルールを作成し、作成時のアクションを「許可」として警告とレポートを有効にする", "取引先責任者の Email 項目を外部IDとして設定する", "取引先責任者のページレイアウトで Email 項目を必須にする", "取引先責任者の項目履歴管理を有効化する"], "answer": [0, 1], "explanation": "重複管理では、一致ルールで何を重複とみなすかを定義し、重複ルールで保存時のアクション（許可または禁止）、警告、レポートを指定する。重複ルールが参照する一致ルールは有効化しておく必要がある。レポートを有効にすると重複レコードセットが作成され、後から確認できる。", "choiceNotes": ["正しい。重複ルールが参照する一致ルールは有効化しておく必要がある。", "正しい。「許可」と警告で作成を止めずに知らせ、レポートで重複レコードセットを残せる。", "誤り。外部IDはアップサートなどの照合用で、ユーザーへの重複警告は出さない。", "誤り。必須にしても重複は検知できない。", "誤り。項目の変更を記録するだけで、重複は検知しない。"], "ref": "重複管理（一致ルール、重複ルール、重複レコードセット）"}, {"id": "DA-005", "domain": "データ管理", "topic": "重複ルールのブロック", "q": "ある金融機関では、コンプライアンス上、同じ法人番号を持つ取引先を作成できないようにしたい。ユーザーが重複する取引先を保存しようとしたら、確実に保存を止めたい。コンサルタントは何を推奨すべきか？", "choices": ["法人番号を比較する一致ルールを使い、重複ルールの作成アクションを「許可」にして警告を表示する", "取引先の割り当てルールを設定する", "法人番号の項目を項目履歴管理の対象にする", "法人番号を比較する一致ルールを使い、重複ルールの作成アクションを「ブロック」にする"], "answer": [3], "explanation": "重複ルールのアクションを「ブロック」にすると、一致ルールに該当するレコードは保存できなくなる。「許可」では警告が出るだけで、保存はできてしまう。", "choiceNotes": ["誤り。「許可」は警告を出すだけで、保存は止められない。", "誤り。割り当てルールは所有者を決める機能で、重複は防げない。", "誤り。履歴は変更を記録するだけで、作成は止めない。", "正しい。「ブロック」なら重複レコードの保存を止められる。"], "ref": "重複ルールのアクション（許可／ブロック）"}, {"id": "DA-006", "domain": "データ管理", "topic": "入力規則", "q": "ある企業の営業部長は、商談を「Closed Lost」にするときは必ず「失注理由」を入力してほしいと考えている。他のフェーズでは失注理由は不要である。コンサルタントは何を推奨すべきか？", "choices": ["失注理由の項目をページレイアウトで必須にする", "フェーズが「Closed Lost」で失注理由が空白のときにエラーを表示する入力規則を作成する", "失注理由の項目を項目レベルセキュリティで参照のみにする", "失注理由を数式項目に変更する"], "answer": [1], "explanation": "条件によって入力を必須にしたい場合は入力規則を使う。ページレイアウトの必須設定は常に適用されるため、フェーズに関係なく入力を求めてしまう。", "choiceNotes": ["誤り。常に必須になり、他のフェーズでも入力が必要になる。", "正しい。条件付きの必須チェックは入力規則で実現できる。", "誤り。参照のみにすると入力そのものができなくなる。", "誤り。数式項目はユーザーが入力できない。"], "ref": "入力規則、入力規則の例"}, {"id": "DA-007", "domain": "データ管理", "topic": "選択リストの標準化", "q": "ある企業では、取引先、リード、カスタムオブジェクト「案件」の3つに「地域」という選択リストがある。値がオブジェクトごとに少しずつ違い、レポートで集計しにくい。今後は値を一か所で管理し、ユーザーが一覧にない値を入れられないようにしたい。コンサルタントは何を推奨すべきか？", "choices": ["グローバル選択リスト値セットを作成し、各オブジェクトの「地域」項目がそれを使うようにする", "「地域」をテキスト項目に変え、入力規則で文字数を制限する", "各オブジェクトの選択リストに「その他」を追加する", "地域ごとにレコードタイプを作成する"], "answer": [0], "explanation": "グローバル選択リスト値セットを使うと、複数の選択リスト項目で同じ値を共有し、一か所で管理できる。グローバル値セットを使う選択リストは制限付きなので、定義されていない値は保存できない。", "choiceNotes": ["正しい。値を一元管理でき、一覧にない値も入らない。", "誤り。テキスト項目では値がばらつき、問題がかえって悪化する。", "誤り。値のばらつきは解消しない。", "誤り。レコードタイプはプロセスやレイアウトを分ける機能で、値を統一する機能ではない。"], "ref": "グローバル選択リスト値セット、制限付き選択リスト"}, {"id": "DA-008", "domain": "データ管理", "topic": "API経由でも有効な必須化", "q": "ある企業では、取引先を画面から作成するだけでなく、基幹システムからの API 連携でも作成している。連携で作られた取引先に「顧客区分」が入っていないことがある。どの経路で作成しても顧客区分が必ず入るようにするには、どの方法が有効か？（2つ選択してください）", "choices": ["ページレイアウトで顧客区分を必須にする", "顧客区分の項目定義で「常に値を必須にする」を有効にする", "顧客区分が空白のときにエラーを返す入力規則を作成する", "Lightning レコードページで顧客区分の項目を目立つ位置に置く", "顧客区分の既定値をユーザーごとに設定する"], "answer": [1, 2], "explanation": "ページレイアウトの必須設定は画面での入力にしか効かず、API での作成には適用されない。項目定義で常に必須にする設定や入力規則は、API を含むすべての保存処理に適用される。", "choiceNotes": ["誤り。画面での入力にしか効かず、API 連携には適用されない。", "正しい。項目定義での必須はすべての作成経路に適用される。", "正しい。入力規則は API による保存でも評価される。", "誤り。表示位置を変えても入力は強制されない。", "誤り。既定値は作成時の初期値にすぎず、ユーザーや連携処理が空白で保存することは防げない。"], "ref": "項目の必須化（ユニバーサル必須項目）、入力規則"}, {"id": "DA-009", "domain": "データ管理", "topic": "外部IDとアップサート", "q": "ある卸売業者では、毎晩ERPから取引先データを Salesforce に連携している。ERPには Salesforce のレコードIDがなく、ERP独自の顧客コードで管理している。新しい顧客は作成し、既存の顧客は更新したい。コンサルタントは何を推奨すべきか？", "choices": ["毎晩すべての取引先を削除してから再度インポートする", "顧客コードを取引先名の末尾に連結し、名前で照合する", "取引先に顧客コードの項目を作り外部IDとして設定し、それをキーにアップサートする", "新しい顧客と既存の顧客を手作業で分けて、それぞれ挿入と更新を行う"], "answer": [2], "explanation": "外部IDに設定した項目をキーにアップサートすると、一致するレコードがあれば更新し、なければ新しく作成する。Salesforce のIDを持たない外部システムとの連携でよく使われる方法である。", "choiceNotes": ["誤り。毎回IDが変わり、関連する活動や商談との紐付けが失われる。", "誤り。名前での照合は不確実で、データ品質も下がる。", "正しい。外部IDを使ったアップサートで作成と更新を一度に処理できる。", "誤り。毎晩の手作業は非効率で、ミスも起きやすい。"], "ref": "外部ID、データローダのアップサート"}, {"id": "DA-010", "domain": "データ管理", "topic": "データスキュー（取引先）", "q": "ある企業では、個人顧客の取引先責任者をすべて「未割当顧客」という1つの取引先にまとめている。その取引先には約30万件の取引先責任者がひもづいており、一括更新のときにロックエラーや処理の遅れが起きている。コンサルタントは何を推奨すべきか？", "choices": ["未割当顧客の取引先に入力規則を追加する", "取引先責任者の項目履歴管理を有効化する", "未割当顧客の取引先の所有者をシステム管理者に変更する", "子レコードを複数の取引先に分散させ、1つの取引先に1万件を超える子レコードが集中しないようにする"], "answer": [3], "explanation": "1つの親レコードに大量の子レコードが集中する状態を取引先データスキューと呼ぶ。子レコードを更新するときに親レコードがロックされるため、競合や処理の遅れが起きやすい。1つの親あたりの子レコードを1万件以下に抑えるよう分散させるのが推奨されている。", "choiceNotes": ["誤り。入力規則を追加するとかえって処理が増え、スキューは解消しない。", "誤り。記録処理が増えるだけで、ロックの原因は解消しない。", "誤り。所有者を変えても、子レコードの集中は残る。", "正しい。子レコードを分散するのがスキュー対策の基本である。"], "ref": "大規模データ量の考慮事項、データスキュー（取引先スキュー）"}, {"id": "DA-011", "domain": "データ管理", "topic": "所有権スキュー", "q": "ある企業では、連携用の統合ユーザーがリード約50万件を所有している。このユーザーはロール階層の中間に置かれており、共有の再計算に時間がかかっている。所有者を変えずに影響を小さくするには、コンサルタントは何を推奨すべきか？", "choices": ["統合ユーザーにリードの「すべて変更」権限を付与する", "統合ユーザーをロールに割り当てないか、ロール階層の最上位に置く", "リードの組織の共有設定を「公開/参照・更新可能」に変更する", "統合ユーザーのプロファイルを毎日変更する"], "answer": [1], "explanation": "1人のユーザーが大量のレコードを所有している状態を所有権スキューと呼ぶ。そのユーザーがロール階層の途中にいると、ロール変更などのたびに大規模な共有の再計算が起きる。推奨されているのは、ロールに割り当てないか、階層の最上位に置くことである。", "choiceNotes": ["誤り。権限を付与しても共有の再計算は減らない。", "正しい。所有権スキューへの推奨される対策である。", "誤り。セキュリティ要件を無視した変更であり、根本的な対策にもならない。", "誤り。変更のたびに再計算が起き、逆効果になる。"], "ref": "所有権データスキュー、大規模データ量のベストプラクティス"}, {"id": "DA-012", "domain": "データ管理", "topic": "項目履歴管理の設定", "q": "ある企業では、取引先の「顧客ランク」が、いつ、誰によって、どの値からどの値に変わったかを営業マネージャーが画面で確認したい。コンサルタントは何を推奨すべきか？", "choices": ["顧客ランクが変わるたびにタスクを作成するよう営業担当者に依頼する", "顧客ランクを数式項目に変更する", "取引先の項目履歴管理を有効化して顧客ランクを対象にし、取引先履歴の関連リストをレイアウトに追加する", "取引先のリストビューに顧客ランクを追加する"], "answer": [2], "explanation": "項目履歴管理を使うと、対象の項目について変更日時、変更者、変更前の値、変更後の値が記録される。履歴の関連リストをページレイアウトに追加すれば、画面から確認できる。", "choiceNotes": ["誤り。手作業に頼るため、漏れが出る。", "誤り。数式項目にすると手入力できず、変更の履歴も残らない。", "正しい。変更内容が自動で記録され、関連リストで確認できる。", "誤り。現在の値しか見えず、変更の履歴はわからない。"], "ref": "項目履歴管理"}, {"id": "DA-013", "domain": "データ管理", "topic": "長期の監査証跡", "q": "ある金融機関では、規制対応のため、取引先の特定項目の変更履歴を10年間保持する必要がある。標準の項目履歴管理だけでは保持期間が足りない。コンサルタントは何を推奨すべきか？", "choices": ["項目履歴管理で追跡する項目数を増やす", "設定変更履歴を有効化する", "毎日レポートを手作業で印刷して保管する", "Salesforce Shield の項目監査履歴（Field Audit Trail）を導入し、保持ポリシーを定義する"], "answer": [3], "explanation": "標準の項目履歴管理は、データの保持期間に上限がある（組織内では18か月が目安）。項目監査履歴を使うと保持ポリシーを定義でき、最長10年間、履歴を保持できる。", "choiceNotes": ["誤り。追跡する項目を増やしても、保持期間は延びない。", "誤り。設定変更履歴は設定の変更を記録するもので、データの変更は対象外。", "誤り。非効率で漏れが出やすく、監査要件を満たしにくい。", "正しい。項目監査履歴なら長期間の保持要件に対応できる。"], "ref": "項目監査履歴（Field Audit Trail）、項目履歴の保持"}, {"id": "DA-014", "domain": "データ管理", "topic": "削除データの復元とバックアップ", "q": "ある企業の営業担当者が、3日前に重要な商談を誤って削除した。システム管理者はデータを復元したいと考えている。あわせて、全データを定期的にバックアップする方法も知りたい。コンサルタントは何を推奨すべきか？", "choices": ["削除した商談はごみ箱から復元し、定期バックアップにはデータエクスポートサービスの定期エクスポートを使う", "削除した商談は項目履歴から再作成し、バックアップは不要と伝える", "削除した商談はリストビューの「最近削除」から編集する", "削除した商談は二度と復元できないため、データローダで新規作成する"], "answer": [0], "explanation": "削除したレコードは、一定期間（通常15日間）ごみ箱に残るため、そこから復元できる。データエクスポートサービスを使うと、組織のデータを週次または月次でCSVとしてエクスポートするよう予約できる。", "choiceNotes": ["正しい。ごみ箱から復元でき、定期エクスポートでバックアップも取れる。", "誤り。履歴から元のレコードは作り直せず、バックアップの要否も見誤っている。", "誤り。そのような機能はない。", "誤り。ごみ箱の保持期間内であれば復元できる。"], "ref": "ごみ箱、データのエクスポート（データエクスポートサービス）"}, {"id": "DA-015", "domain": "データ管理", "topic": "積み上げ集計項目と主従関係", "q": "ある建設会社では、カスタムオブジェクト「工事」と「工事明細」があり、明細は参照関係で工事に紐付いている。どの明細にも必ず工事が設定されている。工事レコードに明細金額の合計を標準機能で表示したい。コンサルタントは何を推奨すべきか？", "choices": ["工事に数式項目を作り、明細金額を参照する", "参照関係を主従関係に変更し、工事に積み上げ集計項目を作成する", "工事明細に積み上げ集計項目を作成する", "工事明細のレポートを作成して、合計を工事の説明欄に手で書き写す"], "answer": [1], "explanation": "積み上げ集計項目は、主従関係の主側オブジェクトに作成する。参照関係のままでは作成できないが、すべての子レコードに親が設定されていれば、主従関係に変更できる。", "choiceNotes": ["誤り。数式項目で子レコードの値を集計することはできない。", "正しい。主従関係に変更すれば、主側に積み上げ集計項目を作成できる。", "誤り。積み上げ集計項目は従側ではなく主側に作る。", "誤り。手作業で、値がすぐに古くなる。"], "ref": "積み上げ集計項目、主従関係への変換"}, {"id": "DA-016", "domain": "データ管理", "topic": "取引先での商談集計", "q": "ある企業の営業部長は、取引先ごとに「Closed Won」の商談の金額合計を取引先レコードに表示したい。コンサルタントは何を推奨すべきか？", "choices": ["取引先に数式項目を作り、商談の金額を参照する", "取引先と商談の関係を主従関係に変更する", "取引先に、商談の金額を合計する積み上げ集計項目を作り、フェーズが「Closed Won」の商談だけを集計する条件を設定する", "商談に積み上げ集計項目を作る"], "answer": [2], "explanation": "取引先と商談の関係は主従関係ではないが、標準機能として、取引先に商談を集計する積み上げ集計項目を作成できる。絞り込み条件を設定すれば、Closed Won の商談だけを合計できる。なお、積み上げ集計項目の絞り込み条件には「今年度」のような相対日付は使えない点に注意する。", "choiceNotes": ["誤り。数式項目では子レコードを集計できない。", "誤り。標準の関係は変更できず、変更しなくても集計できる。", "正しい。取引先には商談を集計する積み上げ集計項目を作成できる。", "誤り。集計結果を表示したいのは親の取引先である。"], "ref": "積み上げ集計項目（取引先での商談の集計）"}, {"id": "DA-017", "domain": "データ管理", "topic": "マルチ通貨と価格表", "q": "ある日本企業は米国に進出し、同じ製品を円とドルで販売することになった。商談には販売通貨で製品を追加したい。コンサルタントが推奨すべき対応はどれか？（2つ選択してください）", "choices": ["マルチ通貨を有効化し、使用する通貨とその換算レートを有効にする", "製品ごとに円用とドル用の別の製品レコードを作る", "価格表に、各製品の円とドルの価格表エントリを作成する", "商談の金額をテキスト項目に変更する", "商談の通貨は常に会社の通貨に固定する"], "answer": [0, 2], "explanation": "マルチ通貨を有効にすると、レコードごとに通貨を持てるようになる。価格表エントリは通貨ごとに作成し、商談に追加できるのは商談と同じ通貨の価格表エントリだけである。", "choiceNotes": ["正しい。複数の通貨を扱うにはマルチ通貨の有効化が必要。", "誤り。1つの製品に通貨ごとの価格表エントリを持たせれば済み、製品マスタを重複させる必要はない。", "正しい。商談と同じ通貨の価格表エントリが必要になる。", "誤り。集計や換算ができなくなる。", "誤り。ドルで販売する商談が作れなくなる。"], "ref": "マルチ通貨の有効化、価格表エントリと通貨"}, {"id": "DA-018", "domain": "データ管理", "topic": "日付別換算レート", "q": "ある多国籍企業では、商談の金額を完了予定日時点の為替レートで会社の通貨に換算し、レポートしたいと考えている。マルチ通貨はすでに有効になっている。コンサルタントは何を推奨すべきか？", "choices": ["会社の通貨を毎月変更する", "通貨ごとに別の Salesforce 組織を用意する", "商談に通貨換算用の数式項目を作り、レートを固定値で書く", "日付別換算レート（高度な通貨管理）を有効化し、期間ごとの換算レートを管理する"], "answer": [3], "explanation": "高度な通貨管理を有効にすると、日付ごとに換算レートを持てる。商談の金額は、完了予定日に該当する期間のレートで換算される。", "choiceNotes": ["誤り。会社の通貨を頻繁に変えるのは非現実的で、データの整合性も崩れる。", "誤り。運用やレポートがかえって複雑になる。", "誤り。固定値ではレートの変動を反映できない。", "正しい。日付別換算レートで完了予定日時点のレートを使える。"], "ref": "高度な通貨管理、日付別換算レート"}, {"id": "DA-019", "domain": "データ管理", "topic": "Data Cloud の役割", "q": "ある小売企業では、ECサイトの購買履歴、マーケティングのメール反応、Sales Cloud の商談データがそれぞれ別のシステムにある。これらを1人の顧客の統合プロファイルにまとめ、セグメントを作って営業活動に活用したい。コンサルタントは何を推奨すべきか？", "choices": ["Data Cloud でデータを取り込み、ID解決で統合プロファイルを作り、セグメントを作成する", "すべてのデータを取引先のロングテキストエリアに貼り付ける", "データインポートウィザードで毎日手作業で取り込む", "各システムのレポートをそれぞれ見るよう営業担当者に依頼する"], "answer": [0], "explanation": "Data Cloud（2025年10月に Data 360 に名称変更）は、複数のソースからデータを取り込んでデータモデルに合わせ、ID解決によって統合された顧客プロファイルを作る。そのプロファイルをもとにセグメントを作り、各チャネルで活用できる。", "choiceNotes": ["正しい。複数ソースの統合とセグメント化は Data Cloud の中心的な役割である。", "誤り。構造化されず、分析にも活用にも使えない。", "誤り。手作業では統合もID解決もできない。", "誤り。統合ビューにならず、要件を満たさない。"], "ref": "Data Cloud の基本、ID解決と統合プロファイル"}, {"id": "DA-020", "domain": "データ管理", "topic": "データ取込み順序", "q": "ある企業では、旧システムから取引先、取引先責任者、商談、商談の取引先責任者の役割をSalesforceに移行する。ユーザーはすでに作成済みである。関連付けの失敗を避けるための適切な取込み順序はどれか？", "choices": ["商談 → 取引先 → 取引先責任者 → 取引先責任者の役割", "取引先責任者 → 商談 → 取引先 → 取引先責任者の役割", "取引先 → 取引先責任者 → 商談 → 取引先責任者の役割", "取引先責任者の役割 → 商談 → 取引先責任者 → 取引先"], "answer": [2], "explanation": "子レコードを取り込むときは、参照先の親レコードがすでに存在している必要がある。取引先責任者と商談は取引先を参照し、取引先責任者の役割は商談と取引先責任者の両方を参照するため、この順序が適切である。", "choiceNotes": ["誤り。商談を取り込む時点で、参照先の取引先がまだない。", "誤り。親の取引先より先に子を取り込んでいる。", "正しい。親から子へと順に取り込んでいる。", "誤り。参照先がない状態で、中間オブジェクトから取り込んでいる。"], "ref": "データ移行のベストプラクティス（読み込み順序）"}, {"id": "DA-021", "domain": "予測AI・生成AI", "topic": "Einstein リードスコアリングとグローバルモデル", "q": "あるスタートアップは Salesforce を導入したばかりで、リードの取引開始の実績がまだ少ない。それでも、営業担当者が有望なリードを優先できるよう、Einstein リードスコアリングを使いたいと考えている。コンサルタントは何を伝えるべきか？", "choices": ["十分な実績がたまるまで、Einstein リードスコアリングは有効化できない", "実績が少ない間はグローバルモデルでスコアが付き、十分なデータがたまると組織固有のモデルに切り替わる", "スコアは営業担当者が手で入力する必要がある", "Einstein リードスコアリングを使うには Data Cloud が必須である"], "answer": [1], "explanation": "組織に十分な取引開始の実績がない場合、Einstein リードスコアリングは、複数の組織から匿名化したデータで作ったグローバルモデルを使う。データが十分にたまると、組織固有のモデルを使うようになる。", "choiceNotes": ["誤り。グローバルモデルを使えば有効化できる。", "正しい。データ量に応じて、グローバルモデルと組織固有のモデルが使い分けられる。", "誤り。スコアは自動で算出される。", "誤り。リードスコアリングに Data Cloud は必要ない。"], "ref": "Einstein リードスコアリング（グローバルモデル）"}, {"id": "DA-022", "domain": "予測AI・生成AI", "topic": "スコア要因の活用", "q": "ある企業では Einstein リードスコアリングを有効にした。営業担当者から「スコアの数字だけでは、なぜ有望なのかがわからない」という声が出ている。コンサルタントは何を推奨すべきか？", "choices": ["スコアを非表示にして、営業担当者の判断だけに任せる", "リードスコアの項目を削除する", "スコアをもとに入力規則を作成する", "リードのレコードページに Einstein スコアのコンポーネントを配置し、スコアに影響した上位の要因を表示する"], "answer": [3], "explanation": "Einstein リードスコアリングは、スコアとあわせて、スコアを上げた要因と下げた要因を示す。レコードページのコンポーネントで要因を表示すれば、営業担当者はスコアの理由を理解して行動できる。", "choiceNotes": ["誤り。予測AIの価値を活かせない。", "誤り。根本的な解決にならない。", "誤り。入力規則で根拠は説明できない。", "正しい。要因を表示すれば、スコアの理由が伝わる。"], "ref": "Einstein リードスコアリング（スコアの要因表示）"}, {"id": "DA-023", "domain": "予測AI・生成AI", "topic": "Einstein 商談スコアリング", "q": "ある企業の営業マネージャーは、パイプラインの中で受注の見込みが高い商談と、リスクのある商談をすばやく見分けたいと考えている。組織には過去数年分の受注と失注の商談データがある。コンサルタントは何を推奨すべきか？", "choices": ["Einstein 商談スコアリングを有効化し、商談のスコアと要因をリストビューやレコードページに表示する", "Einstein 活動キャプチャを有効化する", "商談の確度を手入力させる入力規則を作成する", "Einstein リードスコアリングを商談にも適用する"], "answer": [0], "explanation": "Einstein 商談スコアリングは、過去の受注・失注の商談データや活動をもとに、商談ごとに受注の可能性をスコアで示す。上位の要因も表示されるので、優先順位付けやリスクの把握に役立つ。", "choiceNotes": ["正しい。商談の受注可能性を予測し、要因もあわせて示す。", "誤り。メールや予定を同期する機能で、スコアは付けない。", "誤り。主観的な入力であり、予測AIではない。", "誤り。リードスコアリングの対象はリードだけである。"], "ref": "Einstein 商談スコアリング"}, {"id": "DA-024", "domain": "予測AI・生成AI", "topic": "商談スコアリングの学習データ", "q": "ある企業は Einstein 商談スコアリングを有効にしたが、Salesforce を導入して間もないため、完了した商談の数が少ない。管理者は、スコアが表示されないのではないかと心配している。コンサルタントの説明として正しいものはどれか？", "choices": ["完了した商談がなければ、商談スコアリングは使えない", "商談スコアは営業担当者の入力から計算される", "組織のデータが要件に満たない間はグローバルモデルでスコアが付き、要件を満たすと組織固有のモデルが作られる", "商談スコアリングは、取引先のスコアだけを表示する"], "answer": [2], "explanation": "Einstein 商談スコアリングは、組織固有のモデルを作るのに、一定数以上の受注・失注の商談を必要とする。要件を満たさない間は、グローバルモデルを使ってスコアを付ける。", "choiceNotes": ["誤り。グローバルモデルで使える。", "誤り。スコアは機械学習のモデルが算出する。", "正しい。データ量に応じてモデルが切り替わる。", "誤り。スコアは商談に付く。"], "ref": "Einstein 商談スコアリングの要件、グローバルモデル"}, {"id": "DA-025", "domain": "予測AI・生成AI", "topic": "Einstein 売上予測", "q": "ある企業の営業本部長は、営業担当者が入力した売上予測に加えて、AIが期末にどれくらいの結果になると予測しているかを見て、売上予測の精度を高めたいと考えている。コンサルタントは何を推奨すべきか？", "choices": ["Einstein 活動キャプチャを有効化する", "Einstein リードスコアリングのスコアを売上予測に使う", "商談に数式項目を作り、金額に確度をかける", "コラボレーション売上予測を前提に、Einstein 売上予測を有効化する"], "answer": [3], "explanation": "Einstein 売上予測は、過去の実績やパイプラインをもとに、期末の売上がどれくらいになるかを予測し、売上予測ページに表示する。コラボレーション売上予測の機能の上で動く。", "choiceNotes": ["誤り。活動の同期機能で、売上を予測するものではない。", "誤り。リードのスコアは売上予測ではない。", "誤り。単純な期待値の計算であり、AIによる予測ではない。", "正しい。売上予測ページにAIの予測を表示できる。"], "ref": "Einstein 売上予測、コラボレーション売上予測"}, {"id": "DA-026", "domain": "予測AI・生成AI", "topic": "Einstein 活動キャプチャ", "q": "ある企業では、営業担当者がメールや会議を Salesforce に記録し忘れることが多い。Gmail や Microsoft のメールとカレンダーの活動を自動で取り込みたい。あわせて、取り込んだメールを標準のレポートで集計したいという要望もある。現在の Einstein 活動キャプチャについて、コンサルタントの説明として正しいものはどれか？", "choices": ["Einstein 活動キャプチャで活動を自動で取り込める。「Salesforce 活動としてメールを同期（Sync Email as Salesforce Activity）」を使うと、取り込んだメールが ToDo とメールメッセージのレコードとして保存され、標準レポートで集計できる", "取り込んだメールを集計するには、Activity 360 レポートと活動指標を新たに有効化する必要がある", "Einstein 活動キャプチャは Salesforce 内で送信したメールにしか対応していない", "Einstein 活動キャプチャを使うには、すべての営業担当者がメールごとに手動で記録ボタンを押す必要がある"], "answer": [0], "explanation": "Einstein 活動キャプチャは、メールとカレンダーのアカウントを接続して、メールや予定を関連するレコードに自動で関連付ける。Summer '25 以降の「Salesforce 活動としてメールを同期」では、取り込んだメールが ToDo（Task）とメールメッセージ（EmailMessage）のレコードとして保存されるため、標準の活動レポートやメールメッセージを主オブジェクトにしたレポートで集計できる。従来の Activity 360 レポート、活動指標、活動ダッシュボードは廃止予定で、Summer '25 以降に有効化した組織では利用できない。", "choiceNotes": ["正しい。メールは ToDo とメールメッセージのレコードとして保存され、標準レポートの対象になる。", "誤り。Activity 360 レポートや活動指標は廃止予定で、新たに有効化した組織では利用できない。", "誤り。外部のメールサービスと接続して取り込む機能である。", "誤り。接続後は自動で取り込まれる。"], "ref": "Einstein 活動キャプチャ（Salesforce 活動としてメールを同期）、Activity 360 レポート等の廃止"}, {"id": "DA-027", "domain": "予測AI・生成AI", "topic": "Agentforce のトピックとアクション", "q": "ある企業では、営業担当者を支援する Agentforce エージェントを運用している。新たに、担当者が自然言語で依頼すると、商談の次のステップを提案する仕事をエージェントに追加したい。コンサルタントは何を推奨すべきか？", "choices": ["エージェントのプロファイルにシステム管理者権限を付与する", "新しいトピックを作成し、その仕事の範囲と指示を記述して、必要なアクションを割り当てる", "商談に新しい入力規則を追加する", "エージェントを削除して、作り直す"], "answer": [1], "explanation": "Agentforce では、トピック（2026年4月以降は「サブエージェント」と呼ばれる）がエージェントが担う仕事の範囲を定め、その指示が振る舞いを導く。アクションは、エージェントが実際に実行する処理（フロー、Apex、プロンプトテンプレートなど）である。新しい仕事を追加するには、トピック（サブエージェント）を作り、アクションを割り当てる。", "choiceNotes": ["誤り。権限を広げても仕事は追加されず、セキュリティ上も望ましくない。", "正しい。トピック、指示、アクションの組み合わせで仕事を定義する。", "誤り。入力規則はエージェントの機能とは関係ない。", "誤り。トピックを追加すれば拡張できる。"], "ref": "Agentforce の概念（エージェント、トピック、アクション）"}, {"id": "DA-028", "domain": "予測AI・生成AI", "topic": "エージェントアクションの種類", "q": "ある企業では、Agentforce エージェントに独自の業務処理を実行させたい。エージェントのカスタムアクションとして利用できるものはどれか？（2つ選択してください）", "choices": ["自動起動フロー（トリガーなし）", "ページレイアウト", "呼び出し可能な Apex メソッド", "入力規則", "レポートタイプ"], "answer": [0, 2], "explanation": "エージェントのカスタムアクションは、フロー、呼び出し可能な Apex、プロンプトテンプレートなどをもとに作成する。ページレイアウトや入力規則、レポートタイプはアクションの実装には使えない。", "choiceNotes": ["正しい。自動起動フローはエージェントアクションとして使える。", "誤り。画面の構成を決める設定で、アクションにはならない。", "正しい。呼び出し可能な Apex はアクションとして使える。", "誤り。保存時のチェックで、アクションにはならない。", "誤り。レポートの定義で、アクションにはならない。"], "ref": "Agentforce のカスタムアクション（フロー、Apex、プロンプトテンプレート）"}, {"id": "DA-029", "domain": "予測AI・生成AI", "topic": "Sales Development Rep エージェント", "q": "あるSaaS企業では、Webからのリードが急増し、インサイドセールスの人手が足りず、多くのリードにすぐ対応できていない。営業時間外も含めて、リードに自律的にメールで連絡し、質問に答え、見込みの高いリードを営業担当者につなぎたい。コンサルタントは何を推奨すべきか？", "choices": ["Einstein 売上予測を有効化する", "重複ルールでリードを削減する", "リードへのメール連絡や返信を自律的に行う Agentforce の営業エージェント（Agentforce Engagement。旧称 Lead Nurturing、SDR）を導入する", "リードの割り当てルールで全リードを1人に割り当てる"], "answer": [2], "explanation": "Agentforce Engagement（旧称 Agentforce Lead Nurturing、さらに前は Agentforce SDR）は、CRMのデータなどをもとに、リードや取引先責任者への最初のメール、返信への回答、ナーチャリングを自律的に行い、見込みの高いリードを営業担当者につなぐ。人手が足りない状況でも、リードへの対応を拡大できる。", "choiceNotes": ["誤り。売上を予測する機能で、リードへの対応はしない。", "誤り。重複を減らしても、リードへの対応は進まない。", "正しい。このエージェントは、まさにこの用途のためのものである。", "誤り。人手不足が悪化する。"], "ref": "Agentforce Engagement（旧 Lead Nurturing / SDR）"}, {"id": "DA-030", "domain": "予測AI・生成AI", "topic": "Sales Coach エージェント", "q": "ある企業の営業マネージャーは、重要な商談の前に部下が価格交渉の練習をしてフィードバックを受けられるようにしたい。ただし、マネージャー自身が毎回付き合う時間はない。コンサルタントは何を推奨すべきか？", "choices": ["Einstein 活動キャプチャで過去のメールを同期する", "Agentforce Sales Coach を使い、商談の情報をもとにしたロールプレイとフィードバックを提供する", "商談スコアリングのスコアを部下にメールで送る", "商談の入力規則を厳しくする"], "answer": [1], "explanation": "Agentforce Sales Coach は、商談のコンテキストをもとに、営業担当者が交渉などのロールプレイを行い、フィードバックを受けられるようにする。マネージャーが付き合わなくても練習の機会を増やせる。", "choiceNotes": ["誤り。活動を記録するだけで、練習やフィードバックはできない。", "正しい。商談に合わせたロールプレイとフィードバックを提供する。", "誤り。スコアを見るだけでは交渉の練習にならない。", "誤り。営業スキルの向上とは関係ない。"], "ref": "Agentforce Sales Coach"}, {"id": "DA-031", "domain": "予測AI・生成AI", "topic": "生成メールと人のレビュー", "q": "ある企業では、営業担当者が見込み客へのフォローアップメールを書く時間を減らしたい。同時に、コンプライアンス部門は、AIが作った文面を誰も確認しないまま送ることを懸念している。コンサルタントは何を推奨すべきか？", "choices": ["生成AIの利用を全面的に禁止する", "AIが生成したメールを、営業担当者が確認しないまま自動で送信する", "メールテンプレートだけを使い、差し込み項目を一切使わない", "Einstein の生成メールでCRMのデータを使って下書きを作り、営業担当者が確認・編集してから送信する"], "answer": [3], "explanation": "Einstein の生成メールは、レコードのデータをもとにパーソナライズされた下書きを作る。営業担当者が内容を確認・編集してから送信するので、効率化と人による確認を両立できる。", "choiceNotes": ["誤り。効率化の目的を果たせない。", "誤り。人の確認がなく、コンプライアンスの懸念を解消できない。", "誤り。パーソナライズが不足し、時間の削減も限られる。", "正しい。下書きの生成と人によるレビューを両立できる。"], "ref": "Einstein の生成メール（Sales Emails）"}, {"id": "DA-032", "domain": "予測AI・生成AI", "topic": "Prompt Builder のグラウンディング", "q": "ある企業では、Prompt Builder で商談の要約を作るプロンプトテンプレートを作成している。生成される内容が具体性に欠けるため、対象の商談や関連データにもとづく要約にしたい。グラウンディングの方法として適切なものはどれか？（2つ選択してください）", "choices": ["テンプレートに商談レコードの項目の差し込み項目を追加する", "プロンプトに「詳しく書いて」とだけ追記する", "フローを使って関連レコードのデータを取得し、テンプレートに渡す", "商談のページレイアウトから項目を削除する", "LLMの学習データに自社のデータを追加するよう依頼する"], "answer": [0, 2], "explanation": "Prompt Builder では、差し込み項目やフロー、Apex などを使ってCRMのデータをプロンプトに含めることで、回答をグラウンディングできる。これにより、対象レコードに即した具体的な内容が生成される。", "choiceNotes": ["正しい。レコードの項目値をプロンプトに含められる。", "誤り。データがなければ具体性は上がらない。", "正しい。フローで関連データを取得してグラウンディングできる。", "誤り。生成の品質とは関係ない。", "誤り。Prompt Builder は、モデルを学習させるのではなく、実行時にデータを渡す仕組みである。"], "ref": "Prompt Builder（差し込み項目、フローによるグラウンディング）"}, {"id": "DA-033", "domain": "予測AI・生成AI", "topic": "Einstein Trust Layer", "q": "ある医療機器メーカーでは、生成AIで営業メールの下書きを作ることを検討している。情報セキュリティ部門は、顧客の個人情報が外部の大規模言語モデル（LLM）に渡ったり、LLMの提供元に保存されたりすることを懸念している。Einstein Trust Layer の機能のうち、この懸念に対応するものはどれか？（2つ選択してください）", "choices": ["プロンプトに含まれる個人情報などの機密データを、LLMに送る前にマスキングする", "すべてのユーザーに、生成されたメールを自動で送信させる", "Salesforce と LLM の提供元との間のゼロデータリテンションの取り決めにより、プロンプトと応答がLLM側に保存されないようにする", "営業担当者のプロファイルからメール送信権限を削除する", "AIが生成した文面を、営業担当者が編集できないようにする"], "answer": [0, 2], "explanation": "Einstein Trust Layer は、プロンプト内の機密データをLLMに送る前にマスキングし、応答を返すときに元の値に戻す。また、外部のLLM提供元とはゼロデータリテンションの契約があり、プロンプトや応答がLLM側に保存されたり、モデルの学習に使われたりしない。なお、データマスキングは生成メールなどの組み込み生成AI機能で利用できるもので、Agentforce のエージェントでは無効化されている。", "choiceNotes": ["正しい。データマスキングで、機密データがLLMに渡るのを防ぐ。", "誤り。自動送信は Trust Layer の機能ではなく、懸念の解消にもならない。", "正しい。ゼロデータリテンションで、LLM側にデータが保存されない。", "誤り。Trust Layer の機能ではなく、業務も止まってしまう。", "誤り。人による確認と編集は、むしろ推奨される。"], "ref": "Einstein Trust Layer（データマスキング、ゼロデータリテンション、毒性検出）"}, {"id": "DA-034", "domain": "予測AI・生成AI", "topic": "信頼されるAIの原則", "q": "ある企業では、生成AIの導入にあたり、Salesforce の信頼される生成AIのガイドラインに沿った運用ルールを作っている。「AIが生成したコンテンツであることを利用者に明らかにし、データの出所を尊重する」というルールは、どの原則にもっとも当てはまるか？", "choices": ["正確性（Accuracy）", "持続可能性（Sustainability）", "誠実性（Honesty）", "安全性（Safety）"], "answer": [2], "explanation": "Salesforce の信頼される生成AIのガイドラインは、正確性、安全性、誠実性、エンパワーメント、持続可能性の5つで構成されている。誠実性は、データの出所を尊重し、コンテンツがAIによって生成されたことを透明にすることを求めている。", "choiceNotes": ["誤り。正確性は、検証可能で根拠のある結果を出すことに関する原則である。", "誤り。持続可能性は、モデルの規模や環境への影響に関する原則である。", "正しい。AIが生成したことの開示とデータの出所の尊重は、誠実性にあたる。", "誤り。安全性は、偏りや有害な出力、個人情報の保護に関する原則である。"], "ref": "Salesforce の信頼される生成AIのガイドライン"}, {"id": "DA2-001", "domain": "データ管理", "topic": "データ移行の順序", "q": "製造業のA社は旧CRMからSalesforceへ、ユーザー、取引先、取引先責任者、商談、商談商品を移行する。商品と価格表エントリは本番組織で既に作成済みである。参照関係のエラーを最小限にするための読み込み順として最も適切なものはどれか。", "choices": ["取引先 → 商談 → ユーザー → 取引先責任者 → 商談商品", "ユーザー → 取引先 → 取引先責任者 → 商談 → 商談商品", "商談 → 商談商品 → 取引先 → 取引先責任者 → ユーザー", "取引先責任者 → 取引先 → ユーザー → 商談商品 → 商談"], "answer": [1], "explanation": "移行は参照される側（親）から先に読み込むのが原則である。所有者として参照されるユーザー、次に取引先、取引先を参照する取引先責任者と商談、最後に商談と価格表エントリを参照する商談商品の順になる。", "choiceNotes": ["ユーザーより先に取引先・商談を読み込むと所有者を正しく設定できない。", "親から子への依存順になっており正しい。", "子である商談・商談商品を親より先に読み込むことはできない。", "取引先責任者を取引先より先に入れると紐付けができず、商談商品も商談より先には作れない。"], "ref": "データ移行のベストプラクティス / Trailhead: Data Management - データのインポート"}, {"id": "DA2-002", "domain": "データ管理", "topic": "外部IDによるupsert", "q": "B社では基幹システムから毎晩取引先データをSalesforceに連携している。同じファイルを再実行すると重複レコードができてしまう問題が起きている。基幹側の顧客コードを使って解決したい。適切な対応はどれか。2つ選択してください。", "choices": ["毎晩の連携前に全取引先を一括削除してから再投入する", "顧客コード用のカスタム項目を作成し「外部ID」属性を付ける", "取引先名を照合キーにして重複ルールで保存をブロックする", "Data Loaderの操作をinsertからupsertに変更し、照合キーに顧客コード項目を指定する", "連携ファイルにSalesforceのレコードIDを手作業で追記する運用にする"], "answer": [1, 3], "explanation": "外部ID属性を持つ項目をキーにupsertすると、一致するレコードは更新され、一致しないものだけが新規作成されるため再実行しても重複しない。基幹システムのキーをそのまま使えるため、SalesforceのレコードIDを管理する必要もない。", "choiceNotes": ["毎回削除すると関連レコードや履歴が失われ、IDも変わるため不適切。", "upsertの照合キーには外部ID（またはレコードID）が必要であり正しい。", "名前は一意性が保証されず、ブロックしても連携が失敗するだけで根本解決にならない。", "upsertにより既存は更新・未登録は作成となり重複を防げるため正しい。", "手作業は誤りやすく、外部IDで済む作業を増やすだけである。"], "ref": "Data Loader: upsert と外部ID / 外部ID項目の作成"}, {"id": "DA2-003", "domain": "データ管理", "topic": "親子関係の紐付け", "q": "C社の移行チームは取引先を先に読み込み、各取引先に旧システムの取引先コードを外部ID項目として保持させた。次に取引先責任者を読み込むが、ファイルには旧取引先コードしか含まれずSalesforceの取引先IDはない。最も効率的に親子を紐付ける方法はどれか。", "choices": ["取引先を一度エクスポートし、VLOOKUPで全行に取引先IDを埋めてからinsertする", "取引先責任者を取引先なしで読み込み、後で1件ずつ画面から取引先を設定する", "Data Loaderで取引先責任者を読み込む際、取引先への参照を取引先の外部ID項目でマッピングする", "取引先責任者の取引先名テキスト項目に旧コードを入れ、ワークフローで紐付ける"], "answer": [2], "explanation": "Data Loaderでは参照関係を親オブジェクトの外部ID項目で指定できるため、子レコードのファイルに親のSalesforce IDがなくても紐付けられる。ID変換の手作業が不要になり、誤りも減る。", "choiceNotes": ["実現は可能だが手作業が多く、外部ID参照より非効率である。", "大量データでは非現実的で誤りも生じやすい。", "親の外部IDで参照を解決でき、最も効率的で正しい。", "テキスト項目に値を入れても参照関係は設定されない。"], "ref": "Data Loader: 外部IDを使用した関連レコードの指定"}, {"id": "DA2-004", "domain": "データ管理", "topic": "一括削除と復元", "q": "D社の管理者が10日前、Data Loaderの通常の削除（delete）操作で誤って300件の取引先を削除した。取引先にぶら下がっていた取引先責任者と商談も一緒に削除されている。最も適切な対応はどれか。", "choices": ["組織のごみ箱から該当の取引先を復元する。カスケード削除された関連レコードも併せて復元される", "ごみ箱は個人単位なので、管理者であっても他ユーザーの削除レコードは復元できない", "Data Loaderで削除された時点でレコードは物理削除されているため、バックアップからinsertし直すしかない", "取引先だけを復元した後、取引先責任者と商談はそれぞれ別途ごみ箱から個別に復元しなければならない"], "answer": [0], "explanation": "通常のdeleteで削除されたレコードは一定期間ごみ箱に残り、管理者は組織全体のごみ箱から復元できる。親の削除に伴い削除された子レコードは親の復元時に併せて復元され、元のIDと関係も維持される。", "choiceNotes": ["ごみ箱の保持期間内であり、関連レコードも親と一緒に戻るため正しい。", "管理者は組織のごみ箱ビューで他ユーザーの削除レコードも扱える。", "物理削除になるのはハード削除を選んだ場合であり、通常のdeleteはごみ箱に入る。", "親と一緒に削除された子は親の復元時に自動で復元される。"], "ref": "ごみ箱 / 削除されたレコードの復元"}, {"id": "DA2-005", "domain": "データ管理", "topic": "重複ジョブ", "q": "E社では取引先の重複ルールを有効にしたが、ルール有効化以前に登録された大量の重複取引先がそのまま残っている。組織全体の既存重複を洗い出して統合作業につなげたい。最も適切な機能はどれか。", "choices": ["重複ルールのアクションを「ブロック」に変更する", "一致ルールを新規作成すれば既存レコードも自動で統合される", "入力規則で取引先名の重複を検出する", "重複ジョブを一致ルールで実行し、結果の重複レコードセットから統合する"], "answer": [3], "explanation": "重複ルールはレコードの作成・編集時にのみ評価されるため既存データには作用しない。重複ジョブは一致ルールを使って既存レコード全体をスキャンし、重複レコードセットとして結果を出すので、そこから比較・統合できる。", "choiceNotes": ["保存時の挙動が変わるだけで既存の重複は検出されない。", "一致ルールは照合条件の定義であり、それ自体が統合を行うことはない。", "入力規則は他レコードとの比較ができず重複検出には使えない。", "既存データ全体を対象にスキャンでき、統合まで進められるため正しい。"], "ref": "重複ジョブ / 重複レコードセット"}, {"id": "DA2-006", "domain": "データ管理", "topic": "データエクスポート", "q": "F社のCIOは「Salesforceのデータを定期的に社内保管したい。追加費用はかけたくない」と要望している。データエクスポートサービスについてコンサルタントが説明する内容として正しいものはどれか。", "choices": ["エクスポートしたファイルをアップロードすれば、関連付けも含めてボタン一つで組織を元の状態に戻せる", "スケジュール実行でオブジェクトのデータをCSV形式のZIPファイルとして出力でき、取り込みによる復元は別途計画する必要がある", "エクスポートは差分のみ出力されるため、初回以外は変更されたレコードしか含まれない", "エクスポート対象はカスタムオブジェクトに限られ、標準オブジェクトは含められない"], "answer": [1], "explanation": "データエクスポートサービスは手動またはスケジュールでデータをCSVファイル（ZIP）として出力する標準機能である。バックアップ取得の手段であり、復元は自動化されていないため、読み込み順序やID再マッピングを含めた復元手順を別に計画する必要がある。", "choiceNotes": ["データエクスポートには自動復元機能はない。", "スケジュール出力とCSV形式の説明、復元が別作業である点ともに正しい。", "選択したオブジェクトの全件が出力され、差分エクスポートではない。", "標準オブジェクトもカスタムオブジェクトも対象にできる。"], "ref": "データのエクスポート / データのバックアップと復元"}, {"id": "DA2-007", "domain": "データ管理", "topic": "所有権のデータスキュー", "q": "G社では外部システム連携用の1ユーザーが30万件の取引先を所有している。このユーザーのロール変更や共有ルールの更新時に処理が非常に遅くなり、ロックエラーも発生する。Salesforceが推奨する対策として適切なものはどれか。2つ選択してください。", "choices": ["所有レコードを実際の担当者など複数のユーザーに分散する", "そのユーザーを多数の公開グループに追加して共有範囲を広げる", "そのユーザーをロール階層の深い位置に置き、上位の多数のロールが自動で参照できるようにする", "取引先の組織の共有設定を非公開から公開/参照・更新可能へ変更するだけで解決する", "大量所有が避けられない場合、そのユーザーはロールなし、またはロール階層の最上位付近に割り当てる"], "answer": [0, 4], "explanation": "1ユーザーが約1万件を超えるレコードを所有する状態は所有権のデータスキューと呼ばれ、共有の再計算が重くなる。所有の分散が基本の対策であり、避けられない場合はロールを付けないか最上位に置き、公開グループに入れないことで再計算の影響を抑える。", "choiceNotes": ["スキュー自体を解消でき推奨される。", "グループメンバーシップの再計算が増え悪化する。", "階層が深いほど上位への共有計算が増え悪化する。", "共有要件を無視した変更であり、スキューの根本対策ではない。", "ロール階層による共有計算を最小化できる推奨構成である。"], "ref": "大規模データ量のベストプラクティス: 所有権のデータスキュー"}, {"id": "DA2-008", "domain": "データ管理", "topic": "取引先のデータスキュー", "q": "H社では担当未定の取引先責任者をすべて「未割当」という1つの取引先に紐付けており、その取引先配下の取引先責任者は8万件に達した。夜間の一括更新で「UNABLE_TO_LOCK_ROW」エラーが頻発している。最も効果的な対策はどれか。", "choices": ["Data Loaderのバッチサイズを最大値に増やす", "「未割当」取引先の所有者をシステム管理者に変更する", "取引先責任者を複数の取引先に分散し、1つの親に子レコードが集中しないようにする", "取引先責任者の入力規則をすべて無効化する"], "answer": [2], "explanation": "1つの親に大量の子レコードが集中すると、子の更新時に親レコードのロック競合が起きやすい（取引先のデータスキュー）。子を複数の親に分散し、1親あたりの子の件数を抑えるのが根本対策である。", "choiceNotes": ["バッチを大きくしても同一親へのロック競合は解消しない。", "所有者を変えてもロック競合の原因である子の集中は変わらない。", "親への集中を解消でき、ロック競合を根本的に減らせる。", "入力規則はロック競合の原因ではない。"], "ref": "大規模データ量のベストプラクティス: 取引先のデータスキュー / レコードロック"}, {"id": "DA2-009", "domain": "データ管理", "topic": "項目の暗号化の考え方", "q": "I社のセキュリティ部門は「取引先責任者の標準項目を含む個人情報を保存時暗号化（at rest）したい。暗号化後もリストビューやレポートで完全一致による絞り込みは続けたい」と要望している。また「暗号化すれば営業担当者全員から値が見えなくなる」と考えている。コンサルタントの説明として最も適切なものはどれか。", "choices": ["Shield Platform Encryptionで決定論的暗号化方式を使えば完全一致の絞り込みを維持できる。ただし暗号化は権限のあるユーザーには透過的なので、値を見せたくない場合は項目レベルセキュリティで制御する", "クラシック暗号化（暗号化テキスト項目）を使えば標準項目もそのまま暗号化でき、絞り込みも制限なく使える", "Shield Platform Encryptionを有効にすると、項目にアクセス権があるユーザーにも値がすべてマスクされる", "保存時暗号化は標準項目には適用できないため、すべてカスタム項目に移し替える必要がある"], "answer": [0], "explanation": "Shield Platform Encryptionは標準項目・カスタム項目を保存時に暗号化でき、決定論的暗号化方式を選ぶと完全一致の絞り込みが可能になる。暗号化はアクセス権のあるユーザーには透過的に復号表示されるため、誰が値を見られるかは項目レベルセキュリティなどのアクセス制御で設計する。", "choiceNotes": ["暗号化方式と可視性の役割分担を正しく説明している。", "クラシック暗号化はカスタムの暗号化テキスト項目専用で、標準項目には使えず絞り込みにも制限がある。", "Platform Encryptionは権限のあるユーザーには透過的であり、マスク機能ではない。", "Shield Platform Encryptionは多くの標準項目に対応している。"], "ref": "Shield Platform Encryption / 決定論的暗号化 / クラシック暗号化"}, {"id": "DA2-010", "domain": "データ管理", "topic": "データ品質ダッシュボード", "q": "J社の営業本部長は「取引先の主要項目（業種、従業員数、電話、住所）がどれだけ埋まっているかを担当者別に可視化し、改善を追跡したい」と考えている。追加開発を最小限に抑えた方法として最も適切なものはどれか。", "choices": ["四半期ごとに全取引先をエクスポートし、表計算ソフトで空欄を数える", "主要項目をすべて必須項目にし、既存レコードの空欄は無視する", "主要項目の入力有無から完全性スコアを計算する数式項目を作成し、そのスコアを集計するレポートとダッシュボードを作る", "重複ジョブを実行し、その結果をダッシュボードに表示する"], "answer": [2], "explanation": "数式項目で各レコードの入力率をスコア化すれば、標準のレポート・ダッシュボードで担当者別の平均や推移を可視化できる。AppExchangeのデータ品質分析ダッシュボードも同様の考え方であり、宣言的な設定だけで継続的に追跡できる。", "choiceNotes": ["手作業で継続性がなく、リアルタイムに追跡できない。", "今後の入力は改善されるが、既存データの品質を可視化できない。", "宣言的に完全性を測定・可視化でき最も適切である。", "重複ジョブは重複検出用であり、項目の完全性は測れない。"], "ref": "Data Quality Analysis Dashboards（AppExchange）/ 数式項目 / レポートとダッシュボード"}, {"id": "DA2-011", "domain": "データ管理", "topic": "取引先の統合", "q": "K社の営業担当者が重複している3件の取引先を標準の統合機能で統合しようとしている。統合の挙動として正しいものはどれか。2つ選択してください。", "choices": ["統合されたマスター以外のレコードは、関連レコードとともにごみ箱を経由せず物理削除される", "一度に統合できるのは2件までなので、2回に分けて実施する必要がある", "統合後に残すマスターレコードを選び、項目ごとにどのレコードの値を残すかを選択できる", "統合されたマスター以外のレコードに関連していた取引先責任者や商談は、マスターレコードに付け替えられる", "個人取引先と法人取引先を統合して1件の法人取引先にできる"], "answer": [2, 3], "explanation": "取引先の統合では最大3件までを対象に、マスターレコードと残す項目値を選べる。マスター以外のレコードの関連レコードはマスターに付け替えられ、マスター以外のレコード自体は削除される。", "choiceNotes": ["関連レコードはマスターへ移り、統合元レコードはごみ箱に入る。", "取引先は一度に3件まで統合できる。", "マスターと項目値の選択は統合機能の基本動作である。", "関連レコードは失われずマスターに再割り当てされる。", "個人取引先と法人取引先は統合できない。"], "ref": "取引先の統合 / 重複レコードの統合"}, {"id": "DA2-012", "domain": "データ管理", "topic": "移行時の監査項目", "q": "L社は旧システムの商談を移行するにあたり、レポートで過去の作成日ベースの分析を続けたいため、各レコードの元の作成日と作成者を保持したいと考えている。適切な対応はどれか。", "choices": ["移行後に作成日項目を一括更新する", "商談に「旧作成日」カスタム項目を作り、標準の作成日は移行日のままにするしか方法はない", "作成日は数式項目なので、旧システムの値を参照する数式に変更する", "「レコード作成時に監査項目を設定」を有効化し、移行ユーザーに権限を付与したうえで、insert時に作成日と作成者を指定する"], "answer": [3], "explanation": "「レコード作成時に監査項目を設定」を有効にし、該当権限を持つユーザーで読み込めば、新規作成時に限り作成日・作成者などの監査項目へ値を設定できる。既存レコードの更新では変更できないため、insert時に指定する必要がある。", "choiceNotes": ["監査項目は作成後の更新では変更できない。", "標準機能で作成時に監査項目を設定する方法があるため不適切。", "作成日はシステム項目であり数式に変更できない。", "作成時に監査項目を設定する正しい手順である。"], "ref": "レコード作成時に監査項目を設定 / データ移行"}, {"id": "DA2-013", "domain": "データ管理", "topic": "インポートツールの選択", "q": "M社は旧システムから約20万件の商談を一度に移行し、さらに今後は毎週定期的に商談を更新したいと考えている。ツールの選択として最も適切なものはどれか。", "choices": ["データインポートウィザードで5万件ずつ4回に分けて取り込む", "Data Loaderを使用する。大量件数と商談に対応し、コマンドラインから定期実行も構成できる", "データインポートウィザードで取引先と一緒に商談を取り込む", "Salesforce画面から商談をクローン機能で作成する"], "answer": [1], "explanation": "データインポートウィザードは1回5万件までで、商談などの一部標準オブジェクトに対応していない。Data Loaderは数百万件規模と全オブジェクトに対応し、コマンドラインインターフェースで定期実行も可能である。", "choiceNotes": ["インポートウィザードは商談の取り込みに対応していない。", "件数・対象オブジェクト・定期実行のいずれにも対応でき正しい。", "インポートウィザードでは商談は取り込めない。", "手作業であり大量移行には非現実的である。"], "ref": "データインポートウィザードとData Loaderの比較"}, {"id": "DA2-014", "domain": "予測AI・生成AI", "topic": "Einstein スコアの前提", "q": "設立2年目のN社はSalesforce導入直後で、リードと取引開始の履歴がまだほとんどない。営業部長は「Einstein リードスコアリングはデータが溜まるまで全く使えないのか」と質問した。最も適切な回答はどれか。", "choices": ["自社データが不足している間はグローバルモデルでスコアを算出し、十分なデータが蓄積されると自社固有のモデルに切り替わる", "過去の取引開始データが十分に揃うまで、スコア項目は空欄のままになる", "旧システムのデータを手作業でスコア項目に入力すれば代替できる", "リードスコアリングは商談データから学習するため、リードの履歴は不要である"], "answer": [0], "explanation": "Einstein リードスコアリングは、組織に十分な履歴データがない場合、多様な組織の匿名化データから作られたグローバルモデルを使用する。十分なリードと取引開始の履歴がたまると自社データに基づくモデルを使用するようになる。", "choiceNotes": ["データ不足時のグローバルモデル利用の説明として正しい。", "グローバルモデルによりスコアは算出される。", "スコア項目は予測結果であり、手入力で代替するものではない。", "リードスコアリングはリードと取引開始の履歴から学習する。"], "ref": "Einstein リードスコアリング / グローバルモデル"}, {"id": "DA2-015", "domain": "予測AI・生成AI", "topic": "スコアの寄与要因", "q": "O社の営業担当者から「この商談のEinsteinスコアが低いが、理由がわからないので対策できない」と相談があった。最も適切な案内はどれか。", "choices": ["スコアは内部計算のため理由は確認できないと説明する", "管理者にスコアを手動で引き上げてもらうよう依頼する", "商談レコードページのEinstein スコアコンポーネントで、スコアを押し上げている要因と押し下げている要因を確認する", "スコアが低い商談は自動で失注扱いになるため、新規商談を作り直す"], "answer": [2], "explanation": "Einstein 商談スコアリングはスコアとともに、スコアに好影響・悪影響を与えている主な要因をレコードページ上で示す。担当者はこれをもとに次の行動を判断でき、AIの透明性にもつながる。", "choiceNotes": ["寄与要因が表示されるため誤り。", "スコアは予測結果であり手動で変更するものではない。", "寄与要因の確認により具体的な対策を検討できる。", "スコアによって商談のフェーズが自動で変更されることはない。"], "ref": "Einstein 商談スコアリング / スコアの要因"}, {"id": "DA2-016", "domain": "予測AI・生成AI", "topic": "Einstein 売上予測とコラボレーション売上予測", "q": "P社はコラボレーション売上予測を運用中で、営業マネージャーはチームの申告値に対するAIの予測を比較したいと考えている。Einstein 売上予測についての説明として正しいものはどれか。", "choices": ["Einstein 売上予測はコラボレーション売上予測を置き換えるため、有効化すると売上予測の調整機能は使えなくなる", "Einstein 売上予測を有効化すると、マネージャーの調整値がAIの予測値で自動的に上書きされる", "Einstein 売上予測はコラボレーション売上予測とは独立した別画面で、レポートでのみ確認できる", "Einstein 売上予測はコラボレーション売上予測の設定を前提とし、売上予測ページにAIの予測値を表示して担当者の予測と比較できるようにする"], "answer": [3], "explanation": "Einstein 売上予測はコラボレーション売上予測の仕組みの上に機能し、売上予測ページにAIによる予測を表示する。マネージャーは担当者の予測や自身の調整値とAIの予測を見比べて判断材料にでき、調整値が自動で書き換えられることはない。", "choiceNotes": ["コラボレーション売上予測を補完する機能であり、置き換えるものではない。", "AIの予測は参考値として表示され、調整値を上書きしない。", "売上予測ページ上で比較できる。", "コラボレーション売上予測との関係を正しく説明している。"], "ref": "Einstein 売上予測 / コラボレーション売上予測"}, {"id": "DA2-017", "domain": "予測AI・生成AI", "topic": "Einstein Conversation Insights", "q": "Q社の営業マネージャーは、録音された商談の通話の中で特定の競合他社名や「価格」がどの程度話題に出ているかを把握し、コーチングに活かしたい。最も適切な機能の使い方はどれか。", "choices": ["Einstein Conversation Insights を通話録音の提供元と接続し、競合名や価格に関するキーワードを追跡対象に設定する", "活動履歴の件名に競合名を入力するよう担当者に依頼し、レポートで集計する", "Einstein リードスコアリングの要因に競合名を追加する", "Einstein 売上予測の対象に通話データを含める"], "answer": [0], "explanation": "Einstein Conversation Insights は録音された通話を文字起こし・分析し、設定したキーワードや競合などの言及を把握できる。マネージャーは言及箇所を確認してコーチングに活用できる。", "choiceNotes": ["通話内容から言及を自動抽出でき最も適切である。", "担当者の手入力に依存し正確性と網羅性に欠ける。", "リードスコアリングは通話内容の分析機能ではない。", "売上予測は通話の内容を分析する機能ではない。"], "ref": "Einstein Conversation Insights / キーワードのトラッキング"}, {"id": "DA2-018", "domain": "予測AI・生成AI", "topic": "生成AIの通話サマリー", "q": "R社では録音・文字起こし済みの通話について、営業担当者が要点や次のステップを手入力でまとめるのに時間がかかっている。生成AIの通話サマリーを導入する際の運用として最も適切なものはどれか。", "choices": ["サマリーは常に正確なので、担当者は確認せずにそのまま顧客へ転送させる", "生成されたサマリーを担当者が確認・必要に応じて編集してから記録や共有に使う運用にする", "通話サマリーは文字起こしがなくても、活動のメモ欄から自動生成される", "サマリー生成には顧客の個人情報をすべて削除した録音を手動で再アップロードする必要がある"], "answer": [1], "explanation": "生成AIの通話サマリーは文字起こしをもとに要点や次のステップを下書きとして生成する。生成AIの出力は誤りを含みうるため、担当者が内容を確認・編集してから利用する人によるレビューを運用に組み込むのが適切である。", "choiceNotes": ["生成AIの出力は誤りを含む可能性があり、無確認の転送は不適切。", "人によるレビューを前提とした運用で適切である。", "通話サマリーは通話の文字起こしを入力として生成される。", "Trust Layer がデータ保護を担っており、手動の再アップロードは前提ではない。"], "ref": "Einstein 通話サマリー / Einstein Conversation Insights"}, {"id": "DA2-019", "domain": "予測AI・生成AI", "topic": "Prompt Builder のテンプレート種別", "q": "S社は商談レコードに「商談の状況サマリー」という項目を設け、営業担当者がボタンを押すと生成AIがこの項目に文章を下書きできるようにしたい。Prompt Builderで作成すべきテンプレート種別として最も適切なものはどれか。", "choices": ["営業メール（Sales Email）", "フレックス（Flex）", "項目生成（Field Generation）", "レコード要約（Record Summary）"], "answer": [2], "explanation": "項目生成テンプレートは特定のオブジェクトの項目に紐付けて、Lightningレコードページ上から生成AIで項目値を下書きする用途に使う。ユーザーは生成された内容を確認・編集してから保存できる。", "choiceNotes": ["営業メールはメールの下書き生成用であり、項目への書き込み用ではない。", "フレックスは柔軟な入力を持つ汎用テンプレートで、項目への直接生成には項目生成が適する。", "特定の項目に生成結果を入れる要件に合致する。", "レコード要約は要約の表示用途であり、指定項目への書き込みには項目生成が適する。"], "ref": "Prompt Builder: プロンプトテンプレートの種類 / 項目生成テンプレート"}, {"id": "DA2-020", "domain": "予測AI・生成AI", "topic": "グラウンディング", "q": "T社は営業メールのプロンプトテンプレートに、取引先の基本情報だけでなく、その取引先の未完了ケースの件数と件名も含めたい。Salesforceのデータでテンプレートをグラウンディングする方法として適切なものはどれか。2つ選択してください。", "choices": ["毎回担当者がケース一覧をコピーしてテンプレート本文に手で貼り付ける", "テンプレート内の差し込み項目でレコードや関連リストの値を参照する", "ケースデータをCSVで外部のLLM提供元に事前にアップロードしておく", "ケース情報は生成AIが自動で推測するため、指示文に「ケースも考慮して」と書けば十分である", "Flowを作成してケース情報を取得・整形し、その結果をテンプレートに組み込む"], "answer": [1, 4], "explanation": "Prompt Builderでは、差し込み項目によるレコード・関連リストの参照や、Flow・Apexによるデータ取得でテンプレートを動的にグラウンディングできる。これによりLLMは実際のCRMデータに基づいた出力を生成できる。", "choiceNotes": ["手作業で非効率かつ誤りやすく、グラウンディングの仕組みを活かせない。", "差し込み項目による参照は標準的なグラウンディング方法である。", "Trust Layerの外にデータを持ち出すことになり不適切である。", "LLMはデータを渡されなければ推測するだけであり、ハルシネーションの原因になる。", "Flowで取得・加工したデータをテンプレートに渡せる。"], "ref": "Prompt Builder: グラウンディング / 差し込み項目 / テンプレートで起動するプロンプトフロー"}, {"id": "DA2-021", "domain": "予測AI・生成AI", "topic": "Agentforce のトピック", "q": "U社が構築した営業向けエージェントで、ユーザーが「来週の商談予定を教えて」と依頼すると、本来の「商談管理」トピックではなく「見積作成」トピックが選ばれてしまう。最初に見直すべき点として最も適切なものはどれか。", "choices": ["見積作成トピックに含まれるアクションの実行権限", "各トピックの分類の説明と範囲（スコープ）の記述", "エージェントが使用するLLMの温度設定", "ユーザーのプロファイルのページレイアウト"], "answer": [1], "explanation": "エージェントはユーザーの依頼をトピック（2026年4月以降は「サブエージェント」と呼ばれる）の分類の説明に基づいて振り分けるため、誤ったトピックが選ばれる場合はトピックの説明と範囲が曖昧・重複していないかを見直す。トピックの中では、指示がエージェントの振る舞いを、アクションが実行できる処理を定める。", "choiceNotes": ["権限はトピック選択の判断基準ではない。", "トピック選択に直接影響する記述であり最初に見直すべき点である。", "トピック分類の問題の一次対応として適切ではない。", "ページレイアウトはエージェントのトピック選択に関係しない。"], "ref": "Agentforce: トピック、指示、アクション / Agentforce Builder"}, {"id": "DA2-022", "domain": "予測AI・生成AI", "topic": "Agentforce の指示とアクション", "q": "V社のエージェントは「商談の更新」トピックに、商談フェーズを更新するFlowアクションを持っている。業務要件として「完了・失注にする前に必ず失注理由をユーザーに確認すること」を守らせたい。最も適切な設定はどれか。", "choices": ["トピックの指示に、失注にする前に理由を確認し、得られてからアクションを実行するよう明記する", "新しいトピックを作成し、失注理由専用のLLMを割り当てる", "Flowアクションを削除し、エージェントには商談の参照だけをさせる", "ユーザーに毎回プロンプトで失注理由を書くよう周知するだけにする"], "answer": [0], "explanation": "トピック（2026年4月以降は「サブエージェント」と呼ばれる）の指示は、そのトピック内でエージェントがどう振る舞い、いつどのようにアクションを使うかを定める。業務ルールは指示として明記するのが適切であり、確実性が必要な場合はFlow側の入力必須チェックなどと組み合わせる。", "choiceNotes": ["振る舞いのルールを定めるのは指示の役割であり正しい。", "トピックごとにLLMを割り当てる設計ではなく要件にも合わない。", "業務要件である更新機能自体を失ってしまう。", "ユーザーの記憶に頼る運用で確実性がない。"], "ref": "Agentforce: トピックの指示 / エージェントアクション"}, {"id": "DA2-023", "domain": "予測AI・生成AI", "topic": "Einstein Trust Layer", "q": "W社の情報セキュリティ部門は、生成AI機能の導入にあたり顧客データの扱いを懸念している。Einstein Trust Layer が提供する仕組みとして正しいものはどれか。2つ選択してください。", "choices": ["LLM提供元との間のゼロデータリテンション（プロンプトや応答をLLM提供元が保持・学習に使わない）", "生成された内容を誤りがないことが保証された状態にする正確性保証", "プロンプトに含まれる機密データのマスキング", "ユーザーの共有設定を無視して全データを参照できるようにするグラウンディング", "LLMの出力を人の確認なしに自動送信する機能"], "answer": [0, 2], "explanation": "Einstein Trust Layer はゼロデータリテンション、データマスキング、有害性の検出、監査証跡、ユーザー権限を尊重したセキュアなグラウンディングなどを提供する。なお、データマスキングは組み込みの生成AI機能で利用でき、Agentforce のエージェントでは無効化されている。また出力の正確性を保証するものではないため、人によるレビューも併せて設計する。", "choiceNotes": ["Trust Layerの主要な仕組みの一つで正しい。", "生成AIの出力の正確性を保証する機能はない。", "機密データをマスクしてからLLMに送る仕組みで正しい。", "グラウンディングはユーザーの権限を尊重して行われる。", "Trust Layerは自動送信の機能ではなく、人の確認は運用で担保する。"], "ref": "Einstein Trust Layer"}, {"id": "DA2-024", "domain": "予測AI・生成AI", "topic": "Human in the loop", "q": "X社は大口顧客向けの値引きを提示するエージェントを検討している。誤った値引き提示は大きな損失につながるため、経営層は慎重な運用を求めている。最も適切な設計はどれか。", "choices": ["エージェントが値引き率を決めて顧客へ直接提示し、結果を月次でレビューする", "値引きの判断はすべてエージェントに任せ、営業担当者には通知しない", "値引き案の作成まではエージェントに任せ、確定前に担当者の確認や既存の承認プロセスを経るようにする", "リスクを避けるため、値引きに関わる業務ではAIを一切使わない"], "answer": [2], "explanation": "影響の大きい判断ではAIを下書きや提案に使い、確定前に人が確認・承認する人によるレビュー（Human in the loop）を組み込むのが責任あるAI活用である。既存の承認プロセスを活用すれば統制を維持しつつ効率化できる。", "choiceNotes": ["事後レビューでは誤った提示による損失を防げない。", "人の関与と透明性がなく不適切である。", "提案の効率化と人による最終判断を両立でき適切である。", "効率化の機会を失い、リスク管理のための設計としても過剰である。"], "ref": "Trailhead: 責任ある生成AI / Agentforce の人によるレビュー"}, {"id": "DA2-025", "domain": "予測AI・生成AI", "topic": "AIの責任ある利用", "q": "Y社はリードの優先度付けにAIスコアを活用する予定である。AIの責任ある利用の観点から、コンサルタントが推奨する内容として適切なものはどれか。2つ選択してください。", "choices": ["スコアの算出根拠は混乱を招くため、担当者には一切開示しない", "過去の成約傾向を再現することが最優先なので、偏りのある学習データでもそのまま使う", "スコアが高いリード以外は自動的に削除する", "性別や年齢など保護されるべき属性や、その代理となりうる項目がモデルの判断に不当に影響していないかを確認する", "営業担当者にスコアの寄与要因を示し、AIがなぜその評価をしたかを理解できるようにする"], "answer": [3, 4], "explanation": "責任あるAIでは、学習データや項目に含まれる偏り（バイアス）を確認・軽減し、AIの判断根拠を利用者に示す透明性を確保することが重要である。これにより不公平な扱いを防ぎ、利用者が適切にAIの結果を判断できる。", "choiceNotes": ["透明性に反し、利用者がAIを適切に使えなくなる。", "偏ったデータは過去の不公平を再生産する。", "人の判断を排除したデータ削除は不適切である。", "バイアスの確認・軽減は責任あるAIの基本である。", "寄与要因の提示は透明性の確保につながる。"], "ref": "Trailhead: 責任あるAI開発 / Salesforce の信頼できるAIの原則"}, {"id": "SL-001", "domain": "セールスライフサイクル", "topic": "複数販売プロセスとレコードタイプ", "q": "ある製造業の企業では、新規製品販売と保守契約更新の2つの事業があり、それぞれ商談のフェーズ構成が大きく異なる。営業担当者が商談を作成するときに、事業に応じたフェーズだけが選択できるようにしたい。コンサルタントは何を推奨すべきか？", "choices": ["事業ごとに販売プロセスを作成し、それぞれを別の商談レコードタイプに割り当てて、適切なプロファイルにレコードタイプを付与する", "フェーズ選択リストを事業ごとに別のカスタム項目として作成し、ページレイアウトで出し分ける", "入力規則を作成し、事業と一致しないフェーズを保存時にエラーにする", "商談の項目レベルセキュリティでフェーズ項目の参照可能なユーザーを事業ごとに制限する"], "answer": [0], "explanation": "販売プロセスは商談のフェーズ選択リスト値の部分集合を定義する仕組みで、商談レコードタイプに割り当てて使用する。事業ごとに販売プロセスとレコードタイプを用意し、ユーザーのプロファイルにレコードタイプを付与することで、表示されるフェーズを出し分けられる。", "choiceNotes": ["正解。販売プロセスとレコードタイプの組み合わせが標準的な方法である。", "標準のフェーズ項目と売上予測・確度の連動が失われ、保守性も低い。", "エラーで防ぐだけで、選択肢自体は絞り込めず利用者体験が悪い。", "項目レベルセキュリティは項目全体の表示可否を制御するもので、選択リスト値は絞り込めない。"], "ref": "販売プロセスの作成 / 商談のレコードタイプ（Salesforce ヘルプ）"}, {"id": "SL-002", "domain": "セールスライフサイクル", "topic": "フェーズと確度・売上予測カテゴリ", "q": "ある企業では、営業担当者が商談のフェーズを更新しても、売上予測カテゴリがフェーズに合った値になっていないことが多い。営業部長は、フェーズを変更したら売上予測カテゴリが自動的に適切な値になるようにしたいと考えている。コンサルタントは何を推奨すべきか？", "choices": ["売上予測カテゴリを必須項目にし、営業担当者に毎回選択させる", "商談のフェーズ選択リスト値ごとに、対応する売上予測カテゴリを設定する", "売上予測カテゴリ項目の既定値を「パイプライン」に設定する", "確度（%）項目を非表示にし、売上予測カテゴリのみを使用する"], "answer": [1], "explanation": "商談のフェーズ選択リストの各値には、確度（%）と売上予測カテゴリの既定値を設定できる。フェーズが変更されると、その値に紐づく確度と売上予測カテゴリが自動的にセットされる。", "choiceNotes": ["手入力に依存するため、不整合の解消にならない。", "正解。フェーズ値ごとに売上予測カテゴリを定義すると自動で設定される。", "全商談が同じ値になり、フェーズとの対応関係が作れない。", "確度の表示有無は売上予測カテゴリの自動設定とは無関係である。"], "ref": "商談のフェーズ選択リスト値の編集 / 売上予測カテゴリ（Salesforce ヘルプ）"}, {"id": "SL-003", "domain": "セールスライフサイクル", "topic": "リードプロセス", "q": "ある企業では、展示会で獲得したリードと、Webからの問い合わせリードとで、使用するリード状況の値を分けたいと考えている。展示会リードには「名刺交換済み」、Webリードには「資料請求」といった状況を使わせたい。コンサルタントは何を推奨すべきか？", "choices": ["リードの割り当てルールで、リードソースに応じてリード状況を変更する", "リード状況とは別に、リードソースごとのカスタム選択リスト項目を2つ作成する", "それぞれのリード状況の値を含むリードプロセスを2つ作成し、リードのレコードタイプに割り当てる", "リードキューを2つ作成し、キューごとにリード状況の値を制限する"], "answer": [2], "explanation": "リードプロセスはリード状況の選択リスト値の部分集合を定義し、リードのレコードタイプに割り当てて使う。チャネルごとにリードプロセスとレコードタイプを用意すれば、使用できる状況値を分けられる。", "choiceNotes": ["割り当てルールは所有者の割り当てを行うもので、使用可能な状況値を制限する機能ではない。", "標準のリード状況項目や取引開始の仕組みと連動せず、データが分散する。", "正解。リードプロセスとレコードタイプでリード状況の値を出し分けられる。", "キューにはリード状況の値を制限する機能はない。"], "ref": "リードプロセスの作成（Salesforce ヘルプ）"}, {"id": "SL-004", "domain": "セールスライフサイクル", "topic": "リード取引開始と項目の対応付け", "q": "ある企業では、リードに「導入予定時期」というカスタム項目を作成している。リードの取引開始後、この値が作成された商談の同等のカスタム項目に引き継がれていないと営業担当者から報告があった。コンサルタントは何を推奨すべきか？", "choices": ["取引開始後にレコードトリガーフローで商談を更新する", "リードの取引開始画面のページレイアウトに項目を追加する", "商談の項目を数式項目にしてリードの値を参照する", "リードの項目の対応付けで、リードのカスタム項目を商談のカスタム項目に対応付ける"], "answer": [3], "explanation": "リードのカスタム項目は、オブジェクトマネージャーの「リード項目の対応付け」で、取引先・取引先責任者・商談の互換性のあるカスタム項目に対応付けることで取引開始時に値が引き継がれる。標準機能で対応できるため自動化は不要である。", "choiceNotes": ["実現は可能だが、標準の項目対応付けで済む要件に対して過剰な実装である。", "画面レイアウトを変えても値の引き継ぎは行われない。", "取引開始後は商談からリードへの参照関係がなく、数式で参照できない。", "正解。リード項目の対応付けで取引開始時に値が引き継がれる。"], "ref": "取引開始されたリードのカスタムリード項目の対応付け（Salesforce ヘルプ）"}, {"id": "SL-005", "domain": "セールスライフサイクル", "topic": "リード割り当てルール", "q": "ある企業では、Web-to-リードで作成されるリードを、都道府県に応じて東日本チームと西日本チームのキューに自動で振り分けたい。どちらにも該当しないリードはマーケティング担当者が受け取るようにしたい。コンサルタントが推奨すべき対応はどれか？（2つ選択してください）", "choices": ["東日本用と西日本用の2つのリード割り当てルールを作成し、両方を有効化する", "1つのリード割り当てルールに都道府県を条件とした複数のエントリを作成し、評価順序を設定する", "リード設定で、どのエントリにも一致しない場合の既定のリード所有者を指定する", "リードの共有ルールを作成し、都道府県に応じてキューにアクセス権を付与する", "取引先の割り当てルールを作成して、リードの所有者を決定する"], "answer": [1, 2], "explanation": "リード割り当てルールは同時に1つしか有効化できず、1つのルール内のエントリが順序どおりに評価され、最初に一致したエントリで割り当てられる。どのエントリにも一致しない場合は、リード設定で指定した既定のリード所有者に割り当てられる。", "choiceNotes": ["リード割り当てルールは一度に1つしか有効にできない。", "正解。1つのルール内の複数エントリで振り分けを定義する。", "正解。一致しないリードは既定のリード所有者に割り当てられる。", "共有ルールはアクセス権を付与するだけで、所有者は変わらない。", "取引先の割り当てルールはリードの所有者決定には使用されない。"], "ref": "割り当てルールの設定 / リードの設定（Salesforce ヘルプ）"}, {"id": "SL-006", "domain": "セールスライフサイクル", "topic": "Web-to-リードとスパム対策", "q": "ある企業では、Webサイトに設置したWeb-to-リードフォームから、ボットによると思われる無意味なリードが大量に登録されている。フォームの仕組みは維持したまま、スパム登録を減らしたい。コンサルタントは何を推奨すべきか？", "choices": ["Web-to-リードの設定でreCAPTCHAによる検証を必須にし、生成されたHTMLをWebサイトに再設置する", "リードの重複ルールを作成し、重複するリードをブロックする", "リードの割り当てルールで、スパムリードを専用キューに振り分ける", "Web-to-リードを無効化し、問い合わせはすべてメールで受け付ける"], "answer": [0], "explanation": "Web-to-リードではフォーム生成時にreCAPTCHA検証を必須にするオプションがあり、ボットによる送信を抑制できる。設定を有効にした後は、生成されたHTMLをWebサイト側に反映する必要がある。", "choiceNotes": ["正解。reCAPTCHAによりボットからの送信を抑制できる。", "内容が異なるスパムは重複と判定されず、根本的な対策にならない。", "登録自体は防げず、データ量の問題が残る。", "フォームを維持するという要件に反する。"], "ref": "Web-to-リードの設定 / reCAPTCHA（Salesforce ヘルプ）"}, {"id": "SL-007", "domain": "セールスライフサイクル", "topic": "重複ルール", "q": "ある企業では、インサイドセールスが新しいリードを作成するとき、すでに顧客として登録済みの取引先責任者と同一人物であることに気付かずに登録してしまうことがある。作成自体は許可しつつ、既存の取引先責任者と重複する可能性があることを担当者に知らせたい。コンサルタントは何を推奨すべきか？", "choices": ["取引先責任者オブジェクトに入力規則を作成し、同じメールアドレスのリード作成を防ぐ", "リードの割り当てルールで、既存顧客のリードを営業担当者に割り当てる", "取引先責任者用の一致ルールを含むリードの重複ルールを作成し、作成時のアクションを「許可」として警告を表示する", "リードのメールアドレス項目を一意項目に設定する"], "answer": [2], "explanation": "リードの重複ルールには、リード同士だけでなく取引先責任者と比較する一致ルールも含めることができる。アクションを「許可」にして警告を有効にすれば、作成を妨げずに重複の可能性を通知できる。", "choiceNotes": ["取引先責任者の入力規則はリードの作成時には評価されない。", "割り当ては所有者を決めるだけで、重複の通知にはならない。", "正解。リードの重複ルールで取引先責任者との一致を検出し警告できる。", "標準のメール項目には一意属性を設定できない。仮にカスタム項目で一意にしてもリード同士の重複しか防げず、取引先責任者との重複は検出できない。"], "ref": "重複ルール / 一致ルール（Salesforce ヘルプ）"}, {"id": "SL-008", "domain": "セールスライフサイクル", "topic": "キャンペーンインフルエンス", "q": "ある企業のマーケティング部門では、1つの商談に複数のキャンペーンが関与している場合に、最初の接点・最後の接点・均等配分などのモデルで収益への貢献度を比較したいと考えている。コンサルタントは何を推奨すべきか？", "choices": ["商談の主キャンペーンソース項目のみを使用してレポートを作成する", "カスタマイズ可能なキャンペーンインフルエンスを有効化し、アトリビューションモデルを設定する", "キャンペーンごとに商談のカスタム参照項目を追加する", "キャンペーン階層を作成し、親キャンペーンで集計する"], "answer": [1], "explanation": "カスタマイズ可能なキャンペーンインフルエンスでは、1つの商談に影響した複数のキャンペーンに対して、アトリビューションモデルに基づき収益の貢献度を配分できる。主キャンペーンソースモデルに加え、Account Engagement 利用時は最初の接点・最後の接点・均等配分の追加モデルを有効化でき、カスタムモデルも作成できる。", "choiceNotes": ["主キャンペーンソースは1つのキャンペーンしか記録できず、複数の貢献を比較できない。", "正解。アトリビューションモデルで複数キャンペーンの貢献を配分できる。", "拡張性がなく、配分ロジックも自前で作る必要がある。", "キャンペーン階層は親子間の集計であり、商談へのアトリビューションとは異なる。"], "ref": "カスタマイズ可能なキャンペーンインフルエンス（Salesforce ヘルプ）"}, {"id": "SL-009", "domain": "セールスライフサイクル", "topic": "キャンペーン階層", "q": "ある企業では、年間の「新製品ローンチ」施策の下に、セミナー、Web広告、メール配信といった個別のキャンペーンを実施している。施策全体のリード数や獲得商談額を、個別キャンペーンの実績を合算して確認したい。コンサルタントは何を推奨すべきか？", "choices": ["個別キャンペーンを削除し、すべてのメンバーを1つのキャンペーンに統合する", "個別キャンペーンのレポートをExcelに出力して手作業で合算する", "個別キャンペーンに共通のキャンペーン種別を設定し、種別でグループ化する", "「新製品ローンチ」を親キャンペーンとし、個別キャンペーンを子キャンペーンとして関連付ける"], "answer": [3], "explanation": "キャンペーン階層を使うと、子キャンペーンの実績（リード数、商談数、商談金額など）が親キャンペーンの階層集計項目に集計される。施策単位と個別施策単位の両方で効果を把握できる。", "choiceNotes": ["個別施策ごとの効果測定ができなくなる。", "手作業であり継続的な運用に向かない。", "レポート上の分類はできるが、親施策の実績として標準の階層集計は得られない。", "正解。キャンペーン階層で子キャンペーンの実績が親に集計される。"], "ref": "キャンペーン階層（Salesforce ヘルプ）"}, {"id": "SL-010", "domain": "セールスライフサイクル", "topic": "商談チームとデフォルト商談チーム", "q": "ある企業では、各営業担当者が決まった技術営業およびアシスタントと組んで活動している。営業担当者が商談を作成するたびに、同じメンバーを手作業で商談チームに追加する手間を省きたい。コンサルタントは何を推奨すべきか？", "choices": ["各営業担当者にデフォルト商談チームを設定し、作成した商談に自動で追加するオプションを有効にする", "技術営業とアシスタントを営業担当者と同じロールに変更する", "商談の共有ルールで、営業担当者が所有する商談を技術営業に共有する", "商談のキューを作成し、チームメンバーをキューに追加する"], "answer": [0], "explanation": "商談チームを有効にすると、ユーザーはデフォルト商談チームを定義でき、作成した商談に自動で追加するよう設定できる。これにより毎回の手作業を省きつつ、チームロールとアクセス権も一貫して設定できる。", "choiceNotes": ["正解。デフォルト商談チームで作成時に自動追加できる。", "ロールの変更は組織構造を歪め、チームメンバーとしての記録にもならない。", "アクセス権は付与されるが、商談チームとしての役割の記録にはならない。", "キューはレコードの所有者として使うもので、チームの代替にならない。"], "ref": "商談チーム / デフォルト商談チームの設定（Salesforce ヘルプ）"}, {"id": "SL-011", "domain": "セールスライフサイクル", "topic": "商談分割", "q": "ある企業では、主担当と副担当の営業担当者が商談の売上実績を按分して評価されている。また、プリセールスエンジニアには、売上とは別に関与した商談の金額全体を実績として付与したい。コンサルタントが説明すべき内容はどれか？（2つ選択してください）", "choices": ["商談分割を有効にするには、商談チームが有効になっている必要がある", "収益分割と重複分割は、どちらも合計が100%でなければならない", "収益分割は合計100%となり、営業担当者間の売上の按分に使用する", "重複分割は商談の所有者以外には設定できない", "重複分割は合計が100%を超えてもよく、プリセールスなどの補助的な貢献の評価に使用できる"], "answer": [2, 4], "explanation": "収益分割は商談金額の合計100%を商談チームメンバー間で按分するもので、売上実績の配分に使う。重複分割は合計100%の制約がなく、売上に直接計上されない補助的な貢献を評価する用途に使える。なお、商談分割の利用には商談チームの有効化が前提となる。", "choiceNotes": ["記述自体は正しいが、問われている2つの分割タイプの使い分けを説明する内容ではない。", "重複分割には合計100%の制約がない。", "正解。収益分割は合計100%で売上を按分する。",

主要取引"}, {"id": "PA3-003", "domain": "Agentforce Sales の実践的な応用", "topic": "ホームページの割り当て", "q": "同じ Sales アプリを使うインサイドセールスとフィールドセールスで、ホームページに表示するコンポーネントを分けたい。両者はプロファイルが異なる。コンサルタントが推奨すべき設定はどれか。", "choices": ["2種類のホームページを作成し、Lightning アプリケーションビルダーの有効化で「アプリケーションとプロファイル」の組み合わせごとに割り当てる", "2種類のホームページを作成し、片方を組織のデフォルト、もう片方をアプリケーションのデフォルトに設定する", "ホームページを1つだけ作成し、ページレイアウトの割り当てでプロファイルごとに切り替える", "2つの Lightning アプリケーションを作成し、それぞれのナビゲーション項目からホームを削除する"], "answer": [0], "explanation": "Lightning のホームページは、組織のデフォルト、アプリケーションのデフォルト、アプリケーションとプロファイルの組み合わせ、の3段階で割り当てられる。同じアプリでプロファイルごとに分けるには、アプリケーションとプロファイルの組み合わせで割り当てる。", "choiceNotes": ["正解。同一アプリ内でプロファイルごとに異なるホームページを表示できる。", "組織デフォルトとアプリデフォルトだけでは、同じアプリ内でプロファイル別に分けられない。", "ページレイアウトはレコード詳細の項目配置であり、ホームページの割り当てには使わない。", "ホームを削除しても要件は満たせず、アプリを分ける必要もない。"], "ref": "Lightning アプリケーションビルダー ホームページの有効化"}, {"id": "PA3-004", "domain": "Agentforce Sales の実践的な応用", "topic": "リストビューの共有範囲", "q": "営業企画担当者が「今四半期完了予定の商談」というリストビューを作成し、関東営業部のロールのユーザーだけに公開したいが、共有範囲の設定が表示されない。考えられる原因と対応として正しいものを2つ選択してください。", "choices": ["担当者に「公開リストビューの管理」権限がないため、権限セットで付与する", "公開リストビューの共有先として、特定の公開グループやロールを指定できる", "リストビューは常に作成者本人だけが利用でき、他ユーザーと共有できない", "共有範囲を設定するには、商談の組織の共有設定を「公開/参照・更新可能」にする必要がある", "リストビューを共有するには、同じ条件のレポートを作成して公開フォルダに保存する必要がある"], "answer": [0, 1], "explanation": "他のユーザーに見えるリストビューを作成・編集するには「公開リストビューの管理」権限が必要である。共有範囲は「自分のみ」「すべてのユーザー」「特定のユーザーグループ」から選べ、公開グループやロールを指定できる。なおリストビューを共有しても、表示されるのは各ユーザーがアクセス権を持つレコードだけである。", "choiceNotes": ["正解。権限がないと自分専用のリストビューしか作れない。", "正解。特定のグループやロールを共有先にできる。", "誤り。権限があれば他ユーザーにもリストビューを公開できる。", "誤り。リストビューの共有とレコードの組織の共有設定は別であり、変更は不要。", "誤り。リストビューの共有にレポートは関係しない。"], "ref": "リストビューの作成と共有"}, {"id": "PA3-005", "domain": "Agentforce Sales の実践的な応用", "topic": "リストビューのグラフ", "q": "営業担当者が、自分のリードのリストビューを見ながら、リードソース別の件数をその場で視覚的に把握したいと考えている。レポートを作成せずに実現できる方法はどれか。", "choices": ["リストビューのグラフ機能を使い、リードソースでグループ化したグラフを表示する", "リストビューの表示形式をかんばんに切り替え、リードソースで列を分ける", "リストビューの列にリードソースを追加し、件数を目視で数える", "リードオブジェクトにリードソースごとの件数を保持する積み上げ集計項目を作成する"], "answer": [0], "explanation": "Lightning Experience のリストビューにはグラフ機能があり、表示中のリストビューのレコードを項目でグループ化して件数や合計をグラフ表示できる。レポートを作成せずに、その場で傾向を把握したい場面に向く。", "choiceNotes": ["正解。リストビューのグラフで、表示中のレコードを集計して可視化できる。", "リードソースで列を分けること自体はできるが、レコードをカードで並べる表示であり、件数を比較するグラフにはならない。", "目視での集計は非効率で、視覚的な把握という要件を満たさない。", "積み上げ集計項目は主従関係の親に作るもので、リードには作成できない。"], "ref": "リストビューのグラフ"}, {"id": "PA3-006", "domain": "Agentforce Sales の実践的な応用", "topic": "一括クイックアクション", "q": "インサイドセールスチームは、展示会後に取り込んだリードのうち数十件を選び、まとめて「状況」と「評価」を同じ値に更新したい。データローダは使わず、日常の画面操作の中で行いたい。最も適切な方法はどれか。", "choices": ["レコード更新タイプのオブジェクト固有アクションを作成し、一括クイックアクションとしてリードのリストビューに追加する", "リードのページレイアウトの「Salesforce モバイルおよび Lightning Experience のアクション」にアクションを追加する", "グローバルアクションを作成し、ホームのパブリッシャーレイアウトに追加する", "リードのリストビューでインライン編集を使い、1件ずつ値を変更する"], "answer": [0], "explanation": "一括クイックアクションを使うと、リストビューで選択した複数レコードに対して作成または更新タイプのクイックアクションを一度に実行できる。対象のアクションをリストビューのアクションとして追加することで、画面操作の中で一括更新が行える。", "choiceNotes": ["正解。リストビューで複数のリードを選択し、まとめて更新できる。", "レコードページへの追加では、1件ずつしか実行できない。", "グローバルアクションはレコードの作成などに使い、既存リードの一括更新はできない。", "1件ずつの編集では数十件の処理に手間がかかり、要件に合わない。"], "ref": "一括クイックアクション"}, {"id": "PA3-007", "domain": "Agentforce Sales の実践的な応用", "topic": "取引先の一括移行", "q": "退職する営業担当者が所有する取引先を、業種が「製造」のものに絞って後任者へ移したい。あわせて、それらの取引先に関連する進行中の商談も後任者に移したい。最も効率的な標準機能はどれか。", "choices": ["設定の「レコードの一括譲渡」で、元の所有者と業種を条件に取引先を絞り込み、後任者へまとめて譲渡する", "取引先のリストビューで1件ずつ所有者を変更する", "データインポートウィザードで取引先を更新し、所有者を変更する", "取引先チームに後任者を追加し、アクセス権を「参照・更新可能」にする"], "answer": [0], "explanation": "レコードの一括譲渡ツールでは、現在の所有者と項目条件で取引先を絞り込み、所有者をまとめて変更できる。取引先の譲渡時には、元の所有者が所有する進行中の商談もあわせて新しい所有者に譲渡される。さらにオプションで、取引先所有者以外が所有する進行中の商談や、完了した商談も譲渡対象にできる。", "choiceNotes": ["正解。条件で絞り込んだ取引先を一括譲渡でき、元の所有者の進行中の商談もあわせて譲渡される。", "1件ずつの変更は非効率で、関連商談の扱いも個別作業になる。", "対象取引先の抽出と CSV の準備が必要で、条件指定だけで画面上から一括譲渡できる標準ツールより手間がかかる。", "チームへの追加は共有であり、所有者は変わらない。"], "ref": "レコードの一括譲渡"}, {"id": "PA3-008", "domain": "Agentforce Sales の実践的な応用", "topic": "グローバルアクションとオブジェクト固有アクション", "q": "営業担当者が取引先レコードを開いた状態で商談を作成した際、作成した商談の取引先が空欄になってしまうと報告があった。使用しているのは「商談を作成」という名前のクイックアクションである。原因として最も考えられるものはどれか。", "choices": ["このアクションがグローバルアクションとして作成されており、表示中のレコードとの関連付けが自動で行われない", "このアクションがオブジェクト固有アクションとして作成されており、親レコードとの関連付けが行われない", "商談のページレイアウトで取引先名が必須項目になっていない", "商談の組織の共有設定が「非公開」になっている"], "answer": [0], "explanation": "グローバルアクションで作成したレコードは、アクションを実行したレコードと自動的には関連付けられない。取引先のオブジェクト固有アクションとして作成すれば、作成した商談は表示中の取引先と自動で関連付けられる。", "choiceNotes": ["正解。グローバルアクションは表示中のレコードと自動で関連付けない。", "誤り。オブジェクト固有アクションは親レコードと自動で関連付ける。", "必須かどうかは、取引先が自動で入るかどうかとは関係がない。", "共有設定はアクセス権の問題で、取引先が空欄になる原因ではない。"], "ref": "グローバルアクションとオブジェクト固有アクション"}, {"id": "PA3-009", "domain": "Agentforce Sales の実践的な応用", "topic": "レコード更新アクションの定義済み値", "q": "営業担当者が商談を失注にするとき、フェーズを「Closed Lost」にし、失注理由だけを入力すればよいようにしたい。担当者が入力する項目をできるだけ減らしたい場合、最も適切な設定はどれか。", "choices": ["商談の「レコードを更新」タイプのオブジェクト固有アクションを作成し、フェーズに定義済みの値を設定して、レイアウトには失注理由だけを置く", "失注理由を必須にする入力規則を作成し、担当者に編集画面からフェーズを変更させる", "フェーズを Closed Lost に更新するグローバルアクションを作成する", "失注専用のレコードタイプを作成し、ページレイアウトで失注理由を必須にする"], "answer": [0], "explanation": "レコード更新タイプのクイックアクションでは、アクションのレイアウトに表示する項目を絞り込み、定義済みの項目値を設定できる。フェーズを定義済みの値で更新し、失注理由だけを入力させれば、少ない操作で失注処理を行える。", "choiceNotes": ["正解。定義済みの値と最小限のレイアウトで入力項目を減らせる。", "入力規則は入力漏れを防げるが、入力項目を減らすことにはならない。", "グローバルアクションでは既存の商談レコードは更新できない。", "レコードタイプを分けても操作は減らず、運用が複雑になる。"], "ref": "クイックアクションの定義済み項目値"}, {"id": "PA3-010", "domain": "Agentforce Sales の実践的な応用", "topic": "レコードタイプとページレイアウトの割り当て", "q": "商談には「新規」と「更新」の2つのレコードタイプがある。営業担当者プロファイルでは、更新商談のときだけ「前回契約番号」項目を表示したい。営業事務プロファイルでは、どちらのレコードタイプでも同じ項目を表示したい。この要件を満たすページレイアウトの設定として正しいものはどれか。", "choices": ["ページレイアウトの割り当てで、プロファイルとレコードタイプの組み合わせごとに表示するレイアウトを指定する", "プロファイルごとに1つのページレイアウトしか割り当てられないため、営業担当者用にプロファイルを2つに分ける", "レコードタイプごとに1つのページレイアウトしか割り当てられないため、営業事務用にレコードタイプを追加する", "前回契約番号の項目レベルセキュリティを、レコードタイプごとに設定する"], "answer": [0], "explanation": "ページレイアウトは、プロファイルとレコードタイプの組み合わせごとに割り当てられる。そのため同じプロファイルでもレコードタイプによって異なるレイアウトを使い、別のプロファイルでは同じレイアウトを使う、といった設定ができる。", "choiceNotes": ["正解。プロファイルとレコードタイプの組み合わせごとにレイアウトを指定できる。", "誤り。プロファイル内でレコードタイプごとに異なるレイアウトを割り当てられる。", "誤り。レコードタイプ内でもプロファイルごとに異なるレイアウトを割り当てられる。", "項目レベルセキュリティはプロファイル・権限セット単位で、レコードタイプごとには設定できない。"], "ref": "ページレイアウトの割り当て"}, {"id": "PA3-011", "domain": "Agentforce Sales の実践的な応用", "topic": "レコードタイプ別の選択リスト値", "q": "取引先の「業種」選択リストには全事業部の値が定義されているが、公共事業部の担当者には官公庁向けの値だけを表示し、民間事業部の担当者には民間向けの値だけを表示したい。値そのものは組織で共通管理したい。最も適切な方法はどれか。", "choices": ["事業部ごとに取引先のレコードタイプを作成し、レコードタイプごとに使用できる業種の選択リスト値を選ぶ", "事業部ごとに別の業種選択リスト項目を作成し、項目レベルセキュリティで出し分ける", "業種を従属項目にし、ユーザーのロールを制御項目にする", "入力規則で、事業部に合わない業種値が選ばれたときにエラーにする"], "answer": [0], "explanation": "レコードタイプでは、選択リスト項目ごとに使用できる値のサブセットを指定できる。値の定義は1つの項目で共通管理しつつ、事業部ごとのレコードタイプで表示される値を絞り込める。", "choiceNotes": ["正解。レコードタイプ別に選択リスト値を絞り込める。", "項目を分けると値の管理が二重になり、共通管理の要件に反する。", "ロールは項目ではないため、依存関係の制御項目にはできない。", "入力規則はエラーで止めるだけで、選択肢そのものは絞り込まれない。"], "ref": "レコードタイプの選択リスト値"}, {"id": "PA3-012", "domain": "Agentforce Sales の実践的な応用", "topic": "選択リストの依存関係の制御項目", "q": "商談に「製品カテゴリ」というカスタム選択リストを作り、別の項目の値に応じて選択できる値を絞り込みたい。依存関係の制御項目として使用できるものを2つ選択してください。", "choices": ["カスタムのチェックボックス項目", "標準の選択リスト項目（例: 商談の種別）", "カスタムの複数選択リスト項目", "数式項目", "カスタムのテキスト項目"], "answer": [0, 1], "explanation": "項目の依存関係では、選択リストとチェックボックスを制御項目として使用できる。標準の選択リスト項目も制御項目にはなれるが、従属項目にはできない。複数選択リストは従属項目にはなれるが制御項目にはできず、数式項目やテキスト項目はどちらにも使えない。", "choiceNotes": ["正解。チェックボックスは制御項目に使用できる。", "正解。標準の選択リスト項目は制御項目として使用できる。", "誤り。複数選択リストは制御項目には使用できない。", "誤り。数式項目は依存関係に使用できない。", "誤り。テキスト項目は依存関係に使用できない。"], "ref": "選択リストの項目の依存関係"}, {"id": "PA3-013", "domain": "Agentforce Sales の実践的な応用", "topic": "検索レイアウト", "q": "営業担当者がグローバル検索で取引先を探すとき、同名の取引先が多く、検索結果に取引先名しか表示されないため見分けがつかないという声が上がっている。最も適切な対応はどれか。", "choices": ["オブジェクトマネージャで取引先の検索レイアウトを編集し、都道府県や取引先番号などの列を検索結果に追加する", "取引先のコンパクトレイアウトに都道府県と取引先番号を追加する", "取引先のページレイアウトの先頭セクションに都道府県と取引先番号を配置する", "取引先のリストビューに都道府県と取引先番号の列を追加する"], "answer": [0], "explanation": "検索結果に表示される列は、オブジェクトごとの検索レイアウトで設定する。検索結果に識別しやすい項目を追加すれば、同名のレコードを見分けやすくなる。", "choiceNotes": ["正解。検索レイアウトで検索結果の列を追加できる。", "コンパクトレイアウトはレコードの強調表示やモバイルで使われ、検索結果の列ではない。", "ページレイアウトはレコードを開いた後の表示で、検索結果には影響しない。", "リストビューの列は検索結果には反映されない。"], "ref": "検索レイアウト"}, {"id": "PA3-014", "domain": "Agentforce Sales の実践的な応用", "topic": "ルックアップ検索条件", "q": "商談に「決裁者」という取引先責任者へのカスタム参照項目がある。営業担当者が誤って、別の会社の取引先責任者を選んでしまうことがある。商談の取引先に所属する取引先責任者だけを選べるようにしたい。最も適切な方法はどれか。", "choices": ["参照項目に、取引先責任者の取引先が商談の取引先と一致することを条件とする必須のルックアップ検索条件を設定する", "取引先責任者の検索レイアウトに取引先名の列を追加する", "商談の取引先責任者の役割を必須にする", "取引先責任者の組織の共有設定を「親レコードに連動」にする"], "answer": [0], "explanation": "ルックアップ検索条件を使うと、参照項目で選べるレコードを条件で絞り込める。条件を必須にすれば、条件に合わないレコードは保存できなくなるため、別会社の取引先責任者を選ぶ誤りを防げる。", "choiceNotes": ["正解。必須のルックアップ検索条件で選択肢を絞り込み、誤選択を防げる。", "列を追加すると見分けやすくはなるが、誤った選択は防げない。", "取引先責任者の役割は別の機能で、決裁者項目の選択肢は絞り込めない。", "共有設定はアクセス権であり、参照項目の選択肢を商談の取引先に絞り込むものではない。"], "ref": "ルックアップ検索条件"}, {"id": "PA3-015", "domain": "Agentforce Sales の実践的な応用", "topic": "項目レベルセキュリティとページレイアウト", "q": "商談の「粗利率」項目について、営業担当者には参照だけを許可し、営業事務には非表示にしたい。ページレイアウトは両者で共通である。この要件と動作について正しいものを2つ選択してください。", "choices": ["営業事務の項目レベルセキュリティで粗利率を非表示にすれば、ページレイアウトに配置されていても表示されない", "営業担当者の項目レベルセキュリティで粗利率を参照のみにすれば、ページレイアウトで編集可能になっていても編集できない", "ページレイアウトで粗利率を参照のみにすれば、API やデータローダからの更新も防げる", "ページレイアウトから粗利率を外せば、レポートや検索でも値が見えなくなる", "項目レベルセキュリティはページレイアウトより優先度が低いため、レイアウトの設定が適用される"], "answer": [0, 1], "explanation": "項目のアクセス権は項目レベルセキュリティとページレイアウトの両方で決まり、より制限の厳しい設定が適用される。項目レベルセキュリティはレポート、検索、API などすべての経路で有効だが、ページレイアウトはそのレイアウトの画面表示にしか影響しない。", "choiceNotes": ["正解。項目レベルセキュリティで非表示ならレイアウトに関係なく表示されない。", "正解。より厳しい項目レベルセキュリティの参照のみが優先される。", "誤り。ページレイアウトの設定は API による更新には適用されない。", "誤り。レイアウトから外しても、レポートや検索では値が見える。", "誤り。より厳しい設定が適用されるため、項目レベルセキュリティの制限が優先される。"], "ref": "項目レベルセキュリティとページレイアウト"}, {"id": "PA3-016", "domain": "Agentforce Sales の実践的な応用", "topic": "商談の取引先責任者の役割", "q": "大型商談では、決裁者、技術評価者、購買担当など複数の顧客側関係者が関わる。営業部長は、商談ごとに誰がどの立場で関与しているか、そして主な窓口が誰かを記録し、後でレポートで分析したいと考えている。最も適切な標準機能はどれか。", "choices": ["商談の取引先責任者の役割を使い、役割と「主」のフラグを記録する", "商談に取引先責任者への参照項目を役割の数だけ作成する", "取引先チームに顧客側の関係者を追加する", "商談チームに顧客側の関係者を追加する"], "answer": [0], "explanation": "商談の取引先責任者の役割では、1つの商談に複数の取引先責任者を役割付きで関連付け、そのうち1人を主として指定できる。この情報はレポートで分析できるため、購買関係者の把握に適している。", "choiceNotes": ["正解。役割と主の指定を記録し、レポートで分析できる。", "参照項目の追加は人数や役割の増減に対応できず、保守しにくい。", "取引先チームは社内ユーザーのチームで、顧客側の取引先責任者は追加できない。", "商談チームも社内ユーザーのチームで、顧客側の関係者を記録するものではない。"], "ref": "商談の取引先責任者の役割"}, {"id": "PA3-018", "domain": "Agentforce Sales の実践的な応用", "topic": "メールの追跡", "q": "営業担当者が Salesforce から送信した提案メールについて、顧客がいつ開封したかを活動タイムラインで確認したい。管理者が行うべき設定と注意点として正しいものはどれか。", "choices": ["活動設定でメールの追跡を有効にする。開封の追跡は HTML 形式のメールが対象になる", "Einstein 活動キャプチャを有効にすると、すべてのメールの開封が自動で追跡される", "メールテンプレートに開封追跡用の差し込み項目を追加する", "メールの追跡は Outlook 連携を導入した場合にだけ使用できる"], "answer": [0], "explanation": "メールの追跡を有効にすると、Salesforce から送信した HTML 形式のメールについて開封の状況を確認できる。テキスト形式のメールは開封を追跡できない点に注意する。", "choiceNotes": ["正解。メールの追跡を有効にし、HTML 形式のメールで開封を確認する。", "活動キャプチャはメールや行動の同期機能で、開封追跡の有効化とは別である。", "開封追跡は差し込み項目で実現するものではない。", "Salesforce から送信したメールで追跡でき、Outlook 連携は前提ではない。"], "ref": "メールの追跡"}, {"id": "PA3-019", "domain": "Agentforce Sales の実践的な応用", "topic": "リストメール", "q": "営業担当者が、セミナーに参加した既存顧客の取引先責任者約30名に、それぞれの氏名を差し込んだお礼メールを送りたい。マーケティングオートメーションは導入していない。担当者自身が Salesforce 上で行える方法として最も適切なものはどれか。", "choices": ["取引先責任者のリストビューで対象者を選択し、リストメールでテンプレートを使って送信する", "1人ずつ取引先責任者を開き、メール送信アクションで送る", "全員を宛先に入れた1通のメールを作成し、Outlook から送る", "メールアラートを使うフローを作成し、管理者に実行してもらう"], "answer": [0], "explanation": "リストメールを使うと、リストビューで選んだ取引先責任者やリードに対し、差し込み項目を含むメールを受信者ごとに個別に送信でき、送信結果は活動として記録される。なおリストメールには送信件数の上限があるため、大規模な配信は Marketing Cloud Account Engagement などマーケティングツールを検討する。", "choiceNotes": ["正解。リストビューから個別の差し込みメールをまとめて送信できる。", "1人ずつの送信は30名では手間がかかる。", "全員を宛先に入れると個別の差し込みができず、宛先が互いに見える問題もある。", "担当者自身が行う要件に反し、単発の送信にフローを作る必要はない。"], "ref": "リストメール"}, {"id": "PA3-020", "domain": "Agentforce Sales の実践的な応用", "topic": "オブジェクトのカレンダー", "q": "営業担当者が、自分の商談の完了予定日を月間カレンダー形式で一覧し、月末に集中している商談を把握したいと考えている。最も適切な方法はどれか。", "choices": ["Lightning のカレンダーで、商談オブジェクトの完了予定日を日付項目とするカレンダーを作成し、自分の商談のリストビューで絞り込む", "完了予定日ごとに行動を作成し、自分のカレンダーに表示する", "商談のレポートを完了予定日で行グループ化する", "商談のリストビューをかんばん表示に切り替え、完了予定日で列を分ける"], "answer": [0], "explanation": "Lightning Experience のカレンダーでは、日付項目を持つオブジェクトからカレンダーを作成でき、リストビューで表示するレコードを絞り込める。商談の完了予定日をカレンダーで表示すれば、時期の偏りを視覚的に把握できる。", "choiceNotes": ["正解。オブジェクトのカレンダーで商談の完了予定日を月間表示できる。", "行動の手作業での作成は二重管理になり、日付変更に追随しない。", "レポートでも集計はできるが、カレンダー形式で一覧するという要件には合わない。", "かんばんで列を分けられるのは選択リスト項目で、日付で列を分けることはできない。"], "ref": "Lightning Experience のカレンダー"}, {"id": "PA3-021", "domain": "Agentforce Sales の実践的な応用", "topic": "カレンダーの共有設定", "q": "ある企業では、営業担当者同士が互いのカレンダーを見て訪問の予定を調整している。しかし顧客名などの予定の内容は見せず、空き時間かどうかだけが分かればよいとしている。この要件に合う設定はどれか。", "choices": ["共有設定のカレンダーの組織の共有設定を、詳細を非表示にする設定にする", "活動の組織の共有設定を「非公開」にする", "営業担当者のプロファイルから行動オブジェクトの参照権限を外す", "行動のページレイアウトから件名と関連先を外す"], "answer": [0], "explanation": "カレンダーの組織の共有設定では、他のユーザーがカレンダーで見られる範囲を、詳細を非表示にする設定から詳細を表示する設定まで選べる。詳細を非表示にすると、予定が入っている時間帯は分かるが内容は表示されない。", "choiceNotes": ["正解。予定の有無だけを見せ、内容は非表示にできる。", "活動の組織の共有設定はレコードへのアクセス制御であり、カレンダーで空き時間だけを見せる設定ではない。", "参照権限を外すと自分の予定も扱えなくなる。", "ページレイアウトはレコード画面の表示で、カレンダー上の表示内容は制御できない。"], "ref": "カレンダーの共有設定"}, {"id": "PA3-022", "domain": "Agentforce Sales の実践的な応用", "topic": "Sales Cloud と Slack の連携", "q": "営業チームは日常のやり取りを Slack で行っており、商談に関する相談がチャットに埋もれて Salesforce の情報と結び付いていない。営業部長は、商談ごとに関係者が Slack で協業しながら、Salesforce の商談情報を Slack 上で参照・更新できるようにしたいと考えている。最も適切な提案はどれか。", "choices": ["Salesforce と Slack を連携するアプリを導入し、商談レコードと関連付けた Slack チャネルで協業できるようにする", "商談の Chatter グループを作成し、Slack の利用をやめるよう指示する", "商談の変更内容をメールで Slack チャネルのアドレスに転送するワークフローを作る", "Slack のやり取りを毎週エクスポートし、商談のメモとして取り込む"], "answer": [0], "explanation": "Salesforce と Slack の連携アプリを使うと、Slack 上で Salesforce のレコードを参照・更新したり、商談の変化の通知を受け取ったりでき、レコードと関連付けたチャネルで関係者が協業できる。既存の Slack の利用習慣を活かしつつ、商談情報との結び付きを確保できる。", "choiceNotes": ["正解。Slack 上で商談情報を参照・更新し、レコードと結び付いた協業ができる。", "利用ツールの変更を強いるもので定着しにくく、要件の Slack での協業と逆行する。", "一方向の通知にとどまり、Slack から商談を更新できない。", "手作業の取り込みは遅く、リアルタイムの協業にならない。"], "ref": "Sales Cloud for Slack"}, {"id": "PA3-023", "domain": "Agentforce Sales の実践的な応用", "topic": "営業資料のライブラリ管理", "q": "マーケティング部が作成した最新の製品カタログや提案書テンプレートを全営業担当者に配布しているが、各自がローカルに保存した古い版が使われてしまう。営業担当者には参照だけを許可し、資料の追加・更新はマーケティング部だけに限定したい。最も適切な方法はどれか。", "choices": ["Salesforce ファイルのライブラリを作成し、マーケティング部に作成者または管理者、営業担当者に閲覧者の権限を付与する", "各営業担当者 const KEY = "afsales-quiz-v1";
let S = load();
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || { q: {}, star: {} }; } catch (e) { return { q: {}, star: {} }; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const st = id => S.q[id] || { c: 0, w: 0, last: null };
const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const app = document.getElementById("app");

function domainStats(d) {
  const qs = QUESTIONS.filter(q => q.domain === d);
  let c = 0, w = 0, seen = 0;
  qs.forEach(q => { const s = st(q.id); if (s.last !== null) { seen++; s.last ? c++ : w++; } });
  return { total: qs.length, c, w, seen, acc: seen ? c / seen : null };
}
// 弱点度: 直近不正解・誤答回数・分野の正答率の低さで重み付け。未回答は中程度。
function weakness(q) {
  const s = st(q.id), ds = domainStats(q.domain);
  const dom = ds.acc === null ? 1 : 1.6 - ds.acc;
  let base;
  if (s.last === null) base = 2;
  else base = (s.last ? 0.4 : 4) + s.w * 1.2 - Math.min(s.c, 3) * 0.3;
  return Math.max(0.1, base) * dom;
}
function weightedPick(pool, n) {
  pool = pool.map(q => ({ q, k: Math.pow(Math.random(), 1 / weakness(q)) }));
  return pool.sort((a, b) => b.k - a.k).slice(0, n).map(x => x.q);
}

function home() {
  clearInterval(timerId);
  const days = Math.ceil((EXAM_DATE - new Date()) / 86400000);
  const wrongs = QUESTIONS.filter(q => st(q.id).last === false);
  const stars = QUESTIONS.filter(q => S.star[q.id]);
  const answered = QUESTIONS.filter(q => st(q.id).last !== null).length;
  app.innerHTML = "";
  app.append($(`<div class="top"><h1>Agentforce Sales コンサルタント 問題集</h1>
    <div class="count">受験目標 11/30 まで <b>${days > 0 ? days : 0}</b> 日</div></div>`));
  const p = $(`<section class="panel"><div class="top"><h2>分野別の到達度</h2><span class="small">${answered} / ${QUESTIONS.length} 問 回答済み</span></div><div class="domains"></div></section>`);
  const dbox = p.querySelector(".domains");
  DOMAINS.forEach(d => {
    const s = domainStats(d.name);
    const cp = s.total ? s.c / s.total * 100 : 0, wp = s.total ? s.w / s.total * 100 : 0;
    dbox.append($(`<div class="drow"><span class="name">${esc(d.name)} <span class="small">配点 ${d.w}%</span></span>
      <span class="num">${s.acc === null ? "—" : Math.round(s.acc * 100) + "%"} · ${s.seen}/${s.total}</span>
      <div class="bar"><i class="c" style="width:${cp}%"></i><i class="w" style="width:${wp}%"></i></div></div>`));
  });
  app.append(p);
  const m = $(`<section class="panel"><h2>出題モード</h2><div class="modes"></div>
    <div class="row"><select id="dom-select" aria-label="分野">${DOMAINS.map(d => `<option>${esc(d.name)}</option>`).join("")}</select>
    <button class="btn" id="dom-go">この分野を全問</button></div></section>`);
  const modes = m.querySelector(".modes");
  const add = (label, sub, fn, cls = "", disabled = false) => { const b = $(`<button class="mode ${cls}" ${disabled ? "disabled" : ""}><strong>${label}</strong><span>${sub}</span></button>`); b.onclick = fn; modes.append(b); };
  add("弱点優先 20問", "間違えた問題と苦手分野を多めに出題", () => start(weightedPick(QUESTIONS, 20), "弱点優先"), "primary");
  add("模擬試験 60問", "105分・配点比率どおり・最後に採点", () => startMock());
  add("ランダム 10問", "全分野からまんべんなく", () => start(shuffle(QUESTIONS).slice(0, 10), "ランダム"));
  add("間違えた問題", `${wrongs.length}問 (直近の回答が不正解)`, () => start(shuffle(wrongs), "復習"), "", !wrongs.length);
  add("ブックマーク", `${stars.length}問`, () => start(shuffle(stars), "ブックマーク"), "", !stars.length);
  add("未回答のみ", `${QUESTIONS.length - answered}問`, () => start(shuffle(QUESTIONS.filter(q => st(q.id).last === null)), "未回答"), "", answered === QUESTIONS.length);
  m.querySelector("#dom-go").onclick = () => { const d = m.querySelector("#dom-select").value; start(shuffle(QUESTIONS.filter(q => q.domain === d)), d); };
  app.append(m);
  const r = $(`<div class="row small">回答履歴はこのブラウザにだけ保存されます。<button class="danger" id="reset">履歴を消去</button></div>`);
  r.querySelector("#reset").onclick = (e) => {
    if (e.target.dataset.armed) { S = { q: {}, star: {} }; save(); home(); }
    else { e.target.dataset.armed = 1; e.target.textContent = "もう一度押すと消去します"; }
  };
  app.append(r);
}

let session = null, timerId = null;
function start(list, label, mock = false) {
  if (!list.length) return;
  session = { list: list.map(q => ({ q, order: shuffle(q.choices.map((_, i) => i)), pick: [], done: false })), i: 0, label, mock, endAt: mock ? Date.now() + 105 * 60000 : 0 };
  if (mock) timerId = setInterval(tick, 1000);
  render();
}
function startMock() {
  const out = [];
  DOMAINS.forEach(d => { const n = Math.round(60 * d.w / 100); out.push(...shuffle(QUESTIONS.filter(q => q.domain === d.name)).slice(0, n)); });
  start(shuffle(out), "模擬試験", true);
}
function tick() {
  const el = document.getElementById("timer"); if (!el) return;
  const left = Math.max(0, session.endAt - Date.now());
  el.textContent = `${String(Math.floor(left / 60000)).padStart(2, "0")}:${String(Math.floor(left / 1000) % 60).padStart(2, "0")}`;
  el.classList.toggle("low", left < 600000);
  if (!left) finish();
}
const isRight = it => { const a = it.q.answer.slice().sort().join(), p = it.pick.slice().sort().join(); return a === p; };
function record(it) {
  const s = st(it.q.id), ok = isRight(it);
  S.q[it.q.id] = { c: s.c + (ok ? 1 : 0), w: s.w + (ok ? 0 : 1), last: ok }; save();
}

function render() {
  const it = session.list[session.i], q = it.q, need = q.answer.length, multi = need > 1;
  const showAns = it.done && !session.mock;
  app.innerHTML = "";
  const head = $(`<div class="top"><button class="btn" id="back">← 終了</button>
    <span class="count">${esc(session.label)} · ${session.i + 1} / ${session.list.length}${session.mock ? ` · <span class="timer" id="timer"></span>` : ""}</span></div>`);
  head.querySelector("#back").onclick = () => session.mock ? finish() : home();
  app.append(head);
  app.append($(`<div class="progress"><i style="width:${(session.i) / session.list.length * 100}%"></i></div>`));
  const card = $(`<section class="panel"><div class="meta"><span class="chip">${esc(q.domain)}</span><span>${esc(q.topic || "")}</span>
    ${multi ? `<span class="chip multi">${need}つ選択</span>` : ""}<span style="flex:1"></span>
    <button class="star ${S.star[q.id] ? "on" : ""}" id="star">${S.star[q.id] ? "★ 保存済み" : "☆ ブックマーク"}</button></div>
    <div class="q">${esc(q.q)}</div><div class="choices"></div><div class="row" id="actions"></div></section>`);
  card.querySelector("#star").onclick = () => { S.star[q.id] ? delete S.star[q.id] : (S.star[q.id] = 1); save(); render(); };
  const box = card.querySelector(".choices");
  it.order.forEach((ci, k) => {
    const picked = it.pick.includes(ci), right = q.answer.includes(ci);
    let cls = picked ? "sel" : "";
    if (showAns) cls = right ? "right" : (picked ? "wrong" : "");
    const id = `c-${q.id}-${ci}`;
    const el = $(`<label class="choice ${cls}" for="${id}"><input id="${id}" type="${multi ? "checkbox" : "radio"}" name="ch" ${picked ? "checked" : ""} ${showAns ? "disabled" : ""}>
      <span>${"ABCDE"[k]}. ${esc(q.choices[ci])}</span>${showAns && q.choiceNotes && q.choiceNotes[ci] ? `<span class="note">${right ? "○" : "×"} ${esc(q.choiceNotes[ci])}</span>` : ""}</label>`);
    el.querySelector("input").onchange = () => {
      if (multi) { it.pick = picked ? it.pick.filter(x => x !== ci) : [...it.pick, ci]; } else it.pick = [ci];
      if (session.mock) it.done = it.pick.length > 0;
      render();
    };
    box.append(el);
  });
  const act = card.querySelector("#actions");
  if (!session.mock && !it.done) {
    const b = $(`<button class="btn go" ${it.pick.length !== need ? "disabled" : ""}>解答する</button>`);
    b.onclick = () => { it.done = true; record(it); render(); };
    act.append(b);
    if (multi && it.pick.length !== need) act.append($(`<span class="small">${need}つ選んでください</span>`));
  } else {
    if (session.i > 0) { const pv = $(`<button class="btn">前へ</button>`); pv.onclick = () => { session.i--; render(); }; act.append(pv); }
    const last = session.i === session.list.length - 1;
    const nx = $(`<button class="btn go">${last ? (session.mock ? "採点する" : "結果を見る") : "次へ"}</button>`);
    nx.onclick = () => { if (last) finish(); else { session.i++; render(); } };
    act.append(nx);
  }
  if (session.mock && !it.done && session.i < session.list.length - 1) {
    const sk = $(`<button class="btn">あとで解く</button>`); sk.onclick = () => { session.i++; render(); }; act.append(sk);
  }
  if (showAns) {
    const ok = isRight(it);
    card.append($(`<div class="expl"><div class="verdict ${ok ? "ok" : "ng"}">${ok ? "正解" : "不正解"}　<span class="small">正答: ${it.order.map((ci, k) => q.answer.includes(ci) ? "ABCDE"[k] : "").join("")}</span></div>
      <div>${esc(q.explanation)}</div>${q.ref ? `<div class="ref">参考: ${esc(q.ref)}</div>` : ""}</div>`));
  }
  app.append(card);
  if (session.mock) tick();
  window.scrollTo(0, 0);
}

function finish() {
  clearInterval(timerId);
  const done = session.list.filter(it => session.mock ? true : it.done);
  if (session.mock) session.list.forEach(it => { record(it); it.done = true; });
  const ok = done.filter(isRight).length, pct = done.length ? Math.round(ok / done.length * 100) : 0;
  app.innerHTML = "";
  const hd = $(`<div class="top"><h1>${esc(session.label)} の結果</h1><button class="btn" id="home">ホームへ</button></div>`);
  hd.querySelector("#home").onclick = home; app.append(hd);
  const p = $(`<section class="panel"><div class="row"><span class="result-big">${pct}%</span>
    <span>${ok} / ${done.length} 問正解${session.mock ? `<br><span class="small">合格ラインの目安は 69〜73%（公式で要確認）。${pct >= 73 ? "目安を超えています。" : "目安に届いていません。"}</span>` : ""}</span></div><div class="domains"></div></section>`);
  const dbox = p.querySelector(".domains");
  DOMAINS.forEach(d => {
    const xs = done.filter(it => it.q.domain === d.name); if (!xs.length) return;
    const c = xs.filter(isRight).length;
    dbox.append($(`<div class="drow"><span class="name">${esc(d.name)}</span><span class="num">${c}/${xs.length}</span>
      <div class="bar"><i class="c" style="width:${c / xs.length * 100}%"></i><i class="w" style="width:${(xs.length - c) / xs.length * 100}%"></i></div></div>`));
  });
  app.append(p);
  const l = $(`<section class="panel"><h2>問題を見直す</h2><div class="list"></div></section>`);
  done.forEach((it, k) => {
    const r = isRight(it);
    const b = $(`<button class="li"><span class="mark ${r ? "ok" : "ng"}">${r ? "○" : "×"}</span><span>${esc(it.q.q.slice(0, 70))}…</span></button>`);
    b.onclick = () => { session.mock = false; session.list = done; session.i = k; render(); };
    l.querySelector(".list").append(b);
  });
  app.append(l);
  window.scrollTo(0, 0);
}
home();
</script>
</body>
</html>
